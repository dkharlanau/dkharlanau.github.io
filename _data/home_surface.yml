en:
  employment_prefix: "Current role — SAP Department, "
  employment_suffix: ". Where useful, the discussion can include the relevant EPAM specialists."
  start_diagnostic: "Start with a diagnostic"
  routes: { diagnostics: "Diagnostics", atlas: "Atlas", research: "Research" }
  path:
    label: "How improvement work starts"
    items:
      - { title: "Find repeated work", detail: "Identify recurring incidents, weak handovers, and undocumented dependencies." }
      - { title: "Choose the corrective action", detail: "Decide whether the fix belongs in operations, master data, integration, or configuration." }
      - { title: "Reuse verified fixes", detail: "Keep the diagnostic record so the next team does not start the analysis again." }
  knowledge:
    label: "Knowledge system"
    title: "Find an issue. Trace its SAP context. Reuse the diagnostic record."
    lead: "Services address operating problems. Diagnostics explain SAP cases. Research and MCP make public material easier to find and use."
    diagnostics: { title: "Diagnostics", detail: "Check a specific SAP issue." }
    atlas: { title: "Atlas", detail: "Review process and data dependencies." }
    mcp: { title: "MCP", detail: "Use public SAP records in a compatible client." }
  agents:
    label: "For teams and agents"
    title: "Use the public material with clear boundaries."
    lead: "Choose the route that matches the work: an SAP case, structured retrieval, or a local MCP client."
    team: { title: "For a project team", detail: "Use a diagnostic to structure the issue, evidence, and next action." }
    agent: { title: "For an AI agent", detail: "Retrieve reviewed records and keep the source URL, review state, and limits in the result." }
    mcp: { title: "For an MCP client", detail: "Run local, read-only retrieval and checklists. No SAP connection or credentials." }
  open_source:
    label: "Open source"
    title: "MartenWeave"
    lead: "Model governance for SAP migration and master data."
    detail: "Canonical files, validation, lineage, impact analysis, and reviewable AI changes."
    action: "Open MartenWeave"
