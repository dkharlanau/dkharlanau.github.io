version: "1.4.0"
updated_at: "2026-08-18"
policy: >-
  Canonical topic identities used by visible navigation, JSON-LD and machine sidecars.
  Every local entity ID resolves to a real anchor on /entities/. External sameAs links are
  used only when a clear canonical product or technology identity exists.

