version: "1.0.0"
updated_at: "2026-08-16"
policy: >-
  Canonical topic identities used by visible navigation, JSON-LD and AI sidecars.
  Entity IDs are stable site-local identifiers. External sameAs links are used only when a
  clear canonical product or technology identity exists.

entities:
  sap-s4hana:
    id: /entities/sap-s4hana/
    name: SAP S/4HANA
    type: SoftwareApplication
    description: Enterprise ERP platform used as the primary SAP application context in this knowledge base.
    same_as:
      - https://www.sap.com/products/erp/s4hana.html
  sap-sales:
    id: /entities/sap-sales/
    name: SAP Sales
    type: Thing
    description: Sales and order-to-cash capabilities in SAP S/4HANA.
  sap-pricing:
    id: /entities/sap-pricing/
    name: SAP Sales Pricing
    type: Thing
    description: Pricing, condition technique, determination and pricing analysis in SAP Sales.
  advanced-atp:
    id: /entities/advanced-atp/
    name: SAP Advanced Available-to-Promise
    type: Thing
    description: Availability and product confirmation capabilities used to promise customer demand.
  sap-shipping:
    id: /entities/sap-shipping/
    name: SAP Shipping
    type: Thing
    description: Delivery, scheduling, picking, packing and post-goods-issue execution in SAP logistics.
  sap-procurement:
    id: /entities/sap-procurement/
    name: SAP Procurement
    type: Thing
    description: Source-to-pay and purchasing processes in SAP S/4HANA.
  sap-ewm:
