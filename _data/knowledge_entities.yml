    description: Governance, workflow and distribution capabilities for enterprise master data.
  sap-integration:
    id: /entities/sap-integration/
    name: SAP Integration Architecture
    type: Thing
    description: APIs, IDocs, events, middleware and operational integration patterns around SAP landscapes.
  sap-business-ai:
    id: /entities/sap-business-ai/
    name: SAP Business AI
    type: Thing
    description: SAP enterprise AI capabilities, agents, grounding and governance patterns.
  business-ai:
    id: /entities/business-ai/
    name: Enterprise Business AI
    type: Thing
    description: Enterprise AI patterns, technologies, controls and evidence across business processes.
  ai-architecture:
