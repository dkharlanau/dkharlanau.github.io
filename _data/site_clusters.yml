version: 1
updated: 2026-10-07

principles:
  - Product architecture and storage architecture are related but not identical.
  - Keep established deep URLs stable unless a move has a clear benefit.
  - Two primary audience journeys share one knowledge base; reference products support learning and AMS improvement.
  - Global navigation stays compact; Labs, Frameworks, and Machine remain visible from the Knowledge product map.
  - Reuse canonical sources instead of copying the same knowledge between products.

# Phase 1 English header. Reviewed localization follows without overwriting existing translations.
primary_navigation:
  - label: Learn
    url: /learn/
  - label: Library
    url: /knowledge/
  - label: About
    url: /about/

# Supporting footer destinations; the English header remains the primary menu.
fallback_navigation:
  - label: Lab
    url: /lab/
  - label: Learn & prepare
    url: /labs/
  - label: Library
    url: /knowledge/
  - label: About
    url: /about/

