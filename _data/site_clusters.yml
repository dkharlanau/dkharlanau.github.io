      - /
      - /about/
      - /cv/
      - /certifications/
      - /publications/

  - id: knowledge
    label: Knowledge
    purpose: "Published explanations, diagnostics, research, scenarios, and analysis."
    primary_url: /knowledge/
    members:
      - /atlas/
      - /scenarios/
      - /research/
      - /blog/
      - /notes/
      - /radar/
      - /news/
      - /faq/

  - id: labs
    label: Labs
    purpose: "Working models, practice systems, architecture exercises, and assessment preparation."
    primary_url: /labs/
    members:
      - /labs/assessment/
      - /labs/enterprise-context/
      - /labs/ai-ready/
      - /labs/business-ai/
      - /labs/templates/

  - id: frameworks
    label: Frameworks
    purpose: "Reusable methods for reasoning, decisions, problem solving, and repeated work."
    primary_url: /frameworks/
    members:
      - /triz/
      - /ddd/
      - /reusable-data-procedures/
      - /skill-hub/

  - id: machine
    label: Machine Layer
    purpose: "Structured datasets, indexes, schemas, discovery files, skills, and tool contracts."
    primary_url: /machine/
    members:
      - /datasets/
      - /ai/
      - /entities/
      - /agent-tools/
      - /agent-skills/
      - /.well-known/
      - /mcp/

  - id: services
    label: Services
    purpose: "Consulting offers derived from practical SAP, integration, data, AMS, and AI work."
    primary_url: /services/
    members:
      - /services/

rules:
  - "Do not move an established public URL only to make folders look cleaner."
  - "Use hub pages to group existing content before considering physical migration."
  - "Knowledge explains; Labs model and exercise; Frameworks define reusable methods."
  - "Machine Layer is structured access, not a duplicate human-facing knowledge base."
  - "New cross-cutting entities should be connected by metadata and links, not duplicated across folders."
