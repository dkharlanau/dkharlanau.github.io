version: 1
updated_at: 2026-09-10
title: SAP Lead Assessment Requirements
summary: Detailed preparation topics for a SAP Lead assessment across logistics, architecture, AI, migration, operations, and leadership.

priority_model:
  P1: Must explain and defend at Lead level.
  P2: Must understand across module and system boundaries.
  P3: Differentiator or scenario-specific depth.

domains:
  sales:
    order: 1
    label: Sales and Order-to-Cash
  procurement:
    order: 2
    label: Procurement and Inventory
  logistics:
    order: 3
    label: Warehouse, Production, Quality and Transport
  integration:
    order: 4
    label: Integration and Architecture
  migration:
    order: 5
    label: S/4HANA Migration
  operations:
    order: 6
    label: Performance and Operations
  ai:
    order: 7
    label: AI and Data
  delivery:
    order: 8
    label: Delivery and Leadership

requirements:
