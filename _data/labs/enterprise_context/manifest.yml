id: lab-enterprise-context
title: "Enterprise Context Lab"
model_name: "Enterprise Context Graph"
version: "1.3.0"
status: active_research
started_at: "2026-08-14"
updated_at: "2026-08-15"
last_reviewed_together_at: "2026-08-15"
review_note: "Last reviewed together against current primary SAP sources."
owner: "Dzmitryi Kharlanau"

purpose: >-
  Build a source-tracked, machine-readable model that connects business domains,
  platform areas, solution domains, industries, deployment models, processes,
  master-data objects, systems, rules, integrations, interface contracts,
  extensions, failures, KPIs, tests, AI components, and expert reasoning for
  learning, architecture, diagnostics, presales, and AI evaluation.

principles:
  - id: source_tracked
    label: "Source-tracked"
    description: "Every externally verifiable assertion should point to evidence and a verification date."
  - id: machine_readable
    label: "Machine-readable"
    description: "Human pages are views over structured data rather than the only source of truth."
  - id: synthetic_safe
    label: "Synthetic by default"
    description: "Examples and enterprise records are fictional unless explicitly documented otherwise."
  - id: fact_vs_judgment
    label: "Facts and judgment stay separate"
    description: "Documented facts, professional observations, expert heuristics, and inferences carry different evidence types."
  - id: deep_verticals
    label: "Depth before breadth"
    description: "A topic is expanded through relationships, failures, tests, and reasoning before another catalogue is created."
  - id: domain_separation
    label: "Keep architecture dimensions separate"
    description: "Business domains, platform areas, solution domains, industries, deployment models, processes, applications, master-data objects, platforms, and AI assets are different entity types."
  - id: independent_synthesis
    label: "Independent synthesis"
    description: "Vendor sources verify facts; public explanations, comparisons, models, and examples are written independently for this site."
  - id: author_reasoning
    label: "Teach the reasoning"
    description: "Public content should show how I frame the problem, what I check, where I draw boundaries, and why I prefer one decision over another."

content_integrity:
  policy_url: "/legal/research-attribution/"
  default_source_usage: reference_and_verification_only
  publication_rules:
    - "Write public explanations in original language rather than reproducing vendor prose."
    - "Link to primary sources instead of mirroring or republishing vendor documentation."
    - "Do not copy vendor tables, diagrams, training material, or screenshots by default."
    - "Use product names only to identify the products and services being discussed; do not imply affiliation or endorsement."
    - "Do not publish restricted, licensed, partner-only, customer-only, employer-confidential, or client-confidential material."
    - "Avoid direct quotations by default; prefer a short independent summary plus the source link."
    - "Do not bulk scrape or build a local copy of vendor web content."
  author_voice_rules:
    - "Use first person for genuine professional methods, preferences, and reasoning, not for invented project history."
    - "Do not fabricate clients, incidents, outcomes, project details, metrics, savings, or personal experience."
    - "Prefer a reasoning path over a product catalogue: problem, evidence, boundary, trade-off, decision, and next check."
    - "Surface failure modes and operational consequences where they materially change the architecture decision."
    - "Mark fictional cases as synthetic; do not disguise a synthetic example as a real delivery story."
    - "Avoid generic consultant language when a concrete diagnostic question or decision rule can teach more."
  origin_labels:
    documented_fact: "Checked against a public primary source."
    professional_experience: "Practical observation from delivery, support, or architecture work."
    reasoned_interpretation: "Independent conclusion based on facts, constraints, and experience."
    synthetic_example: "Fictional scenario created for learning or evaluation."

reference_enterprise:
  id: enterprise-global-transformation-industries
  title: "Global Transformation Industries"
  status: active_synthetic_model
  synthetic: true
  description: >-
    A fictional multinational enterprise used to instantiate processes, master data,
    integrations, transactions, failures, and transformation scenarios without exposing
    client or employer information.

