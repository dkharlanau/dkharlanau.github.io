maturity_gates:
  - id: scope
    order: 1
    label: "Scope"
    done_definition: "Boundary, business question, domain, and exclusions are explicit."
  - id: sources
    order: 2
    label: "Sources"
    done_definition: "Primary evidence is registered with access and verification dates."
  - id: model
    order: 3
    label: "Model"
    done_definition: "Domains, industries, deployment models, processes, objects, determinations, rules, applications, platforms, AI assets, and terms are represented as structured entities."
  - id: relationships
    order: 4
    label: "Relationships"
    done_definition: "Material dependencies are linked with typed, reviewable edges."
  - id: expert_reasoning
    order: 5
    label: "Expert reasoning"
    done_definition: "Questions, heuristics, decision drivers, risks, anti-patterns, and diagnostic paths are captured separately from facts."
  - id: synthetic_example
    order: 6
    label: "Synthetic example"
    done_definition: "The topic is instantiated with safe fictional data or a scenario."
  - id: ai_evaluation
    order: 7
    label: "AI / evaluation"
    done_definition: "At least one grounded question, impact trace, diagnostic case, or benchmark task can be evaluated against the model."

