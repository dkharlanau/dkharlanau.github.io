edge_types:
  - contains
  - contains_component
  - belongs_to_domain
  - decomposes_to
  - supports_domain
  - precedes
  - triggers
  - creates
  - reads
  - writes
  - updates
  - references
  - requires
  - determines
  - derives_from
  - validated_by
  - integrated_via
  - integrates_with
  - extends
  - exposed_by
  - orchestrates
  - runs_on
  - consumed_via
  - grounds
  - governs
  - provides_capability
  - can_fail_as
  - can_cause
  - impacts
  - measured_by
  - controlled_by
  - tested_by
  - supported_by
  - owned_by
  - applies_to
  - synonym_of

source_contract:
  required:
    - id
    - publisher
    - source_type
    - title
    - accessed_at
    - status
  optional:
    - url
    - release_scope
    - product_scope
    - country_scope
    - notes

assertion_contract:
  required:
    - subject
    - predicate
    - object
    - evidence_type
    - confidence
  optional:
    - source_refs
    - rationale
    - scope
    - verified_at

expert_heuristic_contract:
  required:
    - id
    - context
    - statement
    - confidence
  optional:
    - symptom
    - questions
    - checks
    - anti_patterns
    - escalation_conditions
    - related_nodes
    - evidence_refs

freshness_fields:
  created_at: "When the object first entered the model."
  updated_at: "When its structured content last changed."
  verified_at: "When externally verifiable facts were last checked."
  source_accessed_at: "When a source was reviewed."
  release_scope: "Product or release boundary for time-sensitive facts."

id_rules:
  pattern: "<PREFIX>-<DOMAIN>-<SHORT-STABLE-NAME>"
  examples:
    - "BDOM-SUPPLY-CHAIN-OPERATIONS"
    - "DOM-WAREHOUSING"
    - "PROC-O2C-ORDER-TO-CASH"
    - "STEP-O2C-CREATE-SALES-ORDER"
    - "OBJ-SD-SALES-ORDER"
    - "APP-S4HANA-SALES"
    - "PLT-SAP-AI-CORE"
    - "AI-JOULE-AGENTS"
    - "HEUR-O2C-SCOPE-BEFORE-CONFIG"
  guidance: "IDs are stable identifiers. Titles may change; IDs should not unless the underlying concept changes."
