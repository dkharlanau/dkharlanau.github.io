    - type
    - title
    - statement
  optional:
    - context
    - symptom
    - root_cause
    - consequence
    - recommendation
    - related_nodes
    - source_refs

freshness_fields:
  created_at: "When the object first entered the model."
  updated_at: "When its structured content last changed."
  verified_at: "When externally verifiable facts were last checked."
  source_accessed_at: "When a source was reviewed."
  release_scope: "Product or release boundary for time-sensitive facts."

id_rules:
  pattern: "<PREFIX>-<DOMAIN>-<SHORT-STABLE-NAME>"
  examples:
    - "DOM-WAREHOUSING"
    - "PROC-O2C-ORDER-TO-CASH"
    - "STEP-O2C-CREATE-SALES-ORDER"
    - "OBJ-SD-SALES-ORDER"
    - "DET-SD-SHIPPING-POINT"
    - "APP-S4HANA-SALES"
    - "EXP-SD-SYMPTOM-UPSTREAM"
  guidance: "IDs are stable identifiers. Titles may change; IDs should not unless the underlying concept changes."
