source_contract:
  required:
    - id
    - publisher
    - source_type
    - title
    - accessed_at
    - status
  optional:
    - url
    - release_scope
    - product_scope
    - country_scope
    - notes

assertion_contract:
  required:
    - subject
    - predicate
    - object
    - evidence_type
    - confidence
  optional:
    - source_refs
    - rationale
    - scope
    - verified_at

determination_contract:
  required:
    - id
    - title
    - level
    - question
    - mechanism
    - inputs
    - output
  optional:
    - rule_set
    - fallback_behavior
    - downstream_effects
    - lead_lens
    - source_refs
    - release_scope

expert_heuristic_contract:
  required:
    - id
    - context
    - statement
    - confidence
  optional:
    - symptom
    - questions
    - checks
    - anti_patterns
    - escalation_conditions
    - related_nodes
    - evidence_refs

experience_contract:
  types:
    - lesson
    - pitfall
    - decision
    - tradeoff
    - troubleshooting
    - project_example
    - lead_insight
  required:
