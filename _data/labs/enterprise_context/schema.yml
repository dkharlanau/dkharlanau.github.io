    - "IND-AUTOMOTIVE"
    - "DEP-S4-PUBLIC"
    - "DOM-WAREHOUSING"
    - "PROC-O2C-ORDER-TO-CASH"
    - "STEP-O2C-CREATE-SALES-ORDER"
    - "OBJ-SD-SALES-ORDER"
    - "DET-SD-SHIPPING-POINT"
    - "APP-S4HANA-SALES"
    - "PLT-SAP-AI-CORE"
    - "AI-JOULE-AGENTS"
    - "HEUR-O2C-SCOPE-BEFORE-CONFIG"
  guidance: "IDs are stable identifiers. Titles may change; IDs should not unless the underlying concept changes."
