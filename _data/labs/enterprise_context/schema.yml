  - id: application_component
    label: "Application / Solution Component"
    prefix: "APP"
  - id: platform_component
    label: "Platform / Technology Component"
    prefix: "PLT"
  - id: ai_asset
    label: "AI Asset / Agent / Assistant / Model"
    prefix: "AI"
  - id: term
