publication_contract:
  default_vendor_source_usage: reference_and_verification_only
  rules:
    - "Public text should be independently written and should not reproduce vendor prose."
    - "Prefer source links and source IDs over copied passages."
    - "Do not reuse vendor diagrams, tables, screenshots, or training material unless the specific use is deliberately reviewed and permitted."
    - "Keep documented facts separate from professional experience, interpretation, and synthetic examples."
    - "Do not publish restricted or confidential client, employer, partner, customer, or licensed material."
    - "Do not imply vendor sponsorship, affiliation, certification, approval, or endorsement."
    - "Do not bulk scrape or mirror vendor websites."
    - "Use first person only for supportable professional methods and judgments; never invent projects, clients, outcomes, or metrics."
    - "Prefer reasoning that exposes evidence checks, trade-offs, failure modes, and the next decision over catalogue-style prose."
    - "Synthetic examples must remain visibly synthetic and must not be presented as personal delivery history."

