    title: "Wrong shipping point"
    prompt: "The sales order has the wrong shipping point. What do you check before Customizing?"
    expected_reasoning:
      - "plant"
      - "shipping condition"
      - "loading group"
      - "source of each input"
      - "exact configuration combination"
  - id: DRILL-SD-02
    title: "Stock exists, no confirmation"
    prompt: "The warehouse shows stock, but the order is not fully confirmed. How do you structure the investigation?"
    expected_reasoning:
      - "plant"
      - "material availability date"
      - "requested quantity"
      - "scope/check context"
      - "supply and demand elements"
      - "advanced ATP logic if activated"
  - id: DRILL-SD-03
    title: "Unexpected item behavior"
    prompt: "A line is not delivery relevant as expected. Where do you start?"
    expected_reasoning:
      - "item category"
      - "item-category determination inputs"
      - "schedule line category"
      - "schedule-line controls"
  - id: DRILL-SD-04
    title: "Wrong price"
    prompt: "The net value is wrong. What is the shortest useful diagnostic path?"
    expected_reasoning:
      - "pricing procedure"
      - "pricing analysis"
      - "condition type"
      - "access sequence"
      - "condition record / requirement / formula"
  - id: DRILL-SD-05
    title: "Manual order works, API order fails"
    prompt: "The same customer and product work in manual entry but fail through an API. What changes in your hypothesis?"
    expected_reasoning:
      - "compare payload with manual order"
      - "find explicitly supplied fields"
      - "check mapping/default suppression"
      - "separate integration values from S/4 determination"

