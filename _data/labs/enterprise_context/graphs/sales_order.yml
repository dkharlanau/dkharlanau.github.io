technical_extension_map:
  title: "Sales-order extension and tracing map"
  principle: >-
    A custom sales-order value is not the starting point. First prove whether the value
    came from standard determination, reference copying, manual entry, or the inbound
    interface. Only then trace custom logic.
  inherited_system_recognition:
    - hook: "MV45AFZZ — USEREXIT_MOVE_FIELD_TO_VBAK / USEREXIT_MOVE_FIELD_TO_VBAP"
      purpose: "Recognize classic code that moves or derives header and item data in sales-document processing."
      boundary: "Useful for inherited ERP and classic Private/on-premise code reading; not a Public Cloud extension model."
    - hook: "MV45AFZZ — USEREXIT_SAVE_DOCUMENT / USEREXIT_SAVE_DOCUMENT_PREPARE"
      purpose: "Recognize save-time validations or side effects in classic sales-document processing."
      boundary: "Treat save-time custom code as high-impact because it can affect the complete document lifecycle."
    - hook: "Classic SD customer exits and enhancement points"
      purpose: "Identify historical logic around availability, text, document flow, foreign trade, and other SD processing."
      boundary: "Verify the exact enhancement in the target release instead of copying an old include pattern."
  current_s4_paths:
    - hook: "SD_SLS_MODIFY_HEAD / SD_SLS_MODIFY_ITEM"
      purpose: "Set or change values for custom fields in sales-document header or item contexts."
      boundary: "Released Custom Logic path; availability still depends on the app and business context."
    - hook: "SD_SLS_MODIFY_HEAD_BUSINESS / SD_SLS_MODIFY_ITEM_BUSINESS"
      purpose: "Change supported business-data fields in current sales-document processing."
      boundary: "Use only the fields and business contexts exposed by the released BAdI contract."
    - hook: "Custom Fields + API extensibility"
      purpose: "Carry supported extension fields through sales apps and released sales APIs."
      boundary: "Keep UI, business logic, and API exposure aligned; a field visible in one channel is not automatically available everywhere."
  tracing_sequence:
    - "Compare the failing order with a working order at the same document, item, customer, product, and sales-area scope."
    - "Compare manual creation with API or interface creation and mark every field supplied explicitly by the inbound payload."
    - "Trace the first wrong runtime value to master data, configuration, copy control, or standard determination."
    - "Only then inspect the relevant BAdI, user exit, enhancement implementation, or custom field logic."
    - "For a new design, translate the old hook into business intent and check the current released extension contract."
  assessment_answer: >-
    In an inherited system I know the classic MV45* exits because they often explain why
    a sales order behaves differently from standard. I do not start a new design there.
    I first prove the standard owner, then use the released sales-document BAdIs or other
    clean-core extension option that matches the target edition and business context.
  source_refs:
    - SRC-STOOLKIT-ABAP-SALES
    - SRC-SAP-SALES-DOCUMENT-BADIS-2608
    - SRC-SAP-S4-KEY-USER-EXTENSIBILITY
    - SRC-SAP-ABAP-CLOUD-EXTENSIBILITY

impact_traces:
  - id: TRACE-SD-PLANT-CHANGE
    title: "What can change if the plant changes?"
    direction: forward
    path:
      - "Plant"
      - "Shipping Point Determination"
      - "Shipping Point"
      - "Route Determination"
      - "Route"
      - "Scheduling"
      - "Material Availability Date"
      - "Availability Check"
      - "Confirmation"
    lesson: "A plant change is not local. It can redirect both logistics and the promise to the customer."
    caveat: >-
      The exact path depends on configuration and enabled capabilities. This is a
      reasoning trace, not a runtime trace from a customer system.

  - id: TRACE-SD-WHY-SHIPPING-POINT
    title: "Why did this shipping point appear?"
    direction: backward
    path:
      - "Shipping Point"
      - "Shipping Point Determination"
      - "Plant"
      - "Shipping Condition"
      - "Loading Group"
      - "Customizing Assignment"
    lesson: "Start with actual inputs. A configuration change is the last step, not the first."
    caveat: "Manual changes or custom logic must be checked separately where they exist."

  - id: TRACE-SD-WRONG-ITEM-BEHAVIOR
    title: "Why does the item behave incorrectly?"
    direction: backward_then_forward
    path:
      - "Observed Item Behavior"
      - "Item Category"
      - "Sales Document Type + Item Category Group + Context"
      - "Schedule Line Category"
      - "MRP Type"
      - "Requirements / ATP / Delivery Controls"
    lesson: "Find the first wrong control level before changing the later symptom."
    caveat: "Not every behavior is controlled by item or schedule line category; scope the symptom first."

  - id: TRACE-SD-WRONG-PRICE
    title: "Why is the price missing or wrong?"
    direction: backward
    path:
      - "Unexpected Net Value"
      - "Pricing Analysis"
      - "Pricing Procedure"
      - "Condition Type"
      - "Access Sequence"
      - "Condition Record / Requirement / Formula"
    lesson: "Pricing is easier to diagnose as a trace than as a final number."
    caveat: "Manual conditions, exclusions, formulas, and custom logic can change the standard path."

  - id: TRACE-SD-NO-CONFIRMATION
    title: "Why is the requested quantity not confirmed?"
    direction: backward
    path:
      - "Missing / Partial Confirmation"
      - "Availability Check"
      - "Material Availability Date"
      - "Plant"
      - "Scope of Check"
      - "Supply and Demand Elements"
    lesson: "Stock on hand is only one part of an availability answer."
    caveat: "Advanced ATP functions can add substitution, allocation, or backorder logic."

  - id: TRACE-SD-CREDIT-BLOCK
    title: "Why is a valid order blocked?"
    direction: backward
    path:
      - "Credit Block"
      - "Credit Check Result"
      - "Order Value / Exposure"
      - "Credit Segment / Limit"
      - "Risk and Check Context"
    lesson: "Separate commercial risk control from logistics correctness."
    caveat: "The exact check set depends on credit-management configuration."


  - id: TRACE-SD-MISSING-TEXT
    title: "Why was an expected text not transferred?"
    direction: backward
    path:
      - "Missing / Unexpected Text"
      - "Text Determination Log"
      - "Target Text ID + Procedure Assignment"
      - "Access Sequence"
      - "First Intended Access"
      - "Source Object / Text ID / Language / Partner"
      - "Reference Document / Requirement / Transfer Routine"
    lesson: "Treat automatic text transfer as an ordered runtime search. Find the first access that should have succeeded and prove why it did not."
    caveat: "The VOTXN, VOFM, SM31, and SO10 examples are classic/private/on-premise-style configuration patterns; deployment-specific configuration surfaces can differ."

expert_heuristics:
  - id: HEUR-SD-FIRST-WRONG-DECISION
    context: "Troubleshooting a wrong sales-order result"
    statement: "Find the first wrong decision in the dependency chain, not the last visible symptom."
    confidence: high
    questions:
      - "What is the first value that differs from the expected case?"
      - "Was that value determined, copied, entered manually, or sent by an interface?"
    checks:
      - "Compare a working and non-working order with the same scope."
      - "Trace the suspicious value backward to its inputs."
    anti_patterns:
      - "Changing Customizing before checking master data and explicit overrides."

  - id: HEUR-SD-SCOPE-SYMPTOM
    context: "Before proposing a configuration change"
    statement: "Scope the symptom by customer, product, sales area, plant, item, date, channel, and entry method."
    confidence: high
    questions:
      - "Does the same issue happen for another customer or material?"
      - "Does manual entry behave differently from an inbound order?"
    checks:
      - "Create a small comparison matrix before changing shared configuration."
    anti_patterns:
      - "Treating one order as proof of a global configuration defect."

  - id: HEUR-SD-FOUR-CAUSE-BUCKETS
    context: "Sales-order diagnosis"
    statement: "Classify the cause as data, configuration, integration/override, or runtime supply/control before designing the fix."
    confidence: high
    questions:
      - "Is the input itself wrong?"
      - "Is the rule wrong?"
      - "Did another system or user override the normal result?"
      - "Is the result correct but the runtime situation changed?"
    anti_patterns:
      - "Using one configuration fix for several unrelated cause types."

  - id: HEUR-SD-ATP-NOT-STOCK
    context: "Availability investigation"
    statement: "Inventory and confirmation answer different questions."
    confidence: high
    questions:
      - "For which plant and material availability date is the order asking?"
      - "Which supply and demand elements are relevant to the check?"
    anti_patterns:
      - "Using unrestricted stock alone as proof that ATP is wrong."

  - id: HEUR-SD-MANUAL-VS-INBOUND
    context: "Orders created through integration"
    statement: "Compare manual and inbound creation because an interface can provide values that standard determination would otherwise derive."
    confidence: high
    questions:
      - "Which fields are supplied explicitly by the message or API?"
      - "Which fields are left for S/4HANA to determine?"
    anti_patterns:
      - "Debugging standard determination without checking the inbound payload or mapping."

synthetic_case:
  id: SCN-SD-ORDER-100
  evidence_type: synthetic_example
  title: "Synthetic case: the order looks simple"
  description: >-
    A fictional customer orders 100 units for delivery next Friday. The sales order
    is created successfully, but only 60 units are confirmed and the route is not the one
    the consultant expected. The exercise is to explain the result without changing configuration first.
  facts:
    - "Ship-to customer has a different transportation zone from the sold-to customer."
    - "Customer-material information contains Plant B."
    - "Material master contains Plant A as a more general sales default."
    - "The shipping point is valid for Plant B and the material loading group."
    - "Available-to-promise can confirm 60 units for the material availability date at Plant B."
  reasoning_path:
    - "Partner context: use the ship-to for destination and shipping data."
    - "Plant: customer-material information explains why Plant B is proposed before the general material default."
    - "Shipping point: recalculate from Plant B + shipping condition + loading group."
    - "Route: recalculate from departure/destination context + shipping condition + transportation group."
    - "Scheduling: route and shipping point influence the material availability date."
    - "ATP: evaluate Plant B, the calculated date, quantity 100, and relevant supply/demand."
  lesson: >-
    The route and confirmation are not two isolated defects. They can share an upstream
    cause: the location and partner context selected earlier in the order.

assessment_drills:
  - id: DRILL-SD-01
    title: "Wrong shipping point"
    prompt: "The sales order has the wrong shipping point. What do you check before Customizing?"
    expected_reasoning:
      - "plant"
      - "shipping condition"
      - "loading group"
      - "source of each input"
      - "exact configuration combination"
  - id: DRILL-SD-02
    title: "Stock exists, no confirmation"
    prompt: "The warehouse shows stock, but the order is not fully confirmed. How do you structure the investigation?"
    expected_reasoning:
      - "plant"
      - "material availability date"
      - "requested quantity"
      - "scope/check context"
      - "supply and demand elements"
      - "advanced ATP logic if activated"
  - id: DRILL-SD-03
    title: "Unexpected item behavior"
    prompt: "A line is not delivery relevant as expected. Where do you start?"
    expected_reasoning:
      - "item category"
      - "item-category determination inputs"
      - "schedule line category"
      - "schedule-line controls"
  - id: DRILL-SD-04
    title: "Wrong price"
    prompt: "The net value is wrong. What is the shortest useful diagnostic path?"
    expected_reasoning:
      - "pricing procedure"
      - "pricing analysis"
      - "condition type"
      - "access sequence"
      - "condition record / requirement / formula"
  - id: DRILL-SD-05
    title: "Manual order works, API order fails"
    prompt: "The same customer and product work in manual entry but fail through an API. What changes in your hypothesis?"
    expected_reasoning:
      - "compare payload with manual order"
      - "find explicitly supplied fields"
      - "check mapping/default suppression"
      - "separate integration values from S/4 determination"

  - id: DRILL-SD-06
    title: "Customer text exists, order text is empty"
    prompt: "A required customer instruction exists in master data, but the sales-order text is empty. How do you investigate?"
    expected_reasoning:
      - "open the text determination log"
      - "confirm target text ID and procedure assignment"
      - "read the access sequence in order"
      - "check source object, source text ID, partner function, and language"
      - "check direct predecessor and access requirements"
      - "check generated accesses and any VOFM transfer routine in classic configuration"
      - "check mandatory/display and duplicate/reference behavior only after source determination is understood"

