id: GRAPH-SD-SALES-ORDER-DECISIONS
type: knowledge_graph
title: "Sales Order — Decision & Dependency Map"
summary: >-
  A source-tracked learning model of the decisions hidden inside sales-order creation.
  It shows what SAP reads, how a value is derived, where the result is used next,
  and how a consultant can investigate an unexpected result.
domain: "SAP S/4HANA Sales"
process_family: "Order-to-Cash"
process_step: "Create Sales Order"
status: researching
created_at: "2026-08-14"
updated_at: "2026-09-23"
verified_at: null

thesis: >-
  A sales order is not only a document. It is a chain of business decisions.
  One result often becomes an input for the next decision, so a wrong value should
  first be traced to its origin before configuration is changed.

model_boundary:
  release_scope:
    - "SAP S/4HANA 2025 FPS01 where cited"
    - "SAP S/4HANA best-practice configuration where cited"
    - "SAP S/4HANA Cloud Private Edition text-control behavior where cited"
  note: >-
    This is a learning and reasoning model. The exact runtime path depends on edition,
    activated scope, configuration, master data, enhancements, and customer design.
  evidence_policy: >-
    Documented SAP behavior, expert heuristics, and synthetic examples are stored as
    different evidence types. Client-specific data and custom logic are excluded.

memory_model:
  title: "Eight questions to remember"
  summary: >-
    Instead of memorizing configuration tables, ask eight business questions.
    They form a practical mental model for reading a sales order from left to right.
  questions:
    - key: "WHO"
      question: "Who is involved?"
      answer: "Sold-to, ship-to, bill-to, payer, and other partners."
      nodes:
        - DET-SD-PARTNER
    - key: "WHAT"
      question: "What kind of document and item is this?"
      answer: "Sales document type, item category, and schedule line category define behavior."
      nodes:
        - DET-SD-ITEM-CATEGORY
        - DET-SD-SCHEDULE-LINE-CATEGORY
    - key: "WHERE"
      question: "Where will the product come from and leave from?"
      answer: "Delivering plant, shipping point, and route build the logistics path."
      nodes:
        - DET-SD-PLANT
        - DET-SD-SHIPPING-POINT
        - DET-SD-ROUTE
    - key: "WHEN"
      question: "When must logistics activities happen?"
      answer: "Scheduling works backward and forward around the requested delivery date."
      nodes:
        - DET-SD-SCHEDULING
    - key: "PRICE"
      question: "How is the commercial value calculated?"
      answer: "Pricing procedure and condition technique find and calculate price elements."
      nodes:
        - DET-SD-PRICING
    - key: "PROMISE"
      question: "What quantity and date can we promise?"
      answer: "Availability logic creates confirmations, not a simple stock lookup."
      nodes:
        - DET-SD-AVAILABILITY
    - key: "RISK"
      question: "Are we allowed to continue with this customer exposure?"
      answer: "Credit management can check risk and block further processing."
      nodes:
        - DET-SD-CREDIT
    - key: "FULFILL"
      question: "Which physical stock can finally satisfy the requirement?"
      answer: "Batch search and later delivery execution can add a more detailed fulfillment decision."
      nodes:
        - DET-SD-BATCH

control_stack:
  title: "Three document-control levels"
  summary: >-
    Many sales-order questions become easier when the consultant first identifies
    whether the behavior is controlled at header, item, or schedule-line level.
  levels:
    - id: CTRL-SD-DOCUMENT-TYPE
      level: header
      title: "Sales Document Type"
      question: "What kind of sales document is this?"
      controls:
        - "overall document behavior"
        - "document-level checks and defaults"
        - "input to item-category determination"
      remember: "Header context"
      source_refs:
        - SRC-SAP-SD-DOCUMENT-CONTROL
    - id: CTRL-SD-ITEM-CATEGORY
      level: item
      title: "Item Category"
      question: "How should this line behave?"
      controls:
        - "item-level business behavior"
        - "delivery and billing relevance depending on configuration"
        - "input to schedule-line-category determination"
      remember: "Item behavior"
      source_refs:
        - SRC-SAP-SD-DOCUMENT-CONTROL
        - SRC-SAP-SD-ITEM-CATEGORY-DETERMINATION
    - id: CTRL-SD-SCHEDULE-LINE
      level: schedule_line
      title: "Schedule Line Category"
      question: "How should quantity, planning, availability, and delivery behave?"
      controls:
        - "requirements transfer"
        - "availability-check relevance"
        - "delivery relevance"
      remember: "Quantity and date behavior"
      source_refs:
        - SRC-SAP-SD-DOCUMENT-CONTROL
        - SRC-SAP-SD-SCHEDULE-LINE-CATEGORY

input_domains:
  - id: INPUT-SD-BUSINESS-PARTNER
    title: "Business Partner / Customer"
    purpose: >-
      Provides sales-area and partner context such as ship-to information, shipping
      condition, pricing-related fields, payment terms, Incoterms, and other defaults.
    source_refs:
      - SRC-SAP-SD-MASTER-DATA
  - id: INPUT-SD-PRODUCT
    title: "Product / Material"
    purpose: >-
      Provides item, logistics, planning, pricing, loading, and transportation attributes
      that participate in later decisions.
    source_refs:
      - SRC-SAP-SD-MASTER-DATA
  - id: INPUT-SD-CUSTOMER-MATERIAL
    title: "Customer-Material Information"
    purpose: >-
      Can provide customer/product-specific sales data and can participate in the
      delivering-plant proposal before more general master data is used.
    source_refs:
      - SRC-SAP-SD-MASTER-DATA
      - SRC-SAP-SD-DELIVERING-PLANT
  - id: INPUT-SD-ORGANIZATION
    title: "Sales and Logistics Organization"
    purpose: >-
      Sales area, plant, shipping point, and related organizational assignments form
      the structural context in which several determinations run.
  - id: INPUT-SD-CONFIGURATION
    title: "Configuration and Rule Data"
    purpose: >-
      Procedures, mappings, condition records, checks, and search strategies convert
      document and master-data context into runtime decisions.
    source_refs:
      - SRC-SAP-SD-DATA-SOURCE-LEARNING

field_provenance:
  title: "Field provenance: which source supplied this value?"
  summary: >-
    Use this map when a sales-order value looks wrong. First identify the runtime field,
    then trace the partner, master-data record, document type, preceding document, or
    previous determination that supplied it. Partner functions matter because different
    partners own different commercial, logistics, billing, payment, and tax context.
    The rows below focus on standard defaulting when master data participates; creation
    with reference, explicit interface values, and manual overrides can change the runtime source.
  partner_memory:
    - partner: "Sold-to party"
      owns: "Commercial sales context"
      examples:
        - "Incoterms in standard SD"
        - "customer pricing procedure"
        - "sales office / sales group and price-list context"
        - "complete-delivery and order-combination defaults"
        - "delivery priority, with customer-material data able to specialize the item"
      caveat: >-
        Do not assume every customer-derived field comes from sold-to. Payment, logistics,
        and tax rules deliberately read other partner roles.
    - partner: "Ship-to party"
      owns: "Delivery destination and logistics context"
      examples:
        - "delivery address"
        - "delivering-plant fallback"
        - "shipping data and destination geography"
        - "shipping condition when the sales document type is configured to read ship-to"
        - "tax destination and ship-to tax liability"
      caveat: >-
        Incoterms are not normally switched to ship-to in standard SD just because delivery
        happens there.
    - partner: "Bill-to party"
      owns: "Invoice recipient context"
      examples:
        - "invoice address"
        - "document printing and electronic communication data"
      caveat: >-
        Bill-to answers who receives the invoice; it is not the same role as the payer.
    - partner: "Payer"
      owns: "Payment and selected tax-identity context"
      examples:
        - "payment terms at header level"
        - "billing schedules and bank details"
        - "possible VAT / sales-tax-ID source depending on the configured tax rule"
      caveat: >-
        Tax identity is rule-driven. Depending on the sales-organization rule, payer,
        ship-to, or sold-to can supply the relevant tax ID and classification.

  fields:
    - field: "Incoterms"
      level: "Header / business data"
      partner_role: "Sold-to"
      source: "Sold-to party sales-area master data"
      mechanism: "master-data default"
      rule: >-
        Standard SD sales documents determine Incoterms from the sold-to party, not the
        ship-to party. This source cannot be switched through ordinary Customizing.
      downstream: "Commercial terms carried into later sales, delivery, and billing processing."
      technical_hint: "Sales-document business data includes VBKD-INCO1 and the newer Incoterms location/version fields where used."
      source_refs:
        - SRC-SAP-SD-INCOTERMS-SOLDTO
        - SRC-SAP-SD-MASTER-DATA

    - field: "Payment terms"
      level: "Header / business data"
      partner_role: "Payer"
      source: "Payer customer master data"
      mechanism: "master-data default with document override"
      rule: >-
        SAP documents the payer's master-data payment terms as the header default for a
        quotation or sales order; the document value can be edited where the process permits.
      downstream: "Billing, due-date calculation, payment processing, and cash-discount context."
      technical_hint: "Terms of payment are represented by ZTERM in sales-document business data."
      source_refs:
        - SRC-SAP-SD-MASTER-DATA
        - SRC-SAP-SD-PAYER-PAYMENT-TERMS

    - field: "Shipping condition"
      level: "Header"
      partner_role: "Sold-to / Ship-to / Sales document type"
      source: "Sold-to or ship-to sales-area data, depending on sales-document-type configuration; direct document-type value has highest priority"
      mechanism: "configurable partner source with document-type override"
      rule: >-
        In current S/4HANA configuration, the sales document type can control whether
        partner master data is read from sold-to, ship-to, or ship-to with sold-to fallback.
        If a shipping condition is maintained directly in the sales document type, that
        value takes precedence over the partner master default.
      downstream: "Shipping-point determination, route determination, and logistics scheduling context."
      technical_hint: "The runtime sales-order header field is VBAK-VSBED."
      source_refs:
        - SRC-SAP-SD-SHIPPING-DATA-LEARNING
        - SRC-SAP-SD-SHIPPING-POINTS

    - field: "Delivery priority"
      level: "Item / shipping"
      partner_role: "Sold-to, with customer-material specialization"
      source: "Sold-to sales-area shipping data; customer-material information can provide a more specific item value"
      mechanism: "master-data default"
      rule: >-
        Standard sales-order item defaulting uses the sold-to customer structure rather
        than automatically reading a different ship-to party's delivery priority. A relevant
        customer-material information record can also provide the delivery priority.
      downstream: "Delivery selection and prioritization."
      technical_hint: "Customer sales-area field KNVV-LPRIO; sales-order item field VBAP-LPRIO; customer-material field KNMT-LPRIO."
      source_refs:
        - SRC-SAP-SD-DELIVERY-PRIORITY
        - SRC-SAP-SD-DELIVERY-PRIORITY-HELP

    - field: "Complete delivery"
      level: "Header"
      partner_role: "Sold-to"
      source: "Sold-to business-partner / customer sales-area shipping data"
      mechanism: "master-data default with manual override"
      rule: >-
        The complete-delivery requirement is copied from the sold-to party into the sales
        order and can be changed in the order where the process permits.
      downstream: "Whether all order items must be delivered together in one outbound delivery."
      source_refs:
        - SRC-SAP-SD-COMPLETE-PARTIAL-DELIVERY
        - SRC-SAP-SD-MASTER-DATA

    - field: "Partial delivery per item"
      level: "Item"
      partner_role: "Customer-material → Sold-to"
      source: "Customer-material information record first, then business-partner/customer master data"
      mechanism: "prioritized master-data default"
      rule: >-
        Customer-material information, when maintained, takes priority over the business
        partner for the item-level partial-delivery agreement. The order value can then be
        changed manually where allowed.
      downstream: "Availability-check reaction and how many partial deliveries may be created for an item."
      source_refs:
        - SRC-SAP-SD-COMPLETE-PARTIAL-DELIVERY

    - field: "Order combination"
      level: "Header / item delivery terms"
      partner_role: "Sold-to"
      source: "Sold-to master data"
      mechanism: "master-data default with manual override"
      rule: >-
        The order-combination indicator is determined from the sold-to party master data
        and can be changed in the order. It permits items from multiple sales orders to be
        combined only when the remaining delivery-combination criteria also match.
      downstream: "Collective outbound-delivery creation and delivery split behavior."
      source_refs:
        - SRC-SAP-SD-ORDER-COMBINATION
        - SRC-SAP-SD-MASTER-DATA

    - field: "Sales office / Sales group"
      level: "Header"
      partner_role: "Sold-to"
      source: "Sold-to sales-area master data or explicit document input"
      mechanism: "master-data proposal"
      rule: >-
        These organizational sales fields belong to the sold-to sales context. A useful
        diagnostic nuance is that changing the sold-to party in an existing sales document
        does not automatically redetermine the existing sales office and sales group.
      downstream: "Sales responsibility, reporting, output context, and process selection."
      source_refs:
        - SRC-SAP-SD-PARTNER-FUNCTIONS
        - SRC-SAP-SD-CHANGE-SOLDTO

    - field: "Customer account assignment group"
      level: "Header / business data"
      partner_role: "Customer sales-area context"
      source: "Customer sales-area accounting data, copied into sales-document business data"
      mechanism: "master-data default feeding account determination"
      rule: >-
        The customer account assignment group is not the final G/L account. It is one
        criterion used later together with material/account-key context in revenue account determination.
      downstream: "Revenue G/L account determination during billing-to-FI transfer."
      technical_hint: "Customer account assignment group is represented by KTGRD in sales-document business data."
      source_refs:
        - SRC-SAP-SD-ACCOUNT-DETERMINATION-LEARNING
        - SRC-SAP-SD-SALES-ORDER-HEADER

    - field: "Customer pricing procedure"
      level: "Header / pricing context"
      partner_role: "Sold-to"
      source: "Sold-to party sales-area master data"
      mechanism: "input to pricing-procedure determination"
      rule: >-
        Pricing-procedure determination combines sales area, document pricing procedure,
        and the customer pricing procedure supplied by the sold-to party.
      downstream: "Selects the pricing procedure before condition types and access sequences are evaluated."
      source_refs:
        - SRC-SAP-SD-PRICING-PROCEDURE
        - SRC-SAP-SD-PRICING-DETERMINATION-LEARNING

    - field: "Delivering plant"
      level: "Item"
      partner_role: "CMIR → Ship-to → Material"
      source: "Customer-material information record, then ship-to customer master, then material master"
      mechanism: "prioritized default"
      rule: >-
        The more specific customer-material source is checked first; the ship-to partner is
        the customer-master fallback before the material master.
      downstream: "Availability, shipping-point determination, tax departure country, and fulfillment location."
      technical_hint: "Sales-order item plant is VBAP-WERKS."
      source_refs:
        - SRC-SAP-SD-DELIVERING-PLANT
        - SRC-SAP-SD-MASTER-DATA

    - field: "Shipping point"
      level: "Item"
      partner_role: "Derived"
      source: "Delivering plant + shipping condition + material loading group"
      mechanism: "Customizing lookup"
      rule: >-
        The shipping point is a result, not a master-data field to debug in isolation.
        Trace the plant, shipping condition, and loading group first.
      downstream: "Outbound-delivery execution, scheduling, and route context."
      technical_hint: "Sales-order item shipping point is VBAP-VSTEL."
      source_refs:
        - SRC-SAP-SD-SHIPPING-POINTS

    - field: "Route"
      level: "Item"
      partner_role: "Ship-to + logistics context"
      source: "Departure geography + ship-to destination geography + determined shipping condition + material transportation group"
      mechanism: "Customizing lookup"
      rule: >-
        Route determination joins the departure side, destination side, shipping policy,
        and material transportation attributes. Remember that the shipping condition can
        itself come from sold-to, ship-to, or the sales document type depending on configuration.
      downstream: "Transportation lead time and delivery / transportation scheduling."
      technical_hint: "Sales-order item route is VBAP-ROUTE."
      source_refs:
        - SRC-SAP-SD-ROUTE-DETERMINATION

    - field: "Tax / VAT determination inputs"
      level: "Header + item / pricing"
      partner_role: "Ship-to + plant + material"
      source: "Departure country + destination country + customer tax classification + material tax classification"
      mechanism: "pricing condition technique"
      rule: >-
        SAP treats VAT as a tax-pricing decision, not as one customer field. Core criteria
        include departure and destination geography plus customer and material tax liability/classification.
        The order API also exposes customer tax classifications copied from the goods-recipient master data.
      downstream: "Tax condition, tax code/rate, tax amount, and billing/accounting context."
      source_refs:
        - SRC-SAP-SD-TAX-DETERMINATION
        - SRC-SAP-SD-SALES-ORDER-HEADER
        - SRC-SAP-SD-CONDITION-TECHNIQUE

    - field: "Tax departure country / region"
      level: "Header tax context"
      partner_role: "Plant"
      source: "Country / region of the delivering plant"
      mechanism: "derived tax geography"
      rule: "For tax determination, SAP uses the plant country or region as the normal departure country or region."
      downstream: "Domestic/export/import classification and tax determination."
      source_refs:
        - SRC-SAP-SD-SALES-ORDER-HEADER

    - field: "Tax destination / VAT registration country"
      level: "Header tax context"
      partner_role: "Ship-to"
      source: "Country / region of the ship-to party"
      mechanism: "derived tax geography"
      rule: >-
        For tax determination, SAP uses the ship-to country or region as the normal tax
        destination / VAT registration country in the sales-order context.
      downstream: "Tax-country context, condition access, and billing tax data."
      source_refs:
        - SRC-SAP-SD-SALES-ORDER-HEADER

    - field: "VAT registration / sales-tax-ID source"
      level: "Header tax identity"
      partner_role: "Rule-dependent"
      source: "Sales-organization rule for the sales tax identification number"
      mechanism: "priority rule"
      rule: >-
        SAP distinguishes tax-ID source from simple ship-to geography. With the documented
        blank rule, payer can take priority when it has a tax ID and differs from sold-to;
        otherwise ship-to can be used, then sold-to. Rule A uses sold-to; rule B uses payer.
      downstream: "Tax identity and classification used by order and billing tax determination."
      source_refs:
        - SRC-SAP-SD-TAX-DETERMINATION

objects:
  - id: OBJ-SD-SALES-ORDER
    title: "Sales Order"
    level: header
    contains:
      - OBJ-SD-SALES-ORDER-ITEM
  - id: OBJ-SD-SALES-ORDER-ITEM
    title: "Sales Order Item"
    level: item
    contains:
      - OBJ-SD-SCHEDULE-LINE
    attributes:
      - ATTR-SD-MATERIAL
      - ATTR-SD-ITEM-CATEGORY
      - ATTR-SD-PLANT
      - ATTR-SD-SHIPPING-POINT
      - ATTR-SD-ROUTE
  - id: OBJ-SD-SCHEDULE-LINE
    title: "Schedule Line"
    level: schedule_line
    attributes:
      - ATTR-SD-SCHEDULE-LINE-CATEGORY
      - ATTR-SD-REQUESTED-DELIVERY-DATE
      - ATTR-SD-CONFIRMED-DATE
      - ATTR-SD-CONFIRMED-QUANTITY

views:
  - id: process
    title: "Process view"
    question: "Where are we in Order-to-Cash?"
    projection: "Quotation → Sales Order → Delivery → Goods Issue → Billing"
  - id: object
    title: "Object view"
    question: "What lives inside the sales order?"
    projection: "Header → Item → Schedule Line"
  - id: why
    title: "Decision view"
    question: "Why did this value appear, and what uses it next?"
    projection: "Input → Rule → Output → Downstream effect"

determinations:
  - id: DET-SD-PARTNER
    title: "Partner Determination"
    memory_key: "WHO"
    level: header_and_item
    question: "Which business partners take part in this document?"
    mechanism: procedure
    inputs:
      - "partner determination procedure"
      - "sales document type"
      - "item category where item-level partner determination applies"
      - "business partner / customer master context"
    output:
      - "partner functions and partner assignments"
    downstream_effects:
      - "ship-to context"
      - "pricing and shipping data context"
      - "billing and payment context"
      - "document completeness"
    common_failures:
      - "required partner function is missing"
      - "wrong ship-to changes later logistics inputs"
      - "partner master data is incomplete or inconsistent"
    check_first:
      - "Compare the expected partner functions with the partners in the order."
      - "Check whether the issue is header-level or item-level."
      - "Trace the partner back to the relevant master-data relationship or procedure."
    remember: "Partners are inputs to later decisions, not just names on the header."
    lead_lens: >-
      A different ship-to can change geography, shipping data, tax context, pricing
      context, and delivery logic. Trace the consequence before correcting one field.
    source_refs:
      - SRC-SAP-SD-PARTNER-DETERMINATION
      - SRC-SAP-SD-MASTER-DATA


  - id: DET-SD-TEXT-DETERMINATION
    title: "Text Determination and Automatic Transfer"
    memory_key: "TEXT"
    level: header_and_item
    question: "Which text should appear automatically, where should SAP search for it, and should it be referenced or duplicated?"
    mechanism: access_sequence
    inputs:
      - "target text object and text ID"
      - "text determination procedure assigned to the actual document type or item category"
      - "access sequence assigned to the target text ID"
      - "ordered source text objects and source text IDs"
      - "partner function, language, reference-document context, and access requirements"
      - "optional VOFM data transfer routine in classic/private/on-premise-style configuration"
    output:
      - "proposed or transferred text"
      - "reference or duplicate relationship to the source text"
      - "possible incompleteness status when the text is mandatory"
    downstream_effects:
      - "instructions shown to the document processor"
      - "text available for output processing"
      - "text available to follow-on document transfer"
      - "document completeness when the text is mandatory"
    common_failures:
      - "the target text ID is not part of the procedure assigned to the actual document context"
      - "an earlier access finds a valid but unexpected source, so later accesses are not executed"
      - "the source text exists under the wrong language, partner, text ID, or text object"
      - "VBBK or VBBP reads the direct predecessor, not an older document in the chain"
      - "an access sequence was changed but its accesses were not generated"
      - "a custom data transfer routine returns no text or selects a different text than expected"
    check_first:
      - "Open the text determination log for the actual header or item text and read the runtime search path."
      - "Confirm which text procedure is assigned to the document type or item category and that the target text ID is present."
      - "Read the access sequence in order because the first valid hit ends the search."
      - "Verify the source object's text ID, language, partner role, and direct predecessor context."
      - "Then check duplicate/reference behavior, mandatory/display settings, and any custom transfer routine."
    remember: "Procedure says which text IDs exist; access sequence says where to look; the first valid access wins."
    lead_lens: >-
      Text control is a small determination engine. Separate source selection, copy semantics,
      incompleteness, and custom ABAP logic instead of treating every missing note as master-data maintenance.
    source_refs:
      - SRC-SAP-SD-TEXT-CONTROL-BASICS
      - SRC-SAP-SD-TEXT-MANUAL-CONFIG
      - SRC-SAP-SD-TEXT-AUTO-TRANSFER
      - SRC-SAP-SD-TEXT-SPECIAL-FEATURES
      - SRC-SAP-SD-TEXT-ANALYSIS

  - id: DET-SD-ITEM-CATEGORY
    title: "Item Category Determination"
    memory_key: "WHAT"
    level: item
    question: "How should this item behave inside this sales document?"
    mechanism: lookup
    inputs:
      - "sales document type"
      - "item category group from product/material master"
      - "item usage"
      - "higher-level item category where relevant"
    output:
      - ATTR-SD-ITEM-CATEGORY
    downstream_effects:
      - DET-SD-SCHEDULE-LINE-CATEGORY
      - "item delivery behavior"
      - "item billing behavior"
      - "pricing and other item controls"
    common_failures:
      - "no valid item category is found"
      - "unexpected material item category group"
      - "wrong sales document type changes the lookup context"
      - "higher-level item structure changes the result"
    check_first:
      - "Read the sales document type and material item category group."
      - "Check usage and higher-level item only if they are relevant to the case."
      - "Compare the determined category with the business behavior that is required."
    remember: "Document type + item category group + context → item behavior."
    lead_lens: >-
      An item-category change is a behavior change. Do not replace the code before
      checking what delivery, billing, pricing, and schedule-line controls move with it.
    source_refs:
      - SRC-SAP-SD-ITEM-CATEGORY-DETERMINATION
      - SRC-SAP-SD-DOCUMENT-CONTROL

  - id: DET-SD-SCHEDULE-LINE-CATEGORY
    title: "Schedule Line Category Determination"
    memory_key: "WHAT"
    level: schedule_line
    question: "How should quantity, requirements, availability, and delivery behave?"
    mechanism: lookup
    inputs:
      - ATTR-SD-ITEM-CATEGORY
      - "MRP type from product/material master"
    output:
      - ATTR-SD-SCHEDULE-LINE-CATEGORY
    downstream_effects:
      - "requirements transfer"
      - "availability-check relevance"
      - "delivery relevance"
    common_failures:
      - "unexpected MRP type changes the category"
      - "item category is already wrong upstream"
      - "the category exists but does not allow the expected planning or delivery behavior"
    check_first:
      - "Check the item category first because it is an upstream input."
      - "Read the material MRP type."
      - "Then inspect the controls of the determined schedule line category."
    remember: "Item category + MRP type → quantity and date behavior."
    lead_lens: >-
      If an item does not transfer requirements, check availability, or become delivery
      relevant as expected, the schedule line is often the better starting point than the header.
    source_refs:
      - SRC-SAP-SD-SCHEDULE-LINE-CATEGORY
      - SRC-SAP-SD-DOCUMENT-CONTROL

  - id: DET-SD-PLANT
    title: "Delivering Plant Proposal"
    memory_key: "WHERE"
    level: item
    question: "From which plant should this item normally be delivered?"
    mechanism: prioritized_default_with_override
    inputs:
      - "customer-material information record, where maintained"
      - "ship-to customer master data"
      - "product/material master data"
      - "manual or integration-provided item value"
    priority:
      - "customer-material information record"
      - "ship-to customer master"
      - "material master"
    output:
      - ATTR-SD-PLANT
    downstream_effects:
      - DET-SD-SHIPPING-POINT
      - DET-SD-AVAILABILITY
      - "sourcing and fulfillment location context"
      - "possible aATP alternative confirmation"
    common_failures:
      - "a more specific master-data source overrides the expected general default"
      - "wrong ship-to leads to a different plant proposal"
      - "plant is not valid for the intended sales/logistics design"
      - "inbound integration sends a plant and bypasses the expected default"
    check_first:
      - "Check whether the plant was entered or sent explicitly."
      - "Then inspect the plant proposal sources in priority order."
      - "If the value is correct at creation but later changes, inspect advanced sourcing or substitution separately."
    remember: "Specific customer/product data can win before customer or material defaults."
    lead_lens: >-
      Plant is a hinge in the graph. A plant change can redirect availability,
      shipping-point determination, logistics execution, and dates.
    source_refs:
      - SRC-SAP-SD-DELIVERING-PLANT
      - SRC-SAP-SD-MASTER-DATA
      - SRC-SAP-AATP-ALTERNATIVE-CONFIRMATION

  - id: DET-SD-SHIPPING-POINT
    title: "Shipping Point Determination"
    memory_key: "WHERE"
    level: item
    question: "Which shipping unit should execute delivery processing?"
    mechanism: customizing_lookup
    inputs:
      - ATTR-SD-PLANT
      - "shipping condition"
      - "loading group from product/material master"
    output:
      - ATTR-SD-SHIPPING-POINT
    downstream_effects:
      - DET-SD-ROUTE
      - DET-SD-SCHEDULING
      - "delivery execution"
    common_failures:
      - "plant is wrong upstream"
      - "shipping condition is missing or unexpected"
      - "loading group is missing or unexpected"
      - "the input combination has no valid assignment"
    check_first:
      - "Read plant, shipping condition, and loading group from the actual order context."
      - "Trace each input to its source before changing the assignment."
      - "Check whether the exact combination is configured."
    remember: "Plant + shipping condition + loading group → shipping point."
    lead_lens: >-
      A missing shipping point is usually a symptom. First find which upstream input
      is missing, wrong, or mapped to no valid combination.
    source_refs:
      - SRC-SAP-SD-SHIPPING-POINTS

  - id: DET-SD-ROUTE
    title: "Route Determination"
    memory_key: "WHERE"
    level: item
    question: "Which transportation route should be proposed?"
    mechanism: customizing_lookup
    inputs:
      - "departure country/region and zone from shipping point context"
      - "destination country/region and transportation zone from ship-to context"
      - "shipping condition"
      - "transportation group from product/material master"
    output:
      - ATTR-SD-ROUTE
    downstream_effects:
      - DET-SD-SCHEDULING
      - "transportation timing"
    common_failures:
      - "wrong ship-to or transportation zone"
      - "wrong shipping point changes departure context"
      - "transportation group is missing or incorrect"
      - "shipping condition is not the expected one"
      - "no matching route rule exists"
    check_first:
      - "Validate departure and destination geography first."
      - "Then check shipping condition and transportation group."
      - "Only after the inputs are correct, inspect the route mapping."
    remember: "Departure + destination + shipping policy + material transport group → route."
    lead_lens: >-
      Route joins customer geography, logistics organization, material attributes,
      and shipping policy. That is why route defects rarely belong to one table only.
    source_refs:
      - SRC-SAP-SD-ROUTE-DETERMINATION

  - id: DET-SD-SCHEDULING
    title: "Delivery & Transportation Scheduling"
    memory_key: "WHEN"
    level: schedule_line
    question: "When must logistics activities happen to support the requested delivery date?"
    mechanism: calculation
    inputs:
      - ATTR-SD-REQUESTED-DELIVERY-DATE
      - ATTR-SD-ROUTE
      - ATTR-SD-SHIPPING-POINT
      - "product/material context"
      - "ship-to context"
      - "transit, loading, pick/pack, and transportation lead times"
      - "relevant calendars"
    output:
      - "material availability date"
      - "loading date"
      - "goods issue date"
      - "transportation planning date"
    downstream_effects:
      - DET-SD-AVAILABILITY
      - "delivery timing"
      - "confirmation timing"
    common_failures:
      - "unexpected route or shipping point changes lead times"
      - "calendar differences move dates"
      - "requested date is physically too early"
      - "lead-time configuration is inconsistent with the logistics design"
    check_first:
      - "Start from the requested delivery date and compare all calculated dates."
      - "Trace route and shipping point upstream if lead times look wrong."
      - "Check calendars before assuming the arithmetic is wrong."
    remember: "Requested date is a target; calculated logistics dates make it executable."
    lead_lens: >-
      Scheduling explains why requested delivery date and material availability date
      are different concepts. Dates are outputs of logistics assumptions and calendars.
    source_refs:
      - SRC-SAP-SD-SCHEDULING

  - id: DET-SD-PRICING
    title: "Pricing"
    memory_key: "PRICE"
    level: header_and_item
    question: "Which price elements apply, in which procedure, and from which records?"
    mechanism: condition_technique
    inputs:
      - "sales area"
      - "document pricing procedure"
      - "customer pricing procedure"
      - "pricing procedure"
      - "condition types and access sequences"
      - "condition tables and condition records"
      - "customer, product, quantity, date, and other pricing fields"
    procedure_context:
      - "sales organization"
      - "distribution channel"
      - "division"
      - "document pricing procedure"
      - "customer pricing procedure"
    output:
      - "price conditions"
      - "discounts and surcharges"
      - "tax-related pricing elements where applicable"
      - "subtotals"
      - "net value"
    downstream_effects:
      - "commercial value of the order"
      - "billing values where relevant"
      - "credit exposure context"
    common_failures:
      - "wrong pricing procedure is determined"
      - "expected condition type is missing from the procedure"
      - "access sequence does not find a valid record"
      - "condition record is missing, expired, or has the wrong key"
      - "requirement, exclusion, scale, formula, or manual condition changes the result"
    check_first:
      - "First verify which pricing procedure was determined."
      - "Then use the pricing analysis/trace to find the first missing or unexpected condition."
      - "Follow the access sequence and condition-record key instead of staring at net value."
    remember: "Procedure chooses the calculation path; access sequence searches for condition data."
    lead_lens: >-
      Pricing is a search and calculation pipeline. The trace is usually more useful
      than the final amount because it shows where the expected path stopped.
    source_refs:
      - SRC-SAP-SD-PRICING-PROCEDURE
      - SRC-SAP-SD-CONDITION-TECHNIQUE

  - id: DET-SD-TAX
    title: "Tax / VAT Determination"
    memory_key: "PRICE"
    level: header_and_item
    question: "Which tax logic, rate, and amount apply to this sale?"
    mechanism: condition_technique
    inputs:
      - "tax departure country / region, normally derived from the delivering plant"
      - "tax destination country / region, normally derived from the ship-to party"
      - "customer tax classification / tax liability"
      - "material tax classification / tax liability"
      - "sales-organization rule for the sales tax identification number / VAT identity"
      - "tax condition types, access sequences, and condition records"
    output:
      - "tax condition"
      - "tax code / rate where applicable"
      - "tax amount"
    downstream_effects:
      - "order commercial value"
      - "billing tax data"
      - "FI tax posting context"
    common_failures:
      - "wrong partner drives tax identity or destination context"
      - "wrong plant changes the tax departure country"
      - "customer or material tax classification is missing or unexpected"
      - "wrong pricing procedure, tax condition, access, or condition record"
      - "tax-ID source rule is misunderstood as a fixed partner rule"
    check_first:
      - "Separate tax geography, tax liability/classification, and VAT / tax-ID source; they are different inputs."
      - "Check plant/departure country and ship-to/destination country."
      - "Check customer and material tax classifications."
      - "Check the sales-organization rule that selects the tax-ID source when partner roles differ."
      - "Then use pricing analysis to trace the tax condition and access sequence."
    remember: "VAT is pricing plus geography plus tax liability plus a rule for tax identity."
    lead_lens: >-
      A tax issue is often a partner or geography issue before it is a condition-record issue.
      Do not assume that one partner function owns every tax field.
    source_refs:
      - SRC-SAP-SD-TAX-DETERMINATION
      - SRC-SAP-SD-SALES-ORDER-HEADER
      - SRC-SAP-SD-CONDITION-TECHNIQUE

  - id: DET-SD-AVAILABILITY
    title: "Availability Check / Confirmation"
    memory_key: "PROMISE"
    level: schedule_line
    question: "What quantity and date can the system confirm?"
    mechanism: availability_check
    inputs:
      - ATTR-SD-PLANT
      - "product/material"
      - "requested quantity"
      - "material availability date"
      - "checking configuration and scope"
      - "current and future supply/demand situation"
    output:
      - ATTR-SD-CONFIRMED-QUANTITY
      - ATTR-SD-CONFIRMED-DATE
    downstream_effects:
      - "customer order confirmation"
      - "delivery feasibility"
      - "backorder processing or other aATP capabilities where used"
      - "alternative confirmation strategies where used"
    common_failures:
      - "stock exists but is not relevant or available for this check"
      - "material availability date differs from the date the user is looking at"
      - "wrong plant changes the supply situation"
      - "scope/check configuration excludes or includes unexpected elements"
      - "other requirements consume the available quantity"
    check_first:
      - "Use the exact plant, requested quantity, and material availability date from the order."
      - "Check the confirmation result, not only unrestricted stock."
      - "Inspect the scope and supply/demand elements before changing ATP configuration."
    remember: "Inventory is a balance. ATP is a promise for quantity, date, and location."
    lead_lens: >-
      Do not debug ATP with a stock screenshot. The useful unit is requirement + date
      + location + scope + supply/demand situation.
    source_refs:
      - SRC-SAP-AATP-PRODUCT-AVAILABILITY-CHECK
      - SRC-SAP-AATP-ALTERNATIVE-CONFIRMATION
      - SRC-SAP-SD-SCHEDULING

  - id: DET-SD-CREDIT
    title: "Credit Check"
    memory_key: "RISK"
    level: document_processing
    question: "Can the order continue under the current customer credit situation?"
    mechanism: credit_check
    inputs:
      - "business partner credit data"
      - "credit segment and credit limit context"
      - "risk class / check rule context"
      - "order value and credit exposure"
      - "configured automatic credit checks"
    output:
      - "credit result"
      - "possible credit block"
    downstream_effects:
      - "ability to continue processing"
      - "credit-release workflow or review"
      - "delivery processing depending on the design"
    common_failures:
      - "credit master data is incomplete or assigned to the wrong segment"
      - "credit limit or exposure is not what the business expects"
      - "check configuration differs by risk/check context"
      - "sales document is blocked although logistics data is correct"
    check_first:
      - "Separate a credit block from logistics or pricing errors."
      - "Read the credit result and the business-partner credit context."
      - "Inspect exposure and the configured check before changing the limit."
    remember: "A technically valid order can still be commercially blocked."
    lead_lens: >-
      Credit is a cross-domain decision. Sales creates the commercial exposure,
      while SAP Credit Management evaluates whether processing should continue.
    source_refs:
      - SRC-SAP-SD-CREDIT-CHECK

  - id: DET-SD-BATCH
    title: "Batch Determination Touchpoint"
    memory_key: "FULFILL"
    level: item_or_delivery
    question: "Which eligible batch can satisfy the business requirement?"
    mechanism: search_strategy
    inputs:
      - "business transaction"
      - "search procedure"
      - "strategy type"
      - "selection criteria"
      - "sort rule"
      - "available batch stock when execution reaches this point"
    output:
      - "selected batch or ranked batch candidates"
    downstream_effects:
      - "batch-specific fulfillment"
      - "delivery execution"
    common_failures:
      - "no batch meets selection criteria"
      - "classification data is missing or inconsistent"
      - "sort rule returns a technically valid but unexpected batch"
      - "search strategy is not found for the transaction context"
    check_first:
      - "Confirm where batch determination is expected to run in the process."
      - "Check strategy, selection criteria, and batch characteristics separately."
      - "Do not mix a batch-search problem with the earlier ATP confirmation problem."
    remember: "ATP answers whether we can promise; batch search can later answer which stock will fulfill."
    lead_lens: >-
      Batch determination is kept as a touchpoint because it is a later fulfillment
      search, not the same decision as sales-order availability confirmation.
    source_refs:
      - SRC-SAP-BATCH-SEARCH-STRATEGY

