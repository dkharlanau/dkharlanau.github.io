process_matrix:
  columns: ["Procurement", "Inventory", "Production", "Quality", "Sales/Delivery", "Warehouse"]
  rows:
    - capability: "Batch Management"
      coverage: ["strong", "strong", "strong", "strong", "strong", "strong"]
    - capability: "Handling Unit Management"
      coverage: ["medium", "strong", "medium", "low", "strong", "strong"]
    - capability: "Serial Number Management"
      coverage: ["strong", "strong", "strong", "strong", "strong", "medium"]
    - capability: "Classification System"
      coverage: ["supporting", "supporting", "supporting", "supporting", "supporting", "supporting"]
    - capability: "Split Valuation"
      coverage: ["strong", "strong", "medium", "low", "medium", "medium"]
    - capability: "Stock Determination"
      coverage: ["low", "strong", "strong", "low", "medium", "medium"]
  note: >-
    Coverage values are an architecture reading for learning, not SAP scope entitlements. They show where the capability
    commonly matters in an end-to-end logistics design, not whether every process variant uses it.

selection_guide:
  - signal: "Trace a homogeneous lot and select stock by lot properties"
    choose: "Batch Management + Classification; add Batch Determination only when automatic selection is needed."
  - signal: "Move, scan, nest, and ship a physical pallet/carton/container as one unit"
    choose: "Handling Unit Management."
  - signal: "Identify one exact device, machine part, or sellable unit"
    choose: "Serial Number Management."
  - signal: "Reuse attributes across objects or drive characteristic-based selection"
    choose: "Classification System."
  - signal: "Same material, different inventory value by origin/quality/status"
    choose: "Split Valuation."
  - signal: "Automatically prioritize which eligible stock source is consumed"
    choose: "Stock Determination."

architecture_boundaries:
  - "Batch Management is not Serial Number Management: lot identity and individual-unit identity solve different traceability problems."
  - "Handling Unit Management is not warehouse management: an HU is a logistics object; EWM adds warehouse topology, tasks, waves, resources, and execution rules."
  - "Classification is not master-data governance: it models object attributes; governance controls ownership, quality, workflow, and lifecycle."
  - "Split Valuation is not a substitute for batch management: valuation identity and traceability identity can be independent."
  - "Stock Determination is not ATP: stock determination chooses a source for withdrawal; ATP answers whether and when demand can be confirmed."
  - "Stock Determination is not Batch Determination: one chooses stock-source priority, the other selects suitable batches."

failure_modes:
  - id: FAIL-LO-BATCH-NOT-DETERMINED
    symptom: "Stock exists but no batch is selected."
    first_checks: ["batch availability and status", "classification values", "selection class", "search strategy and validity", "shelf-life constraints"]
  - id: FAIL-LO-HU-PROCESS-BLOCK
    symptom: "Goods exist but the movement cannot continue without an HU."
    first_checks: ["HU-managed location/process", "packing status", "HU identification", "delivery/HU consistency", "nested HU structure"]
  - id: FAIL-LO-SERIAL-MISSING
    symptom: "Document quantity is correct but posting cannot complete."
    first_checks: ["serial number profile", "active procedure", "required number of serials", "serial status and document assignment"]
  - id: FAIL-LO-SPLIT-VALUATION
    symptom: "Goods movement reaches the correct material but valuation is wrong or incomplete."
    first_checks: ["valuation category", "valuation type", "material accounting data", "movement/reference context", "posting/account determination"]
  - id: FAIL-LO-STOCK-DETERMINATION
    symptom: "System withdraws from an unexpected stock source."
    first_checks: ["material stock determination group", "application rule", "resolved strategy", "stock priority and eligibility", "whether another execution layer owns removal"]

practitioner_heuristics:
  - "Start with the identity the business must preserve: lot, package, unit, attribute set, value, or stock source."
  - "Do not activate a cross-process capability only because one transaction can technically use it."
  - "Separate mandatory-by-design from mandatory-by-standard: a feature may be optional globally but compulsory once a profile, managed location, or process rule is active."
  - "Model nested capabilities below their parent. Shelf life belongs under batch/inventory; packing instructions belong under HU Management."
  - "When two mechanisms coexist, state the question each one answers. That avoids ATP, batch determination, stock determination, and EWM removal logic becoming one vague 'availability' box."

assessment_drills:
  - question: "Batch versus serial number: what is the difference?"
    strong_answer: "A batch identifies a lot of material. A serial number identifies one individual unit. A product can require either or both."
  - question: "When does Handling Unit Management become mandatory?"
    strong_answer: "It is optional globally, but a process or storage location can be designed as HU-managed. Then stock and movements must preserve the HU object."
  - question: "Why is Classification relevant to logistics?"
    strong_answer: "It gives reusable characteristics and classes. Batch determination is a practical example because selection can depend on batch characteristics."
  - question: "Split valuation versus batch management?"
    strong_answer: "Split valuation separates inventory value; batch management separates lot identity and traceability. They can be used independently or together."
  - question: "Stock determination versus ATP?"
    strong_answer: "ATP confirms whether and when demand can be fulfilled. Stock determination chooses which eligible stock source should be consumed."

