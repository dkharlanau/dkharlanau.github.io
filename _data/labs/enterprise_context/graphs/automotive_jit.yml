id: GRAPH-AUTO-JIT-JIS
type: knowledge_graph
title: "Automotive JIT / JIS — Signal to Sequence"
domain: "SAP S/4HANA Automotive"
process_family: "Just-In-Time and Just-In-Sequence Supply"
process_step: "From scheduling agreement forecasts through exact calls, sequence, delivery, forwarding, and confirmation"
status: researching
created_at: "2026-08-16"
updated_at: "2026-08-16"
verified_at: "2026-08-16"

summary: >-
  A Lead-level map of Automotive JIT and JIS. It separates planning signals from execution calls,
  summarized calls from sequenced calls, classic JIT Inbound/Outbound from Next Generation JIT Supply,
  and the customer-call lifecycle from production, handling unit, delivery, EWM/TM, supplier forwarding, and monitoring boundaries.

thesis: >-
  Forecast and JIT delivery schedules say what the customer expects over a horizon; JIT/JIS calls say what must be supplied now.
  Sequenced calls add vehicle/sequence discipline, so the risk is not only quantity and date but order, destination, package, status, and downstream handoff.
  A Lead diagnosis follows signal → call → control → build/pick → sequence/pack → ship → confirm/reconcile.

boundary:
  includes:
    - "Sales and purchasing scheduling agreements and releases"
    - "Forecast delivery schedules and JIT delivery schedules"
    - "Classic JIT Inbound summarized and sequenced calls"
    - "Classic call control, requirements match, JIT monitoring, and JIT Outbound"
    - "Next Generation JIT Supply to Customer and sequenced JIS"
    - "Customer destination, sequence groups, packing/HU, delivery, EWM and TM integration"
    - "Supplier forwarding and exception/recovery boundaries"
  excludes_for_later_deep_dives:
    - "Full EDI partner-profile and IDoc mapping catalogue"
    - "OEM-specific VDA/Odette implementation details"
    - "Full repetitive manufacturing, EWM, and TM configuration"
    - "Commercial self-billing and settlement variants"

concept_split:
  planning_signal:
    title: "Delivery Schedule"
    purpose: "Plan expected quantities and dates against a long-term scheduling agreement."
    types:
      - id: AUTO-SIGNAL-FRC
        title: "Forecast Delivery Schedule"
        reading: "Longer-horizon planning signal for production/procurement."
      - id: AUTO-SIGNAL-JIT-SCHEDULE
        title: "JIT Delivery Schedule"
        reading: "Near-term schedule; within the JIT horizon it can override forecast relevance according to configuration."
    source_refs: [SRC-SAP-AUTO-SA-RELEASES, SRC-SAP-AUTO-SALES-SA, SRC-SAP-AUTO-SA-FAQ]
  execution_signal:
    title: "JIT / JIS Call"
    purpose: "Dedicated short-term execution requirement."
    types:
      - id: AUTO-CALL-SUM
        title: "Summarized JIT Call"
        sequence_sensitive: false
        reading: "Quantity/time-focused call, often with simpler internal control."
      - id: AUTO-CALL-SEQ
        title: "Sequenced JIT Call / JIS"
        sequence_sensitive: true
        reading: "Supply must preserve customer sequence through production, packing, and delivery."
    source_refs: [SRC-SAP-AUTO-CLASSIC-CALL-CONTROL, SRC-SAP-AUTO-CLASSIC-CALL-TYPES, SRC-SAP-AUTO-NG-S2C]

memory_model:
  path: "AGREEMENT → FORECAST → CALL → CONTROL → BUILD / PICK → SEQUENCE / PACK → DELIVER → FORWARD / CONFIRM → RECONCILE"
  questions:
    - key: AGREEMENT
      question: "Which long-term relationship owns the flow?"
      answer: "Start with scheduling agreement, JIT customer/supplier, destination, material/component, and partner mapping."
    - key: FORECAST
      question: "Which planning signal creates the demand expectation?"
      answer: "Forecast and JIT delivery schedules provide horizon-based requirements before or alongside exact calls."
    - key: CALL
      question: "What exact execution call arrived?"
      answer: "Identify external call number, summarized/sequenced type, date/time, sequence, destination, components, and change/cancellation context."
    - key: CONTROL
      question: "Which action/status is allowed now?"
      answer: "Classic call control links actions to internal/external status; modern flows also expose lifecycle and processing status."
    - key: BUILD
      question: "Do we produce, pick, or replenish externally?"
      answer: "Supply path depends on stock, production, component-group context, and process generation."
    - key: SEQUENCE
      question: "How is sequence and package integrity protected?"
      answer: "For JIS use sequence rules, sequence groups, packing groups/HUs, split rules, and explicit handling of valid gaps."
    - key: DELIVER
      question: "How does the call become delivery and PGI?"
      answer: "Delivery, HU, EWM and TM execute the physical flow while preserving call and sequence references."
    - key: FORWARD
      question: "Does upstream supply need the same short-term demand?"
      answer: "A system supplier can forward inbound sequenced or summarized demand to its own suppliers."
    - key: RECONCILE
      question: "How do we prove fulfillment?"
      answer: "Reconcile schedule, call status, supply, sequence/packing, delivery/PGI, forwarding, confirmations, and exception logs."

process_families:
  - id: AUTO-FAMILY-CLASSIC-INBOUND
    title: "Classic JIT Inbound"
    reading: "Summarized and sequenced call processing with call components/groups and configurable call control."
    key_objects: ["JIT call", "call component", "components group", "external call number", "internal status", "external status", "action"]
    source_refs: [SRC-SAP-AUTO-CLASSIC-STRUCTURE, SRC-SAP-AUTO-CLASSIC-CALL-CONTROL, SRC-SAP-AUTO-CLASSIC-CALL-TYPES]
  - id: AUTO-FAMILY-CLASSIC-OUTBOUND
    title: "Classic JIT Outbound"
    reading: "System supplier forwards received JIT demand to upstream suppliers."
    key_objects: ["inbound JIT call", "outbound JIT call", "supplier relationship", "forwarded component requirement"]
    source_refs: [SRC-SAP-AUTO-JIT-OUTBOUND]
  - id: AUTO-FAMILY-NG-S2C
    title: "Next Generation JIT Supply to Customer"
    reading: "Current S/4HANA supplier-to-customer JIT/JIS with customer/destination data, sequence/packing groups, Delivery, HU, TM and EWM integration."
    key_objects: ["customer JIT/JIS call", "sales scheduling agreement", "customer destination", "sequence group", "packing group", "handling unit", "outbound delivery"]
    source_refs: [SRC-SAP-AUTO-NG-S2C, SRC-SAP-AUTO-NG-CUSTOMER-DATA, SRC-SAP-AUTO-NG-E2E-JIS]

runtime_pipeline:
  - order: 1
    id: AUTO-RUNTIME-AGREEMENT
    title: "Establish agreement and partner context"
    question: "Which customer/supplier/material relationship owns this demand?"
    inputs: ["scheduling agreement", "customer/supplier", "destination/assembly location", "material/component", "plant/sales area"]
    output: ["valid long-term relationship and JIT-relevant context"]
    failure_signal: "Call cannot be assigned to the intended partner, destination, material, or agreement."
  - order: 2
    id: AUTO-RUNTIME-PLAN
    title: "Receive planning schedules"
    question: "What forecast/JIT schedule was already communicated?"
    inputs: ["forecast schedule", "JIT schedule", "JIT horizon", "cumulative quantities", "tolerance profile"]
    output: ["planning and delivery-relevance baseline"]
    failure_signal: "Planning follows stale forecast while near-term relevance has changed."
  - order: 3
    id: AUTO-RUNTIME-CALL
    title: "Identify the execution call"
    question: "What exact short-term requirement arrived?"
    inputs: ["external call number", "call type", "sequence", "date/time", "components", "destination", "change/cancellation"]
    output: ["accepted, changed, cancelled, duplicate, or exception call"]
    failure_signal: "Duplicate identity, wrong destination, component assignment, or sequence interpretation creates the wrong call state."
  - order: 4
    id: AUTO-RUNTIME-CONTROL
    title: "Apply call control and status"
    question: "Which action is allowed now?"
    inputs: ["call control", "internal status", "external status", "action", "components group/process generation"]
    output: ["new status and permitted logistical/technical action"]
    failure_signal: "Valid call cannot progress because action/status logic does not match the intended business transition."
    source_refs: [SRC-SAP-AUTO-CLASSIC-CALL-CONTROL]
  - order: 5
    id: AUTO-RUNTIME-MATCH
    title: "Match calls to planned requirements"
    question: "Do exact calls fit the forecast/JIT schedule baseline?"
    inputs: ["JIT calls", "forecast/JIT schedules", "quantity", "time window"]
    output: ["critical, balanced, or not-balanced requirement picture"]
    failure_signal: "Call and planned requirements are not reconciled, creating shortage or excess risk."
    source_refs: [SRC-SAP-AUTO-CLASSIC-REQ-MATCH]
  - order: 6
    id: AUTO-RUNTIME-SUPPLY
    title: "Produce, pick, or replenish"
    question: "How will the requested component/group be supplied?"
    inputs: ["stock", "production progress", "component group", "requested quantity/time", "replenishment strategy"]
    output: ["supply ready for sequence and packing"]
    failure_signal: "Missing component, production delay, or wrong replenishment path threatens the call."
  - order: 7
    id: AUTO-RUNTIME-SEQUENCE
    title: "Control sequence and packing"
    question: "Can the required vehicle sequence survive physical packaging?"
    inputs: ["sequence number", "sequence profile/check", "delivery sequence group", "packing group", "planned HU", "split criteria"]
    output: ["ordered package units and explicit sequence exceptions"]
    failure_signal: "Sequence parsing, gap handling, packing grouping, or split logic breaks customer order."
    source_refs: [SRC-SAP-AUTO-NG-SEQUENCE, SRC-SAP-AUTO-NG-SEQUENCE-CHECK]
  - order: 8
    id: AUTO-RUNTIME-DELIVER
    title: "Create delivery and execute logistics"
    question: "How does sequence-safe supply become delivery and PGI?"
    inputs: ["eligible calls", "package/HU", "shipping point", "EWM/TM", "subsequent-delivery need"]
    output: ["outbound delivery", "warehouse/transport state", "PGI", "call status update"]
    failure_signal: "Delivery split, EWM block, TM handoff, or one delayed component prevents expected completion."
    source_refs: [SRC-SAP-AUTO-NG-DELIVERY, SRC-SAP-AUTO-NG-E2E-JIS]
  - order: 9
    id: AUTO-RUNTIME-FORWARD
    title: "Forward demand upstream"
    question: "Which part of customer demand must reach our supplier?"
    inputs: ["inbound call", "supplier/component mapping", "outbound/forwarded process", "message partner"]
    output: ["supplier requirement traceable to customer demand"]
    failure_signal: "Customer call changes but supplier demand is stale, duplicated, late, or untraceable."
    source_refs: [SRC-SAP-AUTO-JIT-OUTBOUND]
  - order: 10
    id: AUTO-RUNTIME-RECONCILE
    title: "Monitor, confirm, and reconcile"
    question: "Was the call fulfilled in quantity, time, destination, and sequence?"
    inputs: ["monitor/log", "call status", "supply", "packing/HU", "delivery/PGI", "confirmation", "forwarded call"]
    output: ["complete, partial, cancelled, reordered, subsequent-delivery, or owned exception state"]
    failure_signal: "Delivery is green but call, sequence, confirmation, or supplier/customer evidence is inconsistent."
    source_refs: [SRC-SAP-AUTO-CLASSIC-MONITOR, SRC-SAP-AUTO-NG-MANAGE-CALLS]

sequence_model:
  principle: >-
    JIS is not simply JIT with a smaller time window. Sequence becomes a business key for production, packing, delivery, and transport execution.
    A sequence gap is not automatically an error because different suppliers can own different numbers.
  controls: ["external sequence number/profile", "sequence checks and permitted gaps", "delivery sequence group", "packing group/HU", "JIS split criteria", "subsequent delivery"]
  source_refs: [SRC-SAP-AUTO-NG-SEQUENCE, SRC-SAP-AUTO-NG-SEQUENCE-CHECK, SRC-SAP-AUTO-NG-DELIVERY]

integration_boundaries:
  - boundary: "Customer message / Scheduling Agreement"
    ownership: "Customer schedules and calls must map to the correct agreement, customer, destination, and material context."
    note: "VDA, AIAG, and Odette define relevant delivery-schedule conventions; exact partner message design is project-specific."
    source_refs: [SRC-SAP-AUTO-SA-FAQ]
  - boundary: "Classic JIT / Call Control"
    ownership: "Call control owns allowed action/status progression; downstream logistics executes the action."
    source_refs: [SRC-SAP-AUTO-CLASSIC-CALL-CONTROL]
  - boundary: "JIS / HU and Delivery"
    ownership: "JIS owns sequence context; packing/HU and delivery own physical package/shipment while preserving references."
    source_refs: [SRC-SAP-AUTO-NG-E2E-JIS, SRC-SAP-AUTO-NG-DELIVERY]
  - boundary: "JIS / EWM and TM"
    ownership: "EWM and TM own warehouse/transport execution; JIT state must reflect downstream execution without losing sequence."
    source_refs: [SRC-SAP-AUTO-NG-MANAGE-CALLS, SRC-SAP-AUTO-NG-E2E-JIS]
  - boundary: "System Supplier / Upstream Supplier"
    ownership: "JIT Outbound/forwarded JIS transforms customer demand into supplier demand with traceability."
    source_refs: [SRC-SAP-AUTO-JIT-OUTBOUND]
  - boundary: "Message Technology"
    ownership: "Classic landscapes expose EDI/IDoc-era monitoring; current Next Generation apps document SOAP-based electronic interchange and message monitoring."
    source_refs: [SRC-SAP-AUTO-NG-MANAGE-CALLS]

failure_modes:
  - id: AUTO-FAIL-SCHEDULE-CALL-MISMATCH
    symptom: "Exact calls do not fit forecast/JIT schedule requirements."
    first_checks: ["requirements match", "JIT horizon", "latest schedule", "cumulative quantities", "call date/time", "customer change/cancellation"]
    avoid: "Do not treat forecast as execution truth when a valid short-term call supersedes it."
  - id: AUTO-FAIL-CALL-IDENTITY
    symptom: "Call is duplicated, assigned to wrong destination, or cannot be uniquely identified."
    first_checks: ["external call number", "uniqueness window", "sales area", "ship-to/destination", "assembly location", "split rule", "partner mapping"]
    avoid: "Do not renumber manually without understanding customer reuse rules."
  - id: AUTO-FAIL-CALL-CONTROL
    symptom: "Valid call cannot progress to expected action."
    first_checks: ["components group", "call control determination", "internal/external status", "allowed action", "action log"]
    avoid: "Do not force status until the failed action is understood."
  - id: AUTO-FAIL-SEQUENCE
    symptom: "JIS appears out of sequence or packing/delivery order differs from customer sequence."
    first_checks: ["raw sequence", "sequence profile", "gap rules", "sequence group", "packing group", "delayed/subsequent group"]
    avoid: "Do not assume every sequence gap is lost demand."
  - id: AUTO-FAIL-SUPPLY
    symptom: "Call is valid but component group is not ready on time."
    first_checks: ["stock", "production progress", "priority", "replenishment path", "component assignment", "subsequent-delivery option"]
    avoid: "Do not block all sequence-valid calls because one component is late unless package rules require it."
  - id: AUTO-FAIL-DELIVERY-HU
    symptom: "Sequence/packing is correct but delivery, EWM, or TM handoff fails."
    first_checks: ["package unit", "planned HU", "split criteria", "shipping point", "EWM block/task", "TM integration", "subsequent delivery"]
    avoid: "Do not recreate the JIT call because a downstream execution object failed."
  - id: AUTO-FAIL-FORWARDING
    symptom: "Customer call changed but supplier-facing demand is stale or missing."
    first_checks: ["source inbound call", "forwarding action", "supplier mapping", "outbound call", "message processing", "change/cancellation propagation"]
    avoid: "Do not create independent supplier demand that loses customer-sequence traceability."

impact_traces:
  - id: AUTO-TRACE-SEQUENCE
    start: "Wrong sequence interpretation"
    path: ["wrong build/packing order", "wrong HU order", "delivery sequence mismatch", "OEM assembly disruption", "premium freight/rework/line-stop risk"]
    lead_question: "Is customer message, sequence profile, grouping, or physical execution wrong?"
  - id: AUTO-TRACE-DESTINATION
    start: "Wrong customer destination / assembly location"
    path: ["valid call mapped to wrong line", "correct logistics for wrong destination", "customer shortage despite shipped stock"]
    lead_question: "Was destination transferred from message or determined from JIT customer data?"
  - id: AUTO-TRACE-FORWARD
    start: "Customer call changes after supplier demand was forwarded"
    path: ["customer requirement changes", "supplier call stays stale", "excess/shortage arrives", "system supplier buffers mismatch", "sequence/service risk grows"]
    lead_question: "How do change/cancellation propagation remain traceable and idempotent?"

lead_lens:
  what_i_ask_first:
    - "Is this a planning schedule problem or an exact JIT/JIS call problem?"
    - "Is the call summarized or sequenced, and which process generation owns it?"
    - "Is the defect identity, quantity/time, status, sequence, supply readiness, packaging/delivery, forwarding, or confirmation?"
  decision_owner: "Scheduling agreements own long-term context; JIT/JIS owns exact call and sequence state; Production/EWM/LE/TM own physical execution; external interfaces own partner contract and confirmations."
  main_trade_off: "React to exact OEM demand with minimal stock while preserving sequence, traceability, and controlled recovery."
  typical_failure: "Treating JIT as ordinary delivery scheduling and missing call identity, sequence, status, or supplier-forwarding state."
  proof_of_cause: "Join delivery schedule history, external call, customer/destination data, action log, sequence/packing group, HU/delivery/PGI, EWM/TM state, forwarded supplier call, and confirmation evidence."
  integration_impact: "Automotive JIT/JIS connects Sales scheduling agreements, Production, MM, HU, Delivery, EWM, TM, suppliers, and OEM message flows."
  data_impact: "Destination, external call number, sequence number, component/group mapping, scheduling agreement, horizon, split/grouping, and HU data are operational keys."
  sixty_second_explanation: >-
    I separate planning schedules from exact calls. Forecast and JIT schedules create the demand horizon, while a JIT/JIS call is the short-term execution instruction.
    I prove call identity, destination, quantity/time and whether it is summarized or sequenced. Then I follow status/control, requirements matching, production or picking,
    and for JIS the sequence and packing group. HU, Delivery, EWM and TM are downstream execution owners that must preserve call and sequence references.
    If we are a system supplier, I also trace forwarded supplier demand. Completion means call, sequence, delivery, confirmations and exception logs agree.

assessment_prompts:
  - "Forecast says 100 but new JIT calls require 130 near-term. Explain planning versus execution truth."
  - "The OEM reuses an external call number and the system flags a duplicate. Build the identity diagnosis."
  - "A sequenced call is received but the next call-control action is not allowed. Explain status/action investigation."
  - "Sequence numbers are 101, 102, 105, 108. Decide whether gaps are errors before stopping production."
  - "One JIS component group is late while the rest of the packing group is ready. Explain sequence and subsequent-delivery impact."
  - "A customer JIS call changes after requirements were forwarded to an upstream supplier. Design recovery and reconciliation."
