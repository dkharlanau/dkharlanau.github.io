id: GRAPH-QM-QUALITY-MANAGEMENT
type: knowledge_graph
title: "Quality Management — Trigger to Disposition"
domain: "SAP S/4HANA Quality Management"
process_family: "Quality Planning / Inspection / Improvement"
process_step: "From quality-relevant event to inspection, decision, stock consequence, and follow-up"
status: researching
created_at: "2026-08-16"
updated_at: "2026-08-16"
verified_at: "2026-08-16"

summary: >-
  A Lead-level map of Quality Management across procurement, production, inventory, and sales.
  It separates the event that triggers inspection from inspection planning, evidence, usage decision,
  stock disposition, corrective follow-up, and customer-facing quality proof.

thesis: >-
  Quality is not a final yes/no flag. One logistics or production event can create an inspection lot,
  collect results and defects, produce a usage decision, change stock usability, create corrective work,
  and affect delivery or customer evidence.

boundary:
  includes:
    - "Inspection lot origin and inspection type"
    - "Inspection lot, inspection specification, plan, and characteristics"
    - "Results recording, valuation, defects, and usage decision"
    - "Stock disposition and quality notification boundary"
    - "Procurement, production, inventory, EWM, and sales integration"
    - "Quality certificate boundary"
  excludes_for_later_deep_dives:
    - "Detailed configuration of every inspection type"
    - "Sampling and dynamic modification configuration"
    - "Calibration and test-equipment management"
    - "Audit management"
    - "Detailed quality-cost accounting"

memory_model:
  path: "EVENT → LOT → SPEC → RECORD → DECIDE → DISPOSE → FOLLOW-UP → PROVE"
  questions:
    - key: EVENT
      question: "Which business event made quality relevant?"
      answer: "Start with goods receipt, production, receipt from production, stock movement, delivery, return, or another inspection origin."
    - key: LOT
      question: "Why was this inspection lot created, or why was it not created?"
      answer: "Inspection lot origin and inspection type define creation and processing context together with material and process settings."
    - key: SPEC
      question: "What exactly should be inspected?"
      answer: "Trace the inspection plan or task list, operations, characteristics, methods, validity, and acceptance limits that apply to the lot."
    - key: RECORD
      question: "What evidence was measured or observed?"
      answer: "Results recording captures quantitative or qualitative characteristic results and their valuation."
    - key: DECIDE
      question: "Who accepts or rejects the inspected material?"
      answer: "The usage decision completes the inspection decision and can trigger follow-up actions."
    - key: DISPOSE
      question: "What happens to the physical stock after the decision?"
      answer: "For stock-relevant lots, stock posting can move quantities to unrestricted, blocked, scrap, or another allowed destination."
    - key: FOLLOW-UP
      question: "Does the problem require action beyond the lot?"
      answer: "Defects and quality notifications can carry problem, cause, task, responsibility, and corrective work."
    - key: PROVE
      question: "What quality evidence must travel downstream?"
      answer: "Delivery controls, batch data, inspection results, and quality certificates can become part of the customer handoff."

control_layers:
  - id: QM-CTRL-TRIGGER
    title: "Inspection Trigger"
    purpose: "Defines which business event can create the inspection requirement."
    diagnostic_question: "Did the right event create the right inspection context?"
    source_refs: [SRC-SAP-QM-LOT-ORIGIN]
  - id: QM-CTRL-SPEC
    title: "Inspection Specification"
    purpose: "Defines what must be checked and against which criteria."
    diagnostic_question: "Is the lot using the intended specification for this material and process?"
  - id: QM-CTRL-RESULT
    title: "Result and Valuation"
    purpose: "Separates inspection evidence from acceptance of characteristics or samples."
    diagnostic_question: "Is the evidence complete and correctly valuated?"
    source_refs: [SRC-SAP-QM-RESULTS]
  - id: QM-CTRL-UD
    title: "Usage Decision"
    purpose: "Completes the quality decision and can trigger follow-up actions."
    diagnostic_question: "Has the inspection been completed with the correct decision and authority?"
    source_refs: [SRC-SAP-QM-USAGE-DECISION]
  - id: QM-CTRL-STOCK
    title: "Stock Disposition"
    purpose: "Controls the stock consequence for stock-relevant lots."
    diagnostic_question: "Is quality accepted but stock still in the wrong state, or was the disposition itself wrong?"
    source_refs: [SRC-SAP-QM-LOT-COMPLETION]

runtime_pipeline:
  - order: 1
    title: "Receive a quality-relevant event"
    question: "What event should trigger quality control?"
    inputs: ["goods receipt", "production event", "stock movement", "delivery or return", "material quality settings"]
    output: ["inspection requirement context"]
    failure_signal: "The business event completes, but no expected inspection starts or an unexpected inspection blocks the process."
  - order: 2
    title: "Create inspection lot"
    question: "Which quantity and object belong to this inspection?"
    inputs: ["inspection lot origin", "inspection type", "material and plant", "quantity", "batch or document reference"]
    output: ["inspection lot with status and reference context"]
    failure_signal: "Lot exists with the wrong origin, quantity, reference, status, or processing behavior."
    source_refs: [SRC-SAP-QM-INSPECTION-LOT, SRC-SAP-QM-LOT-ORIGIN]
  - order: 3
    title: "Assign inspection specification"
    question: "Which checks and limits should apply?"
    inputs: ["material", "plant", "inspection plan or task list", "characteristics", "validity and usage"]
    output: ["inspection operations and characteristics"]
    failure_signal: "Expected characteristics are missing, obsolete, or based on the wrong specification."
  - order: 4
    title: "Record and valuate results"
    question: "What did the inspection actually find?"
    inputs: ["samples or inspection points", "characteristics", "measured values or codes", "valuation rules"]
    output: ["recorded and valuated inspection evidence"]
    failure_signal: "Usage decision is blocked because required evidence or valuation is incomplete."
    source_refs: [SRC-SAP-QM-RESULTS]
  - order: 5
    title: "Record defects where needed"
    question: "Is there a problem that must be classified and followed?"
    inputs: ["inspection result", "defect code", "severity", "reference object"]
    output: ["structured defect evidence and possible notification trigger"]
    failure_signal: "Material is rejected, but the organization loses the reason and follow-up context in free text."
  - order: 6
    title: "Make usage decision"
    question: "Is the inspected material accepted, rejected, or conditionally handled?"
    inputs: ["completed results", "valuations", "defects", "usage-decision code", "authorization"]
    output: ["completed quality decision and configured follow-up"]
    failure_signal: "Evidence is complete but business use remains blocked because no valid usage decision exists."
    source_refs: [SRC-SAP-QM-USAGE-DECISION]
  - order: 7
    title: "Apply stock disposition"
    question: "What physical state follows the quality decision?"
    inputs: ["usage decision", "stock-relevant lot", "inspection stock quantity", "allowed stock postings"]
    output: ["usable, blocked, scrap, sample, or other configured stock state"]
    failure_signal: "Usage decision says accepted but inventory remains unavailable, or stock moves to the wrong destination."
    source_refs: [SRC-SAP-QM-LOT-COMPLETION]
  - order: 8
    title: "Run follow-up and provide evidence"
    question: "What must happen after the lot is decided?"
    inputs: ["defect or notification", "responsible role", "customer/material context", "batch/results", "certificate profile"]
    output: ["corrective action and/or downstream quality evidence"]
    failure_signal: "The lot is closed but the recurring problem has no owner, or the customer-facing quality handoff is incomplete."
    source_refs: [SRC-SAP-QM-SALES, SRC-SAP-QM-CERTIFICATE]

integration_boundaries:
  - boundary: "Procurement → QM"
    ownership: "Procurement owns the purchase and supplier relationship; QM owns inspection evidence and quality disposition where required."
    question: "Did goods receipt create the intended inspection lot and stock state?"
    source_refs: [SRC-SAP-QM-GR]
  - boundary: "Production → QM"
    ownership: "Production owns manufacturing execution; QM can inspect during production or at receipt from production."
    question: "Is the issue an execution defect, inspection result, or stock disposition problem?"
    source_refs: [SRC-SAP-QM-PRODUCTION]
  - boundary: "QM → Inventory Management"
    ownership: "QM owns the quality decision; Inventory Management records the resulting stock state and goods movement."
    question: "Does physical stock reflect the usage decision?"
  - boundary: "QM → EWM"
    ownership: "QM defines quality-relevant state; EWM can own physical warehouse execution depending on architecture."
    question: "Is material blocked because quality is incomplete or warehouse execution has not reflected the decision?"
  - boundary: "QM → Sales"
    ownership: "Sales owns customer delivery; QM can control delivery inspection and quality evidence."
    question: "Can goods issue proceed, and is the correct quality certificate available?"
    source_refs: [SRC-SAP-QM-SALES, SRC-SAP-QM-CERTIFICATE]

failure_modes:
  - id: QM-FAIL-NO-LOT
    symptom: "Expected inspection lot is not created."
    first_checks: ["inspection lot origin", "active inspection type", "material/plant quality settings", "business event", "lot-creation status"]
    avoid: "Do not create a manual lot before proving why the automatic trigger did not apply."
  - id: QM-FAIL-WRONG-SPEC
    symptom: "Expected inspection characteristics are missing or wrong."
    first_checks: ["inspection plan/task-list selection", "usage and status", "validity date", "material/plant assignment", "characteristics"]
    avoid: "Do not add ad-hoc characteristics to each lot before fixing specification selection."
  - id: QM-FAIL-RESULTS
    symptom: "Usage decision cannot be made although inspection work appears finished."
    first_checks: ["required characteristics", "sample valuation", "open operations", "recording completeness", "lot status"]
    avoid: "Do not bypass missing inspection evidence only to release stock faster."
  - id: QM-FAIL-STOCK
    symptom: "Usage decision is accepted, but material remains unavailable."
    first_checks: ["stock-relevant lot", "usage-decision stock posting", "inspection-stock balance", "material document", "EWM state where relevant"]
    avoid: "Do not post an unrelated manual transfer before reconciling quality disposition."
  - id: QM-FAIL-NOTIFICATION
    symptom: "Repeated defects occur but no corrective owner exists."
    first_checks: ["defect records", "notification creation", "problem/cause coding", "responsible role", "task status"]
    avoid: "Do not use usage-decision text as the only problem-management record."
  - id: QM-FAIL-DELIVERY
    symptom: "Delivery is ready, but quality control or certificate requirement blocks the handoff."
    first_checks: ["delivery inspection context", "customer/material quality control", "usage decision", "batch/results", "certificate profile and output"]
    avoid: "Do not remove the customer quality requirement just to unblock shipment."

impact_traces:
  - title: "Goods receipt → stock usability"
    path: "Goods Receipt → Inspection Lot → Results → Usage Decision → Stock Posting → Available/Blocked/Scrap"
    lesson: "A successful goods receipt does not prove the material is usable."
  - title: "Production defect → corrective action"
    path: "Production Inspection → Result → Defect → Notification → Cause/Task → Follow-up"
    lesson: "Closing an inspection does not remove the underlying process problem."
  - title: "Quality result → customer delivery"
    path: "Inspection/Batch Result → Delivery Quality Control → Usage Decision → Certificate → Customer Evidence"
    lesson: "Quality data can become part of the customer fulfillment contract."

lead_lens:
  what_i_ask_first: "Which event created the quality requirement, and which state is wrong: inspection, evidence, decision, stock, corrective action, or customer proof?"
  decision_owner: "Separate logistics trigger, QM inspection authority, inventory stock state, warehouse execution, production responsibility, and sales evidence."
  main_trade_off: "More inspection control can reduce quality risk, but unnecessary or badly designed inspections add stock delay, manual effort, and false blocks."
  typical_failure: "Teams treat blocked stock as an inventory problem although the real cause is an incomplete or incorrect quality decision."
  proof_of_cause: "Trace event → lot origin/type → specification → results → usage decision → stock posting or follow-up using the exact material, plant, date, batch, and reference."
  integration_impact: "QM can change whether purchased, produced, stored, or delivered material is usable."
  data_impact: "Inspection types, plans, characteristics, codes, material settings, batch data, and customer/supplier controls must align."
  sixty_second_explanation: >-
    I read QM as trigger, inspection lot, specification, evidence, decision, and consequence. I first prove why the inspection exists,
    then which specification and results it uses. The usage decision closes the quality judgment, but I still verify stock disposition,
    corrective follow-up, and customer-facing evidence.

synthetic_cases:
  - id: QM-CASE-GR-NO-LOT
    title: "Supplier receipt bypasses expected inspection"
    synthetic: true
    scenario: "A quality-relevant material is received from a supplier, but no inspection lot appears and stock is immediately usable."
    lead_path: ["Confirm goods-receipt event and material/plant.", "Check lot origin and active inspection type.", "Check material quality settings.", "Prove whether automatic lot creation should apply.", "Correct the trigger and retest with a clean receipt."]
    lesson: "The missing lot is a trigger problem before it is a stock problem."
  - id: QM-CASE-ACCEPTED-BLOCKED
    title: "Accepted lot, unavailable stock"
    synthetic: true
    scenario: "Results are accepted and a usage decision exists, but production still cannot use the material."
    lead_path: ["Check usage-decision code and lot status.", "Inspect stock posting and inspection-stock balance.", "Read material document and stock state.", "Separate ERP quality state from EWM execution if relevant.", "Prove final usable stock at the required location."]
    lesson: "Quality acceptance and physical stock availability are different states."
  - id: QM-CASE-CUSTOMER-CERT
    title: "Shipment ready, certificate missing"
    synthetic: true
    scenario: "Product is accepted and delivery is ready, but the customer-required quality certificate is not created."
    lead_path: ["Confirm customer/material quality requirement.", "Check delivery and batch/result context.", "Check certificate profile determination.", "Check recipient and output processing.", "Prove the evidence handoff instead of removing the requirement."]
    lesson: "Customer fulfillment can depend on quality evidence even when the product itself is acceptable."

assessment_drills:
  - question: "Results versus usage decision?"
    strong_answer: "Results are inspection evidence and characteristic valuation. The usage decision is the business quality decision that completes the lot and can trigger follow-up or stock disposition."
  - question: "Accepted usage decision, stock still blocked. Diagnose."
    strong_answer: "I trace the stock-relevant lot, usage-decision code, stock posting, inspection-stock balance and warehouse state before posting a manual transfer."
  - question: "How does QM integrate with production?"
    strong_answer: "Production owns execution; QM can inspect during production or at receipt from production. I separate production progress, inspection evidence, usage decision and stock consequence."
  - question: "How does QM affect sales?"
    strong_answer: "Delivery inspection, customer/material quality controls, batch results and quality certificates can influence goods issue and customer evidence."

