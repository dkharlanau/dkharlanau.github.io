relations:
  - from: AI-ENTERPRISE-AGENT
    type: integrated_via
    to: INT-AI-MCP
    evidence_type: reasoned_interpretation
    confidence: high
    rationale: "MCP is one standard option for an agent to consume tools; direct APIs can also remain valid."
    source_refs: [SRC-SAP-ARCH-AGENT-A2A-MCP]
  - from: AI-AGENT-ORCHESTRATOR
    type: integrated_via
    to: INT-AI-A2A
    evidence_type: reasoned_interpretation
    confidence: high
    rationale: "A2A is designed for communication and task delegation between independent agents."
    source_refs: [SRC-SAP-ARCH-AGENT-A2A-MCP]
  - from: AI-ENTERPRISE-AGENT
    type: controlled_by
    to: CTRL-AI-AGENT-IDENTITY
    evidence_type: reasoned_interpretation
    confidence: high
    rationale: "A production agent requires a distinct identity and authorization boundary."
    source_refs: [SRC-SAP-ARCH-AGENT-IDENTITY]
  - from: AI-ENTERPRISE-AGENT
    type: controlled_by
    to: CTRL-AI-ACTION-RISK
    evidence_type: expert_heuristic
    confidence: high
    rationale: "Action risk determines how much autonomous execution is acceptable."
  - from: AI-ENTERPRISE-AGENT
    type: controlled_by
    to: CTRL-AI-HUMAN-CONTROL
    evidence_type: expert_heuristic
    confidence: high
    rationale: "High-impact or uncertain actions need an explicit human decision boundary."
  - from: AI-ENTERPRISE-AGENT
    type: controlled_by
    to: CTRL-AI-AGENT-GUARDRAILS
    evidence_type: reasoned_interpretation
    confidence: high
    rationale: "Prompt instructions alone are not a sufficient enterprise control."
    source_refs: [SRC-SAP-ARCH-AI-NORTH-STAR]
