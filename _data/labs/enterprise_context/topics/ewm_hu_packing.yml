memory_model:
  phrase: "Create → Pack → Identify → Move → Repack → Ship → Reconcile"
  lead_line: >-
    A handling unit is not a barcode. It is the warehouse representation of a physical logistics unit,
    with packaging material, contents, hierarchy, location, status and a scannable identity.

