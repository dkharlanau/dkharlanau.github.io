  include:
    - "Handling unit identity, contents, packaging material and hierarchy"
    - "Packaging specifications and packing proposals"
    - "Packing, unpacking, repacking and deconsolidation at work centers"
    - "External supplier HUs versus internally created HUs"
    - "SSCC/scannable identity and controlled label reprint"
    - "Batch and serial context inside HUs"
    - "Physical/digital packing reconciliation and exception patterns"
  exclude_for_now:
