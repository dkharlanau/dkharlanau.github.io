  - id: TEST-EWM-HU-PHYSICAL-DIGITAL
    type: test_case
    title: "Physical-to-Digital Packing Test"
    summary: "Test repack, damaged label, reprint, nested HU, partial unpack, wrong pallet and recovery from interrupted packing."

decision_rules:
  - need: "The physical package must move, scan or be tracked as one warehouse logistics unit"
    choice: "Use an HU"
    reasoning: "Model the physical packaging unit and its content as one execution object."
  - need: "Packing should be proposed from maintained rules and levels"
    choice: "Packaging Specification / package building"
    reasoning: "Keep repeatable packing logic in packing master data rather than in user memory or printer templates."
  - need: "Products or HUs must be packed, unpacked, repacked or deconsolidated"
    choice: "Packing / deconsolidation Work Center"
    reasoning: "Use an explicit warehouse execution point where physical and digital package state change together."

assessment_cards:
  - question: "What is an HU in EWM?"
    answer: "A physical logistics unit made of packaging material and contained goods. It can be nested and has a unique scannable identity."
  - question: "What is the difference between HU identity and a barcode?"
    answer: "The HU is the business object. The barcode is one carrier used to identify it. Reprinting a label must not silently create a new HU."
  - question: "When does a packaging specification matter?"
    answer: "When packing levels, quantities, packaging materials or repeatable work instructions should be determined consistently."
  - question: "What is the dangerous packing failure?"
    answer: "A physical package can look correct while EWM has another content or hierarchy. I reconcile the physical HU before continuing the process."

