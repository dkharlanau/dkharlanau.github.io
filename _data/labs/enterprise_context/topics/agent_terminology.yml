id: TOPIC-ENTERPRISE-AGENT-TERMINOLOGY
type: research_topic
title: "Agent Terminology and Design Patterns"
summary: >-
  A practical vocabulary for enterprise agent design: what each term means,
  what it is often confused with, when it helps, when it adds unnecessary
  complexity, and how to explain the choice in an SAP logistics discussion.
business_question: "How do I understand agentic AI terms well enough to choose the right pattern and explain the trade-off at Lead level?"
domain: "Enterprise AI Architecture"
process_family: "Cross-enterprise / agentic business processes"
status: researching
created_at: "2026-08-15"
updated_at: "2026-08-15"
verified_at: "2026-08-15"
reviewed_together_at: "2026-08-15"
page_url: "/labs/enterprise-context/business-ai/agents/terminology/"
graph_ref: "GRAPH-ENTERPRISE-AGENT-TERMINOLOGY"

learning_model:
  path: "TERM → DISTINCTION → PATTERN → DECISION → LOGISTICS EXAMPLE → LEAD LANGUAGE"
  rule: "Do not memorize a term without knowing the problem it solves and the simpler option it may replace."

scope:
  includes:
    - "Core agent vocabulary"
    - "Context, grounding, RAG, memory, and state"
    - "Planner, executor, router, orchestrator, supervisor, delegation, and handoff"
    - "ReAct, plan-and-execute, sequential, parallel, event-driven, and verification patterns"
    - "Guardrails, policy, authorization, autonomy, human control, and deterministic gates"
    - "Evaluation, traces, spans, checkpoints, durable execution, retries, and compensation"
    - "MCP, A2A, Agent Card, tools, APIs, and protocol boundaries"
    - "SAP logistics examples and assessment-ready wording"
  excludes:
    - "Framework-specific API tutorials"
    - "Prompt engineering tricks without architecture context"
    - "Foundation-model benchmark comparison"
    - "Claims that a popular pattern is automatically a best practice"

