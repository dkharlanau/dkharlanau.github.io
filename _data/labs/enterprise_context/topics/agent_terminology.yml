assessment_questions:
  - "What is the difference between an agent, workflow, skill, and tool?"
  - "What is ReAct and when would you avoid it?"
  - "What is the difference between RAG, agentic RAG, memory, and business state?"
  - "What is the difference between router, orchestrator, supervisor, delegation, and handoff?"
  - "How do MCP, API, A2A, and Agent Card relate?"
  - "What is durable execution and why does it matter for long-running business actions?"
  - "What is the difference between retry, idempotency, and compensation?"
  - "Why do structured output and successful tool calls not prove business correctness?"

