id: TOPIC-P2P-PROCUREMENT
type: research_topic
title: "Procure-to-Pay — Procurement"
summary: >-
  Second logistics vertical for the Enterprise Context Graph. The topic connects business demand
  to sourcing, purchasing controls, supplier commitment, receipt, invoice verification, accounting,
  integration boundaries, failure modes, and Lead-level diagnostic reasoning.
domain: "SAP S/4HANA Logistics"
process_family: "Procure-to-Pay"
status: researching
created_at: "2026-08-14"
updated_at: "2026-08-14"
verified_at: "2026-08-14"
page_url: "/labs/enterprise-context/procurement/"
graph_ref: "GRAPH-MM-PROCUREMENT-DECISIONS"

business_question: >-
  How does SAP S/4HANA turn a business requirement into an approved source commitment,
  physical or service receipt, supplier invoice, and financially reconciled procurement history?

scope:
  starts_with: "Business demand or planning requirement"
  ends_with: "Receipt/invoice history and financial settlement"
  core_objects:
    - "Purchase Requisition"
    - "Source of Supply"
    - "Purchasing Info Record"
    - "Source List"
    - "Quota Arrangement"
    - "Contract / Scheduling Agreement"
    - "Purchase Order"
    - "Goods Receipt / Service Receipt"
    - "Supplier Invoice"
    - "GR/IR"

lead_questions:
  - "Why does this requirement exist and who owns it?"
  - "Is the item stock, consumption, service, subcontracting, consignment, stock transfer, third-party, or limit?"
  - "Why was this source selected?"
  - "Where did the PO price come from?"
  - "Which object consumes the value?"
  - "Which approval policy controls the document?"
  - "How is the PO communicated to the supplier?"
  - "What is the expected receipt event?"
  - "What does invoice verification match?"
  - "How do logistics history and FI/CO reconcile?"

planned_deep_dives:
  - "Procurement Decision Map"
  - "Source Determination"
  - "Purchasing Pricing & Conditions"
  - "Approval & Flexible Workflow"
  - "Account Assignment & MM-FI Integration"
  - "Goods Receipt, Invoice Verification & GR/IR"
  - "Procurement Master Data"
  - "Services, Subcontracting, Consignment & Stock Transfer"
  - "Supplier Integration / Business Network"

