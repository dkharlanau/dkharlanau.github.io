expert_heuristics:
  - id: HEUR-TM-FIRST-WRONG-OBJECT
    context: "TM troubleshooting"
    statement: "Find the first object whose business meaning is wrong. Do not start by repairing the Freight Order if the OTR, DTR, or Freight Unit already carries the wrong demand."
    confidence: high
  - id: HEUR-TM-DEMAND-PLAN-EXECUTION
    context: "TM architecture"
    statement: "Keep demand, planning unit, and execution document separate: OTR/DTR describe demand, Freight Unit is the planning unit, Freight Order or Freight Booking is the executable capacity document."
    confidence: high
  - id: HEUR-TM-OWNERSHIP-BOUNDARY
    context: "TM/EWM integration"
    statement: "At every TM/EWM handoff ask which system owns transportation state, warehouse state, and the physical event confirmation. A technically successful message is not the same as a consistent business process."
    confidence: high

synthetic_case:
  id: SCN-TM-OUTBOUND-CONSOLIDATION
  title: "Synthetic outbound consolidation"
  assumption: "Two customer orders from the same shipping location are transport-relevant and can share one truck."
  path:
    - "Sales orders create order-based transportation demand."
    - "Freight Unit Building creates planning units according to the configured rule."
    - "Transportation planning consolidates compatible freight units into one road Freight Order."
    - "A carrier is selected and the Freight Order is tendered."
    - "Warehouse execution loads the truck and sends execution confirmations across the TM/EWM boundary."
    - "TM calculates transportation charges and creates a Freight Settlement Document for MM follow-on processing."
  lesson: "The value of TM is not another shipment document. It is the controlled transition from transport demand to feasible capacity, execution, partner commitment, and cost settlement."