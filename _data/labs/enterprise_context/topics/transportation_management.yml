id: TOPIC-TM-TRANSPORT-TO-SETTLE
type: research_topic
title: "SAP Transportation Management — Transport to Settle"
summary: >-
  A process and object model for SAP Transportation Management that connects ERP demand,
  transportation requirements, freight-unit building, planning, freight documents, carrier
  collaboration, execution, warehouse integration, charge calculation, and freight settlement.
domain: "SAP Supply Chain / Transportation"
process_family: "Transport-to-Settle"
status: researching
created_at: "2026-08-15"
updated_at: "2026-08-15"
verified_at: "2026-08-15"
page_url: "/labs/enterprise-context/transportation-management/"
graph_ref: "GRAPH-TM-TRANSPORT-TO-SETTLE"
tags: [sap-tm, transportation, freight, planning, ewm, settlement]

business_question: >-
  How does SAP TM turn sales, purchasing, stock-transfer, delivery, or logistics-service demand
  into transportable units, an executable transportation plan, carrier commitment, warehouse
  coordination, execution status, transportation charges, and financial settlement?

scope:
  starts_with: "TM-relevant order, delivery, JIT call, or forwarding demand"
  ends_with: "Executed freight document and freight-cost settlement"
  includes:
    - "Order-based and delivery-based transportation demand"
    - "Freight Unit Building and Freight Unit Building Rules"
    - "Manual planning, Transportation Cockpit, and VSR optimization context"
    - "Freight Orders and Freight Bookings"
    - "Carrier determination, carrier selection, tendering, and subcontracting boundary"
    - "Execution monitoring and change propagation"
    - "TM and EWM integration, including Advanced Shipping and Receiving"
    - "Charge calculation and freight settlement to MM"
  excludes_for_later_deep_dives:
    - "Forwarding-order management for logistics service providers"
    - "Detailed transportation charge-management condition technique"
    - "Strategic freight procurement and freight agreements"
    - "Dangerous goods and foreign-trade compliance"
    - "Detailed optimizer algorithms and performance tuning"

maturity:
  gates_complete: 6
  gates_total: 7
  gates:
    scope: done
    sources: done
    model: done
    relationships: done
    expert_reasoning: done
    synthetic_example: done
    ai_evaluation: planned

lead_questions:
  - "Is the transportation demand order-based or delivery-based, and why?"
  - "What is the difference between a transportation requirement, a freight unit, and a freight order?"
  - "Why do we create freight units before planning?"
  - "What happens to an order-based plan when the delivery is created or changed?"
  - "Which constraints and resources make the transportation plan feasible?"
  - "When do we use a Freight Order and when a Freight Booking?"
  - "Who selects the carrier, and when does tendering start?"
  - "Which system owns warehouse execution and which system owns transportation execution?"
  - "Why does Advanced Shipping and Receiving use the TM Freight Order instead of an EWM Transportation Unit?"
  - "Where are freight charges calculated, and how do they reach MM invoice verification?"

