id: TOPIC-SAP-INDUSTRY-SOLUTIONS
type: research_topic
title: "SAP Industry Solution Landscape"
summary: "A compact map of industry-specific SAP patterns on top of business domains, deployment models, and applications."
domain: "SAP Industry Solutions"
process_family: "Cross-enterprise / industry-specific processes"
status: researching
created_at: "2026-08-14"
updated_at: "2026-08-14"
verified_at: "2026-08-14"
reviewed_together_at: "2026-08-14"
review_note: "Reviewed together against current official SAP industry and Help Portal sources."

business_question: "Which industry changes the standard SAP process, data, planning, logistics, or deployment constraints?"

