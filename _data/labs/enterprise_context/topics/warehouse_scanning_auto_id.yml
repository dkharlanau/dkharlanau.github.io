decision_rules:
  - need: "Standard high-frequency EWM work"
    choice: "SAP EWM RF"
    reasoning: "Keep EWM resource, queue, exception and warehouse-task logic in its standard execution channel."
  - need: "Modern mobile experience in SAP Logistics Management"
    choice: "SAP Warehouse Logistics"
    reasoning: "Use the standard native app when its process scope matches the requirement."
  - need: "Special cross-process workflow"
    choice: "Custom mobile/Fiori/native app with released SAP APIs"
    reasoning: "Custom should simplify a genuinely different user journey, not only restyle standard RF."
  - need: "Fixed gate, conveyor or RFID capture"
    choice: "Edge/WCS/MFS/integration event pattern"
    reasoning: "Machine reads need filtering, correlation and duplicate protection before the SAP business action."

synthetic_example:
  id: SCN-WH-SYNTHETIC-OUTBOUND
  type: scenario
  title: "Synthetic high-volume outbound design"
  synthetic: true
  situation: >-
    A distribution warehouse picks cartons with handheld scanners, moves full pallets by forklift,
    and validates outbound pallets at a dock gate.
  reasoning_path:
    - "Use rugged RF for normal pick confirmation."
    - "Use a vehicle-mounted terminal with long-range capture for forklift moves."
    - "Encode pallet identity with SSCC and map it to HU identity."
    - "Use a fixed dock reader only if the gate can identify one clear business checkpoint."
    - "Deduplicate repeated gate reads before load confirmation."
    - "Keep manual exception recovery for damaged or missing labels."
  expected_result: >-
    Human work stays guided by the warehouse process while the dock event becomes automatic without turning raw scanner reads into uncontrolled SAP postings.

assessment_cards:
  - question: "Where do you start when selecting warehouse scanners?"
    answer: "I start with the process, scan frequency, physical environment and identifier. Only then do I choose handheld, wearable, vehicle-mounted, camera, fixed reader or RFID."
  - question: "When would you build a custom scanner app?"
    answer: "When standard RF or a standard mobile app cannot support the required user journey, device interaction or cross-system process. I keep SAP as system of record and use released APIs."
  - question: "What is the difference between SSCC and GTIN?"
    answer: "SSCC identifies a logistic unit such as a pallet. GTIN identifies a trade item. Mixing them in parsing logic is a common integration error."
  - question: "How do you integrate a fixed scanner?"
    answer: "I do not post each raw read directly into SAP. I use an edge or control layer to filter duplicates, correlate the read with the expected process state, then call the warehouse business action once."
  - question: "What is the main UI rule?"
    answer: "Scan-first and exception-aware. The worker should see only the information needed for the current step, with immediate feedback and a clear recovery path."

