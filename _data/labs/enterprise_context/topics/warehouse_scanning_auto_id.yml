memory_model:
  phrase: "Identify → Capture → Parse → Verify → Execute → Confirm → Monitor"
  lead_line: >-
    The scanner is only the capture device. The architecture starts with what the code means,
    what SAP object it must verify, and which process owns the confirmation.

