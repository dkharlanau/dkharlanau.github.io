id: TOPIC-WH-SCANNERS-AUTO-ID
type: research_topic
title: "Warehouse Scanners & Auto-ID"
summary: >-
  A Lead-level map of barcode and RFID capture in SAP warehouse execution:
  identifiers, scanner classes, EWM RF, native mobile, custom applications,
  fixed-reader events, user experience, integration choices, failure modes and tests.
domain: "SAP S/4HANA Logistics / Warehousing"
process_family: "Warehouse Execution and Auto-ID"
status: researching
created_at: "2026-08-16"
updated_at: "2026-08-16"
verified_at: "2026-08-16"
page_url: "/labs/enterprise-context/ewm/scanners/"

business_question: >-
  How should a warehouse scanning solution identify the right physical object,
  capture data with the right device, verify the correct SAP business context,
  and confirm work with the smallest reliable architecture?

scope:
  include:
    - "Rugged handheld, wearable, vehicle-mounted, fixed and camera-based scanners"
    - "Barcode semantics: SSCC, GTIN, GS1-128 and warehouse-local identifiers"
    - "SAP EWM RF and SAP Warehouse Logistics mobile execution"
    - "Keyboard wedge, programmatic scanner event, custom API and edge-event patterns"
    - "RFID as a different capture pattern with event filtering"
    - "Inbound, putaway, picking, loading, inventory and production scenarios"
    - "UI, exception handling, duplicate protection, monitoring and warehouse-floor testing"
  exclude_for_now:
    - "Detailed label-printing platform comparison"
    - "RF spectrum engineering"
    - "Full RFID EPCIS architecture"
    - "Vendor hardware procurement matrix by model and price"

