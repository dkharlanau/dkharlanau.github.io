id: TOPIC-ENTERPRISE-AGENT-ARCHITECTURE
type: research_topic
title: "Enterprise Agent Architecture — Tools, Identity, Autonomy and Governance"
summary: >-
  A practical architecture model for enterprise AI agents: when to use an agent,
  how it gets context, how it calls tools, how permissions are bounded, and how
  behavior is observed and evaluated.
business_question: "How do I design an enterprise agent that can reason over business context, use SAP capabilities safely, and remain governable in production?"
domain: "Enterprise AI Architecture"
process_family: "Cross-enterprise / agentic business processes"
status: researching
