scope:
  includes:
    - "Agent versus rule, workflow, skill, and API"
    - "Agent anatomy: goal, instructions, model, context, memory, planner, tools, identity, guardrails, telemetry"
    - "MCP for agent-to-tool interaction"
    - "A2A for agent-to-agent collaboration"
    - "Agent identity and scoped authorization"
    - "Tool contracts and action-risk classification"
    - "Human control and autonomy levels"
    - "Low-code versus pro-code agent implementation"
    - "Agent lifecycle, governance, evaluation, and observability"
    - "Structured-data and transactional logistics examples"
  excludes:
    - "Product-by-product SAP Business AI catalog"
    - "Foundation-model benchmark comparison"
