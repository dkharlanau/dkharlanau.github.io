    title: "Consolidation"
    domain: DOM-MASTER-DATA-MANAGEMENT
    role: "Standardize, match, merge, and calculate a best record from multiple sources."
  - id: CAP-MDG-MASS-PROCESSING
    title: "Mass Processing"
    domain: DOM-DATA-GOVERNANCE
    role: "Apply controlled changes to many records with validation and auditability."
  - id: CAP-MDG-DATA-QUALITY
    title: "Data Quality Management"
    domain: DOM-DATA-QUALITY
    role: "Prevent, detect, measure, and repair data defects."

