decision_path:
  - question: "What is the business area?"
    answer: "Start with Data and Analytics as the cross-cutting area."
  - question: "What problem domain is in scope?"
    answer: "Separate Master Data Management, Data Governance, Data Quality, Metadata, Integration, and Analytics."
  - question: "Which application implements the governance?"
    answer: "Evaluate SAP MDG variants only after the domain and object scope are clear."
  - question: "Which master-data objects are governed?"
    answer: "List Business Partner, Customer, Supplier, Material / Product, Financial, and Custom Objects explicitly."
  - question: "Which attributes are central versus application-specific?"
    answer: "Assign ownership at attribute level; do not assume one system must own every field."
  - question: "Which business processes consume the data?"
    answer: "Trace each object to sales, procurement, planning, warehouse, transport, finance, or service."
  - question: "How does approved data become usable?"
    answer: "Model activation, replication, mapping, monitoring, and downstream readiness."

assessment_talking_points:
  - "MDG is a governance application, not the complete Data and Analytics domain."
  - "Master Data Management answers what shared objects exist and where authority sits."
  - "Data Governance answers who owns decisions and which controls apply."
  - "Data Quality answers whether the data is fit for the consuming process."
  - "The same master-data object crosses several business domains, so ownership must be explicit."
  - "For logistics, Material / Product and Business Partner are dependency hubs rather than isolated master records."
  - "The architecture decision should start with object and attribute scope, not with an MDG edition name."

