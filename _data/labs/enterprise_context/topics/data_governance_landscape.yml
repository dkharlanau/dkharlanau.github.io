architecture_rule:
  statement: "Do not model SAP MDG as the business domain."
  explanation: >-
    Data and Analytics is the cross-cutting enterprise area. Master Data Management,
    Data Governance, and Data Quality are solution domains inside that area. SAP MDG is
    an application that implements capabilities in those domains. Business Partner,
    Customer, Supplier, Material / Product, Financial Master Data, and Custom Objects
    are governed master-data objects.

hierarchy:
  area:
    id: BDOM-DATA-ANALYTICS
    type: business_domain
    title: "Data and Analytics"
    remember: "Trusted data, shared meaning, and decisions."
    role: "Cross-cutting enterprise area for data ownership, semantics, quality, integration, analytics, planning, and reusable context."
  domains:
    - id: DOM-MASTER-DATA-MANAGEMENT
      type: application_domain
      title: "Master Data Management"
      remember: "Manage shared business entities across systems."
      purpose: "Define authoritative master-data objects, ownership, lifecycle, identity, consolidation, and distribution."
      key_questions:
        - "Which object is shared across applications?"
        - "Which system owns the object or attribute?"
        - "How are duplicates and identities resolved?"
        - "How is approved data distributed?"
    - id: DOM-DATA-GOVERNANCE
      type: application_domain
      title: "Data Governance"
      remember: "Decide who may create, change, approve, and own data."
      purpose: "Define accountabilities, policies, controls, workflow, decision rights, and auditability for enterprise data."
      key_questions:
        - "Who owns the data decision?"
        - "Which changes need approval?"
        - "Which controls are preventive or detective?"
        - "What evidence is required for audit?"
    - id: DOM-DATA-QUALITY
      type: application_domain
      title: "Data Quality"
      remember: "Make data fit for the process that consumes it."
      purpose: "Define quality rules, validation, derivation, duplicate detection, monitoring, and remediation."
      key_questions:
        - "Which defect breaks the business process?"
        - "Where should the rule run?"
        - "How is quality measured?"
        - "Who repairs failed data?"
    - id: DOM-METADATA-SEMANTICS
      type: application_domain
      title: "Metadata and Semantics"
      remember: "Keep the meaning of data explicit."
      purpose: "Define names, definitions, classifications, lineage, semantics, and reusable business meaning."
      key_questions:
        - "What does the field or object mean?"
        - "Is the definition consistent across systems?"
        - "Which data product or application uses the concept?"
    - id: DOM-DATA-INTEGRATION
      type: application_domain
      title: "Data Integration and Distribution"
      remember: "Move trusted data with clear ownership and contracts."
      purpose: "Replicate, synchronize, map, and monitor master data across applications and platforms."
      key_questions:
        - "What is the source and target?"
        - "Is replication event-driven, API-based, message-based, or batch?"
        - "How are keys and values mapped?"
        - "How are failures monitored and recovered?"
    - id: DOM-ANALYTICS-PLANNING
      type: application_domain
      title: "Analytics and Planning"
      remember: "Use governed data for decisions."
      purpose: "Consume consistent master data, dimensions, hierarchies, and semantics for reporting, planning, and AI grounding."
      key_questions:
        - "Which dimensions must be harmonized?"
        - "Which hierarchy is authoritative?"
        - "How does master-data change affect reports and planning?"

