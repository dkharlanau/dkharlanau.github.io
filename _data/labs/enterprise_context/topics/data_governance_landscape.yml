object_families:
  - id: DATA-FAMILY-PARTY
    type: dataset
    title: "Party and Partner Master Data"
    purpose: "Identity and role data for organizations and people that buy, sell, supply, receive, pay, or provide services."
    objects:
      - MD-BP-BUSINESS-PARTNER
      - MD-BP-CUSTOMER
      - MD-BP-SUPPLIER
  - id: DATA-FAMILY-PRODUCT
    type: dataset
    title: "Product and Material Master Data"
    purpose: "Shared product identity plus logistics, commercial, planning, warehouse, and accounting attributes."
    objects:
      - MD-MAT-MATERIAL
  - id: DATA-FAMILY-FINANCE
    type: dataset
    title: "Financial Master Data"
    purpose: "Shared financial structures and entities used for consistent accounting, controlling, and reporting."
    objects:
      - MD-FIN-FINANCIAL
  - id: DATA-FAMILY-CUSTOM
    type: dataset
    title: "Custom Master Data"
    purpose: "Enterprise-specific governed entities when standard domains do not cover the business concept."
    objects:
      - MD-CUSTOM-OBJECT

