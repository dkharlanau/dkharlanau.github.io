memory_model:
  phrase: "Assign → Authenticate → Guide → Scan → Validate → Confirm → Recover → Observe"
  lead_line: >-
    Choose the execution channel from the work pattern and process owner. A custom mobile UI may improve interaction,
    but it should not become a second warehouse management system.

