    type: control
    title: "Mobile Session Recovery"
    summary: "Define authentication, timeout, reconnect and work-state recovery for warehouse mobility."
  - id: CTRL-WH-MOBILE-OFFLINE
    type: control
    title: "Offline Business-State Control"
    summary: "Queue only actions whose stale state, ordering, expiry and reconciliation can be handled safely."
  - id: CTRL-WH-MOBILE-FLEET
    type: control
    title: "Managed Device Fleet"
    summary: "Control device identity, configuration profile, application version and lost-device response."
  - id: FAIL-WH-MOBILE-STALE-WORK
    type: failure_mode
    title: "Stale Mobile Work State"
    summary: "The device resumes or replays work after the underlying WT, HU, stock or queue context has changed."
  - id: FAIL-WH-MOBILE-ROAMING
    type: failure_mode
    title: "Warehouse Roaming Failure"
    summary: "The mobile session or request fails during Wi-Fi handover along the real worker or forklift route."
  - id: KPI-WH-MOBILE-LATENCY
    type: kpi
    title: "Mobile Response Latency"
    summary: "Time from worker scan/action to clear application feedback."
  - id: KPI-WH-MOBILE-SESSION-FAIL
    type: kpi
    title: "Session Failure Rate"
    summary: "Frequency of authentication, timeout, reconnect or resume failures during warehouse execution."
  - id: KPI-WH-MOBILE-MANUAL-FALLBACK
    type: kpi
    title: "Manual Fallback Rate"
    summary: "Share of mobile steps bypassed through typing, paper or supervisor correction."
  - id: HEUR-WH-MOBILE-NOT-WMS
    type: expert_heuristic
    title: "Mobile UI Is Not a Second WMS"
    summary: "Keep allocation, warehouse stock, queue and execution ownership in the business system even when interaction is custom."
  - id: SCN-WH-WEARABLE-PICK
    type: scenario
    title: "Wearable High-Frequency Picking"
    summary: "A hands-free capture pattern reduces interaction cost while EWM keeps task and confirmation ownership."
  - id: TEST-WH-MOBILE-FLOOR
    type: test_case
    title: "Warehouse Mobility Floor Test"
    summary: "Test real routes, roaming, gloves, scan focus, session timeout, reconnect, duplicate retry and exception recovery."

decision_rules:
  - need: "Standard high-frequency EWM task execution"
    choice: "EWM RF"
    reasoning: "Reuse the standard EWM resource, queue, verification and task-confirmation model."
  - need: "Standard native mobile scope is available and fits the process"
    choice: "SAP Warehouse Logistics"
    reasoning: "Prefer a supported standard mobile experience before building another warehouse client."
  - need: "Cross-process flow, special device behavior or material UX gap"
    choice: "Custom mobile/browser/native app"
    reasoning: "Keep the extension thin and call explicit SAP business interfaces rather than duplicating warehouse rules."
  - need: "Hands-free repetitive execution"
    choice: "Wearable / voice-oriented interaction"
    reasoning: "Optimize the physical work cycle while keeping the same business ownership and controls."

assessment_cards:
  - question: "When do you choose EWM RF instead of custom mobile?"
    answer: "If standard EWM execution covers the warehouse flow, I prefer RF. I build custom only when the workflow, device interaction or cross-system journey is genuinely different."
  - question: "Can warehouse work simply be queued offline?"
    answer: "Not always. WT, HU, stock and queue state can change. Offline replay needs expiry, idempotency, conflict detection and reconciliation."
  - question: "What do shared warehouse devices change?"
    answer: "I separate worker identity from device identity, control session handover and manage the device configuration and application lifecycle."
  - question: "What should be tested before go-live?"
    answer: "The real warehouse route: Wi-Fi roaming, scanner behavior, gloves, latency, reconnect, duplicate retry, authentication timeout and exception recovery."

