business_question: >-
  Which mobile execution channel should a warehouse use, and how should device, application,
  network and SAP ownership be separated so that workers can execute reliably on the warehouse floor?

scope:
  include:
    - "SAP EWM RF and presentation-device model"
    - "SAP Warehouse Logistics mobile execution where product scope fits"
    - "Custom mobile, browser/Fiori and native device patterns"
    - "Scanner middleware and programmatic capture"
    - "Shared devices, authentication, Wi-Fi roaming and session recovery"
    - "Offline limits, retries, observability and fleet configuration"
    - "Wearable and voice-oriented interaction patterns at architecture level"
  exclude_for_now:
    - "Mobile-device procurement by brand and price"
    - "Full MDM product comparison"
    - "Detailed RF screen Customizing catalog"

