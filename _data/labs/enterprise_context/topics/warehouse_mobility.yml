    source_refs: [SRC-SAP-WAREHOUSE-LOGISTICS-MOBILE]
  - id: APP-WH-CUSTOM-MOBILE
    type: application_component
    title: "Custom Warehouse Mobile App"
    summary: "Purpose-built mobile or browser application for a real workflow, integration or device-interaction gap."
  - id: PLT-WH-DEVICE-MIDDLEWARE
