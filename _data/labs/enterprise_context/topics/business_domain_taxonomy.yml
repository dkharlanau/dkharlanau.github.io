modeling_rules:
  - "Business domain = a stable area of business responsibility."
  - "Process = work that can cross several domains."
  - "Deployment model = how the SAP solution is operated and constrained."
  - "Solution domain = a functional area such as warehousing, master data management, or transportation."
  - "Application = a product or component such as S/4HANA, EWM, SAP MDG, Ariba, or Joule."
  - "Master-data object = a shared business entity such as Business Partner, Customer, Supplier, or Material / Product."
  - "Platform domains such as data, integration, and AI support many business domains."

