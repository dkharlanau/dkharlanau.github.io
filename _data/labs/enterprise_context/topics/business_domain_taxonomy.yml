decision_guide:
  - question: "Who owns the business outcome?"
    guidance: "Start with the business domain."
  - question: "Is this a cross-cutting platform concern?"
    guidance: "Use Data, Integration, AI, Security, or Transformation as an enterprise area, then decompose it into solution domains."
  - question: "Which process delivers it?"
    guidance: "Map the end-to-end process separately."
  - question: "Which data objects does the process depend on?"
    guidance: "Name the master-data objects and attribute ownership explicitly before selecting the governance application."
  - question: "Which deployment model constrains the solution?"
    guidance: "Check Public Cloud, Private Cloud, or On-Premise before assuming scope or extensibility."
  - question: "Which SAP component owns the function?"
    guidance: "Map the application or platform component without renaming the business or data domain."

