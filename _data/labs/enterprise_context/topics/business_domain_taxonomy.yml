id: TOPIC-ENTERPRISE-BUSINESS-DOMAINS
type: research_topic
title: "Enterprise Business Domains"
summary: "A simple map of what the business owns, separate from processes, SAP products, and technology."
domain: "Enterprise Architecture"
process_family: "Cross-enterprise"
status: researching
created_at: "2026-08-14"
updated_at: "2026-08-14"
verified_at: "2026-08-14"
reviewed_together_at: "2026-08-14"
review_note: "Reviewed together as a practical domain map for learning and architecture discussions."

business_question: "What does the business own, and which processes and SAP solutions support each area?"

maturity:
  gates_complete: 2
  gates_total: 7
  gates:
    scope: done
    sources: done
    model: in_progress
    relationships: in_progress
    expert_reasoning: planned
    synthetic_example: planned
    ai_evaluation: planned

modeling_rules:
  - "Business domain = a stable area of business responsibility."
  - "Process = work that can cross several domains."
  - "Solution domain = a functional area such as warehousing or transportation."
  - "Application = a product or component such as S/4HANA, EWM, Ariba, or Joule."
  - "Platform domains such as data, integration, and AI support many business domains."

business_domains:
  - id: BDOM-CUSTOMER-REVENUE
    type: business_domain
    title: "Customer, Sales and Revenue"
    remember: "Win customers, sell, fulfill, bill, and retain."
    purpose: "Manage customers and revenue from demand and sales through order, service, billing, and retention."
    subdomains:
      - "Marketing and Demand"
      - "Sales and Opportunities"
      - "Configure, Price and Quote"
      - "Digital Commerce"
      - "Order Management"
      - "Customer Service"
      - "Pricing and Rebates"
    related_solution_domains:
      - "SAP Sales"
      - "SAP Customer Experience"
      - "Order-to-Cash"

  - id: BDOM-SPEND-PROCUREMENT
    type: business_domain
    title: "Spend, Procurement and Suppliers"
    remember: "Source suppliers, buy, receive, and pay."
    purpose: "Manage external spend, suppliers, sourcing, purchasing, receiving, and supplier settlement."
    subdomains:
      - "Spend and Categories"
      - "Strategic Sourcing"
      - "Operational Procurement"
      - "Supplier Management"
      - "Services Procurement"
      - "Procure-to-Pay"
      - "Supplier Collaboration"
    related_solution_domains:
      - DOM-PROCUREMENT
      - DOM-COLLABORATION

  - id: BDOM-SUPPLY-CHAIN-OPERATIONS
    type: business_domain
    title: "Supply Chain and Operations"
    remember: "Plan, make, store, move, and deliver."
    purpose: "Plan supply, make products, manage inventory, assure quality, and execute logistics."
    subdomains:
      - id: DOM-SUPPLY-PLANNING
        title: "Supply and Production Planning"
      - id: DOM-MANUFACTURING
        title: "Manufacturing and Shop-Floor Execution"
      - id: DOM-MATERIALS-INVENTORY
        title: "Materials and Inventory Management"
      - id: DOM-QUALITY
        title: "Quality Management"
      - id: DOM-WAREHOUSING
        title: "Warehousing and Fulfillment"
      - id: DOM-TRANSPORTATION
        title: "Transportation and Freight"
      - id: DOM-VISIBILITY
        title: "Logistics Visibility"
      - id: DOM-YARD
        title: "Yard Logistics"
      - id: DOM-GLOBAL-TRADE
        title: "Global Trade and Compliance"
      - id: DOM-COLLABORATION
        title: "Supply Network Collaboration"

  - id: BDOM-FINANCE-PERFORMANCE
    type: business_domain
    title: "Finance, Risk and Performance"
    remember: "Record, control, plan, and report money."
    purpose: "Manage accounting, controlling, treasury, tax, consolidation, planning, risk, and financial reporting."
    subdomains:
      - "Record-to-Report"
      - "Management Accounting"
      - "Treasury and Working Capital"
      - "Tax"
      - "Group Reporting and Consolidation"
      - "Enterprise Planning"
      - "Financial Risk and Controls"

  - id: BDOM-PEOPLE-WORKFORCE
    type: business_domain
    title: "People and Workforce"
    remember: "Hire, develop, reward, and support people."
    purpose: "Manage employees and external workforce from hiring through development, time, pay, and workforce planning."
    subdomains:
      - "Core HR"
      - "Talent Acquisition"
      - "Learning and Development"
      - "Performance and Compensation"
      - "Time and Payroll"
      - "Workforce Planning"
      - "External Workforce"

  - id: BDOM-ASSET-SERVICE-OPERATIONS
    type: business_domain
    title: "Assets, Maintenance and Service"
    remember: "Keep assets running and deliver service."
    purpose: "Manage assets, maintenance, reliability, field work, repair, and service execution."
    subdomains:
      - "Enterprise Asset Management"
      - "Maintenance and Reliability"
      - "Field Service"
      - "Repair and Service Execution"
      - "Service Parts"

  - id: BDOM-SUSTAINABILITY-COMPLIANCE
    type: business_domain
    title: "Sustainability, Safety and Compliance"
    remember: "Operate responsibly and stay compliant."
    purpose: "Manage sustainability, safety, environmental, product, and regulatory obligations."
    subdomains:
      - "Sustainability Management"
      - "Environment, Health and Safety"
      - "Product Compliance"
      - "Corporate Compliance"
      - "Responsible Supply Chain"

platform_domains:
  - id: BDOM-DATA-ANALYTICS
    type: business_domain
    title: "Data and Analytics"
    classification: cross_cutting_platform_domain
    remember: "Give the enterprise trusted data and meaning."
    purpose: "Provide governed data, semantics, analytics, and reusable context for applications and AI."

  - id: BDOM-INTEGRATION-EXTENSIBILITY
    type: business_domain
    title: "Integration, Automation and Extensibility"
    classification: cross_cutting_platform_domain
    remember: "Connect, automate, and extend."
    purpose: "Connect systems and partners, expose APIs and events, automate work, and build clean-core extensions."

  - id: BDOM-BUSINESS-AI
    type: business_domain
    title: "Business AI"
    classification: cross_cutting_platform_domain
    remember: "Use AI with business context and control."
    purpose: "Use, build, run, ground, and govern AI assistants, agents, models, and AI-enabled processes."
    primary_topic: TOPIC-SAP-BUSINESS-AI-PLATFORM

  - id: BDOM-SECURITY-IDENTITY-GOVERNANCE
    type: business_domain
    title: "Security, Identity and Governance"
    classification: cross_cutting_platform_domain
    remember: "Control who can do what, and prove it."
    purpose: "Manage identity, authorization, security, standards, auditability, and technology governance."

  - id: BDOM-BUSINESS-TRANSFORMATION
    type: business_domain
    title: "Transformation and Enterprise Architecture"
    classification: cross_cutting_platform_domain
    remember: "Connect business change to technology decisions."
    purpose: "Model capabilities and processes, govern architecture, and manage transformation decisions."

decision_guide:
  - question: "What business outcome are we discussing?"
    guidance: "Start with the business domain."
  - question: "What work must happen?"
    guidance: "Map the process and solution domain."
  - question: "Which system should own it?"
    guidance: "Map the application or platform component."
  - question: "What crosses domains?"
    guidance: "Model the end-to-end process separately."

tags:
  - enterprise-architecture
  - business-domain
  - sap
  - operating-model
  - supply-chain
  - business-ai
