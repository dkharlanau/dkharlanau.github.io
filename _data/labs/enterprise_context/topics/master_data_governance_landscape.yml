    type: application_component
    title: "SAP Master Data Governance, cloud edition"
    deployment: "Public cloud on SAP Business Technology Platform"
    architecture_role: "Core Business Partner governance and quality in a federated landscape"
    remember: "Core BP first, public cloud, lower entry barrier."
    domains:
      - "Core Business Partner"
      - "Business Partner Relationships"
      - "Business Partner Hierarchies"
    data_model: "One Domain Model for core Business Partner attributes."
    capabilities:
      - "Central Governance"
      - "Consolidation"
      - "Data Quality Management"
      - "Replication"
    replication: "SAP Master Data Integration (MDI) and SOAP."
    extensibility: "Custom fields can extend Business Partner general data within the supported cloud extensibility boundary."
    best_fit: >-
      Use when a public-cloud core data owner for Business Partner fits the target architecture,
      especially in a federated model where application-specific attributes remain in application owners.
    not_for: >-
      Do not position the current cloud edition as a drop-in replacement for S/4HANA MDG when material,
      financial, custom-object, or broad application-specific governance is required.
    source_refs:
      - SRC-SAP-MDG-CE-FEATURES
