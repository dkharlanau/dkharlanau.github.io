process_model:
  central_governance:
    id: PROC-MDG-CENTRAL-GOVERNANCE
    title: "Govern a master data change"
    steps:
      - id: STEP-MDG-REQUEST
        title: "Request"
        detail: "Create a change request or governance process with business context and required data."
      - id: STEP-MDG-ENRICH
        title: "Enrich"
        detail: "Complete the attributes owned by the responsible business or data roles."
      - id: STEP-MDG-CHECK
        title: "Validate and derive"
        detail: "Run rules, derivations, duplicate checks, and required-field checks."
      - id: STEP-MDG-APPROVE
        title: "Approve"
        detail: "Route the process to accountable roles according to workflow and decision rules."
      - id: STEP-MDG-ACTIVATE
        title: "Activate"
        detail: "Move approved data from the governed/staging state into the active master data state."
      - id: STEP-MDG-REPLICATE
        title: "Replicate"
        detail: "Distribute approved data to consuming systems using the chosen replication architecture."
      - id: STEP-MDG-MONITOR
        title: "Monitor"
        detail: "Track process status, data quality, replication errors, and downstream exceptions."

