id: TOPIC-SAP-MASTER-DATA-GOVERNANCE
type: research_topic
title: "SAP Master Data Governance"
summary: "A practical architecture map of SAP MDG: what it governs, how the main deployment options differ, how governance processes work, and how trusted master data reaches logistics processes."
domain: "Data and Analytics"
process_family: "Cross-enterprise Master Data Management"
status: researching
created_at: "2026-08-14"
updated_at: "2026-08-14"
verified_at: null
human_view: "/labs/enterprise-context/mdg/"
source_reviewed_at: "2026-08-14"

business_question: "When should SAP MDG be used, which MDG option fits the landscape, and how should governance, data models, workflows, quality rules, and replication be designed for logistics?"

maturity:
  gates_complete: 4
  gates_total: 7
  gates:
    scope: done
    sources: done
    model: done
    relationships: done
    expert_reasoning: in_progress
    synthetic_example: planned
    ai_evaluation: planned

memory_model:
  phrase: "Request → Check → Approve → Activate → Replicate → Monitor"
  data_book: >-
    In this Lab, MDG is treated as a Data Book: a governed map of which master data exists,
    who owns it, which rules it must pass, which process can change it, and where the approved
    version is distributed. "Data Book" is a Lab learning concept, not an official SAP product term.
  core_idea: >-
    MDG is not only a maintenance screen. It is a control layer around master data decisions:
    ownership, workflow, quality, lifecycle, mass change, consolidation, and distribution.

variants:
  - id: APP-SAP-MDG-S4
    type: application_component
    title: "SAP Master Data Governance on SAP S/4HANA"
    deployment: "SAP S/4HANA Private Cloud Edition or on premises"
    architecture_role: "Full enterprise-wide, multi-domain MDG"
    remember: "Broad domains and broad S/4HANA attributes."
    domains:
      - "Business Partner, Customer and Supplier"
      - "Material / Product"
      - "Financial master data"
      - "Custom Objects"
    data_model: "SAP S/4HANA data model with broad application-specific attribute coverage."
    replication: "Data Replication Framework (DRF) and domain-specific outbound services."
    modes:
      - id: VAR-MDG-CLASSIC
        title: "Classic mode"
        scope: "Broadest MDG scope, including multi-domain central governance, consolidation, mass processing, and data quality capabilities."
        technology: "Established S/4HANA MDG framework with Fiori applications, staging, workflow, BRFplus, and DRF."
      - id: VAR-MDG-CLOUD-READY
        title: "Cloud-ready mode"
        scope: "Current scope is Business Partner."
        technology: "ABAP Cloud, CDS, RAP, cloud-optimized ABAP, Fiori, and integration with selected cloud services."
        boundary: "It is an alternative mode inside S/4HANA MDG, not the same product as SAP MDG, cloud edition."
    best_fit: >-
      Use when the target requires material, financial, custom, or broad customer/supplier application attributes,
      or when S/4HANA is the natural central governance hub.
    source_refs:
