data_architecture:
  principle: "Separate core identity from application-specific attributes and assign an authoritative owner to each."
  classic_mode:
    staging: "Unapproved changes are held in MDG staging before activation."
    active_data: "Depending on the domain, active data can reuse S/4HANA application tables or use generated tables."
    governance_scope: "Define which attributes are governed and which remain read-only or externally owned."
    source_refs:
      - SRC-SAP-MDG-DATA-MODEL
  cloud_edition:
    core_model: "One Domain Model core Business Partner attributes."
    federation: "The cloud edition can act as a core data owner while connected applications own richer application attributes."
    source_refs:
      - SRC-SAP-MDG-PORTFOLIO-COMPARISON
      - SRC-SAP-MDG-CE-FEATURES

logistics_use_cases:
  - id: SCN-MDG-MATERIAL-CREATION
    type: scenario
    title: "Govern a new material for procurement, planning, sales, and warehouse use"
    primary_variant: APP-SAP-MDG-S4
    path: "Basic identity → logistics attributes → plant/MRP → purchasing → sales → valuation → approval → activation → replication"
    value: "One controlled creation process reduces missing views, inconsistent units, and late downstream corrections."
    failure_signals:
      - "Material exists but cannot be planned in the required plant."
      - "Purchasing or sales views are missing."
      - "Unit-of-measure inconsistency creates warehouse or transport conversion errors."
      - "Valuation data is incomplete and postings fail."
  - id: SCN-MDG-SUPPLIER-ONBOARDING
    type: scenario
    title: "Govern supplier identity and supplier-specific enrichment"
    path: "Core BP identity → duplicate/address checks → supplier role → purchasing/company data → approval → activation → replication"
    value: "Separates reliable partner identity from the application data needed by Procure-to-Pay."
    cloud_boundary: "MDG cloud edition governs core BP; application-specific supplier attributes remain with the appropriate application owner unless supported by the chosen architecture."
  - id: SCN-MDG-CUSTOMER-ONBOARDING
    type: scenario
    title: "Govern customer identity and customer-specific enrichment"
    path: "Core BP identity → duplicate/address checks → customer role → sales/company data → approval → activation → replication"
    value: "Reduces downstream order, shipping, billing, tax, and finance exceptions caused by weak customer master data."
    cloud_boundary: "MDG cloud edition focuses on core BP. Broad S/4HANA customer application attributes require an S/4HANA ownership decision."
  - id: SCN-MDG-BULK-LOGISTICS-CHANGE
    type: scenario
    title: "Controlled mass change after a logistics redesign"
    path: "Select scope → define field changes → simulate/check → validate → approve if required → activate → monitor"
    value: "Useful for controlled changes such as plant, purchasing, classification, or partner-data updates when the supported domain and field scope allow it."
    warning: "Mass processing is governance at scale, not a bypass around ownership and validation."

logistics_dependencies:
  - process: "Order-to-Cash"
    depends_on:
      - "Customer / Business Partner"
      - "Material / Product"
      - "Sales organization attributes"
      - "Shipping-relevant attributes"
    typical_impact: "Order blocks, wrong partners, shipping issues, pricing/tax inconsistencies, billing exceptions."
  - process: "Procure-to-Pay"
    depends_on:
      - "Supplier / Business Partner"
      - "Material / Product"
      - "Purchasing organization attributes"
      - "Units and ordering data"
    typical_impact: "PO creation issues, wrong supplier data, receiving exceptions, invoice mismatches."
  - process: "Plan-to-Produce"
    depends_on:
      - "Material / Product"
      - "Plant/MRP attributes"
      - "Units"
      - "Planning parameters"
    typical_impact: "Planning noise, missing supply proposals, wrong lot sizing, execution delays."
  - process: "Warehouse and Transportation"
    depends_on:
      - "Material / Product"
      - "Dimensions, weights, units, packaging-related attributes"
      - "Business Partner addresses and locations"
    typical_impact: "Warehouse task issues, packing problems, freight planning errors, wrong delivery destinations."

implementation_principles:
  - id: HEUR-MDG-OWNERSHIP-BEFORE-WORKFLOW
    type: expert_heuristic
    statement: "Define the data owner and attribute owner before drawing the approval workflow."
    why: "A workflow cannot repair unclear accountability; it only automates the confusion."
  - id: HEUR-MDG-CORE-VS-APPLICATION
    type: expert_heuristic
    statement: "Separate core identity from application-specific attributes before selecting the MDG deployment."
    why: "This is the main boundary between federated core-data governance and a full multi-domain S/4HANA hub."
  - id: HEUR-MDG-CONSOLIDATE-BEFORE-CENTRALIZE
    type: expert_heuristic
    statement: "If the source landscape already contains duplicates, consolidate and define survivorship before declaring a golden record."
    why: "Central governance controls future change; it does not magically resolve historical duplicates."
  - id: HEUR-MDG-REPLICATION-AS-DESIGN
    type: expert_heuristic
    statement: "Treat replication, key mapping, value mapping, error handling, and monitoring as part of the MDG design."
    why: "Approved data has no business value if consuming systems receive it late, partially, or with incompatible codes."
  - id: HEUR-MDG-MINIMUM-GOVERNANCE
    type: expert_heuristic
    statement: "Govern only attributes that need central control."
    why: "Over-centralization creates slow workflows, unnecessary ownership conflicts, and expensive maintenance."

presales_decision_guide:
  - question: "Do you need Material, Financials, Custom Objects, or broad S/4HANA customer/supplier attributes?"
    guidance: "Start with MDG on S/4HANA. Current MDG cloud edition is centered on core Business Partner."
  - question: "Do you mainly need a public-cloud core Business Partner owner in a federated landscape?"
    guidance: "Evaluate SAP MDG, cloud edition and define which application owns the richer local attributes."
  - question: "Is the pain duplicate data from many sources?"
    guidance: "Lead with consolidation, matching, survivorship, and data quality. Do not start with approval workflow."
  - question: "Is the pain uncontrolled creation and change?"
    guidance: "Lead with central governance, ownership, change process, validation, and replication."
  - question: "Is the pain large controlled corrections?"
    guidance: "Evaluate mass processing with governance and volume behavior."
  - question: "Does the customer already run S/4HANA MDG?"
    guidance: "Check classic versus cloud-ready mode before proposing a new architecture. Mode switching has process and application restrictions."

presales_questions:
  - "Which master data domain creates measurable business pain?"
  - "Is the main problem creation, change, duplicates, data quality, mass update, distribution, or ownership?"
  - "Which attributes are core enterprise identity, and which are application-specific?"
  - "Which system is authoritative today, and which one should be authoritative tomorrow?"
  - "How many source and consuming systems exist?"
  - "What are the daily change volumes and peak mass-change volumes?"
  - "Which approval roles, segregation-of-duties rules, and service levels are required?"
  - "Which replication technologies and code mappings already exist?"
  - "Which errors currently block sales orders, purchase orders, planning, warehouse execution, or billing?"
  - "Is a federated operating model acceptable, or does the customer need a central enterprise-wide hub?"

success_metrics:
  - id: KPI-MDG-FIRST-TIME-RIGHT
    title: "First-time-right master data"
    description: "Share of master data requests completed without rework or downstream correction."
  - id: KPI-MDG-CYCLE-TIME
    title: "Governance cycle time"
    description: "Time from request to approved and usable master data."
  - id: KPI-MDG-DUPLICATE-RATE
    title: "Duplicate rate"
    description: "Rate of duplicate or suspected duplicate records in the governed domain."
  - id: KPI-MDG-REPLICATION-FAILURE
    title: "Replication failure rate"
    description: "Failed or delayed distribution of approved master data to consumers."
  - id: KPI-MDG-DOWNSTREAM-EXCEPTIONS
    title: "Master-data-driven process exceptions"
    description: "Sales, procurement, planning, warehouse, or finance exceptions caused by incorrect or incomplete master data."

failure_modes:
  - id: FAIL-MDG-FORM-ONLY
    title: "MDG becomes an expensive form"
    cause: "The project configures screens and approvals but does not define ownership, data quality, and downstream responsibility."
  - id: FAIL-MDG-APPROVAL-MAZE
    title: "Approval maze"
    cause: "Organization structure is copied into workflow without considering business risk or required turnaround time."
  - id: FAIL-MDG-GOLDEN-RECORD-BY-SLOGAN
    title: "Golden record without survivorship"
    cause: "Teams declare one system authoritative without resolving duplicates, source precedence, and attribute-level ownership."
  - id: FAIL-MDG-REPLICATION-AFTERTHOUGHT
    title: "Approved but unusable"
    cause: "Replication, key/value mapping, monitoring, and consumer readiness are designed after governance."
  - id: FAIL-MDG-CLOUD-SCOPE-MISMATCH
    title: "Cloud scope mismatch"
    cause: "Cloud edition is selected for a requirement that needs material, financial, custom, or broad application-specific attributes."
  - id: FAIL-MDG-MASS-BYPASS
    title: "Mass change bypasses governance"
    cause: "Bulk update is treated as a technical shortcut instead of a governed process with validation, ownership, and auditability."

