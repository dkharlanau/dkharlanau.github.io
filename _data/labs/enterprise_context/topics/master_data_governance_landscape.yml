    remember: "Control how master data is created and changed."
    purpose: "Route master data changes through defined ownership, checks, approvals, activation, and distribution."
    typical_flow:
      - "Request"
      - "Enrich"
      - "Validate"
      - "Approve"
      - "Activate"
      - "Replicate"
    source_refs:
      - SRC-SAP-MDG-CLASSIC
      - SRC-SAP-MDG-CE-CENTRAL-GOVERNANCE

  - id: CAP-MDG-CONSOLIDATION
    type: capability
