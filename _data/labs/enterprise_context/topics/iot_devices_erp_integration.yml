signal_classes:
  - id: TERM-IOT-IDENTITY-SIGNAL
    type: term
    title: "Identity Signal"
    examples: ["barcode", "RFID EPC", "NFC", "BLE beacon identifier", "serial number"]
    business_meaning: "Which physical object is this?"
  - id: TERM-IOT-MEASUREMENT-SIGNAL
    type: term
    title: "Measurement Signal"
    examples: ["weight", "temperature", "humidity", "pressure", "torque", "energy", "counter reading"]
    business_meaning: "What measurable state does the object have?"
  - id: TERM-IOT-LOCATION-SIGNAL
    type: term
    title: "Location Signal"
    examples: ["GPS", "geofence", "UWB position", "BLE proximity", "gate passage"]
    business_meaning: "Where is the object or resource?"
  - id: TERM-IOT-CONDITION-SIGNAL
    type: term
    title: "Condition Signal"
    examples: ["vibration", "shock", "temperature excursion", "machine alarm", "battery state"]
    business_meaning: "Is the asset, shipment or product still within an acceptable condition?"
  - id: TERM-IOT-MACHINE-STATE-SIGNAL
    type: term
    title: "Machine State Signal"
    examples: ["running", "stopped", "cycle complete", "fault", "piece counter", "PLC tag"]
    business_meaning: "What is the machine doing now?"
  - id: TERM-IOT-QUALITY-SIGNAL
    type: term
    title: "Quality Signal"
    examples: ["vision result", "torque curve", "test result", "dimension", "pass/fail"]
    business_meaning: "Does the produced or received object meet the required condition?"
  - id: TERM-IOT-ACTUATION-SIGNAL
    type: term
    title: "Actuation / Output Signal"
    examples: ["print label", "switch light", "open gate", "robot task", "Andon display"]
    business_meaning: "What should a physical device do after the business decision?"

device_families:
  - id: TERM-IOT-INDUSTRIAL-SCALE
    type: term
    title: "Industrial Scale / Checkweigher"
    signals: ["weight", "stable-weight flag", "tare", "over/under tolerance"]
    sap_objects: ["Handling Unit", "delivery item", "catch weight quantity", "quality result", "goods receipt"]
    best_fit: ["catch-weight products", "packing weight verification", "receiving or production checks"]
    integration_options:
      - "serial/USB/TCP through workstation or edge software"
      - "OPC UA through industrial gateway where supported"
      - "custom mobile/work-center application calling a released SAP interface"
    design_note: "Capture a stable business weight, not every fluctuating sample from the load cell."
    source_refs: [SRC-SAP-EWM-CATCH-WEIGHT]

  - id: TERM-IOT-ENVIRONMENT-SENSOR
    type: term
    title: "Temperature / Humidity / Shock Sensor"
    signals: ["temperature", "humidity", "shock", "tilt", "vibration"]
    sap_objects: ["HU", "delivery", "batch", "equipment", "quality notification", "maintenance notification"]
    best_fit: ["cold chain", "sensitive goods", "equipment condition monitoring"]
    integration_options:
      - "BLE/cellular sensor → gateway/cloud → event integration"
      - "edge or time-series rules → threshold business event"
    design_note: "Store detailed telemetry outside ERP when possible; send relevant measurements and exceptions into the business process."
    source_refs: [SRC-SAP-APM-TIMESERIES]

  - id: TERM-IOT-RFID-GATE
    type: term
    title: "RFID Gate / Fixed Reader"
    signals: ["EPC read", "reader zone", "timestamp", "read strength", "direction inference"]
    sap_objects: ["HU", "product", "asset", "delivery", "warehouse task"]
    best_fit: ["hands-free gate confirmation", "high-throughput identification", "yard or dock transition"]
    integration_options:
      - "reader → edge/RFID middleware → business event"
      - "WCS/Auto-ID layer → EWM"
    design_note: "Deduplicate repeated reads and infer one physical transition before posting to SAP."
    source_refs: [SRC-SAP-EWM-AII-RFID]

  - id: TERM-IOT-RTLS
    type: term
    title: "Indoor RTLS / UWB / BLE Location System"
    signals: ["position", "zone", "proximity", "dwell time", "enter/leave event"]
    sap_objects: ["HU", "asset", "resource", "forklift", "container", "warehouse zone"]
    best_fit: ["indoor asset finding", "forklift visibility", "zone transition", "yard or plant movement"]
    integration_options:
      - "tag/anchor network → location engine → geofence/zone event → integration layer"
      - "location platform → business API or event after context resolution"
    design_note: "ERP rarely needs every coordinate. Convert position streams into business-relevant zone events and exceptions."

  - id: TERM-IOT-GPS-TRACKER
    type: term
    title: "GPS / Vehicle Telematics Device"
    signals: ["latitude", "longitude", "speed", "geofence", "ignition", "ETA-related event"]
    sap_objects: ["freight order", "transportation unit", "shipment tracking process", "resource"]
    best_fit: ["transport visibility", "arrival/departure detection", "delay management"]
    integration_options:
      - "telematics provider → tracking platform → GTT/TM"
      - "event API through integration layer"
    design_note: "Convert GPS streams into milestones and exceptions instead of storing every position in ERP."
    source_refs: [SRC-SAP-GTT-OVERVIEW, SRC-SAP-TM-TRACKING]

  - id: TERM-IOT-PLC-MACHINE-SENSOR
    type: term
    title: "PLC / Machine Sensor / Counter"
    signals: ["PLC tags", "machine status", "cycle count", "alarm", "process value"]
    sap_objects: ["SFC", "operation", "production order context", "equipment", "measuring point"]
    best_fit: ["automatic production events", "machine-state visibility", "production parameters"]
    integration_options:
      - "OPC UA → SAP Digital Manufacturing Production Connector on Edge"
      - "industrial gateway → event/API integration"
    design_note: "Keep deterministic and safety-sensitive control in OT. MES and ERP receive production meaning."
    source_refs: [SRC-SAP-DM-EDGE-OPCUA, SRC-SAP-DM-PRODUCTION-CONNECTOR]

  - id: TERM-IOT-SMART-TOOL
    type: term
    title: "Smart Tool / Test Bench"
    signals: ["torque", "angle", "dimension", "test result", "tool identity", "calibration state"]
    sap_objects: ["SFC", "operation", "inspection characteristic", "quality result", "equipment"]
    best_fit: ["assembly verification", "quality data collection", "traceable production evidence"]
    integration_options:
      - "OPC UA or shop-floor connector"
      - "REST/event integration from test software"
    design_note: "Link the result to the exact unit, operation and calibration context."
    source_refs: [SRC-SAP-DM-EDGE-OPCUA, SRC-SAP-INTEGRATION-THING-TO-THING]

  - id: TERM-IOT-INDUSTRIAL-CAMERA
    type: term
    title: "Industrial Camera / Vision System"
    signals: ["barcode/OCR result", "defect class", "dimension", "presence check", "pass/fail"]
    sap_objects: ["material", "serial number", "inspection result", "warehouse object", "production unit"]
    best_fit: ["visual quality inspection", "hands-free identification", "loading or packing verification"]
    integration_options:
      - "vision controller → edge/API → SAP business event"
      - "camera inside supported mobile application for scanning workflows"
    design_note: "Normally send the extracted result, confidence and evidence reference, not every raw image."

  - id: TERM-IOT-SMART-METER
    type: term
    title: "Smart Meter / Energy Meter"
    signals: ["meter reading", "consumption interval", "power", "device status"]
    sap_objects: ["utility device", "register", "meter reading", "equipment", "energy KPI"]
    best_fit: ["utilities billing", "plant energy monitoring", "consumption analytics"]
    integration_options:
      - "smart meter gateway / MDM → S/4HANA Utilities"
      - "industrial energy meter → edge/time-series platform → analytics or maintenance"
    design_note: "Regulated utility metering and internal plant energy telemetry need different integration designs."
    source_refs: [SRC-SAP-UTILITIES-SMART-METER]

  - id: TERM-IOT-AUTOMATED-MATERIAL-HANDLING
    type: term
    title: "Conveyor / Sorter / ASRS / Stacker Crane"
    signals: ["communication-point arrival", "HU identity", "route state", "capacity", "fault", "move complete"]
    sap_objects: ["HU", "warehouse task", "communication point", "resource", "storage bin"]
    best_fit: ["automated high-bay storage", "conveyor routing", "sorting", "automatic putaway and retrieval"]
    integration_options:
      - "EWM MFS → communication channel → PLC"
      - "EWM → external WCS/WCU → PLC/equipment"
    design_note: "EWM owns warehouse work. PLC owns low-level machine motion between the defined decision points."
    source_refs: [SRC-SAP-EWM-MFS-SETUP, SRC-SAP-EWM-NONSAP-WCU]

  - id: TERM-IOT-ROBOT-AMR-AGV
    type: term
    title: "Robot / AMR / AGV"
    signals: ["task accepted", "position", "arrival", "load state", "fault", "task complete"]
    sap_objects: ["warehouse task", "warehouse order", "resource", "production staging requirement"]
    best_fit: ["automated internal transport", "warehouse movement", "line-side replenishment"]
    integration_options:
      - "EWM → MFS/WCS/fleet manager → robot"
      - "MES/edge orchestration for production-side moves"
    design_note: "Define whether EWM, WCS or fleet manager owns work decomposition, routing and recovery before integration."
    source_refs: [SRC-SAP-EWM-NONSAP-WCU, SRC-SAP-EWM-MFS-SETUP]

  - id: TERM-IOT-PRINTER-APPLICATOR
    type: term
    title: "Industrial Printer / Label Applicator"
    signals: ["print request", "print complete", "printer error", "label applied"]
    sap_objects: ["HU label", "shipping label", "product label", "warehouse work context"]
    best_fit: ["HU and shipping labeling", "production labeling", "print-and-apply automation"]
    integration_options:
      - "SAP output/spool → printer"
      - "WCS/workstation/edge → print-and-apply device"
    design_note: "The business control is whether the correct label version reached the correct physical object."

  - id: TERM-IOT-PICK-LIGHT-ANDON
    type: term
    title: "Pick-by-Light / Andon / Electronic Indicator"
    signals: ["display command", "light state", "button confirmation", "operator acknowledgement"]
    sap_objects: ["warehouse task", "production operation", "exception or Andon event"]
    best_fit: ["high-frequency picking", "line-side guidance", "visual exception signaling"]
    integration_options:
      - "WCS/MES/edge controller rather than direct ERP device control"
    design_note: "Use ERP for work intent and status. Use the execution layer for sub-second lights and buttons."

integration_patterns:
  - id: "PAT-IOT-PERIPHERAL"
    title: "Local Peripheral"
    path: "Device → USB/Bluetooth/HID/vendor SDK → RF/mobile/work-center UI → SAP action"
    use_when: "One operator owns the interaction and the device behaves like a local input/output peripheral."
    examples: ["scanner", "scale", "camera", "mobile printer"]
  - id: "PAT-IOT-EDGE-OT"
    title: "Industrial Edge / OT"
    path: "Sensor/PLC/tool → OPC UA or industrial protocol → Edge → DM/MES/service → SAP business action"
    use_when: "Signals are high-frequency, machines need local resilience, or protocol conversion belongs near the shop floor."
    source_refs: [SRC-SAP-DM-EDGE-OPCUA, SRC-SAP-DM-PRODUCTION-CONNECTOR]
  - id: "PAT-IOT-EVENT"
    title: "Event / Broker"
    path: "Device/Gateway → MQTT or event broker → integration service → context/rules → SAP API/event"
    use_when: "Many devices publish asynchronous events and consumers should be decoupled."
    source_refs: [SRC-SAP-INTEGRATION-THING-TO-THING, SRC-OASIS-MQTT-5]
  - id: "PAT-IOT-WCS-MFS"
    title: "Warehouse Automation Boundary"
    path: "EWM work → MFS/WCS → PLC/equipment → confirmation or exception → EWM"
    use_when: "Conveyors, ASRS, sorters, cranes or robots execute warehouse work."
    source_refs: [SRC-SAP-EWM-MFS-SETUP, SRC-SAP-EWM-NONSAP-WCU]
  - id: "PAT-IOT-RTLS"
    title: "Indoor Location / RTLS"
    path: "Tag → anchors/gateway → location engine → zone/geofence event → SAP context"
    use_when: "Indoor position or proximity matters but ERP only needs stable business locations and transitions."
  - id: "PAT-IOT-ASSET-TIMESERIES"
    title: "Asset Time-Series"
    path: "Sensor → time-series ingestion → indicator/rule → maintenance notification or S/4 measurement"
    use_when: "The business value is condition monitoring, predictive maintenance or counter-based maintenance."
    source_refs: [SRC-SAP-APM-TIMESERIES, SRC-SAP-APM-IOT-SCOPE, SRC-SAP-ASSET-MEASUREMENT-DOC]
  - id: "PAT-IOT-TRACKING"
    title: "Logistics Tracking"
    path: "Telematics/provider → tracking events → GTT/TM → milestone, ETA or exception"
    use_when: "Location and event visibility cross carrier or organizational boundaries."
    source_refs: [SRC-SAP-GTT-OVERVIEW, SRC-SAP-TM-TRACKING]
  - id: "PAT-IOT-INDUSTRY-GATEWAY"
    title: "Industry Gateway"
    path: "Device → regulated/specialized gateway → domain platform → S/4HANA"
    use_when: "Industry regulation or domain technology defines a dedicated integration chain."
    source_refs: [SRC-SAP-UTILITIES-SMART-METER]

protocol_map:
  - boundary: "Local operator peripheral"
    typical_technology: "USB, Bluetooth, HID, serial, vendor SDK"
    rule: "Keep the device behind the UI when a human owns the step."
  - boundary: "Industrial machine connectivity"
    typical_technology: "OPC UA or supported industrial connector"
    rule: "Use a controlled OT/edge layer with explicit trust and certificate handling."
    source_refs: [SRC-OPCF-UA-SECURITY, SRC-SAP-DM-EDGE-OPCUA]
  - boundary: "Asynchronous device events"
    typical_technology: "MQTT or event broker"
    rule: "Keep device topics separate from the stable ERP business-event contract."
    source_refs: [SRC-OASIS-MQTT-5, SRC-SAP-INTEGRATION-THING-TO-THING]
  - boundary: "Warehouse automation"
    typical_technology: "EWM MFS telegrams or external WCS/WCU interface"
    rule: "Separate warehouse decisions from low-level machine control."
    source_refs: [SRC-SAP-EWM-MFS-SETUP, SRC-SAP-EWM-NONSAP-WCU]
  - boundary: "Enterprise business update"
    typical_technology: "Released API, service or business event"
    rule: "Do not expose PLC tags or vendor payloads as the ERP contract."

control_model:
  - id: CTRL-IOT-CONTEXT-RESOLUTION
    type: control
    title: "Business Context Resolution"
    purpose: "Resolve the device event to the correct HU, asset, order, operation, freight object or meter before posting."
  - id: CTRL-IOT-IDEMPOTENCY
    type: control
    title: "Duplicate Protection"
    purpose: "Ensure retry or repeated physical reads cannot create duplicate business postings."
  - id: CTRL-IOT-STORE-FORWARD
    type: control
    title: "Store and Forward"
    purpose: "Buffer relevant events during a temporary network or SAP outage and replay them in order."
  - id: CTRL-IOT-CONTROL-BOUNDARY
    type: control
    title: "OT / ERP Control Boundary"
    purpose: "Keep safety-critical and deterministic control in OT while SAP owns business intent and governed state."
  - id: CTRL-IOT-SECURITY
    type: control
    title: "Device and OT Security"
    purpose: "Use network zones, trusted device/application identity, certificate lifecycle, least privilege and controlled remote access."
    source_refs: [SRC-OPCF-UA-SECURITY]
  - id: CTRL-IOT-TIME-QUALITY
    type: control
    title: "Clock and Timestamp Quality"
    purpose: "Keep device, gateway and business-event timestamps comparable enough for sequence and audit."
  - id: CTRL-IOT-OBSERVABILITY
    type: control
    title: "End-to-End Observability"
    purpose: "Correlate device event, transformed business event, SAP response, exception and replay status."
  - id: CTRL-IOT-FLEET-LIFECYCLE
    type: control
    title: "Device Fleet Lifecycle"
    purpose: "Own firmware, configuration, certificates, replacement, calibration and support status for operational devices."

ownership_model:
  - owner: "Business process owner"
    owns: "Which business event matters, acceptance criteria and final process result."
  - owner: "SAP application owner"
    owns: "SAP object, posting/API contract, configuration, authorizations and business monitoring."
  - owner: "Integration/platform owner"
    owns: "Event contract, routing, duplicate control, retry, dead-letter handling and observability."
  - owner: "OT / automation owner"
    owns: "PLC/WCS/edge behavior, network zone, local recovery and real-time equipment control."
  - owner: "Device/fleet owner"
    owns: "Hardware lifecycle, firmware, certificates, battery/calibration and replacement."

operational_contract:
  event_identity: "Stable event ID or equivalent deduplication key"
  correlation: "Link device event → normalized event → SAP business object → response"
  offline_policy: "Define what can buffer locally, for how long and in which order it is replayed"
  exception_policy: "Route unrecoverable events to a visible queue with business context"
  reconciliation: "Compare physical completion evidence with SAP state, not only HTTP or protocol acknowledgement"
  monitoring: "Watch device health, edge health, queue depth, failure rate, stale events and business exceptions"

decision_dimensions:
  - key: "LATENCY"
    question: "Is this seconds, near-real-time or sub-second control?"
    lead_point: "Sub-second and safety-critical control normally stays in OT."
  - key: "VOLUME"
    question: "How many raw samples create one useful business event?"
    lead_point: "Aggregate before ERP when telemetry frequency is much higher than business frequency."
  - key: "OFFLINE"
    question: "Can the process continue if SAP or the network is unavailable?"
    lead_point: "Define buffering, local autonomy and replay before go-live."
  - key: "CONTEXT"
    question: "How is the signal bound to the correct business object?"
    lead_point: "Context resolution is often more important than protocol selection."
  - key: "CRITICALITY"
    question: "Can a wrong event stop equipment, move stock or create a financial posting?"
    lead_point: "Increase validation, authorization and reconciliation with business impact."
  - key: "OWNERSHIP"
    question: "Who supports the device, edge, integration and SAP posting at 02:00?"
    lead_point: "An architecture without operational ownership is only a diagram."

lead_decision_guide:
  - need: "One worker scans or weighs one object"
    choice: "Local peripheral + standard RF/mobile UI"
    reason: "Lowest architecture weight; keep human confirmation visible."
  - need: "Machine data at high frequency"
    choice: "Industrial edge / OPC UA / Digital Manufacturing"
    reason: "Local buffering and protocol handling belong near equipment."
  - need: "Many asynchronous devices"
    choice: "Gateway + MQTT/event broker + integration layer"
    reason: "Decouple device payloads from SAP business interfaces."
  - need: "Conveyor, ASRS, sorter or stacker crane"
    choice: "EWM MFS or EWM + external WCS/WCU"
    reason: "Separate warehouse task decisions from deterministic equipment control."
  - need: "Indoor asset or forklift location"
    choice: "RTLS/location engine + zone events"
    reason: "Translate position streams into business-relevant locations and transitions."
  - need: "Asset condition and predictive maintenance"
    choice: "Time-series / APM + S/4HANA Asset Management"
    reason: "Keep detailed telemetry and rules outside transactional maintenance documents."
  - need: "Vehicle and shipment visibility"
    choice: "Telematics provider + GTT/TM tracking"
