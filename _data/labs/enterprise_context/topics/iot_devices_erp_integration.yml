design_rules:
  - id: HEUR-IOT-BUSINESS-EVENT-FIRST
    type: expert_heuristic
    title: "Business Event Before Protocol"
    context: "IoT integration design"
    statement: "Define the SAP business event before choosing the device protocol."
    confidence: high
  - id: HEUR-IOT-EDGE-NOISE
    type: expert_heuristic
    title: "Filter Physical Noise"
    context: "High-frequency telemetry"
    statement: "Filter noise and derive stable events before ERP when raw frequency is higher than business frequency."
    confidence: high
  - id: HEUR-IOT-IDEMPOTENCY
    type: expert_heuristic
    title: "Duplicate-Safe Posting"
    context: "Device-triggered business posting"
    statement: "Every automatic posting needs an idempotency key or equivalent duplicate-control design."
    confidence: high
  - id: HEUR-IOT-OT-ERP-BOUNDARY
    type: expert_heuristic
    title: "Keep Real-Time Control in OT"
    context: "Machine control"
    statement: "Keep safety-critical and sub-second control in OT; send business intent and confirmed state across the ERP boundary."
    confidence: high
  - id: HEUR-IOT-RECONCILE-PHYSICAL
    type: expert_heuristic
    title: "Reconcile Physical and Digital State"
    context: "Operations"
    statement: "A successful API call is not proof that the physical world followed the command. Reconcile final physical and business state."
    confidence: high

failure_modes:
  - id: FAIL-IOT-DUPLICATE-POSTING
    type: failure_mode
    title: "Duplicate Posting"
    symptom: "Duplicate goods movement or confirmation"
    check_first: "Device-event ID, retry path, idempotency store and posting acknowledgement."
  - id: FAIL-IOT-CONTEXT-MISMATCH
    type: failure_mode
    title: "Wrong Business Context"
    symptom: "Correct device value is posted to the wrong HU, asset, order or shipment"
    check_first: "Identity mapping, context lifetime, operator/session state and object correlation."
  - id: FAIL-IOT-ALARM-STORM
    type: failure_mode
    title: "Alarm Storm"
    symptom: "ERP or monitoring receives thousands of repeated alerts"
    check_first: "Sampling, hysteresis, debounce, edge aggregation and business-event definition."
  - id: FAIL-IOT-EDGE-OUTAGE
    type: failure_mode
    title: "Edge or Network Outage"
    symptom: "Physical process continues but SAP stops receiving events"
    check_first: "Store-and-forward buffer, queue depth, ordering, retry and replay policy."
  - id: FAIL-IOT-CERTIFICATE
    type: failure_mode
    title: "Expired or Untrusted Device Identity"
    symptom: "Previously working device or OPC UA connection is rejected"
    check_first: "Certificate expiry, trust list, private key, clock and renewal process."
  - id: FAIL-IOT-STALE-DATA
    type: failure_mode
    title: "Stale Telemetry"
    symptom: "SAP receives a valid event that is too old to use safely"
    check_first: "Source timestamp, gateway timestamp, queue delay and business freshness rule."

synthetic_scenarios:
  - id: SCN-IOT-COLD-CHAIN
    type: scenario
    title: "Cold-Chain Inbound"
    flow: "Temperature logger → gateway → threshold event → inbound delivery/HU context → quality hold or alert"
    result: "Suspect stock is identified before normal use."
  - id: SCN-IOT-PRODUCTION-COUNTER
    type: scenario
    title: "Automatic Line Counter"
    flow: "PLC piece counter → OPC UA → Digital Manufacturing Edge → production context → confirmation/analytics"
    result: "Production progress uses machine evidence without sending every PLC tag to ERP."
  - id: SCN-IOT-PREDICTIVE-MAINTENANCE
    type: scenario
    title: "Predictive Maintenance"
    flow: "Vibration sensor → time-series → APM rule → S/4HANA maintenance notification"
    result: "Asset-health signal becomes owned maintenance work."
  - id: SCN-IOT-RFID-DOCK
    type: scenario
    title: "RFID Dock Door"
    flow: "RFID reads → edge deduplication → HU transition → EWM/TM event"
    result: "Hands-free transition is recorded once with evidence."
  - id: SCN-IOT-SMART-WEIGHING
    type: scenario
    title: "Smart Weighing at Packing"
    flow: "Scale → workstation → HU context → tolerance check → update weight or block exception"
    result: "Shipping data and physical package weight agree before loading."
  - id: SCN-IOT-EWM-AUTOMATION
    type: scenario
    title: "Automated High-Bay Warehouse"
    flow: "EWM warehouse task → MFS communication point → PLC → conveyor/stacker crane → completion or fault → EWM"
    result: "EWM keeps warehouse context while low-level equipment control stays in automation."
    source_refs: [SRC-SAP-EWM-MFS-SETUP]
  - id: SCN-IOT-INDOOR-RTLS
    type: scenario
    title: "Indoor Forklift Zone Tracking"
    flow: "UWB/BLE tag → location engine → zone-enter event → resource context → warehouse visibility or exception"
    result: "Operations use stable zone state instead of a stream of raw coordinates."

assessment_cards:
  - question: "Would you connect a temperature sensor directly to S/4HANA?"
    answer: >-
      Normally no. I first define the business event. High-frequency data belongs in a device,
      edge or time-series layer. S/4HANA receives a relevant measurement, exception or business action.
  - question: "Where does OPC UA fit?"
    answer: >-
      It is an industrial connectivity standard between shop-floor systems and an edge or execution layer.
      SAP Digital Manufacturing Production Connector on Edge can connect to OPC UA data sources and subscribe to tag changes.
  - question: "What is the difference between telemetry, event and command?"
    answer: >-
      Telemetry is raw or measured state. A business event says something meaningful happened.
      A command requests an action. I keep these contracts separate because their frequency, ownership and failure behavior are different.
  - question: "How would you connect a conveyor or ASRS to EWM?"
    answer: >-
      I first decide whether EWM MFS or an external WCS owns the automation boundary.
      EWM provides warehouse work and decision context. PLCs execute deterministic machine movement and return completion or faults.
  - question: "How do you design for an edge outage?"
    answer: >-
      I define local autonomy, store-and-forward, ordering, freshness and replay before go-live.
      After recovery, I reconcile physical completion with SAP state instead of replaying blindly.
  - question: "What is the security boundary?"
    answer: >-
      I do not treat a device network as another office subnet. I separate OT zones, use trusted identities and certificates where supported,
      limit privileges and remote access, and give firmware and certificate lifecycle an owner.
  - question: "When does MQTT make sense?"
    answer: >-
      It fits asynchronous publish-subscribe device communication. I keep device topics and payloads behind the integration boundary
      and translate them into stable business events before SAP.
  - question: "How do you integrate robots or AGVs with EWM?"
    answer: >-
      I define whether EWM, MFS, WCS or fleet manager owns work decomposition, routing and recovery.
      The robot executes physical work; it should not become a second warehouse-management system.

