id: TOPIC-IOT-ERP-DEVICE-INTEGRATION
type: research_topic
title: "IoT Devices Around ERP — From Physical Signal to Business Action"
summary: >-
  A Lead-level map of devices around SAP logistics, manufacturing and asset processes:
  scales, sensors, RFID, RTLS, telematics, PLCs, smart tools, cameras, meters,
  automated material handling, robots, printers and industrial indicators.
  The model separates physical telemetry, execution control and ERP business state.
domain: "Enterprise IoT / Logistics / Manufacturing / Asset Management"
process_family: "Physical-to-Digital Integration"
status: researching
created_at: "2026-08-16"
updated_at: "2026-08-16"
verified_at: "2026-08-16"
page_url: "/labs/enterprise-context/iot-devices/"

business_question: >-
  Which physical device should create which business signal, where should raw device data be interpreted,
  which layer owns real-time control, and which SAP process should receive the final business event?

scope:
  include:
    - "Identity, measurement, location, condition, machine-state, quality and output devices"
    - "Warehouse, production, maintenance, transportation, quality and utility scenarios"
    - "Local peripheral, OPC UA, MQTT/event, MFS/WCS, time-series and tracking patterns"
    - "OT/ERP control boundaries, buffering, idempotency, security and operational ownership"
    - "Device-to-business-object context, monitoring, reconciliation and replay"
  exclude_for_now:
    - "Hardware procurement by vendor model"
    - "Detailed radio-frequency engineering"
    - "PLC safety-program design"
    - "Full MES, WCS or fleet-manager product comparison"

maturity:
  gates_complete: 6
  gates_total: 7
  gates:
    scope: done
    sources: done
    model: done
    relationships: done
    expert_reasoning: done
    synthetic_example: done
    ai_evaluation: in_progress

thesis: >-
  I do not integrate every sensor directly with ERP. The device produces a physical signal.
  A local application, edge, OT, MES, WCS, tracking or integration layer gives that signal context,
  removes noise and turns it into a stable business event. Safety-critical and sub-second control stays
  close to the equipment. SAP receives business intent, relevant measurements, confirmations and exceptions.

memory_model:
  phrase: "Sense → Context → Decide → Execute → Post → Prove"
  steps:
    - key: "SENSE"
      question: "What physical fact is observed?"
      answer: "Identity, weight, location, temperature, vibration, machine state, quality result, energy reading or device action."
    - key: "CONTEXT"
      question: "Which business object does the signal belong to?"
      answer: "Resolve HU, material, batch, serial number, equipment, production order, SFC, freight object, bin, resource or meter."
    - key: "DECIDE"
      question: "Where is telemetry converted into a business decision?"
      answer: "Usually in device software, edge/OT, MES/WCS, APM, tracking, middleware or a controlled application service."
    - key: "EXECUTE"
      question: "Who owns real-time physical control?"
      answer: "PLC, machine controller, WCS, MFS, robot fleet manager or another execution layer owns deterministic and safety-sensitive action."
    - key: "POST"
      question: "What SAP action is required?"
      answer: "Confirm work, create a measurement, update status, post movement, create notification, record quality result or publish a tracking event."
    - key: "PROVE"
      question: "How do we know physical and SAP states still agree?"
      answer: "Use acknowledgement, idempotency, correlation IDs, reconciliation, exception monitoring and replay."

architecture_layers:
  - layer: "Device"
    owns: "Raw physical sensing or actuation"
    examples: ["scale", "RFID reader", "temperature sensor", "PLC", "camera", "robot"]
  - layer: "OT / Edge / Local Execution"
    owns: "Protocol handling, local control, buffering, filtering and device health"
    examples: ["PLC", "industrial gateway", "WCS", "fleet manager", "Production Connector on Edge"]
  - layer: "Context / Integration"
    owns: "Business-object resolution, event normalization, routing, duplicate protection and policy"
    examples: ["integration service", "MES", "tracking platform", "APM", "custom service"]
  - layer: "SAP Business Process"
    owns: "Transactional business state, work intent, accounting-relevant postings and governed master/process context"
    examples: ["EWM", "S/4HANA Asset Management", "TM", "Digital Manufacturing", "Utilities"]
  - layer: "Evidence / Operations"
    owns: "Monitoring, audit, reconciliation, replay and support ownership"
    examples: ["event log", "dead-letter queue", "device health", "business reconciliation"]

