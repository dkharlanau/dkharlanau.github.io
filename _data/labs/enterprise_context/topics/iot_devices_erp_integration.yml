id: TOPIC-IOT-ERP-DEVICE-INTEGRATION
type: research_topic
title: "IoT Devices Around ERP — From Physical Signal to Business Action"
summary: >-
  A practical map of devices that can feed or receive operational signals around SAP ERP and logistics:
  scales, environmental sensors, RFID gates, GPS trackers, PLCs, machine sensors, smart tools,
  cameras, meters, robots, printers and industrial indicators. The model focuses on the path from
  physical signal to business object, decision and result rather than on hardware brands.
domain: "Enterprise IoT / Logistics / Manufacturing / Asset Management"
process_family: "Physical-to-Digital Integration"
status: researching
created_at: "2026-08-16"
updated_at: "2026-08-16"
verified_at: "2026-08-16"
page_url: "/labs/enterprise-context/iot-devices/"

business_question: >-
  Which physical device should create which business signal, where should raw device data be interpreted,
  and which SAP process or object should receive the final business event?

thesis: >-
  I do not integrate every sensor directly with ERP. The device produces a physical signal. An edge,
  OT, mobile or integration layer gives that signal context, filters noise and turns it into a stable
  business event. SAP should receive the smallest business-relevant fact needed to update a warehouse,
  production, maintenance, transport, quality or utility process.

memory_model:
  phrase: "Sense → Context → Decide → Post → Prove"
  steps:
    - key: "SENSE"
      question: "What physical fact is observed?"
      answer: "Identity, weight, location, temperature, vibration, machine state, quality result, energy reading or operator/device action."
    - key: "CONTEXT"
      question: "Which business object does the signal belong to?"
      answer: "Resolve HU, material, batch, serial number, equipment, production order, SFC, freight object, bin, resource or meter."
    - key: "DECIDE"
      question: "Where is raw telemetry converted into a business decision?"
      answer: "Usually in device software, edge/OT, MES/WCS, APM, middleware or a controlled application service rather than in core ERP code."
    - key: "POST"
      question: "What SAP action is required?"
      answer: "Confirm work, create a measurement, update status, trigger goods movement, create notification, record quality result or publish a tracking event."
    - key: "PROVE"
      question: "How do we know the physical and SAP states still agree?"
      answer: "Use acknowledgement, idempotency, reconciliation, exception monitoring and an auditable link from device event to business object."

