id: TOPIC-SAP-BUILD-WORK-ZONE
type: research_topic
title: "SAP Build Work Zone — Enterprise Experience and Digital Workplace"
summary: >-
  A lead-level map of SAP Build Work Zone as a cross-solution experience layer: what problem it solves, where it sits in an enterprise architecture, how standard and advanced editions differ, and how it relates to SAP Fiori launchpad, SAP Start, Task Center, Joule, identity, and source systems.
business_question: "When should SAP Build Work Zone be the user entry and experience layer, what should remain in source systems, and which edition fits the workplace requirement?"
domain: "SAP BTP / Enterprise Experience"
status: researching
