      purchasing_org: "1000"
      annual_spend_band: "HIGH"
      risk_class: "MEDIUM"
    decision: "Add purchasing lead approval before final activation."
    lesson: "The rule returns the route decision; MDG workflow executes it."

  - id: SCN-BRFPLUS-SYNTHETIC-OUTPUT
    title: "Synthetic purchase-order output"
    synthetic: true
    context:
      supplier_country: "DE"
      document_type: "NB"
      total_value_band: "STANDARD"
    decision:
      output_type: "PURCHASE_ORDER"
      receiver: "Supplier"
      channel: "EMAIL"
      form: "Company standard PO form"
    lesson: "The rule determines output parameters; the output framework creates and sends the output."

assessment_cards:
  - question: "Why use BRFplus instead of IF statements?"
    answer: >-
      I use BRFplus when the logic is a business decision that benefits from transparent maintenance, simulation,
      reuse, and rule lifecycle. I keep procedural processing and heavy algorithms in code.
  - question: "What is the most important BRFplus design object?"
    answer: >-
      The function contract. The caller gives context and expects a result. If that contract is stable,
      rules can evolve without forcing application code changes.
  - question: "How is BRFplus used in MDG?"
    answer: >-
      In rule-based workflow it can determine status, next step, and responsible agents from the current process context.
      Workflow executes the process; BRFplus makes the decision.
  - question: "How is BRFplus used in S/4HANA Output Management?"
    answer: >-
      Output Parameter Determination uses decision tables to determine supported output parameters such as output type,
      receiver, channel, form, and relevance conditions.
  - question: "Can BRFplus help in integration?"
    answer: >-
      Yes. AIF can call BRFplus functions for value mapping, structure mapping, and checks.
      I would still keep monitoring, restart, and interface ownership in AIF.

ai_evaluation:
  grounded_questions:
    - "A customer wants to change MDG approval routing without changing workflow templates. Which component should own the decision and which component executes the work?"
    - "A purchase order must use different output channels by supplier and document context. Where should the determination logic sit?"
    - "An AIF interface needs a reusable mapping rule. When is BRFplus useful and what stays in AIF?"
    - "A rule table grows to hundreds of rows with procedural sequencing. What design smell does this indicate?"
  expected_reasoning:
    - "Separate decision logic from workflow or output execution."
    - "Treat the BRFplus function as the stable rule API."
    - "Use application-specific BRFplus integration instead of inventing a parallel framework."
    - "Challenge rule models that hide procedural application logic."

