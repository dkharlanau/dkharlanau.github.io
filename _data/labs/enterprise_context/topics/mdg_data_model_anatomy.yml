id: TOPIC-MDG-DATA-MODEL-ANATOMY
type: research_topic
title: "SAP MDG Data Model Anatomy"
summary: "A design model for understanding governed roots, dependent entities, attributes, relationships, staging, active areas, keys, and the delivered Material structure before touching UI or workflow."
domain: "Data and Analytics"
process_family: "Cross-enterprise Master Data Management"
