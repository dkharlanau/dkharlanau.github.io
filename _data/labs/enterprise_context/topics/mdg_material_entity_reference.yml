    - entity: MATERIAL
      meaning: "Material basic/root data"
      design_role: "Primary material identity and root context"
    - entity: MKALBASIC
      meaning: "Production-version-related basic entity in the delivered MM model"
      design_role: "Separate lifecycle object inside the delivered model; do not flatten into the Material root"
    - entity: DRADBASIC
      meaning: "Basic data for document link"
      design_role: "Document-link context with its own technical entity"
    - entity: MATCHGMNG
