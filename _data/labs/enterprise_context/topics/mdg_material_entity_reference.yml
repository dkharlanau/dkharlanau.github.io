business_question: "How do SAP MDG-M entity types map to business grains without confusing technical persistence with business ownership?"

memory_model:
  phrase: "Technical Entity → Business Grain → Meaning → Owner → Rule → Consumer"
  principle: "An MDG entity name tells us how data is modeled technically. It does not decide who owns the business meaning."

technical_reference:
