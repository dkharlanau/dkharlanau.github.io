business_grain_map:
  - grain: "Material"
    representative_entities: [MATERIAL, BSCDATTXT, UNITOFMSR, MEAN_GTIN, CLASSASGN, VALUATION]
    decision: "Enterprise identity and global product meaning"
  - grain: "Material + Plant"
    representative_entities: [MARCBASIC, MARCATP, MARCPURCH, MARCSALES, MARCQTMNG, MARCWRKSD, MARCMRPSP, MARCMRPPP, MARCMRPMI, MARCMRPLS]
    decision: "Plant planning, procurement, ATP, quality and execution meaning"
  - grain: "Material + Storage Location"
    representative_entities: [MARDSTOR, MARDMRP]
    decision: "Storage-location-specific execution or planning context"
  - grain: "Material + Sales Organization + Distribution Channel"
    representative_entities: [MVKESALES, MVKEGRPNG, SALESTXT]
    decision: "Commercial material behavior by distribution chain"
  - grain: "Material + Valuation Area"
    representative_entities: [MBEWACTNG, MBEWVALUA, MBEWCSTNG, MBEWMLAC, MBEWMLVAL]
    decision: "Accounting, valuation and costing context"
  - grain: "Material + Warehouse context"
    representative_entities: [MLGNSTOR, MLGTSTOR]
    decision: "Warehouse-specific product execution context where the architecture uses these entities"

field_to_entity_protocol:
  - "Start from business meaning and required grain."
  - "Locate the delivered entity that represents that meaning."
  - "Check whether governance scope includes the entity and attribute in the selected release and mode."
  - "Assign business owner and technical owner separately."
  - "Define validation/derivation at the narrowest reliable grain."
  - "Define downstream consumers before approving an extension."
  - "Test one positive and one negative scenario per critical field group."

design_boundaries:
  - "Do not use the entity list as a substitute for governance scope."
  - "Do not infer business ownership from a MARA/MARC/MVKE-style technical grouping alone."
  - "Do not extend the MM model to own routing, pricing conditions or source list only because they reference Material."
  - "Treat the delivered model as release-specific; verify exact scope before implementation."

assessment_cards:
  - prompt: "What is MARCBASIC useful for in an architecture discussion?"
    answer: "It is a technical signal that plant-dependent data is a separate modeled segment. The Lead decision is then which plant attributes are governed, who owns them and which process proves them."
  - prompt: "Would you design workflow directly from the entity list?"
    answer: "No. First group entities by business change, risk and ownership. Several entities can move through one CR pattern, and one entity can contain attributes with different decision rights."
  - prompt: "Why keep technical entities and business grains separate?"
    answer: "Because technical modeling explains where data sits, while grain and ownership explain what the value means and who can decide it."

