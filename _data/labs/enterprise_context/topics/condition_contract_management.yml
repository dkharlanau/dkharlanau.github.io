summary: >-
  A cross-domain Settlement Management topic that explains how customer and supplier rebate agreements move from condition contract to business volume, accruals, partial settlement, final settlement, and accounting.
business_question: "How does SAP turn a long-running customer or supplier rebate agreement into eligible business volume, accruals, and a controlled financial settlement?"
