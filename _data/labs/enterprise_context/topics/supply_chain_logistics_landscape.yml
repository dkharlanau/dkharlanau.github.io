decision_guide:
  - need: "Execute purchase requisitions, POs, receipts and purchasing commitments in the ERP"
    primary_choice: APP-S4HANA-SOURCING-PROCUREMENT
    why: "Keep executable purchasing and its logistics/financial integration in the ERP system of record."
  - need: "Run strategic sourcing events and supplier competition"
    primary_choice: APP-ARIBA-SOURCING
    why: "Use a sourcing application rather than forcing operational purchasing documents to become the sourcing workspace."
  - need: "Provide guided multi-ERP buying and invoicing"
    primary_choice: APP-ARIBA-BUYING-INVOICING
    why: "Use the spend-management layer for buyer experience and policy while ERP systems remain execution back ends."
  - need: "Collaborate digitally with suppliers on orders and invoices"
    primary_choice: APP-BUSINESS-NETWORK-PROCUREMENT
    why: "Use the network for cross-company document exchange and supplier self-service."
  - need: "Collaborate with direct-material suppliers on forecasts, inventory and subcontracting"
    primary_choice: APP-BUSINESS-NETWORK-SUPPLY-CHAIN
    why: "Use supply-chain collaboration when the problem extends beyond basic PO/invoice exchange."
  - need: "Manage plant/storage-location stock and financial goods movements"
    primary_choice: APP-S4HANA-INVENTORY-MANAGEMENT
    why: "MM-IM owns enterprise stock quantities/values and goods-movement postings."
  - need: "Plan material requirements close to ERP execution"
    primary_choice: APP-S4HANA-MRP
    why: "Use core MRP for demand-to-supply proposals before adding advanced planning complexity."
  - need: "Plan constrained bottlenecks and detailed production sequences"
    primary_choice: APP-S4HANA-PPDS
    why: "PP/DS adds finite and detailed planning depth beyond classic MRP."
  - need: "Run enterprise demand, supply, inventory and S&OP planning"
    primary_choice: APP-SAP-IBP
    why: "IBP is the cross-enterprise planning layer rather than an execution engine."
  - need: "Execute production orders in the ERP"
    primary_choice: APP-S4HANA-MANUFACTURING
    why: "S/4HANA manufacturing remains the ERP owner of production and material/financial integration."
  - need: "Orchestrate plant-floor operators, resources and manufacturing execution"
    primary_choice: APP-SAP-DIGITAL-MANUFACTURING
    why: "Use the MOM/MES layer when execution needs to move closer to the shop floor."
  - need: "Control complex warehouse bins, tasks, waves and automation"
    primary_choice: APP-S4HANA-EWM
    why: "EWM is the dedicated advanced warehouse-execution layer."
  - need: "Plan, tender, execute and settle freight"
    primary_choice: APP-S4HANA-TM
    why: "TM owns transportation planning and internal freight execution logic."
  - need: "Collaborate with carriers on freight orders, tendering and appointments"
    primary_choice: APP-BUSINESS-NETWORK-FREIGHT
    why: "Use the network to extend transportation execution to external logistics partners."
  - need: "Track orders and shipments across external parties in real time"
    primary_choice: APP-BUSINESS-NETWORK-GTT
    why: "Visibility is a separate responsibility from planning or warehouse execution."
  - need: "Control gates, docks, trailers, containers and yard movements"
    primary_choice: APP-SAP-YARD-LOGISTICS
    why: "Yard execution sits between transportation and warehousing and deserves explicit ownership when operationally complex."
  - need: "Use one native-cloud SaaS layer for warehouse and transportation dispatching"
    primary_choice: APP-SAP-LOGISTICS-MANAGEMENT
    why: "Evaluate SAP Logistics Management for supported cloud-first scenarios, while checking scope against EWM/TM requirements."
  - need: "Manage customs, classification and trade compliance"
    primary_choice: APP-SAP-GTS
    why: "Use GTS for specialized global-trade controls rather than embedding them informally in core logistics."

architecture_patterns:
  - name: "Core operational procurement"
    path: "S/4HANA Sourcing & Procurement → MM-IM → FI/AP"
    fit: "Single-ERP or ERP-led source-to-pay execution."
  - name: "Enterprise source-to-pay"
    path: "Ariba Sourcing → Ariba Buying and Invoicing → Business Network → S/4HANA"
    fit: "Strategic sourcing and guided multi-ERP procurement with supplier collaboration."
  - name: "Direct-material collaboration"
    path: "S/4HANA / MRP → Business Network Supply Chain Collaboration → Supplier"
    fit: "Forecast, order, component, inventory and subcontracting collaboration."
  - name: "Plan to produce"
    path: "IBP → S/4HANA MRP / PP/DS → S/4HANA Manufacturing → Digital Manufacturing"
    fit: "Enterprise plan through executable schedule to shop-floor execution."
  - name: "Warehouse and transportation execution"
    path: "S/4HANA → EWM ↔ TM → Business Network Freight Collaboration"
    fit: "Advanced warehouse and freight planning with external carrier collaboration."
  - name: "Integrated shipping and receiving"
    path: "MM/SD → TM ↔ EWM → Goods Receipt / Goods Issue"
    fit: "Coordinated transportation and warehouse execution using shared logistics context."
  - name: "Cloud logistics alternative"
    path: "S/4HANA → SAP Logistics Management → Business Network Freight Collaboration"
    fit: "Cloud-first warehouse and transportation dispatching for supported scenarios."
  - name: "Global logistics visibility"
    path: "S/4HANA / TM → Business Network Global Track and Trace ← carriers / visibility providers"
    fit: "Cross-company real-time order and shipment visibility."

