  - id: APP-SAP-LOGISTICS-MANAGEMENT
    type: application_component
    title: "SAP Logistics Management"
    domains: [DOM-WAREHOUSING, DOM-TRANSPORTATION, DOM-COLLABORATION]
    architecture_role: "Native-cloud unified warehouse and transportation execution"
    description: >-
      Native-cloud logistics solution on SAP BTP that combines warehouse-management and
      transportation-dispatching capabilities for inbound and outbound logistics and integrates
      with S/4HANA and SAP Business Network Freight Collaboration.
    best_fit: "Cloud-first logistics scenarios that benefit from one SaaS layer for warehouse execution and transportation dispatching with network collaboration."
    not_for: "Do not assume feature parity with the full advanced scope of mature EWM and TM; treat it as a distinct cloud product with its own supported scenarios."
    licensing:
      commercial_model: "Separate cloud subscription"
