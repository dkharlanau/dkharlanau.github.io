id: TOPIC-INTEGRATION-ARCHITECTURE-LANGUAGE
type: research_topic
title: "Integration Architecture Language"
summary: "A common vocabulary for messages, events, APIs, brokers, queues, topics, streams, mediation, reliability, and data distribution."
domain: "Enterprise Integration"
process_family: "Cross-enterprise logistics and data distribution"
status: researching
created_at: "2026-08-14"
updated_at: "2026-08-14"
verified_at: "2026-08-14"
reviewed_together_at: "2026-08-14"
review_note: "Terminology is written as an architecture learning model and aligned with the integration topic and its primary sources."

purpose: >-
  Create one practical language for integration design. The goal is to separate business meaning,
  interaction pattern, contract, transport, mediation, messaging infrastructure, processing, and operations.
  Many weak designs start by mixing these layers and comparing things that solve different problems.

architecture_stack:
  - order: 1
    layer: "Business meaning"
    question: "What business fact, command, query, or document is crossing the boundary?"
    examples: ["Create sales order", "Delivery completed", "Purchase order", "Material changed"]
    lead_rule: "Start here. A protocol cannot repair unclear business meaning."
  - order: 2
    layer: "Interaction pattern"
    question: "Does the sender need an answer now, or can processing happen later? Is this one receiver, many receivers, or a retained stream?"
    examples: ["Request-response", "Queued handoff", "Publish-subscribe", "Event stream", "Batch"]
    lead_rule: "This defines coupling before any product is selected."
  - order: 3
    layer: "Interface contract"
    question: "What fields, semantics, version, errors, and compatibility rules are agreed?"
    examples: ["OpenAPI", "OData metadata", "WSDL/XSD", "IDoc type", "Avro/JSON Schema", "EDI message definition"]
    lead_rule: "A transport connection is not an interface contract."
  - order: 4
    layer: "Protocol and transport"
    question: "How are bytes moved between endpoints?"
    examples: ["HTTPS", "RFC", "JMS", "AMQP", "SFTP", "AS2", "Kafka protocol"]
    lead_rule: "Protocol answers how data travels, not what the business message means."
  - order: 5
    layer: "Mediation and integration runtime"
    question: "Do we need routing, mapping, protocol conversion, security mediation, or orchestration?"
    examples: ["SAP Integration Suite", "TIBCO BusinessWorks", "IBM App Connect Enterprise", "Boomi"]
    lead_rule: "Add mediation when a boundary needs it. Do not centralize logic only because middleware exists."
  - order: 6
    layer: "Broker or streaming backbone"
    question: "Do we need queues, topics, buffering, decoupling, retention, replay, or partitioned scale?"
    examples: ["SAP Event Mesh", "Advanced Event Mesh", "TIBCO EMS", "IBM MQ", "Apache Kafka"]
    lead_rule: "A broker transports and buffers messages. It does not own the business process."
  - order: 7
    layer: "Application processing"
    question: "Which system validates, persists, executes, or projects the business change?"
    examples: ["S/4HANA", "EWM", "TM", "MDG", "carrier platform", "data product"]
    lead_rule: "Keep business authority visible. Middleware should not quietly become the system of record."
  - order: 8
    layer: "Operations and reliability"
    question: "How do we detect failure, recover, reconcile, and prove business completion?"
    examples: ["Correlation", "retry", "dead-letter queue", "replay", "idempotency", "reconciliation", "monitoring"]
    lead_rule: "The happy path is a demo. Recovery behavior is architecture."

selection_questions:
  - "What exactly is crossing the boundary: command, query, fact, document, stream record, or batch data set?"
  - "Who owns the authoritative business state before and after the integration?"
  - "Does the sender need an immediate answer?"
  - "How many independent consumers may need the information?"
  - "Can the receiver be unavailable without blocking the sender?"
  - "Must data be retained and replayed later?"
  - "Is ordering required, and for which business key?"
  - "What duplicate-delivery behavior is acceptable?"
  - "Where are mapping and semantic translation owned?"
  - "How are errors correlated back to a business object?"
  - "How do we reconcile technical delivery with business completion?"
  - "Which part is a product choice, and which part is an architecture requirement?"

terms:
  - term: "Interface"
    category: "Contract"
    definition: "A defined boundary through which two systems exchange information or invoke behavior."
    architect_view: "An interface includes meaning and contract. It is more than a network connection."
    example: "Sales Order API, ORDERS IDoc, or a DeliveryCompleted event contract."
  - term: "API"
    category: "Contract"
    definition: "A callable interface exposed by an application, usually for commands or queries."
    architect_view: "Use an API when the caller needs controlled access and often an immediate response."
    example: "Create a sales order and return the created document number."
  - term: "Endpoint"
    category: "Connectivity"
    definition: "A concrete network address or technical destination where an interface can be reached."
    architect_view: "The endpoint is where you connect; the interface contract defines what the connection means."
    example: "An HTTPS URL, RFC destination, queue, or broker address."
  - term: "Message"
    category: "Messaging"
    definition: "A unit of information transferred between systems."
    architect_view: "Message is the generic container. Its business meaning may be a command, event, document, or stream record."
    example: "A JSON payload saying that delivery 80001234 was completed."
  - term: "Payload"
    category: "Messaging"
    definition: "The business data carried inside a message."
    architect_view: "Keep payload semantics separate from transport metadata."
    example: "Sales order header and item data inside an API request."
  - term: "Header / metadata"
    category: "Messaging"
    definition: "Technical or contextual information attached to a message but separate from its main business payload."
    architect_view: "Use metadata for routing, tracing, versioning, content type, and correlation where appropriate."
    example: "Correlation ID, event type, schema version, tenant, or timestamp."
  - term: "Producer"
    category: "Messaging"
    definition: "A system or component that creates and sends or publishes a message."
    architect_view: "The producer should know the contract, but in event-driven design it should not need to know every consumer."
    example: "S/4HANA publishes DeliveryCompleted."
  - term: "Consumer"
    category: "Messaging"
    definition: "A system or component that receives and processes a message."
    architect_view: "Consumer recovery, idempotency, and compatibility are part of the design."
    example: "A customer-notification service reacts to DeliveryCompleted."
  - term: "Command"
    category: "Business semantics"
    definition: "A request asking another component to perform an action."
    architect_view: "A command has an intended receiver and may succeed or fail."
    example: "CreateSalesOrder or BookShipment."
  - term: "Query"
    category: "Business semantics"
    definition: "A request asking for information without intending to change business state."
    architect_view: "Queries are naturally request-response and should have a clear source of truth."
    example: "Get available stock for material and plant."
  - term: "Event"
    category: "Business semantics"
    definition: "A statement that something already happened."
    architect_view: "An event is a fact, not an instruction. Consumers decide whether and how to react."
    example: "GoodsIssuePosted or BusinessPartnerChanged."
  - term: "Business document"
    category: "Business semantics"
    definition: "A structured business message that represents a document exchanged between parties or systems."
    architect_view: "The document itself is often the reliable unit of work."
    example: "Purchase order, shipping notice, invoice, or IDoc."
  - term: "Synchronous"
    category: "Interaction"
    definition: "The caller waits for processing or a response before continuing."
    architect_view: "Useful for immediate decisions, but it creates runtime dependency on the receiver."
    example: "A storefront waits for an order-create response."
  - term: "Asynchronous"
    category: "Interaction"
    definition: "The sender can continue without waiting for final receiver processing."
    architect_view: "It reduces runtime coupling but requires explicit failure visibility and eventual-consistency handling."
    example: "An IDoc is sent while the receiving system is temporarily unavailable."
  - term: "Request-response"
    category: "Interaction"
    definition: "A pattern where a caller sends a request and receives a response in the same logical interaction."
    architect_view: "Good for commands and queries that need an immediate answer."
    example: "Rate request to a carrier API."
  - term: "Publish-subscribe"
    category: "Interaction"
    definition: "A pattern where a producer publishes once and multiple independent subscribers may receive the message."
    architect_view: "Use it when the producer should not call every interested consumer directly."
    example: "DeliveryCompleted is consumed by billing analytics, notifications, and a data product."
  - term: "Middleware"
    category: "Platform"
    definition: "Software that connects applications and may route, transform, secure, or mediate communication."
    architect_view: "Middleware is a broad category, not a precise architecture role. Name the capability you actually need."
    example: "Integration Suite or TIBCO BusinessWorks acting as a mediation layer."
  - term: "iPaaS"
    category: "Platform"
    definition: "A cloud integration platform used to build, operate, and govern integrations across applications and services."
    architect_view: "Think managed integration runtime, connectivity, lifecycle, and governance rather than only adapters."
    example: "SAP Integration Suite or Boomi."
  - term: "ESB"
    category: "Platform"
    definition: "An enterprise integration style where a shared bus or runtime performs routing, transformation, and mediation."
    architect_view: "Useful in many brownfield estates, but centralizing every rule in the bus creates shared coupling."
    example: "A TIBCO BusinessWorks or IBM integration estate with centrally managed flows."
  - term: "Integration flow"
    category: "Mediation"
    definition: "Executable integration logic that receives, transforms, routes, enriches, or sends messages."
    architect_view: "Keep the flow focused on integration concerns; do not move application ownership into it by accident."
    example: "IDoc -> map customer identifiers -> JSON -> HTTPS receiver."
  - term: "Mapping"
    category: "Mediation"
    definition: "Transformation from one message structure or semantic representation to another."
    architect_view: "Field mapping is easy; semantic mapping is the real design work."
    example: "SAP material number and units mapped into a carrier product schema."
  - term: "Canonical data model"
    category: "Mediation"
    definition: "A shared intermediate representation used to reduce direct pairwise mappings."
    architect_view: "Useful when several systems share stable semantics; dangerous when it becomes an enormous universal enterprise schema."
    example: "A common shipment representation used across several carrier adapters."
  - term: "Orchestration"
    category: "Process coordination"
    definition: "A central component explicitly coordinates several steps or services in a process."
    architect_view: "Use it when one owner must control sequence, branching, timeout, and compensation."
    example: "Call rate service, book carrier, then persist booking reference."
  - term: "Choreography"
    category: "Process coordination"
    definition: "Independent components react to events without one central coordinator controlling every step."
    architect_view: "It reduces central coupling but makes end-to-end process visibility more important."
    example: "DeliveryCompleted triggers independent notification and analytics consumers."
  - term: "Adapter / connector"
    category: "Connectivity"
    definition: "A technical component that lets an integration runtime communicate using a specific protocol or application interface."
    architect_view: "An adapter solves connectivity. It does not decide business semantics."
    example: "IDoc adapter, RFC adapter, Kafka adapter, SFTP connector."
  - term: "Protocol"
    category: "Connectivity"
    definition: "Rules for technical communication between endpoints."
    architect_view: "Do not confuse protocol with message format or business meaning."
    example: "HTTPS, AMQP, JMS, RFC, SFTP, AS2."
  - term: "Message format"
    category: "Contract"
    definition: "The syntax used to represent message data."
    architect_view: "JSON versus XML is mostly syntax; semantics and compatibility matter more."
    example: "JSON, XML, CSV, EDIFACT, Avro."
  - term: "Schema"
    category: "Contract"
    definition: "A machine-readable definition of allowed message structure and data types."
    architect_view: "Schema controls structure, but it cannot fully define business semantics."
    example: "OpenAPI schema, XSD, JSON Schema, Avro schema."
  - term: "Versioning"
    category: "Contract"
    definition: "Rules for evolving an interface or message contract without breaking consumers unexpectedly."
    architect_view: "Compatibility policy matters more than simply putting v2 in a URL."
    example: "Add an optional event field while old consumers continue processing."
  - term: "Broker"
    category: "Messaging infrastructure"
    definition: "Infrastructure that receives and routes or stores messages between producers and consumers."
    architect_view: "A broker decouples transport. It is not automatically an integration engine or business process owner."
    example: "SAP Event Mesh, TIBCO EMS, or IBM MQ."
  - term: "Queue"
    category: "Messaging infrastructure"
    definition: "A messaging destination where messages wait until a consumer processes them, usually with point-to-point work semantics."
    architect_view: "Use a queue to buffer work and protect the sender from temporary receiver outages."
    example: "Warehouse confirmations wait while a downstream system is offline."
  - term: "Topic"
    category: "Messaging infrastructure"
    definition: "A named publish-subscribe destination or stream category to which producers write and consumers subscribe."
    architect_view: "The exact semantics depend on the platform. A JMS topic and a Kafka topic are not operationally identical."
    example: "sap/s4/delivery/completed or a Kafka shipment-events topic."
  - term: "Event broker"
    category: "Messaging infrastructure"
    definition: "A broker optimized for asynchronous event distribution between publishers and subscribers."
    architect_view: "Use it to decouple event producers and consumers; use integration runtime separately when transformation is required."
    example: "SAP Event Mesh."
  - term: "Event stream"
    category: "Streaming"
    definition: "An ordered sequence of retained records representing events or data changes over time."
    architect_view: "A stream is designed for ongoing consumption, history, and often replay, not just one-time delivery."
    example: "Shipment tracking records retained in Kafka."
  - term: "Kafka topic"
    category: "Streaming"
    definition: "A named Kafka stream split into partitions and retained according to topic configuration."
    architect_view: "Consumers track offsets and can re-read retained records. This differs from classic transient pub-sub semantics."
    example: "shipment-tracking-events with partitions by shipment key."
  - term: "Partition"
    category: "Streaming"
    definition: "A shard of a Kafka topic that enables parallelism and defines an ordering boundary."
    architect_view: "Choose the partition key from business ordering needs, not randomly."
    example: "All events for one shipment use the same shipment ID key."
  - term: "Offset"
    category: "Streaming"
    definition: "A consumer position within a Kafka partition."
    architect_view: "Offsets allow consumers to resume or replay from a chosen position."
    example: "A consumer restarts from its last committed offset."
  - term: "Consumer group"
    category: "Streaming"
    definition: "A Kafka mechanism where consumers in the same group share partition processing."
    architect_view: "Different groups can independently consume the same retained stream for different purposes."
    example: "analytics and customer-notification groups read the same shipment topic independently."
  - term: "Retention"
    category: "Streaming"
    definition: "A policy defining how long records remain available in a stream or store."
    architect_view: "Retention creates replay and history options but also capacity, security, and compliance decisions."
    example: "Keep shipment events for seven days for operational replay."
  - term: "Replay"
    category: "Reliability"
    definition: "Reprocessing previously retained messages or stream records."
    architect_view: "Replay is broader than retry. It may intentionally re-run historical data after code or state changes."
    example: "Rebuild a tracking projection from retained Kafka records."
  - term: "Retry"
    category: "Reliability"
    definition: "Another attempt to process or deliver the same failed operation."
    architect_view: "Retry only transient failures automatically. Permanent errors need another path."
    example: "Retry an HTTPS call after a temporary 503 response."
  - term: "Acknowledgement"
    category: "Reliability"
    definition: "A signal that a message was received or processed at a defined technical or business level."
    architect_view: "Always ask what was acknowledged: transport receipt, technical acceptance, or business completion."
    example: "An EDI technical acknowledgement does not necessarily mean the purchase order was accepted."
  - term: "Dead-letter queue (DLQ)"
    category: "Reliability"
    definition: "A destination for messages that cannot be processed successfully after defined handling attempts."
    architect_view: "A DLQ is useful only if ownership, alerting, correction, and replay are defined."
    example: "Invalid warehouse messages are isolated instead of blocking the main queue."
  - term: "Idempotency"
    category: "Reliability"
    definition: "The ability to process the same logical request or message more than once without creating an unintended duplicate result."
    architect_view: "Assume duplicates can happen in distributed systems and design a business key or idempotency key."
    example: "A retried order request must not create a second sales order."
  - term: "Ordering"
    category: "Reliability"
    definition: "A guarantee or requirement about the sequence in which messages are processed."
    architect_view: "Define ordering per business object or key. Global ordering is expensive and rarely necessary."
    example: "Shipment status 30 must not be applied before status 20 for the same shipment."
  - term: "Correlation ID"
    category: "Observability"
    definition: "An identifier used to trace one business or technical interaction across systems."
    architect_view: "Correlation should connect middleware monitoring back to a real business object."
    example: "Trace one sales order from channel request through integration flow to S/4HANA response."
  - term: "Observability"
    category: "Operations"
    definition: "The ability to understand integration behavior through logs, metrics, traces, message status, and business context."
    architect_view: "Technical green lights are not enough; operations need to know which order, delivery, or material is affected."
    example: "Alert on growing queue depth and show affected outbound deliveries."
  - term: "Reconciliation"
    category: "Reliability"
    definition: "A controlled comparison that confirms business state is consistent across systems after integration processing."
    architect_view: "Delivery success is not proof of business consistency. Reconciliation closes that gap."
    example: "Compare materials expected in a target system with materials actually created there."
  - term: "System of record"
    category: "Data ownership"
    definition: "The authoritative system for a defined business object or attribute."
    architect_view: "Integration design must make authority explicit to avoid competing updates and circular synchronization."
    example: "MDG may govern a business partner while S/4HANA remains authoritative for a logistics-specific view."
  - term: "Replication"
    category: "Data distribution"
    definition: "Copying defined data from an authoritative source to one or more target systems."
    architect_view: "Replication needs receiver selection, filters, mapping, monitoring, and reconciliation."
    example: "DRF distributes approved material master changes to selected systems."
  - term: "Synchronization"
    category: "Data distribution"
    definition: "Keeping data aligned across participating systems over time, usually through initial and delta exchange."
    architect_view: "Synchronization is a distribution responsibility, not the same as data governance."
    example: "SAP Master Data Integration synchronizes shared master-data representations."
  - term: "Initial load"
    category: "Data distribution"
    definition: "The first bulk transfer used to establish a target data state before normal delta processing."
    architect_view: "Initial load needs its own volume, sequencing, restart, and reconciliation design."
    example: "Load all relevant business partners before enabling deltas."
  - term: "Delta"
    category: "Data distribution"
    definition: "A change transferred after the initial state, rather than sending the full data set again."
    architect_view: "Define what counts as a change and how missed deltas are recovered."
    example: "Send only material changes approved since the last successful synchronization point."

not_the_same:
  - left: "Message"
    right: "Event"
    distinction: "Message is the transport unit. Event is one possible business meaning carried by a message."
  - left: "API"
    right: "Event"
    distinction: "API is normally callable request-response access. Event announces a fact that already happened."
  - left: "Queue"
    right: "Topic"
    distinction: "Queue normally represents work for a consumer; topic represents publish-subscribe distribution."
  - left: "JMS topic"
    right: "Kafka topic"
    distinction: "Both are named destinations, but Kafka topics are retained partitioned logs with consumer offsets and replay semantics."
  - left: "Broker"
    right: "Integration runtime"
    distinction: "Broker transports or buffers messages. Integration runtime maps, routes, enriches, converts protocols, or orchestrates."
  - left: "Event Mesh"
    right: "Integration Suite mediation"
    distinction: "Event Mesh provides event distribution. Cloud Integration and related capabilities perform mediation and integration flows."
  - left: "Kafka"
    right: "ESB"
    distinction: "Kafka is a retained event-streaming platform. ESB-style runtimes focus on mediation, routing, and transformation."
  - left: "Protocol"
    right: "Format"
    distinction: "Protocol describes communication. Format describes how data is represented. HTTPS can carry JSON or XML."
  - left: "Schema"
    right: "Semantics"
    distinction: "Schema says what structure is valid. Semantics say what the fields mean to the business."
  - left: "Synchronous"
    right: "Real time"
    distinction: "Real-time or near-real-time describes latency. Synchronous describes whether the caller waits. An asynchronous event can still arrive in seconds."
  - left: "Retry"
    right: "Replay"
    distinction: "Retry repeats a failed attempt. Replay intentionally reprocesses retained historical records."
  - left: "Technical delivery"
    right: "Business completion"
    distinction: "A message can be delivered successfully while the target business object is rejected or inconsistent."
  - left: "Governance"
    right: "Replication"
    distinction: "Governance decides and controls trusted master data. Replication distributes approved data."
  - left: "Orchestration"
    right: "Choreography"
    distinction: "Orchestration has a central coordinator. Choreography relies on independent reactions to events."

walkthroughs:
  - id: WALKTHROUGH-SALES-ORDER-API
    title: "Interactive sales order creation"
    business_need: "A channel must create an order and show the result immediately."
    flow: "Channel -> HTTPS API -> API gateway / mediation if needed -> S/4HANA -> response"
    language:
      business_meaning: "Command"
      interaction: "Synchronous request-response"
      contract: "Released API contract"
      transport: "HTTPS"
      mediation: "Optional"
      broker: "Usually none on the command path"
      reliability: "Timeout, idempotency, correlation, clear business errors"
    architect_take: "Do not add a broker simply to make the diagram look modern. The caller needs a committed response now."
  - id: WALKTHROUGH-DELIVERY-EVENT
    title: "Delivery completion event"
    business_need: "Several systems need to react after delivery completion."
    flow: "S/4HANA -> business event -> Event Mesh -> independent consumers"
    language:
      business_meaning: "Event / fact"
      interaction: "Asynchronous publish-subscribe"
      contract: "Event name, payload, version, business key"
      transport: "Broker-specific messaging protocol"
      mediation: "Only where transformation or protocol conversion is needed"
      broker: "Event Mesh or another enterprise event broker"
      reliability: "Duplicate handling, late events, consumer recovery, correlation"
    architect_take: "The producer publishes what happened once. It should not contain a hard-coded list of consumers."
  - id: WALKTHROUGH-MASTER-DATA
    title: "Governed master-data distribution"
    business_need: "Approved master data must reach selected downstream systems."
    flow: "Governance / source of record -> replication or synchronization service -> integration mediation where needed -> receivers -> reconciliation"
    language:
      business_meaning: "Approved master-data state or change"
      interaction: "Asynchronous replication / synchronization"
      contract: "Object model, filters, keys, mappings, delta rules"
      transport: "API, service, IDoc, or platform-specific mechanism"
      mediation: "Used where target contracts differ"
      broker: "Optional; not the governance owner"
      reliability: "Initial load, deltas, retries, key mapping, target confirmation, reconciliation"
    architect_take: "Separate who decides trusted data from how that data is transported."
  - id: WALKTHROUGH-TRACKING-STREAM
    title: "High-volume shipment tracking stream"
    business_need: "Many consumers need retained tracking history and independent replay."
    flow: "Tracking producers -> Kafka topic -> independent consumer groups -> operational views, analytics, data products"
    language:
      business_meaning: "Stream records / events"
      interaction: "Asynchronous retained stream"
      contract: "Schema, key, compatibility rules"
      transport: "Kafka protocol"
      mediation: "At system boundaries only when needed"
      broker: "Kafka streaming platform"
      reliability: "Partition key, offset management, replay, idempotent consumers, retention"
    architect_take: "Kafka is selected because history, replay, consumer independence, and scale are requirements, not because event-driven architecture sounds contemporary."

memory_model:
  - "Business meaning: what happened or what is requested?"
  - "Interaction: who waits for whom?"
  - "Contract: what exactly is promised?"
  - "Transport: how do bytes move?"
  - "Mediation: what must be translated or coordinated?"
  - "Broker / stream: what must be buffered, distributed, retained, or replayed?"
  - "Application: who owns and changes business state?"
  - "Operations: how do we recover and prove completion?"

