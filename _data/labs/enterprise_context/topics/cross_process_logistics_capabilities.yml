graph_ref: "GRAPH-LO-CROSS-PROCESS-LOGISTICS"

business_question: >-
  Which shared logistics capability should preserve the required business identity across processes,
  where is it used, what makes it mandatory or optional, and which configuration decisions control it?

scope:
  include:
    - "Batch Management and Batch Determination"
    - "Shelf-Life Management as a nested batch/inventory capability"
    - "Handling Unit Management and packing instructions"
    - "Serial Number Management"
    - "Cross-Application Classification"
    - "Split Valuation"
    - "Stock Determination"
    - "Process coverage, mandatory/optional logic, configuration, boundaries, failure modes, and assessment drills"
  exclude_for_now:
    - "Detailed EWM stock-removal strategies"
    - "Detailed packaging specification design in EWM"
    - "Catch Weight Management"
    - "Dangerous goods and Product Compliance deep dive"
    - "Country-specific traceability regulation"
    - "Detailed QM inspection-lot design"

