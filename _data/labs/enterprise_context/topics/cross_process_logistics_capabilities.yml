id: TOPIC-LO-CROSS-PROCESS-CAPABILITIES
type: research_topic
title: "Cross-Process Logistics Capabilities"
summary: >-
  Shared SAP S/4HANA logistics controls that cross procurement, inventory, manufacturing,
  quality, sales, delivery, and warehouse boundaries: batch, handling unit, serial number,
  classification, split valuation, and stock determination.
domain: "SAP S/4HANA Logistics"
process_family: "Cross-process logistics"
status: researching
created_at: "2026-08-15"
