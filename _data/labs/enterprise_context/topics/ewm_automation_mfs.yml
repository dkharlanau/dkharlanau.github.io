    type: test_case
    title: "Automation Recovery Test"
    summary: "Test duplicate telegrams, missing acknowledgment, blocked route, channel restart, unknown HU and physical/digital mismatch."

decision_rules:
  - need: "EWM should directly coordinate material flow and the automation topology fits MFS"
    choice: "EWM MFS"
    reasoning: "Keep warehouse task and route decisions close to EWM while PLCs execute the physical movement."
  - need: "A mature external platform coordinates several automation subsystems or owns detailed material flow"
    choice: "External WCS/WCU"
    reasoning: "Keep EWM as warehouse management owner and integrate at an explicit execution boundary."
  - need: "Sub-second machine movement, interlock or safety decision"
    choice: "PLC / equipment controller"
    reasoning: "This belongs to industrial control, not ERP transaction logic."

assessment_cards:
  - question: "What is the boundary between EWM MFS and a PLC?"
    answer: "EWM MFS decides relevant material-flow steps and exchanges telegrams at communication points. The PLC regulates the physical steps between these decision points."
  - question: "When would you prefer an external WCS?"
    answer: "When a separate automation platform already owns detailed multi-system flow, optimization or equipment orchestration. I keep EWM ownership of warehouse demand and business state explicit."
  - question: "What do you check when a pallet is physically moved but EWM is not confirmed?"
    answer: "I stop blind retries, check the last trusted message and business status, identify the physical HU position, then reconcile before resuming automation."
  - question: "What is a communication point?"
    answer: "A material-flow decision point where EWM and a PLC exchange information. It is not every meter of conveyor."

