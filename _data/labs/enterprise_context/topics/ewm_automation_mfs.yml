business_question: >-
  How should automated warehouse movement be split between EWM, MFS or WCS, PLCs and equipment
  so that business state, physical state and recovery remain consistent?

scope:
  include:
    - "EWM MFS architecture: PLC, communication channel, communication point, conveyor segment and resource"
    - "MFS versus external WCS/WCU decision"
    - "Warehouse task and handling-unit context"
    - "Telegram sequencing, acknowledgment, retry and duplicate protection"
    - "Blocked route, stuck HU, channel failure and reconciliation"
    - "Automated storage/retrieval, conveyors, sorters and goods-to-person patterns"
  exclude_for_now:
    - "Customer-specific PLC code or telegram layouts"
    - "Electrical and machine-safety engineering"
    - "Vendor-specific conveyor configuration"

maturity:
  gates_complete: 6
  gates_total: 7
  gates:
    scope: done
    sources: done
    model: done
    relationships: done
    expert_reasoning: done
    synthetic_example: done
    ai_evaluation: in_progress

memory_model:
  phrase: "Intent → Route → Control → Telegram → Confirm → Recover → Monitor"
  lead_line: >-
    EWM owns warehouse intent and business state. MFS or WCS coordinates material flow.
    PLCs and equipment own real-time physical control and safety.

