    label: "Cross-node sourcing / availability"

decision_guide:
  - need: "Execute the legally and financially relevant order-to-cash process in ERP"
    primary_choice: APP-S4HANA-SALES
    why: "Own sales-order execution, pricing, delivery/billing integration, and enterprise postings."
  - need: "Manage sellers, accounts, opportunities, pipeline, forecasts, and guided selling"
    primary_choice: APP-SALES-CLOUD
    why: "Front-office CRM and seller workspace rather than logistics execution."
  - need: "Build and approve complex configurable offers before order creation"
    primary_choice: APP-SAP-CPQ
    why: "Purpose-built configuration, pricing, quote, proposal, and approval capability."
  - need: "Provide B2B/B2C digital catalog, cart, checkout, and customer self-service"
    primary_choice: APP-COMMERCE-CLOUD
    why: "Digital commerce channel and experience platform."
  - need: "Coordinate orders across multiple channels and heterogeneous fulfillment back ends"
    primary_choice: APP-ORDER-MANAGEMENT-FOUNDATION
    why: "Central orchestration layer decouples order capture from distributed fulfillment."
  - need: "Choose the best fulfillment node using real-time inventory, reservations, and business goals"
    primary_choice: APP-OMSA
    why: "Specialized sourcing and availability optimization."
  - need: "Run service contracts, service orders, confirmations, repairs, parts, and service billing"
    primary_choice: APP-S4HANA-SERVICE
    why: "Service lifecycle execution in the S/4HANA core."

architecture_patterns:
  - name: "ERP-centric B2B sales"
    path: "SAP Sales Cloud → SAP S/4HANA Sales"
    fit: "CRM engagement with ERP-owned quote/order execution where product and fulfillment complexity is moderate."
  - name: "Complex configure-to-order sales"
    path: "SAP Sales Cloud → SAP CPQ → SAP S/4HANA Sales"
    fit: "Seller CRM plus complex configuration/quotation before ERP order execution."
  - name: "Digital commerce with ERP fulfillment"
    path: "SAP Commerce Cloud → SAP S/4HANA Sales"
    fit: "Digital order capture with a relatively centralized ERP fulfillment model."
  - name: "Distributed omnichannel order management"
    path: "Sales channels → SAP Order Management foundation → SAP OMSA → fulfillment systems"
    fit: "Many channels and fulfillment nodes where orchestration and sourcing need to be decoupled from a single ERP or storefront."

