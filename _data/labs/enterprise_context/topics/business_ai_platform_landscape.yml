    architecture_role: "Cross-platform AI governance"
    layer: AI-LAYER-GOVERNANCE
    remember: "AI Agent Hub = inventory and govern AI assets."
    description: "A command center for discovering and governing agents, models, and MCP servers across SAP and third-party platforms."
    best_fit: "Enterprise AI portfolios that need ownership, risk, inventory, and observability."
    not_for: "It is not the agent builder or model runtime."
    licensing:
      commercial_model: "SAP LeanIX / offering-specific access"
      note: "Availability and packaging are time-sensitive."
    limitations:
      - "Verify current availability and regional rollout before solution commitment."
    official_docs_url: "https://www.sap.com/products/artificial-intelligence/ai-agent-hub.html"
    official_commercial_url: "https://help.sap.com/docs/leanix/ea/access-ai-agent-hub"
    source_refs: [SRC-SAP-AI-AGENT-HUB, SRC-SAP-AI-AGENT-HUB-ACCESS]
