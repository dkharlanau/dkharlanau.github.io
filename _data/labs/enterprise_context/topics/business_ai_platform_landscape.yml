    type: platform_component
    title: "SAP HANA Cloud"
    architecture_role: "Data engine for AI applications"
    layer: AI-LAYER-GROUNDING
    remember: "HANA Cloud = relational, vector, graph, and other data in one engine."
    description: "A multi-model database for relational, vector, graph, spatial, and JSON workloads."
    best_fit: "AI applications that need governed enterprise data close to computation."
    not_for: "It is not an assistant, model catalog, or agent orchestrator."
    licensing:
      commercial_model: "SAP HANA Cloud / SAP Business Data Cloud entitlement"
      note: "Database capacity is separate from AI model consumption."
    official_docs_url: "https://www.sap.com/products/data-cloud/hana/features/intelligent-data-apps.html"
    official_commercial_url: "https://www.sap.com/products/data-cloud/hana.html"
    source_refs: [SRC-SAP-HANA-CLOUD-AI]
