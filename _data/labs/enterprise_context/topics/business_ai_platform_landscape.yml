id: TOPIC-SAP-BUSINESS-AI-PLATFORM
type: research_topic
title: "SAP Business AI and AI Platform Landscape"
summary: "A compact map of SAP AI: use AI, build AI, run AI, ground AI, and govern AI."
domain: "SAP Business AI"
process_family: "Cross-enterprise / AI-enabled business processes"
status: researching
created_at: "2026-08-14"
updated_at: "2026-08-14"
verified_at: "2026-08-14"
reviewed_together_at: "2026-08-14"
review_note: "Reviewed together against current official SAP product, pricing, and Help Portal sources."

business_question: "Which SAP AI component should own the user experience, build, runtime, model access, grounding, document processing, or governance?"

maturity:
  gates_complete: 2
  gates_total: 7
  gates:
    scope: done
    sources: done
    model: in_progress
    relationships: in_progress
    expert_reasoning: planned
    synthetic_example: planned
    ai_evaluation: planned

architecture_principles:
  - "Joule = use AI."
  - "Joule Studio = build skills and agents."
  - "SAP AI Core = run AI workloads."
  - "Generative AI Hub = access and orchestrate foundation models."
  - "SAP AI Launchpad = manage AI scenarios."
  - "Business Data Cloud and Knowledge Graph = ground AI in business context."
  - "SAP AI Agent Hub = govern AI assets across platforms."
  - "Use deterministic automation when an agent is not needed."

layers:
  - id: AI-LAYER-EXPERIENCE
    title: "Use AI"
    purpose: "Give users one AI experience for information, actions, and agents."
    components: [PLT-JOULE, PLT-JOULE-WORK]

  - id: AI-LAYER-BUSINESS-AGENTS
    title: "Assist and Act"
    purpose: "Use assistants and agents for business work."
    components: [AI-JOULE-ASSISTANTS, AI-JOULE-AGENTS]

  - id: AI-LAYER-BUILD-EXTEND
    title: "Build and Extend"
    purpose: "Create custom Joule skills and agents."
    components: [PLT-JOULE-STUDIO]

  - id: AI-LAYER-RUNTIME-MODELS
    title: "Run and Manage AI"
    purpose: "Run workloads, manage lifecycle, access models, and process documents."
    components: [PLT-AI-FOUNDATION, PLT-SAP-AI-CORE, PLT-SAP-AI-LAUNCHPAD, PLT-GENERATIVE-AI-HUB, PLT-SAP-DOCUMENT-AI]

  - id: AI-LAYER-GROUNDING
    title: "Ground AI"
    purpose: "Give AI trusted business data, semantics, and relationships."
    components: [PLT-SAP-BUSINESS-DATA-CLOUD, PLT-SAP-KNOWLEDGE-GRAPH, AI-SAP-DOMAIN-MODELS, PLT-SAP-HANA-CLOUD]

  - id: AI-LAYER-GOVERNANCE
    title: "Govern AI"
    purpose: "Inventory, assess, and govern agents, models, and MCP servers."
    components: [PLT-SAP-AI-AGENT-HUB]

components:
  - id: PLT-SAP-BUSINESS-AI-PLATFORM
    type: platform_component
    title: "SAP Business AI Platform"
    architecture_role: "AI platform umbrella"
    layer: architecture_umbrella
    remember: "The umbrella: data, AI services, development, and governance."
    description: "The overall SAP platform for building, connecting, running, and governing business AI."
    best_fit: "Use it to explain the full SAP AI architecture."
    not_for: "It is not one runtime or one deployable product."
    licensing:
      commercial_model: "Portfolio / umbrella"
      note: "Licensing comes from the concrete services and subscriptions used underneath."
    official_docs_url: "https://www.sap.com/products/ai-platform.html"
    official_commercial_url: "https://www.sap.com/products/artificial-intelligence/pricing.html"
    source_refs: [SRC-SAP-BUSINESS-AI-PLATFORM, SRC-SAP-BUSINESS-AI-PRICING]
    status: source_verified

  - id: PLT-JOULE
    type: platform_component
    title: "Joule"
    architecture_role: "AI assistant and user experience"
    layer: AI-LAYER-EXPERIENCE
    remember: "Joule = the user talks to AI."
    description: "SAP's AI assistant for business context, answers, navigation, and actions."
    best_fit: "User-facing AI in the flow of SAP work."
    not_for: "It is not the model runtime."
    licensing:
      commercial_model: "Joule Base plus optional Premium AI"
      metric: "Base AI and Premium AI / AI Units depending on scenario"
      note: "Availability and entitlement depend on the SAP product and scenario."
    official_docs_url: "https://help.sap.com/docs/joule/serviceguide/what-is-joule"
    official_commercial_url: "https://www.sap.com/products/artificial-intelligence/pricing.html"
    source_refs: [SRC-SAP-JOULE-HELP, SRC-SAP-BUSINESS-AI-PRICING]
    status: source_verified

  - id: PLT-JOULE-WORK
    type: platform_component
    title: "Joule Work"
    architecture_role: "AI work experience across applications"
    layer: AI-LAYER-EXPERIENCE
    remember: "Joule Work = one AI workspace across systems."
    description: "A workspace that brings insights, agents, and actions together around user intent."
    best_fit: "Cross-application AI work with less context switching."
    not_for: "It is not a model platform or ERP system of record."
    licensing:
      commercial_model: "Depends on Joule and SAP Business AI entitlements"
      note: "Check current availability and packaging."
    official_docs_url: "https://www.sap.com/products/artificial-intelligence.html"
    official_commercial_url: "https://www.sap.com/products/artificial-intelligence/pricing.html"
    source_refs: [SRC-SAP-BUSINESS-AI, SRC-SAP-BUSINESS-AI-PRICING]
    status: source_verified

  - id: AI-JOULE-ASSISTANTS
    type: ai_asset
    title: "Joule Assistants"
    architecture_role: "Role-aware coordination"
    layer: AI-LAYER-BUSINESS-AGENTS
    remember: "Assistant = understands intent and coordinates work."
    description: "Role-aware assistants that coordinate relevant agents and capabilities."
    best_fit: "A user goal that spans several business tasks or agents."
    not_for: "The assistant does not execute every transaction itself."
    licensing:
      commercial_model: "Base or Premium AI depending on capability"
      note: "Premium capabilities can require AI Units or Joule Premium packaging."
    official_docs_url: "https://www.sap.com/products/artificial-intelligence/ai-agents.html"
    official_commercial_url: "https://www.sap.com/products/artificial-intelligence/pricing.html"
    source_refs: [SRC-SAP-JOULE-AGENTS, SRC-SAP-BUSINESS-AI-PRICING]
    status: source_verified

  - id: AI-JOULE-AGENTS
    type: ai_asset
    title: "Joule Agents"
    architecture_role: "Adaptive multi-step agents"
    layer: AI-LAYER-BUSINESS-AGENTS
    remember: "Agent = reasons, chooses tools, and adapts."
    description: "Agents for multi-step work that can plan, use tools, act, and adapt to results."
    best_fit: "Ambiguous or adaptive tasks that cannot be reduced to a fixed workflow."
    not_for: "Do not use an agent when a rule, API, workflow, or skill is enough."
    licensing:
      commercial_model: "Premium AI / AI Units and product-specific packaging"
      note: "Metering depends on the agent and services it consumes."
    limitations:
      - "Agent behavior is probabilistic and needs evaluation, authorization, observability, and human control."
    official_docs_url: "https://www.sap.com/products/artificial-intelligence/ai-agents.html"
    official_commercial_url: "https://www.sap.com/products/artificial-intelligence/pricing.html"
    source_refs: [SRC-SAP-JOULE-AGENTS, SRC-SAP-BUSINESS-AI-PRICING]
    status: source_verified

  - id: PLT-JOULE-STUDIO
    type: platform_component
    title: "Joule Studio"
    architecture_role: "Build custom skills and agents"
    layer: AI-LAYER-BUILD-EXTEND
    remember: "Joule Studio = build Joule skills and agents."
    description: "SAP Build capability for creating, versioning, and deploying custom Joule skills and agents."
    best_fit: "Company-specific Joule actions, skills, and agentic workflows."
    not_for: "It does not replace AI Core or Integration Suite."
    licensing:
      commercial_model: "SAP Build entitlement and developer licensing"
      note: "Creation and deployment require the relevant SAP Build entitlement and developer access."
    official_docs_url: "https://help.sap.com/docs/Joule_Studio/45f9d2b8914b4f0ba731570ff9a85313/7d6dc3e0d59d43e48f4d7ece55e4c2a3.html"
    official_commercial_url: "https://www.sap.com/products/technology-platform/build.html"
    source_refs: [SRC-SAP-JOULE-STUDIO, SRC-SAP-JOULE-STUDIO-LICENSING]
    status: source_verified

  - id: PLT-AI-FOUNDATION
    type: platform_component
    title: "AI Foundation"
    architecture_role: "AI engineering and operations foundation"
    layer: AI-LAYER-RUNTIME-MODELS
    remember: "AI Foundation = the common SAP layer for building and operating AI."
    description: "A foundation that groups SAP capabilities for AI development, extension, model access, and operations."
    best_fit: "Platform-level AI engineering and operations."
    not_for: "Implementation still needs concrete services such as AI Core or Joule Studio."
    licensing:
      commercial_model: "Underlying BTP services and Business AI entitlements"
      note: "License the concrete services used."
    official_docs_url: "https://www.sap.com/products/artificial-intelligence/ai-foundation-os.html"
    official_commercial_url: "https://www.sap.com/products/artificial-intelligence/pricing.html"
    source_refs: [SRC-SAP-AI-FOUNDATION]
    status: source_verified

  - id: PLT-SAP-AI-CORE
    type: platform_component
    title: "SAP AI Core"
    architecture_role: "AI runtime and lifecycle execution"
    layer: AI-LAYER-RUNTIME-MODELS
    remember: "AI Core = run and serve AI."
    description: "SAP BTP runtime for AI workloads, training, model serving, deployments, and lifecycle execution."
    best_fit: "Production AI workloads that need scalable runtime and lifecycle control."
    not_for: "It is not the business-user assistant."
    licensing:
      commercial_model: "BTP service plan and consumption"
      plans: ["Standard", "Extended"]
      metric: "Runtime resources and model/token consumption"
      note: "Generative AI Hub requires the Extended plan."
    official_docs_url: "https://help.sap.com/docs/sap-ai-core/sap-ai-core-service-guide/sap-ai-core-overview"
    official_commercial_url: "https://help.sap.com/docs/ai-core/ai-core/service-plans"
    source_refs: [SRC-SAP-AI-CORE, SRC-SAP-AI-CORE-PLANS, SRC-SAP-AI-CORE-PRICING]
    status: source_verified

  - id: PLT-SAP-AI-LAUNCHPAD
    type: platform_component
    title: "SAP AI Launchpad"
    architecture_role: "AI management UI"
    layer: AI-LAYER-RUNTIME-MODELS
    remember: "AI Launchpad = manage and monitor AI."
    description: "Central SAP BTP application for managing AI scenarios, resources, prompts, and runtimes."
    best_fit: "Operations and visibility across AI Core scenarios."
    not_for: "It manages runtimes; it does not replace them."
    licensing:
      commercial_model: "Separate SaaS service plan"
      metric: "Tenant"
      note: "Runtime consumption is separate."
    official_docs_url: "https://help.sap.com/docs/ai-launchpad/sap-ai-launchpad/what-is-sap-ai-launchpad"
    official_commercial_url: "https://help.sap.com/docs/ai-launchpad/sap-ai-launchpad/metering-and-pricing"
    source_refs: [SRC-SAP-AI-LAUNCHPAD, SRC-SAP-AI-LAUNCHPAD-PRICING]
    status: source_verified

  - id: PLT-GENERATIVE-AI-HUB
    type: platform_component
    title: "Generative AI Hub"
    architecture_role: "Foundation-model access and orchestration"
    layer: AI-LAYER-RUNTIME-MODELS
    remember: "Generative AI Hub = one governed gateway to foundation models."
    description: "A governed layer in AI Core and AI Launchpad for accessing supported foundation models and orchestration."
    best_fit: "Custom GenAI applications that need controlled multi-model access."
    not_for: "It does not replace AI Core."
    licensing:
      commercial_model: "SAP AI Core Extended plus model consumption"
      metric: "Model/token consumption"
      note: "Model availability and rates are time-sensitive."
    official_docs_url: "https://help.sap.com/docs/sap-ai-core/generative-ai/generative-ai-hub"
    official_commercial_url: "https://help.sap.com/docs/sap-ai-core/sap-ai-core-service-guide/metering-and-pricing-for-generative-ai"
    source_refs: [SRC-SAP-GENAI-HUB, SRC-SAP-AI-CORE-PLANS, SRC-SAP-AI-CORE-PRICING]
    status: source_verified

  - id: PLT-SAP-DOCUMENT-AI
    type: platform_component
    title: "SAP Document AI"
    architecture_role: "Document extraction AI"
    layer: AI-LAYER-RUNTIME-MODELS
    remember: "Document AI = read business documents into structured data."
    description: "AI service for extracting structured business information from documents."
    best_fit: "Invoices, orders, forms, and other document-processing scenarios."
    not_for: "It is not a general assistant or agent runtime."
    licensing:
      commercial_model: "Service-plan-specific metering"
      metric: "Documents, compute, requests, users, or AI Units depending on edition"
      note: "Metrics differ by edition."
    official_docs_url: "https://help.sap.com/docs/document-information-extraction"
    official_commercial_url: "https://help.sap.com/docs/document-information-extraction/document-information-extraction/metering-and-pricing"
    source_refs: [SRC-SAP-DOCUMENT-AI-PRICING]
    status: source_verified

  - id: PLT-SAP-BUSINESS-DATA-CLOUD
    type: platform_component
    title: "SAP Business Data Cloud"
    architecture_role: "Governed business data foundation"
    layer: AI-LAYER-GROUNDING
    remember: "Business Data Cloud = trusted business data for analytics and AI."
    description: "A governed data foundation that keeps SAP and third-party data with business semantics and context."
    best_fit: "Reusable data products, analytics, and enterprise AI grounding."
    not_for: "It is not the LLM runtime or agent builder."
    licensing:
      commercial_model: "Separate SAP Business Data Cloud entitlement"
      note: "Separate from Joule, AI Core, and model consumption."
    official_docs_url: "https://www.sap.com/products/data-cloud/business-data-fabric.html"
    official_commercial_url: "https://www.sap.com/products/data-cloud.html"
    source_refs: [SRC-SAP-BDC-DATA-FABRIC]
    status: source_verified

  - id: PLT-SAP-KNOWLEDGE-GRAPH
    type: platform_component
    title: "SAP Knowledge Graph"
    architecture_role: "Business relationships and semantics"
    layer: AI-LAYER-GROUNDING
    remember: "Knowledge Graph = how business entities and processes relate."
    description: "A semantic relationship layer that helps AI reason with business meaning instead of isolated records."
    best_fit: "AI scenarios where relationships and business semantics matter."
    not_for: "It is not an operational source system or generic data lake."
    licensing:
      commercial_model: "Platform capability"
      note: "Validate availability through the consuming SAP product."
    official_docs_url: "https://www.sap.com/products/artificial-intelligence.html"
    official_commercial_url: "https://www.sap.com/products/artificial-intelligence/pricing.html"
    source_refs: [SRC-SAP-BUSINESS-AI, SRC-SAP-BDC-DATA-FABRIC]
    status: source_verified

  - id: AI-SAP-DOMAIN-MODELS
    type: ai_asset
    title: "SAP Domain Models"
    architecture_role: "SAP-specific AI models"
    layer: AI-LAYER-GROUNDING
    remember: "Domain Models = models trained for SAP-specific knowledge."
    description: "SAP-native models for SAP code, data, metadata, and business-process knowledge."
    best_fit: "SAP-specific reasoning where generic models are not precise enough."
    not_for: "They do not replace every third-party foundation model."
    licensing:
      commercial_model: "Consumed through SAP Business AI capabilities"
      note: "Check the consuming Joule or platform scenario."
    official_docs_url: "https://www.sap.com/products/artificial-intelligence/ai-models/domain-models.html"
    official_commercial_url: "https://www.sap.com/products/artificial-intelligence/pricing.html"
    source_refs: [SRC-SAP-DOMAIN-MODELS]
    status: source_verified

