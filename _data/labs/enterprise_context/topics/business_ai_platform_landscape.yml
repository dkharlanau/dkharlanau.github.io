decision_guide:
  - need: "Business users need one AI entry point"
    primary_choice: PLT-JOULE
    why: "Joule owns the user experience."
  - need: "A role needs several agents coordinated"
    primary_choice: AI-JOULE-ASSISTANTS
    why: "Assistants coordinate intent, agents, and capabilities."
  - need: "A task is adaptive and multi-step"
    primary_choice: AI-JOULE-AGENTS
    why: "Agents can reason, choose tools, and adapt."
  - need: "A task is deterministic"
    primary_choice: PLT-JOULE-STUDIO
    why: "Build a Joule skill instead of an agent."
  - need: "Build custom Joule skills or agents"
    primary_choice: PLT-JOULE-STUDIO
    why: "Joule Studio is the build environment."
  - need: "Run custom AI workloads"
    primary_choice: PLT-SAP-AI-CORE
    why: "AI Core owns runtime and lifecycle execution."
  - need: "Access foundation models"
    primary_choice: PLT-GENERATIVE-AI-HUB
    why: "Generative AI Hub provides governed model access and orchestration."
  - need: "Manage AI scenarios"
    primary_choice: PLT-SAP-AI-LAUNCHPAD
    why: "AI Launchpad is the management UI."
  - need: "Extract data from documents"
    primary_choice: PLT-SAP-DOCUMENT-AI
    why: "Document AI is purpose-built for document extraction."
  - need: "Ground AI in enterprise data"
    primary_choice: PLT-SAP-BUSINESS-DATA-CLOUD
    why: "Business Data Cloud provides governed data and semantics."
  - need: "Govern AI across platforms"
    primary_choice: PLT-SAP-AI-AGENT-HUB
    why: "AI Agent Hub inventories and governs AI assets."

reference_patterns:
  - name: "Embedded business AI"
    path: "SAP application → Joule → assistant / agent / skill → business action"
    fit: "Use when SAP already provides the business AI scenario."
  - name: "Deterministic Joule extension"
    path: "Joule → Joule skill → API → business application"
    fit: "Use for repeatable actions with known inputs and outputs."
  - name: "Custom agent"
    path: "Joule → Joule Agent → tools and APIs → business applications"
    fit: "Use for adaptive multi-step work."
  - name: "Custom GenAI application"
    path: "Application → AI Core Extended → Generative AI Hub → foundation model"
    fit: "Use for governed model access outside standard Joule scenarios."
  - name: "Grounded AI"
    path: "Agent → Business Data Cloud / Knowledge Graph / HANA Cloud → business context"
    fit: "Use when live data and semantics are critical."
  - name: "AI governance"
    path: "Agents / models / MCP servers → AI Agent Hub → ownership, risk, and observability"
    fit: "Use when AI becomes an enterprise portfolio."

