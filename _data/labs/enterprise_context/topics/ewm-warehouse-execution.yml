lead_questions:
  - "Why does this warehouse need EWM instead of inventory management alone?"
  - "Should EWM be embedded or decentralized, and which operational boundary drives that choice?"
  - "Which business document becomes the warehouse request?"
  - "What is the difference between a warehouse task and a warehouse order?"
  - "Which strategy determines source or destination bins?"
  - "When should outbound demand be grouped into waves?"
  - "Where do handling units become operationally important?"
  - "How are replenishment and internal stock movements triggered?"
  - "How does production staging reach the correct PSA?"
  - "Who owns quality status and follow-up actions?"
  - "Which system owns goods receipt, goods issue, stock value and warehouse position?"
  - "Where does TM stop and EWM start in shipping execution?"
  - "Should automation be controlled by EWM MFS or an external WCS?"
  - "Which queue, message, document status or task should be checked first when execution is stuck?"

