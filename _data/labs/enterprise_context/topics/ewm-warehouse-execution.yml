  - "EWM ↔ SD / Delivery Management"
  - "EWM ↔ MM / Inventory Management and Procurement"
  - "EWM ↔ TM / classic Shipping and Receiving"
  - "EWM ↔ TM / Advanced Shipping and Receiving"
  - "EWM ↔ PP / delivery-based production supply"
  - "EWM ↔ PP / advanced PMR-based production integration"
  - "EWM ↔ MES / SAP Digital Manufacturing"
  - "EWM ↔ QM"
  - "EWM MFS ↔ PLC"
  - "EWM ↔ external WCS / WCU"
  - "EWM Operations ↔ Warehouse Monitor and integration monitoring"

