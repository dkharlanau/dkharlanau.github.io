  - "Outbound Fulfillment"
  - "Internal Warehouse Logistics"
  - "Production Logistics"
  - "Shipping, Receiving & Dock Execution"
  - "Cross-Docking & Flow-Through"
  - "Packing, Kitting & Value-Added Services"
  - "Slotting, Rearrangement & Warehouse Optimization"
  - "Labor & Resource Management"
  - "Physical Inventory & Stock Integrity"
  - "Automation & Material Flow"
  - "Monitoring & Exception Handling"

lead_questions:
  - "Why does this warehouse need EWM instead of inventory management alone?"
  - "Should EWM be embedded or decentralized, and which operational boundary drives that choice?"
  - "Which EWM subdomain owns this requirement?"
  - "Which business document becomes the warehouse request?"
  - "What is the difference between a warehouse task and a warehouse order?"
  - "Which strategy determines source or destination bins?"
  - "When should outbound demand be grouped into waves?"
  - "Where do handling units and packaging specifications become operationally important?"
  - "How do POSC and LOSC change a multi-step warehouse flow?"
  - "How are replenishment, posting changes and rearrangement triggered?"
  - "Which production integration type is used: delivery, PMR, MES, JIT or repetitive manufacturing?"
  - "Is shipping based on classic TU/Vehicle processing or Advanced Shipping and Receiving with Freight Orders?"
  - "Where does TM stop and EWM start in loading and unloading?"
  - "Where do VAS and work centers fit into inbound or outbound execution?"
  - "Who owns quality status and follow-up actions?"
  - "Which system owns goods receipt, goods issue, stock value and warehouse position?"
  - "Should automation be controlled by EWM MFS or an external WCS/WCU?"
  - "Which queue, message, document status or task should be checked first when execution is stuck?"

