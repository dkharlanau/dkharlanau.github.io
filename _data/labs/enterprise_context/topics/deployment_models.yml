id: TOPIC-SAP-S4-DEPLOYMENT-MODELS
type: research_topic
title: "SAP S/4HANA Deployment Models"
summary: "Public = standardize. Private = flexible cloud. On-Premise = full control."
domain: "SAP S/4HANA Architecture"
process_family: "Cross-enterprise / deployment and operations"
status: researching
created_at: "2026-08-14"
updated_at: "2026-09-23"
verified_at: "2026-08-14"
reviewed_together_at: "2026-08-14"
review_note: "Reviewed together against current official SAP offering-comparison and Help Portal sources."

business_question: "Which S/4HANA deployment model fits the required scope, flexibility, upgrades, operations, and industry needs?"

maturity:
  gates_complete: 2
  gates_total: 7
  gates:
    scope: done
    sources: done
    model: in_progress
    relationships: in_progress
    expert_reasoning: planned
    synthetic_example: planned
    ai_evaluation: planned

modeling_rules:
  - "Deployment model is separate from business domain, process, industry, and application."
  - "The same business process can exist in all three models, but scope and extension options can differ."
  - "Always verify feature availability for the exact edition and release."
  - "Public Cloud and Private Cloud are different operating models."

deployment_models:
  - id: DEP-S4-PUBLIC
    type: deployment_model
    title: "SAP S/4HANA Cloud Public Edition"
    short_title: "Public Cloud"
    remember: "Standardize and stay current."
    what_it_is: "SAP-managed SaaS ERP with standardized processes and frequent SAP-managed innovation."
    best_when: "A new implementation can adopt fit-to-standard processes and keep custom code limited."
    scope: "Standardized scope with selected line-of-business and industry scenarios."
    extensibility: "Controlled in-app, embedded, and SAP BTP side-by-side extensibility."
    upgrades: "SAP manages regular upgrades."
    operations: "SAP manages technical operations."
    implementation: "New implementation and fit-to-standard transformation."
    industry_support: "Selected industry scope; verify the exact feature and release."
    commercial_signal: "Cloud subscription."
    watch_out: "Do not assume an on-premise transaction, enhancement, add-on, or industry feature exists unchanged in Public Edition."
    source_refs: [SRC-SAP-S4-OFFERING-COMPARISON, SRC-SAP-S4-PUBLIC-EDITION]
    status: source_verified

  - id: DEP-S4-PRIVATE
    type: deployment_model
    title: "SAP S/4HANA Cloud Private Edition"
    short_title: "Private Cloud"
    remember: "Broad S/4HANA scope with cloud operations."
    what_it_is: "Private-cloud S/4HANA with scope comparable to on-premise and SAP-managed technical operations."
    best_when: "The customer needs broad scope, industry capabilities, full Customizing, or a conversion path while moving operations to the cloud."
    scope: "Broad S/4HANA line-of-business and industry scope."
    extensibility: "Full Customizing and broad S/4HANA extensibility options."
    upgrades: "SAP installs upgrades at the customer's request within the maintenance lifecycle."
    operations: "SAP manages technical operations."
    implementation: "New implementation, system conversion, lift and shift, or selective data transition."
    industry_support: "Broad industry support; verify the exact feature and add-on scope."
    commercial_signal: "Cloud subscription and service model; contract-specific."
    watch_out: "Private Cloud is not Public Cloud with more flexibility. It has a different scope, lifecycle, and migration model."
    source_refs: [SRC-SAP-S4-OFFERING-COMPARISON, SRC-SAP-S4-PRIVATE-EDITION, SRC-SAP-S4-PRIVATE-BENEFITS]
    status: source_verified

  - id: DEP-S4-ONPREM
    type: deployment_model
    title: "SAP S/4HANA On-Premise"
    short_title: "On-Premise"
    remember: "Maximum control and maximum responsibility."
    what_it_is: "Customer-operated S/4HANA on customer-controlled infrastructure or hosting."
    best_when: "The customer needs maximum technical control, special infrastructure or regulatory constraints, broad add-on freedom, or requirements not covered by cloud offerings."
    scope: "Broad S/4HANA line-of-business and industry scope."
    extensibility: "Full Customizing and broad customer control over extensions and add-ons."
    upgrades: "The customer manages upgrades."
    operations: "The customer or chosen provider manages infrastructure and technical operations."
    implementation: "New implementation or customer-managed conversion path."
    industry_support: "Broad industry scope; verify release and add-on compatibility."
    commercial_signal: "Traditional software and infrastructure model; contract-specific."
    watch_out: "More flexibility also means more responsibility for operations, upgrades, custom code, security, and lifecycle management."
    source_refs: [SRC-SAP-S4-OFFERING-COMPARISON, SRC-SAP-S4-ONPREM-PRIVATE-DOC]
    status: source_verified


private_edition_implementation:
  principle: "S/4HANA remains the business core; Cloud ALM governs implementation and operations; Cloud Identity secures access; BTP provides extension and integration capabilities around the core."
  methodology:
    activate: "SAP Activate defines the implementation phases, tasks, and deliverables."
    rise: "RISE with SAP Methodology adds Clean Core governance, integrated tooling, reports, and quality gates."
    onboarding: "An Embedded Launch Onboarding Expert helps the customer adopt the methodology, provision SAP Cloud ALM, and reviews progress at Clean Core Q-Gates."
    source_refs: [SRC-SAP-PCE-RISE-METHODOLOGY]
  clean_core:
    q_gates: "Checkpoints at the end of implementation phases that review progress through the Clean Core dimensions."
    reports: "SAP Cloud ALM reports help project managers assess adherence to Clean Core deliverables."
    runbook: "An audit trail compares actual performance with Clean Core success plan KPIs such as enhancement inventory, governance, prioritization, and keep-clean monitoring."
    source_refs: [SRC-SAP-PCE-RISE-METHODOLOGY]
  cloud_alm:
    during_project: "Turns SAP Activate content into actionable project work: scope, tasks, roles, timeboxes, testing, deployment planning, and reporting."
    after_go_live: "Continues as an operations and monitoring layer for connected systems and business processes."
    source_refs: [SRC-SAP-PCE-CLOUD-ALM, SRC-SAP-PCE-RISE-METHODOLOGY]
  cloud_identity:
    ias: "Identity Authentication Service handles authentication and single sign-on."
    ips: "Identity Provisioning Service supports automated identity lifecycle and provisioning across systems."
    source_refs: [SRC-SAP-PCE-CLOUD-IDENTITY]
  btp:
    role: "Use SAP BTP for side-by-side extensions, integrations, automation, and applications when the requirement should not be coupled tightly to the S/4HANA core."
    clean_core_rule: "Check standard functionality first, then approved in-app extensibility, then side-by-side design where it gives a cleaner boundary."
    source_refs: [SRC-SAP-PCE-RISE-METHODOLOGY]


fit_to_standard_analysis:
  purpose: "Use working standard processes to decide what the customer can adopt and what must be configured, extended, integrated, or redesigned before Realize."
  lead_memory: "Show standard first. Challenge the gap. Capture the decision. Feed Realize."
  why_it_matters: >-
    Fit-to-Standard is not a workshop where we design every process from zero.
    We start from an executable standard process, let business experts see how it works,
    and spend workshop time on the few places where standard behavior does not meet a real business need.

  new_implementation:
    focus: "Demonstrate the scoped SAP Best Practice processes in a sandbox and compare them with the customer's business needs."
    default_position: "Adopt the standard process unless a legal, control, operational, integration, or material business requirement justifies a deviation."
    result: "Configuration values and a prioritized list of genuine gaps that must be resolved in Realize."
    source_refs: [SRC-SAP-PCE-FIT-TO-STANDARD-OVERVIEW]

  system_conversion:
    focus: "Use Fit-to-Standard mainly for processes that are new, need replacement, or cannot continue unchanged after conversion."
    converted_processes: "Processes that convert directly are validated through formal business process testing instead of being redesigned in every Fit-to-Standard workshop."
    improvement_boundary: "After converted processes are proven to work, the team can evaluate further improvements and new innovations."
    source_refs: [SRC-SAP-PCE-FIT-TO-STANDARD-OVERVIEW, SRC-SAP-PCE-CONVERSION-PROCESS-VALIDATION]

  workshop_outputs:
    - area: "Configuration"
      collect: "Validate existing L2 Business Driven Configuration Questionnaire answers and gather the L3 values needed for detailed configuration."
    - area: "User experience"
      collect: "Business roles plus required space and page adjustments."
    - area: "Extensibility"
      collect: "Key-user in-app extensions that are genuinely needed."
    - area: "Output"
      collect: "Required form and email changes for the process."
    - area: "Analytics"
      collect: "Analytical app changes or reporting needs."
    - area: "Data migration"
      collect: "Migration values or the business owner who can provide the legacy data."
    - area: "Integration"
      collect: "Additional interfaces or integration requirements discovered while walking the process."
    - area: "Change impact"
      collect: "What changes for users, roles, controls, or operating procedures so the change team can prepare."
    source_refs: [SRC-SAP-PCE-FIT-TO-STANDARD-PREPARE]

  workshop_design:
    principle: "Organize workshops around people and process effort, not only around a module name."
    steps:
      - "Use SAP Signavio Process Navigator process flows to identify the business roles that perform most activities."
      - "Group processes that need the same customer experts so participants stay relevant for most of the session."
      - "Use the length and complexity of the Test Procedures section as a practical effort signal."
      - "As an initial planning baseline, SAP learning content suggests roughly 1–2 processes for a half-day workshop and 2–3 for a full day, then adjust for complexity."
    source_refs: [SRC-SAP-PCE-FIT-TO-STANDARD-PREPARE]

  workshop_execution:
    facilitation: "A practical pattern is to have one consultant run the system demonstration and discussion while another records requirements."
    cloud_alm: "Capture each requirement separately against the scoped process in SAP Cloud ALM so it becomes a traceable backlog item."
    decision_question: "Is this a configuration choice, a real gap, an extension, an integration need, a data issue, or simply a change-management concern?"
    source_refs: [SRC-SAP-PCE-FIT-TO-STANDARD-CONDUCT]

  after_explore:
    new_implementation: "For a new implementation, SAP Best Practices content can be activated with SAP Best Practices Solution Builder using transaction /n/SMB/BBI."
    process_documentation: "SAP Signavio Process Navigator provides the process documentation used to understand the standard scope and process flow."
    realize: "The configuration team then applies the collected configuration values and resolves the prioritized requirements in the development system during Realize."
    source_refs: [SRC-SAP-PCE-BEST-PRACTICES-CONFIG, SRC-SAP-PCE-FIT-TO-STANDARD-CONDUCT]

  assessment_answer: >-
    Fit-to-Standard means we demonstrate an executable standard process first and use the workshop to find
    the minimum justified delta. In a new implementation we compare SAP Best Practices with the customer's
    needs and collect configuration plus gaps. In a system conversion we focus workshops on new or replacement
    processes, while directly converted processes are validated separately through testing. The output is a
    traceable, prioritized backlog that drives configuration and design in Realize.

  source_refs:
    - SRC-SAP-PCE-FIT-TO-STANDARD-OVERVIEW
    - SRC-SAP-PCE-FIT-TO-STANDARD-PREPARE
    - SRC-SAP-PCE-FIT-TO-STANDARD-CONDUCT
    - SRC-SAP-PCE-BEST-PRACTICES-CONFIG
    - SRC-SAP-PCE-CONVERSION-PROCESS-VALIDATION

private_edition_transition_paths:
  source_refs: [SRC-SAP-PCE-TRANSITION-PATHS]
  items:
    - name: "New Implementation"
      memory: "New system, redesigned processes."
      meaning: "A new SAP S/4HANA system is installed and required master/open transactional data is migrated."
    - name: "System Conversion"
      memory: "Convert the existing ERP system 1:1."
      meaning: "An existing SAP ERP system is technically converted to SAP S/4HANA while retaining most configuration, custom code, and history."
    - name: "Selective Data Transition"
      memory: "Keep selected history and redesign selectively."
      meaning: "Configuration and selected master and transaction data are moved or transformed into the target S/4HANA environment."
    - name: "Lift & Shift"
      memory: "Move the system without changing the application release."
      meaning: "An existing S/4HANA system is copied to a new landscape, for example from on-premise to Private Edition on the same release."
    - name: "Upgrade"
      memory: "Change the base release."
      meaning: "Move the system to a newer SAP S/4HANA base release."
    - name: "Update"
      memory: "Apply FPS or SPS within the release lifecycle."
      meaning: "Install software updates without treating the change as a new implementation path."

private_edition_release_cycle:
  base_release_frequency: "Every two years after the 2023 release."
  mainstream_maintenance: "Seven years per base release."
  fps: "Feature Pack Stacks are released every six months with non-disruptive features until the next base release."
  sps: "After the next base release, the previous release receives Support Pack Stacks every six months with corrections until mainstream maintenance ends."
  upgrade_boundary: "SAP executes the technical upgrade as part of the RISE service, while planning, preparation, testing, remediation, and business readiness remain customer or partner responsibilities."
  source_refs: [SRC-SAP-PCE-RELEASE-UPGRADES]

memory_compare:
  - dimension: "Process approach"
    public: "Fit to standard"
    private: "Standard plus broad configuration and conversion flexibility"
    onprem: "Maximum customer control"
  - dimension: "Functional scope"
    public: "Selected and standardized"
    private: "Broad S/4HANA scope"
    onprem: "Broad S/4HANA scope"
  - dimension: "Extensions"
    public: "Controlled cloud extensibility"
    private: "Full Customizing and broad extensibility"
    onprem: "Full Customizing and broadest customer control"
  - dimension: "Upgrades"
    public: "SAP-managed and frequent"
    private: "SAP-installed on customer schedule"
    onprem: "Customer-managed"
  - dimension: "Operations"
    public: "SAP"
    private: "SAP"
    onprem: "Customer or chosen provider"
  - dimension: "Typical transformation"
    public: "New implementation"
    private: "New, conversion, lift and shift, selective transition"
    onprem: "Customer-managed new or conversion path"

decision_guide:
  - need: "Fast fit-to-standard cloud ERP with low operational responsibility"
    primary_choice: DEP-S4-PUBLIC
    why: "Public Edition favors standard processes and an SAP-managed lifecycle."
  - need: "Cloud ERP with broad S/4HANA scope, industry content, and conversion flexibility"
    primary_choice: DEP-S4-PRIVATE
    why: "Private Edition combines cloud operations with scope and extensibility close to on-premise."
  - need: "Maximum customer control over infrastructure, lifecycle, add-ons, and special requirements"
    primary_choice: DEP-S4-ONPREM
    why: "On-premise keeps the largest share of technical and lifecycle responsibility with the customer."

lead_answer: "Start with business requirements, then check scope, clean-core fit, extensibility, industry needs, integration, upgrade tolerance, operations, and migration path."

