log_design_checklist:
  - "Define a log object and subobject around a stable business area, not around a developer name or program include."
  - "Choose an external ID that lets support correlate the log with a business document, job run or interface message."
  - "Log milestones and exceptions. Aggregate repetitive warnings instead of recording noise."
  - "Do not log secrets, authentication tokens or unnecessary personal data."
  - "Make retry or restart behavior visible when the process is asynchronous."
  - "Plan retention. A useful log becomes a database problem if nobody owns deletion."
  - "Keep logging behind a small application interface so classic BAL and cloud-safe implementations can evolve independently of business logic."

logistics_scenarios:
  - scenario: "Sales order inbound API"
    design: "RAP/API or classic service processes the request; BAL stores business validation and document result using the external message ID; ST22/ST05 are used only if a technical failure needs deeper diagnosis."
  - scenario: "Outbound delivery background run"
    design: "One application log per run or useful processing unit. Store counts, skipped deliveries, warnings, document keys and final status. Avoid one success message per item."
  - scenario: "Purchasing exception report"
    design: "SALV is enough for a read-only SAP GUI support report. Use navigation to PO or supplier object instead of turning the report into a second ME22N."
  - scenario: "Buyer mass change"
    design: "If SAP GUI remains the target, ALV Grid can support controlled editing. Keep validations and save logic in reusable application services. For a new strategic UX, re-evaluate RAP/Fiori."
  - scenario: "New logistics exception cockpit"
    design: "Use RAP for business object behavior, OData service binding for exposure, and Fiori elements for a standard list/object flow. Choose freestyle UI5 only if the operator interaction is truly special."

anti_patterns:
  - name: "BAL as debug trace"
    smell: "Every method and loop iteration writes a persistent message."
    correction: "Log business milestones and failures; use technical trace tools for technical investigation."
  - name: "Z log table by reflex"
    smell: "A custom table is created before checking the standard application log."
    correction: "Use BAL when its classification, persistence and analysis model fits; add custom persistence only for a real domain requirement."
  - name: "SALV for a transaction"
    smell: "A simple reporting tool grows into complex editing and save logic."
    correction: "Move transactional behavior to a proper application service and choose a UI designed for the interaction."
  - name: "ALV forever"
    smell: "A strategic new process is forced into SAP GUI because an old grid can be copied quickly."
    correction: "Evaluate user channel, lifecycle and clean-core direction before reusing the old pattern."
  - name: "Fiori rewrite by fashion"
    smell: "A stable internal GUI report is rebuilt without user, lifecycle or cost benefit."
    correction: "Modernize where the business channel or architecture improves, not just where the CSS changes."
  - name: "Freestyle for standard CRUD"
    smell: "A large UI5 app manually implements filters, tables and object pages already covered by Fiori elements."
    correction: "Start with Fiori elements and supported extensions; move to freestyle only when the interaction demands it."
  - name: "Business rules in UI handlers"
    smell: "Validation and status logic exist only in JavaScript or ALV event code."
    correction: "Keep authoritative business behavior in the backend service or business object."

lead_assessment_answers:
  - question: "When would you use BAL?"
    answer: "When the process needs a persistent support history after the request is finished. I define object, subobject and a useful external correlation ID, then log business milestones, warnings and errors. I do not use BAL as a high-volume debug trace."
  - question: "SALV or ALV Grid?"
    answer: "For a small read-oriented SAP GUI report I start with SALV. I use ALV Grid only when the GUI interaction really needs richer control or an existing editable-grid workflow must be maintained. I keep business validation outside the UI where possible."
  - question: "Would you replace every ALV with Fiori?"
    answer: "No. I modernize when the user channel, lifecycle, process design or support model improves. A stable internal GUI report can remain. For a new strategic business application I would normally evaluate RAP and Fiori first."
  - question: "Fiori elements or freestyle SAPUI5?"
    answer: "Fiori elements is my first choice for standard business-object applications because metadata and annotations remove UI boilerplate. Freestyle is for a genuinely custom interaction, and I accept the extra code and test cost deliberately."
  - question: "Where does RAP end and Fiori begin?"
    answer: "RAP models backend data, business behavior and service exposure. The service binding exposes the contract. Fiori elements or SAPUI5 consumes that contract. I do not move authoritative business rules to the browser."
  - question: "A delivery interface is slow and also has business errors. What do you check?"
    answer: "I separate the evidence. BAL can explain business validation and processing results. SAT or ST05 can measure technical runtime and SQL behavior. Mixing both into one giant log makes support worse, not better."

