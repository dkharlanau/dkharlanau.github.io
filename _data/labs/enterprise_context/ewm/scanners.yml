assessment_cards:
  - question: "Where do you start when selecting warehouse scanners?"
    answer: "I start with the process, scan frequency, physical environment and identifier. Only then do I choose the device class."
  - question: "What does the scanner do with a GS1-128 barcode?"
    answer: "The device decodes the symbol. The application parser must interpret the Application Identifiers and map SSCC, GTIN, batch, expiry or serial data to the correct SAP context."
  - question: "What is the difference between reprint and new label generation?"
    answer: "A reprint normally preserves the valid business identity. New generation creates a new identifier. Mixing the two can create duplicate or stale physical identity."
  - question: "When would you build a custom scanner app?"
    answer: "When standard RF or a standard mobile app cannot support the required user journey, device interaction or cross-system process. I keep SAP as system of record and use released APIs."
  - question: "Can warehouse confirmations work offline?"
    answer: "Only with care. A queued action can become stale while stock, HU or warehouse-task state changes. I define expiry, idempotency, conflict detection and reconciliation before allowing replay."
  - question: "How do you secure shared warehouse devices?"
    answer: "I separate worker identity, managed device identity and application authentication. I also define session handover, credential revocation and fleet configuration ownership."
  - question: "When is a scanner the wrong tool?"
    answer: "When the real problem is continuous location, machine control, visual quality, bulk non-line-of-sight capture or a very low scan volume. Then I choose RTLS, PLC/WCS, vision, RFID or a simpler phone workflow."

related_architecture:
  - title: "IoT Devices Around ERP"
    url: "/labs/enterprise-context/iot-devices/"
    relation: "Use for device/edge/OT ownership, event pipelines, security, buffering and physical-to-digital architecture beyond scanners."

assessment_answer: >-
  I start with the warehouse step, business identifier, scan frequency, physical environment and criticality.
  Then I define the label lifecycle and parsing contract before choosing the device. If standard EWM RF covers
  the process, I keep it standard. For a special user journey, I use a mobile extension with released SAP APIs
  but keep warehouse logic in the owning application. For fixed readers or RFID, I separate raw reads from the
  SAP business event with edge filtering and duplicate protection. I design Wi-Fi, retry, offline limits, device
  identity, reprint rules, monitoring and reconciliation before go-live, then measure the solution with operational KPIs.

