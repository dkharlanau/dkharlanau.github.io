id: AGENT-CONTRACT-SD-SALES
version: "1.0.0"
updated_at: "2026-08-15"
title: "SAP Sales Agent Routing Contract"
purpose: >-
  Help an AI agent choose the right Sales knowledge layer before it answers. This file is a router,
  not a second copy of process facts. The canonical models remain the process atlas, mechanism library,
  integration maps, master-data model, deep-dive graphs and diagnostic casebook.

namespaces:
  - prefix: "SD."
    entity: "sales process or process variant"
    primary_endpoint: "/labs/enterprise-context/data/sales-process-atlas.json"
  - prefix: "MEC.SD."
    entity: "reusable Sales decision or control mechanism"
    primary_endpoint: "/labs/enterprise-context/data/sales-mechanisms.json"
  - prefix: "ORC.SD."
    entity: "upstream order origin or orchestrator"
    primary_endpoint: "/labs/enterprise-context/data/sales-order-integration-map.json"
  - prefix: "INT.SD."
    entity: "cross-application handoff or execution owner"
    primary_endpoint: "/labs/enterprise-context/data/sales-order-integration-map.json"
  - prefix: "EVT.SD."
    entity: "Sales event or asynchronous integration contract"
    primary_endpoint: "/labs/enterprise-context/data/sales-order-integration-map.json"
  - prefix: "SDC."
    entity: "symptom-first Sales diagnostic case"
    primary_endpoint: "/labs/enterprise-context/data/sales-diagnostic-casebook.json"

routing_rules:
  - intent: "What business process is this?"
    start_with: "/labs/enterprise-context/data/sales-process-atlas.json"
    then: ["sales-process-coverage", "sales-mechanisms"]
    reason: "Process classification should happen before detailed configuration advice."
  - intent: "Why did SAP choose this item, plant, route, date, price, tax, invoice or output?"
    start_with: "/labs/enterprise-context/data/sales-mechanisms.json"
    then: ["sales-order-graph", "relevant deep-dive graph"]
    reason: "A wrong result normally belongs to a reusable control mechanism, not to the last document in the flow."
  - intent: "Something is wrong in production. How should I diagnose it?"
    start_with: "/labs/enterprise-context/data/sales-diagnostic-casebook.json"
    then: ["sales-mechanisms", "sales-process-atlas", "relevant integration or deep-dive endpoint"]
    reason: "Start from the symptom and evidence boundary before proposing configuration changes."
  - intent: "Which interface, API, IDoc, event or handoff fits this process?"
    start_with: "/labs/enterprise-context/data/sales-order-integration-map.json"
    then: ["sales-process-atlas", "sales-process-coverage"]
    reason: "Choose the business contract and owner before choosing transport technology."
  - intent: "Which master data can change the result?"
    start_with: "/labs/enterprise-context/data/sales-master-data.json"
    then: ["sales-mechanisms", "sales-order-graph"]
    reason: "Master data is an input to runtime decisions; it should not be diagnosed as isolated maintenance."
  - intent: "Is Sales coverage complete enough for this question?"
    start_with: "/labs/enterprise-context/data/sales-process-coverage.json"
    then: ["sales-process-atlas", "sales-mechanisms", "sales-diagnostic-casebook"]
    reason: "Coverage metadata says what is reviewed, partial, adjacent or still open."
  - intent: "How does a normal sales order get built at runtime?"
    start_with: "/labs/enterprise-context/data/sales-order-graph.json"
    then: ["sales-mechanisms", "pricing-graph", "atp-graph", "credit-graph", "shipping-graph"]
    reason: "The runtime graph is the best entry point for the decision chain inside one order."

answer_policy:
  - "Classify the entity before explaining it: process, mechanism, origin, handoff, master data, diagnostic case or deep-dive capability."
  - "Use stable author IDs in the answer when they help a later agent continue the trace."
  - "Keep documented product facts separate from Lab reasoning and synthetic examples."
  - "If a source or process is release-sensitive, state the deployment or release boundary instead of silently generalizing it."
  - "Do not convert an absent relation into a negative claim unless the source model declares that relation set exhaustive."
  - "When evidence is missing, name the evidence to collect. Do not manufacture a root cause."
  - "Prefer one primary owner and an evidence-based handoff over a list of every team that might be involved."

negative_semantics:
  process_mechanism_map: >-
    The process-to-mechanism map is reviewed but not exhaustive. Missing mapping means not reviewed in that map,
    not that the process uses no reusable mechanisms.
  scope_items: >-
    Missing SAP scope-item ID does not automatically mean a missing business process. Check aliases and the business
    contract because several SAP scope items can map to one stable Lab process code.
  diagnostic_casebook: >-
    Missing case means the exact symptom pattern is not modeled yet. It does not prove that the product has no known
    failure mode or that another case cannot provide a useful reasoning pattern.

retrieval_sequence:
  - step: 1
    action: "Classify the user intent and choose one primary endpoint."
  - step: 2
    action: "Resolve stable IDs and read the canonical entity before following related IDs."
  - step: 3
    action: "Follow only material relations: control owner, data hinge, integration handoff, failure evidence or source."
  - step: 4
    action: "Check coverage and release boundaries before making a broad statement."
  - step: 5
    action: "Return a concise answer with the decision path, evidence and next owner."

quality_checks:
  - question: "Did the answer confuse a process with a mechanism?"
    fail_if: "A reusable determination such as pricing or ATP is presented as a separate end-to-end process without context."
  - question: "Did the answer confuse an event with an API?"
    fail_if: "An event notification is described as if it carries the full current business object by definition."
  - question: "Did the answer jump from symptom to fix?"
    fail_if: "No evidence or competing cause is checked before a configuration change is proposed."
  - question: "Did the answer overstate coverage?"
    fail_if: "A partial map or release-specific source is presented as exhaustive or universal."
  - question: "Can another agent continue the trace?"
    fail_if: "The answer drops stable IDs, owner, evidence boundary and relevant endpoint when they are needed for continuation."
