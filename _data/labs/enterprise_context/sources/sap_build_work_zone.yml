    verifies:
      - "Spaces group related content and are assigned to roles."
      - "Pages contain applications and content and are assigned to spaces."
    release_scope: "Cloud"
    accessed_at: "2026-08-27"
    status: source_verified

  - id: SRC-SAP-WZ-WORKSPACES
    title: "About Workspaces"
    publisher: "SAP"
    source_type: "product_documentation"
    url: "https://help.sap.com/docs/build-work-zone-advanced-edition/sap-build-work-zone-advanced-edition/8ff3df94802449f3877af5c380b22c4b.html"
    verifies:
