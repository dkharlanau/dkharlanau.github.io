    verifies:
      - "The advanced edition creates digital workspace solutions with integrated business applications and processes."
      - "It centralizes applications, processes, information, and communication in a unified entry point."
      - "It supports role-based access, SSO, mobile access, team interaction, and cloud/on-premise applications."
    release_scope: "Cloud"
    accessed_at: "2026-08-27"
    status: source_verified

  - id: SRC-SAP-BUILD-OVERVIEW
    title: "What Is SAP Build?"
    publisher: "SAP"
    source_type: "product_documentation"
    url: "https://help.sap.com/docs/SAP%20Build/9d385a1842594230993661ca78dce150/what-is-sap-build"
    verifies:
      - "SAP Build Work Zone is one component of SAP Build."
      - "Standard edition focuses on business sites as an entry point to applications and extensions."
      - "Advanced edition includes standard capabilities and adds collaboration, workspaces, and richer content."
    accessed_at: "2026-08-27"
    status: source_verified

  - id: SRC-SAP-WZ-SPACES-PAGES
    title: "About Spaces and Pages"
    publisher: "SAP"
    source_type: "product_documentation"
