updated_at: "2026-08-27"
scope: "SAP Build Work Zone, SAP central entry points, workspace experience, content federation, tasks, identity, mobile, and Joule integration"
policy: >-
  Primary SAP Help sources verify product behavior and current product boundaries.
  The Lab classification and decision heuristics are independently written architecture interpretations.
  Cloud product capabilities can change; edition-specific design decisions should be checked against current SAP documentation.

sources:
  - id: SRC-SAP-WZ-STANDARD
    title: "SAP Build Work Zone, standard edition"
    publisher: "SAP"
    source_type: "product_documentation"
