    verifies:
      - "SAP Build Work Zone can act as a central entry point with links, tiles, cards, applications, navigation, and content federation."
      - "Content from multiple sources can be exposed into a central site."
      - "In-place embedding has technical constraints such as iframe and cookie behavior."
    accessed_at: "2026-08-27"
    status: source_verified

