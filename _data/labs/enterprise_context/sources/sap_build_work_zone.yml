      - "Workspaces can use templates and contain workpages and member collaboration."
    release_scope: "Cloud"
    accessed_at: "2026-08-27"
    status: source_verified

  - id: SRC-SAP-CENTRAL-ENTRY-POINT
    title: "Central Entry Point"
    publisher: "SAP"
    source_type: "architecture_guidance"
