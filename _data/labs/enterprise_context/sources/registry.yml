updated_at: "2026-08-14"
policy:
  description: >-
    Register sources before using them as evidence. Store bibliographic metadata,
    scope, access date, and verification state rather than copying large source texts.
  allowed_evidence_types:
    - documented_fact
    - expert_heuristic
    - reasoned_inference
    - synthetic_assumption
    - observed_example
  default_status: needs_review

sources: []
