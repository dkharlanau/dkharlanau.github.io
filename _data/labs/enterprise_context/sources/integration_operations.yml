scope: "SAP integration operations and recovery across AIF, IDoc, tRFC/qRFC/bgRFC, SAP Integration Suite, queues, retries, idempotency, dead-letter handling, observability, and business reconciliation"
policy: >-
  Primary SAP sources verify monitoring and reprocessing capabilities. The operating model is independently written and separates technical delivery from business completion.
  Retry, replay, and duplicate handling are treated as business-risk controls, not as generic buttons to press until the monitor turns green.

