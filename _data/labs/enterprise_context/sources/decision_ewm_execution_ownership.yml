claims:
- Warehouse tasks are EWM execution objects for warehouse movements.
- EWM receives goods-movement requests from S/4HANA and sends delivery confirmations for follow-on functions such as goods receipt and goods issue.
- Warehouse-task confirmation records executed warehouse movement details and exceptions.
