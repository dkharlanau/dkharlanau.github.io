  - id: SRC-SAP-CCM-AUTH
    title: "Authorization check logic during Condition Contract Settlement"
    publisher: "SAP"
    source_type: "support_documentation"
    url: "https://help.sap.com/docs/SUPPORT_CONTENT/ssm/3362944142.html"
    verifies:
      - "WB2R_SC and WB2R_SV are settlement transactions used in Condition Contract Settlement."
      - "Condition contract and organizational authorizations are checked during settlement."
    accessed_at: "2026-08-15"
    status: source_verified

  - id: SRC-SAP-CCM-CUSTOMIZING
    title: "How to use customer lists in CCM in S/4HANA"
    publisher: "SAP"
    source_type: "support_documentation"
    url: "https://help.sap.com/docs/SUPPORT_CONTENT/ssm/3362944140.html"
    verifies:
      - "Customizing is under Logistics - General -> Settlement Management -> Condition Contract Management -> Condition Contract Settlement."
      - "Contract type settings, field combinations, and business-volume determination profiles control selection behavior."
    accessed_at: "2026-08-15"
    status: source_verified

  - id: SRC-SAP-CCM-LEARNING
    title: "Explaining Condition Contract Management"
    publisher: "SAP"
    source_type: "learning_content"
    url: "https://learning.sap.com/courses/exploring-sap-s-4hana-settlement-management/explaining-condition-contract-management_afaedda8-fdf8-42cf-a6f4-abc8cc9c6dce"
    verifies:
      - "CCM is a core component of Settlement Management for subsequent settlement scenarios such as rebates, commissions, and royalties."
      - "The lifecycle connects agreement terms, eligible business volume, accrual calculation, settlement, and financial posting."
      - "Supported settlement types include delta accruals, partial settlement, final settlement, and delta settlement."
    accessed_at: "2026-08-25"
    status: source_verified

  - id: SRC-SAP-CCM-ACCRUALS
    title: "Accruals Processing"
    publisher: "SAP"
    source_type: "product_documentation"
    url: "https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/1f9d79fe780f4569a98575f3ef73ec8f/456bafaf76c04b90a17ae8aa94f5a930.html"
    verifies:
      - "Accruals can be posted with transactional documents such as billing documents or goods receipts."
      - "Accruals can also be posted in accumulated form by Delta Accruals Settlement based on relevant business volume."
      - "Settlement Management supports posting, updating, and reversing accruals."
    release_scope: "SAP S/4HANA 2025 FPS01"
    accessed_at: "2026-08-25"
    status: source_verified

  - id: SRC-SAP-CCM-CLASSIC-REBATE
    title: "Working with Settlement Management"
    publisher: "SAP"
    source_type: "learning_content"
    url: "https://learning.sap.com/courses/functions-innovations-in-sap-s-4hana-sales/working-with-settlement-management_dc9ca6aa-ad79-4047-9dae-e51c9ddfc906"
    verifies:
      - "Traditional SAP ERP rebate processing used the VBOX rebate index table."
      - "VBOX is no longer used for S/4HANA rebate processing and CCM replaces traditional rebate processing."
      - "Standard sales rebate examples use RES1 for rebate, REA1 for accruals, and RED1 in delta accrual settlement with pricing procedure A10006."
    accessed_at: "2026-08-25"
    status: source_verified

  - id: SRC-SAP-CCM-SETTLEMENT-DOCUMENT
    title: "Settlement Document"
    publisher: "SAP"
    source_type: "product_documentation"
    url: "https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/66f60a0b52da42d6a6d82607c65c413b/f7cfeac49a124078a70688318cfd2d37.html"
    verifies:
      - "Settlement processing creates one or more settlement documents according to condition contract settings."
      - "Settlement documents calculate rebate or accrual amounts with a separate pricing procedure."
      - "Settlement documents provide the link to financial accounting and journal entries."
    release_scope: "SAP S/4HANA 2025 FPS01"
    accessed_at: "2026-08-25"
    status: source_verified

