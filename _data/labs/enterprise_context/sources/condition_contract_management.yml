  - id: SRC-SAP-CCM-SETTLEMENT-TCODES
    title: "Settlement Management in Sales"
    publisher: "SAP"
    source_type: "product_documentation"
    url: "https://help.sap.com/docs/SAP_S4HANA_CLOUD/60a09f68f2444ceca31dcac2e7017945/febc903ba05b4da2a6b28dc799d79112.html"
