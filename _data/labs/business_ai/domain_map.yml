schema_version: "2.0"
reviewed_at: "2026-08-15"

principle: "Business AI is an enterprise capability map, not an SAP feature list. Start from a process decision or task, then choose the smallest useful AI pattern and connect it to the systems that own data, rules, and actions."

domains:
  - id: "sales-o2c"
    title: "Sales and Order-to-Cash"
    business_jobs:
      - "Recommend the next relevant product, offer, or seller action."
      - "Turn customer emails, PDFs, drawings, and purchase orders into structured quote or order proposals."
      - "Explain why a customer promise, price, allocation, or delivery changed."
      - "Reduce manual navigation across CRM, ERP, commerce, pricing, fulfillment, and finance."
    system_touchpoints:
      - "CRM and sales platforms such as Salesforce, Dynamics 365, SAP Sales, or Oracle CX"
      - "ERP order management such as SAP S/4HANA, Oracle Fusion, or Dynamics 365"
      - "commerce and CPQ"
      - "pricing, ATP, allocation, credit, and fulfillment services"
      - "customer and product master data"
      - "email, EDI, portals, APIs, and document channels"
    technology_families:
      - "guided recommendation and ranking"
      - "document and multimodal extraction"
      - "cross-system copilots and agents"
      - "retrieval and grounded explanation"
      - "workflow automation"
    lead_questions:
      - "Which values may AI propose, and which values must a deterministic business service calculate?"
      - "Does AI create a suggestion, a draft document, or a committed transaction?"
      - "How are customer, product, unit, price, availability, credit, and compliance validated?"
      - "What happens when matching confidence is low or systems disagree?"
      - "Do we measure speed only, or also correction rate, margin, service level, and customer impact?"
    case_ids:
      - "wipro-guided-selling"
      - "amd-sales-order-troubleshooter"
      - "lc-waikiki-smartbot"
      - "dataxstream-quote-order-ai"
      - "synthomer-agentic-order-intake"
      - "pharmaoverseas-joule-operations"

  - id: "procurement-p2p"
    title: "Procurement and Procure-to-Pay"
    business_jobs:
      - "Extract supplier documents and continue a controlled purchasing or invoice workflow."
      - "Compare confirmations, invoices, contracts, and purchase orders and route only material differences."
      - "Support sourcing, supplier research, and negotiation with grounded evidence."
      - "Answer cross-document procurement questions without manual navigation."
    system_touchpoints:
      - "ERP procurement such as SAP S/4HANA, Oracle Fusion, Dynamics 365, or Coupa-integrated backends"
      - "source-to-pay suites such as SAP Ariba or Coupa"
      - "supplier portals, email, EDI, PDFs, and contracts"
      - "supplier master data and risk data"
      - "invoice, payment, and accounting controls"
    technology_families:
      - "document AI and extraction"
      - "agentic exception management"
      - "semantic matching"
      - "supplier knowledge retrieval"
      - "workflow and approval automation"
    lead_questions:
      - "Which fields are extracted by AI and which rules validate them?"
      - "What difference is material enough to become a buyer or AP exception?"
      - "Can a low-confidence result post anything, or must it stop?"
      - "How are duplicates, tolerances, units, price differences, and date differences handled?"
      - "Do we measure touchless rate together with false acceptance and correction rate?"
    case_ids:
      - "frosta-touchless-invoices"
      - "western-sugar-invoices"
      - "lemvigh-muller-confirmations"
      - "lc-waikiki-smartbot"
      - "pharmaoverseas-joule-operations"

  - id: "planning-inventory"
    title: "Demand Planning, Supply Planning, and Inventory"
    business_jobs:
      - "Predict demand at the product and location level where the decision is made."
      - "Sense short-term demand changes and turn them into planning exceptions."
      - "Balance service, stock, capacity, and working capital."
      - "Explain plan changes and scenario trade-offs to planners."
    system_touchpoints:
      - "planning suites such as SAP IBP, Oracle Supply Chain Planning, Kinaxis, or Blue Yonder"
      - "ERP demand, supply, inventory, and order history"
      - "promotion, market, weather, channel, and external signals"
      - "product, location, calendar, and network master data"
    technology_families:
      - "time-series forecasting"
      - "machine learning and demand sensing"
      - "optimization and scenario planning"
      - "anomaly detection"
      - "planning copilots"
    lead_questions:
      - "What is the forecast and planning grain?"
      - "Which statistical or business baseline does the model beat?"
      - "How does model improvement change service level, stock, waste, or working capital?"
      - "Where can a planner override the model and is the override measured?"
      - "How are promotions, launches, seasonality, and structural breaks handled?"
    case_ids:
      - "cainz-demand-forecasting"
      - "forvia-ai-demand-planning"
      - "brf-daily-demand-sensing"
      - "pharmaoverseas-joule-operations"

  - id: "warehouse-logistics"
    title: "Warehouse, Transportation, and Intralogistics"
    business_jobs:
      - "Optimize routes, sequences, waves, slots, and allocations under operational constraints."
      - "Turn warehouse and production priorities into autonomous physical material movement."
      - "Detect delivery, labor, capacity, or congestion risk before service fails."
    system_touchpoints:
      - "WMS and EWM platforms"
      - "TMS and route-planning systems"
      - "ERP inventory and delivery data"
      - "telematics, IoT, maps, scanners, automation, AMR, and robot fleets"
      - "yard, labor, carrier, and production systems"
    technology_families:
      - "operations research and optimization"
      - "predictive ETA and risk models"
      - "computer vision"
      - "embodied AI and robotics"
      - "event-driven agents"
    lead_questions:
      - "Is this an optimization problem, a prediction problem, an AI reasoning problem, or a combination?"
      - "Which constraints are hard and must never be relaxed?"
      - "Who owns physical safety, task state, stock confirmation, and exception recovery?"
      - "What happens when robot, network, model, and warehouse-system state disagree?"
      - "Do we measure throughput together with accuracy, recovery time, safety, and service level?"
    case_ids:
      - "ups-orion"
      - "martur-fompak-embodied-intralogistics"
      - "pharmaoverseas-joule-operations"

  - id: "manufacturing-quality"
    title: "Manufacturing, Maintenance, and Quality"
    business_jobs:
      - "Detect quality problems before defective output continues through production."
      - "Predict equipment or process risk early enough to intervene."
      - "Support operators with current instructions, genealogy, and machine context."
      - "Optimize schedules and production decisions under constraints."
    system_touchpoints:
      - "MES and manufacturing operations systems"
      - "ERP production, quality, and maintenance"
      - "SCADA, IoT, machine historians, images, and sensor streams"
      - "PLM and engineering data"
      - "inspection, batch, serial, and genealogy data"
    technology_families:
      - "predictive maintenance"
      - "computer vision and defect detection"
      - "anomaly detection"
      - "production optimization"
      - "operator copilots"
    lead_questions:
      - "What confirmed label defines a defect or failure?"
      - "What is the cost of false acceptance versus false rejection?"
      - "Which action follows a model signal: inspect, stop, rework, scrap, maintain, or only inform?"
      - "How is the model connected to genealogy, batch, serial, equipment, and engineering context?"
      - "Does the KPI describe model accuracy or actual scrap, downtime, utilization, and quality cost?"
    case_ids:
      - "rolls-royce-quality-prediction"
      - "martur-fompak-embodied-intralogistics"

  - id: "finance"
    title: "Finance and Controlling"
    business_jobs:
      - "Match, classify, and explain financial transactions and exceptions."
      - "Support close, reconciliation, cash, planning, and variance analysis."
      - "Draft management commentary from governed financial data."
      - "Detect unusual transactions for review without replacing accounting controls."
    system_touchpoints:
      - "ERP finance and general ledger"
      - "EPM and planning platforms"
      - "treasury, banking, tax, consolidation, and close systems"
      - "data warehouses and semantic finance models"
    technology_families:
      - "classification and matching"
      - "anomaly detection"
      - "forecasting"
      - "grounded financial copilots"
      - "document extraction"
    lead_questions:
      - "Which numbers are source-system facts and which are model-generated explanations?"
      - "Can AI propose an entry, or may it post one?"
      - "How are segregation of duties, approvals, audit trail, and period controls preserved?"
      - "What materiality threshold defines a useful exception?"
      - "Can every narrative statement be traced to governed financial data?"
    case_ids: []

  - id: "hr-workforce"
    title: "HR and Workforce"
    business_jobs:
      - "Support recruiting, screening, scheduling, onboarding, and employee service."
      - "Find policy and employee information with role-aware access."
      - "Assist managers with workforce planning and routine administrative work."
    system_touchpoints:
      - "HCM platforms such as Workday, SAP SuccessFactors, Oracle HCM, or Dynamics 365 HR ecosystems"
      - "ATS, learning, payroll, time, scheduling, and employee service"
      - "identity, policy, document, and collaboration systems"
    technology_families:
      - "knowledge assistants"
      - "document and resume extraction"
      - "matching and ranking"
      - "workflow agents"
      - "workforce forecasting"
    lead_questions:
      - "Which decisions are legally or ethically unsuitable for autonomous AI?"
      - "How are bias, explainability, privacy, and sensitive attributes controlled?"
      - "Which employee data may the agent retrieve for this role?"
      - "Where is human review mandatory?"
      - "Do productivity gains preserve employee and candidate quality outcomes?"
    case_ids: []

  - id: "customer-service"
    title: "Customer Service and Field Service"
    business_jobs:
      - "Resolve repeat requests with current customer, product, policy, and case context."
      - "Summarize interactions and prepare next actions."
      - "Route, prioritize, and escalate cases."
      - "Support field technicians with manuals, asset history, and diagnostic evidence."
    system_touchpoints:
      - "CRM and customer service platforms"
      - "contact center, voice, email, chat, and messaging"
      - "knowledge bases and policy repositories"
      - "field service, installed-base, asset, and IoT data"
    technology_families:
      - "conversational AI"
      - "retrieval and grounded answers"
      - "case classification and routing"
      - "agent assist"
      - "autonomous service workflows"
    lead_questions:
      - "What evidence is required before the assistant may answer or act?"
      - "How are customer identity and permissions verified?"
      - "Which actions are read-only, prepared, approved, or automatic?"
      - "How is a no-evidence or conflicting-evidence state represented?"
      - "Do we measure deflection together with correctness, repeat contacts, satisfaction, and escalation quality?"
    case_ids:
      - "klarna-service-assistant"

  - id: "it-operations"
    title: "IT, Engineering, and Enterprise Operations"
    business_jobs:
      - "Triage incidents, alerts, change failures, and service requests."
      - "Search code, logs, runbooks, tickets, and architecture knowledge."
      - "Prepare controlled changes and automate repeat operational tasks."
      - "Generate and review software, tests, documentation, and infrastructure changes."
    system_touchpoints:
      - "ServiceNow, Jira, GitHub, GitLab, Azure DevOps, and observability platforms"
      - "CMDB, asset, identity, monitoring, log, and deployment systems"
      - "code repositories and CI/CD"
      - "cloud management and infrastructure APIs"
    technology_families:
      - "coding agents"
      - "incident and operations agents"
      - "RAG over runbooks and code"
      - "tool use and computer use"
      - "workflow automation"
    lead_questions:
      - "Can the agent only investigate, or can it change production state?"
      - "What approval and rollback path exists before a write?"
      - "How are tool permissions scoped to user, service, environment, and task?"
      - "What is the stop condition when evidence is insufficient?"
      - "Can we replay the trajectory that produced a change?"
    case_ids: []

  - id: "legal-risk-compliance"
    title: "Legal, Risk, and Compliance"
    business_jobs:
      - "Extract obligations, clauses, entities, and risks from contracts and policies."
      - "Compare documents against approved standards and route deviations."
      - "Support investigation and compliance research with cited evidence."
      - "Monitor policy or regulatory change and map it to controlled obligations."
    system_touchpoints:
      - "contract lifecycle management"
      - "GRC and risk platforms"
      - "policy, regulatory, legal, and case repositories"
      - "identity, records management, and audit systems"
    technology_families:
      - "document intelligence"
      - "retrieval and legal research"
      - "classification and clause matching"
      - "risk scoring"
      - "human-review workflows"
    lead_questions:
      - "Which output is legal advice, business support, or only document extraction?"
      - "What evidence and citation are mandatory?"
      - "How are privilege, confidentiality, retention, and jurisdiction handled?"
      - "Which decisions always require a qualified human reviewer?"
      - "How are model changes validated against known legal and compliance cases?"
    case_ids: []

  - id: "master-data"
    title: "Master Data, Data Quality, and Governance"
    business_jobs:
      - "Give AI stable identities for customer, supplier, product, employee, account, and asset data."
      - "Reduce duplicate, inconsistent, and weakly governed data before it enters automated decisions."
      - "Match external language to governed enterprise objects without allowing a model to invent identity."
    system_touchpoints:
      - "MDM and governance platforms such as SAP MDG, Informatica, Reltio, Semarchy, or custom golden-record services"
      - "ERP, CRM, HCM, PLM, and data-platform master records"
      - "key mapping, data quality, workflow, and replication"
    technology_families:
      - "entity resolution and matching"
      - "data-quality rules"
      - "ML-assisted duplicate detection"
      - "classification and enrichment"
      - "governed workflows"
    lead_questions:
      - "What is the system of record for identity?"
      - "Can AI suggest a match, and who approves a new or changed master record?"
      - "How are duplicates, aliases, units, descriptions, and cross-system keys governed?"
      - "Which data-quality rules are deterministic and which matching steps benefit from ML?"
      - "Can every downstream AI decision be traced to the master-data version it used?"
    case_ids:
      - "adani-master-data-foundation"
      - "synthomer-agentic-order-intake"
      - "wipro-guided-selling"

  - id: "knowledge-productivity"
    title: "Enterprise Knowledge and Productivity"
    business_jobs:
      - "Find relevant enterprise knowledge with permissions and citations."
      - "Summarize meetings, documents, research, and long conversations."
      - "Prepare drafts, analysis, and follow-up work without losing source context."
      - "Connect knowledge across email, documents, collaboration, CRM, ERP, and project systems."
    system_touchpoints:
      - "Microsoft 365, Google Workspace, Slack, Teams, SharePoint, Drive, and Notion-like knowledge systems"
      - "enterprise search and document repositories"
      - "CRM, ERP, project, engineering, and analytics systems"
    technology_families:
      - "enterprise search and RAG"
      - "research agents"
      - "meeting and writing copilots"
      - "semantic retrieval"
      - "cross-system agent orchestration"
    lead_questions:
      - "Are permissions enforced before retrieval, not only after generation?"
      - "What source and citation quality is required?"
      - "How fresh must the knowledge be?"
      - "Which actions may the assistant take after producing an answer?"
      - "How is confidential information prevented from crossing user or business boundaries?"
    case_ids:
      - "morgan-stanley-assistant"
