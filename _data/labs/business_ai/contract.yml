    to: BusinessDomain
  - id: process-has-stage
    from: EndToEndProcess
    to: ProcessStage
  - id: process-uses-pattern
    from: EndToEndProcess
    to: Pattern
  - id: stage-uses-pattern
    from: ProcessStage
    to: Pattern
  - id: stage-maps-to-capability
    from: ProcessStage
    to: EnterpriseCapability
  - id: domain-maps-to-capability
    from: BusinessDomain
    to: EnterpriseCapability
  - id: pattern-needs-technology
    from: Pattern
    to: TechnologyFamily
  - id: platform-provides-technology
    from: EnterprisePlatform
    to: TechnologyFamily
  - id: stage-has-control
    from: ProcessStage
    to: ControlPoint
  - id: domain-supports-case
    from: BusinessDomain
    to: BusinessAICase
  - id: company-implements-case
    from: Company
    to: BusinessAICase
  - id: case-applies-to-process
    from: BusinessAICase
    to: EndToEndProcess
  - id: case-uses-pattern
    from: BusinessAICase
    to: Pattern
  - id: case-uses-platform
    from: BusinessAICase
    to: EnterprisePlatform
  - id: case-reports-metric
    from: BusinessAICase
    to: Metric
  - id: case-has-outcome
    from: BusinessAICase
    to: ScenarioOutcome
  - id: case-has-limitation
    from: BusinessAICase
    to: Limitation
  - id: metric-supported-by-evidence
