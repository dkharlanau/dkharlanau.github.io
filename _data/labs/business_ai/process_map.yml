schema_version: "1.0"
reviewed_at: "2026-08-15"

principle: "A domain owns capabilities. A process connects work across roles and systems. Business AI should be mapped to a concrete process step, decision, exception, or handoff."

processes:
  - id: "lead-to-cash"
    title: "Lead-to-Cash"
    domains: ["sales-o2c", "customer-service", "finance"]
    stages:
      - "lead and opportunity"
      - "solution and offer"
      - "quote and pricing"
      - "order capture"
      - "availability and promise"
      - "delivery and fulfillment"
      - "billing and receivables"
      - "returns and claims"
    ai_jobs:
      - "lead and account research"
      - "next-best action and recommendation"
      - "quote and order extraction"
      - "product and customer matching"
      - "commitment and exception explanation"
      - "collections prioritization"
      - "return and claim triage"
    pattern_ids:
      - "guided-sales-recommendation"
      - "quote-to-order-intelligence"
      - "cross-system-process-copilot"
      - "agentic-exception-management"
    technology_families:
      - "document-intelligence"
      - "knowledge-rag-search"
      - "agent-runtime-orchestration"
      - "workflow-rpa-process"
      - "predictive-ml"
    control_points:
      - "customer and product identity"
      - "pricing"
      - "availability and allocation"
      - "credit"
      - "tax and compliance"
      - "posting and billing"

  - id: "source-to-pay"
    title: "Source-to-Pay"
    domains: ["procurement-p2p", "finance", "master-data"]
    stages:
      - "demand and requisition"
      - "supplier discovery"
      - "sourcing and negotiation"
      - "contract and catalog"
      - "purchase order"
      - "supplier confirmation"
      - "receipt and service entry"
      - "invoice"
      - "payment"
    ai_jobs:
      - "supplier and market research"
      - "document extraction"
      - "contract comparison"
      - "confirmation and invoice exception detection"
      - "buyer and AP copilot"
      - "supplier risk summarization"
    pattern_ids:
      - "document-to-workflow"
      - "agentic-exception-management"
      - "cross-system-process-copilot"
    technology_families:
      - "document-intelligence"
      - "knowledge-rag-search"
      - "agent-runtime-orchestration"
      - "workflow-rpa-process"
      - "integration-tools-protocols"
    control_points:
      - "supplier identity"
      - "approval limits"
      - "price and quantity tolerances"
      - "duplicate invoice controls"
      - "segregation of duties"
      - "payment authorization"

  - id: "forecast-to-fulfill"
    title: "Forecast-to-Fulfill"
    domains: ["planning-inventory", "warehouse-logistics", "manufacturing-quality", "sales-o2c"]
    stages:
      - "demand sensing"
      - "forecast"
      - "supply and capacity plan"
      - "inventory target"
      - "production or procurement plan"
      - "warehouse execution"
      - "transport execution"
      - "customer fulfillment"
    ai_jobs:
      - "forecasting"
      - "anomaly and demand sensing"
      - "inventory risk prediction"
      - "scenario explanation"
      - "routing and allocation optimization"
      - "delivery risk prediction"
    pattern_ids:
      - "forecast-and-replenish"
      - "operations-optimization"
      - "cross-system-process-copilot"
    technology_families:
      - "predictive-ml"
      - "optimization"
      - "data-semantic-layer"
      - "enterprise-copilot-ux"
      - "eval-observability"
    control_points:
      - "planning grain and horizon"
      - "hard capacity constraints"
      - "inventory policy"
      - "planner override"
      - "service-level target"
      - "execution confirmation"

  - id: "plan-to-produce"
    title: "Plan-to-Produce"
    domains: ["manufacturing-quality", "planning-inventory", "warehouse-logistics"]
    stages:
      - "production planning"
      - "detailed scheduling"
      - "material staging"
      - "production execution"
      - "quality inspection"
      - "yield and scrap analysis"
      - "completion and receipt"
    ai_jobs:
