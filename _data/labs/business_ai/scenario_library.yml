  company: Nichirei Logistics Group
  domain: Warehouse Operations
  process: Cold-warehouse camera tracking of forklifts and roll containers
  pattern_ids:
  - vision-to-workflow-verification
  technology:
  - AWS computer vision services
  - camera video analytics
  - Automagi solution
  what_happened: Nichirei ran a proof of concept that used warehouse camera video to identify and track forklifts and roll
    containers as part of a broader warehouse digitization effort.
  reported_results:
  - The proof of concept reported a 97% tracking success rate.
  good_controls:
  - The company explicitly ran a proof of concept and accuracy validation before broader rollout.
  - The technical KPI is attached to a concrete physical warehouse task.
  limits:
  - The public case is an older pilot and does not publish a realized labor, safety, throughput, or inventory KPI after production
    rollout.
  - A 97% tracking metric does not by itself prove warehouse value or safe operational automation.
  lesson: Technical accuracy is only the first gate for warehouse vision. The production case needs a second metric such as
    labor saved, search time, inventory accuracy, safety, or throughput.
  evidence_grade: C
  source_ids:
  - nichirei-aws
failure_patterns:
- id: fp-authoritative-hallucination
  title: Authoritative hallucination
  signal: The assistant invents policy, price, eligibility, contract meaning, or system state and presents it as final.
  controls:
  - retrieval
  - citations
  - system-of-record API
  - no-answer state
  - human escalation
  examples:
  - air-canada-policy-chatbot
- id: fp-biased-history
  title: Biased history becomes a target
  signal: The model learns historical outcomes as if they represented the desired future policy.
  controls:
  - fairness tests
  - proxy analysis
  - segment metrics
  - appeals
  - human review
  examples:
  - amazon-recruiting-bias
- id: fp-bad-rule-at-scale
  title: Bad rule at machine speed
  signal: A deterministic or AI-assisted rule automates a policy that should not exist.
  controls:
  - policy review
  - legal review
  - segment monitoring
  - exception path
  examples:
  - itutorgroup-age-filter
- id: fp-prediction-to-capital
  title: Prediction directly controls capital
  signal: Forecast error immediately creates inventory, pricing, credit, or financial exposure.
  controls:
  - confidence-aware limits
  - stress tests
  - portfolio caps
  - human approval
  - stop-loss conditions
  examples:
  - zillow-offers-forecast-execution
- id: fp-demo-environment-gap
  title: Demo environment is cleaner than reality
  signal: Production input contains accents, noise, long documents, edge cases, missing data, or adversarial content not represented
    in testing.
  controls:
  - realistic eval set
  - shadow mode
  - canary rollout
  - fallback
  - production monitoring
  examples:
  - mcdonalds-ibm-voice-ordering
- id: fp-metric-tunnel-vision
  title: One KPI wins and the process loses
  signal: Automation, deflection, or cost improves while quality, trust, repeat contacts, or long-term value degrades.
  controls:
  - balanced scorecard
  - quality guardrail KPI
  - human channel
  - cohort monitoring
  examples:
  - klarna-ai-service-course-correction
- id: fp-claims-ahead-of-evidence
  title: Claims are ahead of evidence
  signal: The product is sold as equivalent to an expert or as autonomous before that capability has been tested.
  controls:
  - explicit scope
  - expert evaluation
  - claims review
  - documented limitations
  examples:
  - donotpay-ai-lawyer-claims
- id: fp-context-is-not-grounding
  title: The document fits in context, so the model must know it
  signal: A long policy, rulebook, contract, or manual is sent to a model and the team assumes complete, stable recall without
    clause-level evidence.
  controls:
  - retrieval by clause
  - mandatory citations
  - coverage-oriented evals
  - no-answer state
  - expert review for consequential guidance
  examples:
  - cando-rail-safety-knowledge
- id: fp-model-kpi-is-not-business-kpi
  title: The model KPI becomes the business case
  signal: Accuracy, tracking success, latency, or adoption looks strong, but no one measures whether the end-to-end process,
    cost, service level, risk, or customer outcome improved.
  controls:
  - business baseline
  - end-to-end KPI
  - cost of error
  - pilot exit criteria
  - production follow-up measurement
  examples:
  - nichirei-warehouse-vision-pilot
  - siemens-field-service-report-pilot
