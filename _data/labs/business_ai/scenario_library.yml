schema_version: '1.0'
reviewed_at: '2026-08-15'
title: Enterprise Business AI Scenario Library
purpose: Compare strong implementations, mixed results, and failures by business process, architecture choice, controls, and
  evidence.
reading_rules:
- Do not call a case successful only because a vendor published it. Look for a business KPI and a clear process boundary.
- Do not call a case an AI failure when the real failure is rollout, economics, capacity, policy, or governance.
- Separate model quality from process quality. A good model inside a bad operating model still creates a bad result.
- For high-impact decisions, measure errors by segment and consequence, not only average accuracy.
- A pilot that is stopped can still be useful evidence if it shows where a pattern does not fit.
best_practices:
- id: bp-business-kpi-first
  title: Start with the business KPI
  problem: Teams optimize model metrics that may not improve the real process.
  practice: Define the business decision, baseline, target KPI, and cost of error before choosing the model or platform.
  measure:
  - cycle time
  - touchless rate
  - correction rate
  - service level
  - cost per completed case
  - business loss from wrong decisions
  source_ids:
  - nist-ai-rmf-genai
  - aws-agentcore-best-practices
- id: bp-bounded-autonomy
  title: Bound autonomy by consequence
  problem: The same agent design is often used for low-risk answers and high-risk actions.
  practice: Keep irreversible, financial, legal, safety, employment, and master-data writes behind deterministic controls
    or explicit approval.
  measure:
  - autonomous completion rate
  - approval rate
  - wrong-action rate
  - rollback rate
  - escalation quality
  source_ids:
  - microsoft-responsible-agents
  - aws-agentic-guardrails
- id: bp-eval-before-scale
  title: Evaluate before scale
  problem: A demo can look strong while edge cases, wrong tool calls, and no-answer behavior remain untested.
  practice: Create a representative evaluation set before rollout. Add production failures back into the set and rerun it
    after model, prompt, retrieval, or tool changes.
  measure:
  - task success
  - groundedness
  - tool selection accuracy
  - false acceptance
  - false rejection
  - regression rate
  source_ids:
  - openai-evals
  - aws-agentcore-evaluations
  - google-agent-evaluation
- id: bp-source-of-truth
  title: Keep the system of record outside the model
  problem: A language model can sound authoritative while inventing policy, price, identity, or state.
  practice: Retrieve current governed data and use deterministic APIs for values that already have an authoritative owner.
    The model explains or proposes; the system of record decides.
  measure:
  - unsupported-answer rate
  - citation coverage
  - source freshness
  - master-data match confidence
  - policy mismatch rate
  source_ids:
  - nist-ai-rmf-genai
  - air-canada-chatbot
- id: bp-no-answer-escalation
  title: Design the no-answer path
  problem: Many assistants are optimized to always answer, even when evidence is weak.
  practice: Make insufficient evidence, low confidence, conflict, and missing authorization explicit stop states with a clear
    human handoff.
  measure:
  - safe refusal precision
  - escalation rate
  - repeat contact rate
  - wrong confident answer rate
  source_ids:
  - microsoft-responsible-agents
  - aws-agentcore-best-practices
- id: bp-shadow-canary
  title: Scale through shadow and canary stages
  problem: A model can behave differently on real traffic, accents, documents, seasonal data, and operational exceptions.
  practice: Observe the AI beside the current process first, then allow a small controlled share of production work before
    wider automation.
  measure:
  - difference from human decision
  - exception rate
  - segment accuracy
  - production drift
  - rollback trigger
  source_ids:
  - nist-ai-rmf-genai
  - aws-bedrock-start-small
- id: bp-full-loop-economics
  title: Measure the whole operating loop
  problem: Model accuracy can improve while the business loses money because capacity, inventory, rework, latency, or downstream
    operations cannot absorb the decisions.
  practice: Evaluate the AI together with workflow capacity, human effort, downstream cost, working capital, and the cost
    of wrong actions.
  measure:
  - end-to-end cost
  - working capital
  - inventory exposure
  - rework
  - throughput
  - loss severity
  source_ids:
  - zillow-2021-10q
  - nist-ai-rmf-genai
- id: bp-fairness-by-segment
  title: Test fairness by segment
  problem: Average accuracy can hide systematic harm to a protected or operationally important group.
  practice: For people decisions, compare outcomes across relevant groups, inspect proxy features, and keep a review path
    for disputed decisions.
  measure:
  - selection-rate differences
  - false negative by group
  - false positive by group
  - appeal outcome
  - manual override rate
  source_ids:
  - eeoc-itutorgroup
  - amazon-recruiting-reuters
  - nist-ai-rmf-genai
- id: bp-human-ai-routing
  title: Route by complexity and consequence
  problem: Customer and employee service designs often force a false choice between full automation and full human handling.
  practice: Let AI handle routine, well-bounded work and route ambiguous, emotional, high-value, or high-consequence cases
    to a person with the collected context attached.
  measure:
  - autonomous resolution rate
  - handoff success
  - repeat contact rate
  - customer satisfaction
  - human handling time after handoff
  source_ids:
  - verizon-reuters-hybrid
  - klarna-reuters-course-correction
- id: bp-pilot-exit-criteria
  title: Define pilot exit criteria before the demo
  problem: A technically impressive pilot can continue indefinitely because nobody agreed what production success means.
  practice: Before the pilot starts, define the minimum business KPI, quality threshold, exception rate, operating cost, control
    evidence, and scale condition required to move forward. A stopped pilot can be a successful decision.
  measure:
  - business KPI delta
  - technical quality threshold
  - exception rate
  - unit economics
  - control failures
  - production readiness
  source_ids:
  - siemens-field-service-microsoft
  - nichirei-aws
scenarios:
- id: amazon-fintech-regulatory-contract-review
  status: strong_pattern
  company: Amazon Finance Technology
  domain: Finance, Tax, Legal, and Compliance
  process: Regulatory change monitoring and contract review
  pattern_ids:
  - enterprise-knowledge-retrieval
  - document-to-workflow
  technology:
  - Amazon Bedrock
  - Amazon SageMaker embeddings
  - Amazon OpenSearch Service
  - Amazon S3
  what_worked: Regulatory updates are searched, grouped, summarized, and reviewed by tax experts. Contract review uses indexed
    documents and AI-assisted interpretation.
  reported_results:
  - 92% faster time to regulatory insight, from 26 minutes to 2 minutes per update.
  - 80% reduction in contract analysis time.
  - Tax experts approved 80% of suggested titles, summaries, and impact predictions.
  - Contract review accuracy reported above 90%.
  good_controls:
  - Expert review remains in the regulatory decision loop.
  - Retrieval and document indexing keep source evidence available.
  - The use case measures process time, not only model quality.
  limits:
  - Results are company/provider reported.
  - Public material does not provide the complete false-positive and false-negative distribution.
  lesson: Good enterprise GenAI often compresses evidence for an expert instead of replacing the expert decision.
  evidence_grade: B
  source_ids:
  - amazon-fintech-aws
- id: chime-call-summary
  status: strong_pattern
  company: Chime Financial
  domain: Customer Service
  process: Call summarization and after-call work
  pattern_ids:
  - conversation-resolution-automation
  technology:
  - Amazon Bedrock
  - Anthropic Claude
  - ChimeCore
  what_worked: AI creates call summaries so agents can focus on the conversation and reuse the summary during later contacts.
  reported_results:
  - More than 250,000 hours saved per year.
  - 18 seconds lower average agent handling time.
  - Five-point increase in net promoter score.
  - About $700,000 in annual efficiency gains reported.
  good_controls:
  - The AI prepares documentation rather than making a financial decision for the customer.
  - The tool was tested before production rollout.
  - Customer experience was measured together with efficiency.
  limits:
  - Results are company/provider reported.
  - The public case does not publish detailed summary-error rates.
  lesson: A narrow assistive task can create value without giving the model authority over the business transaction.
  evidence_grade: B
  source_ids:
  - chime-aws
- id: microsoft-hr-case-copilot
  status: strong_pattern
  company: Microsoft HR
  domain: Human Resources
  process: Employee HR case management
  pattern_ids:
  - enterprise-knowledge-retrieval
  - conversation-resolution-automation
  technology:
  - Dynamics 365 Customer Service
  - Copilot
  - unified HR knowledge base
  what_worked: HR advisors use case summaries, draft emails, and knowledge assistance inside the case workflow.
  reported_results:
  - 20% increase in employee service case throughput.
  - 72% monthly active user adoption for Dynamics 365.
  - 47% daily active user adoption.
  good_controls:
  - The solution assists HR advisors instead of autonomously deciding employee cases.
  - Sensitive HR data stays inside an enterprise case-management context.
  - Adoption and satisfaction are measured in addition to throughput.
  limits:
  - This is a Microsoft-on-Microsoft customer story.
  - Public material does not publish case-level correctness statistics.
  lesson: For HR, assistance around knowledge and communication is a lower-risk starting point than automated employment decisions.
  evidence_grade: B
  source_ids:
  - microsoft-hr-copilot
- id: servicenow-internal-agentic-it
  status: strong_pattern
  company: ServiceNow
  domain: IT Operations and Employee Service
  process: Software provisioning and routine IT support
  pattern_ids:
  - agentic-exception-management
  technology:
  - ServiceNow AI Platform
  - AI Agents
  - workflow and service-management controls
  what_worked: Agents automate routine provisioning and support tasks inside a workflow platform that already owns requests,
    approvals, and service state.
  reported_results:
  - 97% of software provisioning requests automated.
  - Nearly 40% reduction in service desk volume.
  - 85% of routine internal IT support requests autonomously solved.
  - 50% faster resolution for a reported class of complex support cases.
  good_controls:
  - Agent actions sit inside an existing service-management workflow.
  - The platform already has identity, request state, and operational records.
  limits:
  - Results are ServiceNow's own internal and customer-reported figures.
  - Public material does not expose the detailed exception or rollback distribution.
  lesson: Agentic automation fits better when the workflow already has typed requests, ownership, permissions, and recoverable
    state.
  evidence_grade: B
  source_ids:
  - servicenow-agentic-workforce
- id: klarna-ai-service-course-correction
  status: mixed_result
  company: Klarna
  domain: Customer Service
  process: Conversational service automation
  linked_case_id: klarna-service-assistant
  what_worked: Early deployment reported strong automation, speed, and repeat-contact metrics.
  what_changed: Later management commentary said the company had over-indexed on AI and cost cutting and was restoring more
    human service capacity.
  failure_mode: 'Optimization target became too narrow: cost and automation were easier to measure than service quality over
    time.'
  lesson: Do not treat deflection or FTE-equivalent capacity as the final KPI. Keep service quality, repeat contacts, escalation
    quality, and human-channel availability in the scorecard.
  evidence_grade: B
  source_ids:
  - klarna-openai
  - klarna-reuters-course-correction
- id: air-canada-policy-chatbot
  status: failure
  company: Air Canada
  domain: Customer Service and Policy
  process: Customer policy guidance
  pattern_ids:
  - conversation-resolution-automation
  what_failed: A website chatbot gave incorrect information about applying a bereavement fare after travel. A British Columbia
    tribunal found Air Canada liable for negligent misrepresentation.
  failure_mode: The conversational layer was allowed to present policy as authoritative without reliable source-of-truth control.
  missing_controls:
  - authoritative policy retrieval
  - conflict detection between chatbot answer and published policy
  - no-answer or escalation path for uncertain policy
  - ownership of chatbot content as company content
  lesson: A chatbot is not a separate legal or operational entity. If it speaks for the company, the company owns the answer.
  evidence_grade: A
  source_ids:
  - air-canada-chatbot
- id: amazon-recruiting-bias
  status: failure
  company: Amazon
  domain: Human Resources
  process: Candidate screening
  what_failed: An experimental recruiting model learned patterns from historical resumes that reflected a male-dominated technical
    workforce and penalized signals associated with women. Amazon abandoned the system for hiring decisions.
  failure_mode: Historical success data encoded an existing imbalance, while proxy features reproduced the bias even without
    an explicit gender field.
  missing_controls:
  - fairness evaluation by group before operational use
  - proxy-feature review
  - clear decision boundary between ranking assistance and hiring decision
  lesson: Historical outcomes are not neutral labels. In people decisions, a model can reproduce the organization's past faster
    than the organization can correct it.
  evidence_grade: B
  source_ids:
  - amazon-recruiting-reuters
- id: itutorgroup-age-filter
  status: failure
  company: iTutorGroup
  domain: Human Resources
  process: Online tutor application screening
  what_failed: The EEOC said application software automatically rejected women aged 55 or older and men aged 60 or older,
    rejecting more than 200 qualified applicants. The companies settled the discrimination suit for $365,000 plus other relief.
  failure_mode: This was an automated decision-rule failure, not a mysterious model hallucination. The discriminatory policy
    was encoded directly into software.
  missing_controls:
  - legal review of automated eligibility rules
  - segment outcome monitoring
  - appeal and human-review path
  lesson: Not every AI-era failure needs a complex model. Deterministic automation can scale a bad rule just as efficiently.
  evidence_grade: A
  source_ids:
  - eeoc-itutorgroup
- id: zillow-offers-forecast-execution
  status: failure
  company: Zillow Group
  domain: Finance, Pricing, and Operations
  process: Automated home valuation, buying, inventory holding, and resale
  what_failed: Zillow wound down Zillow Offers after home-price unpredictability, capacity constraints, and operational challenges
    created unacceptable earnings and balance-sheet volatility. Its 2021 filing reported a $304.4 million inventory write-down
    related to homes purchased above updated estimates of future selling prices.
  failure_mode: Forecast uncertainty was coupled directly to capital-intensive execution and inventory risk. Operational capacity
    and market volatility amplified forecast error.
  missing_controls:
  - risk limits tied to forecast uncertainty
  - capacity-aware buying limits
  - stress tests for regime change
  - portfolio-level loss limits and rapid stop conditions
  lesson: Prediction is not the same as a safe decision. The cost of forecast error depends on how much capital and irreversible
    action sits behind it.
  evidence_grade: A
  source_ids:
  - zillow-2021-10q
  - zillow-2021-results
- id: mcdonalds-ibm-voice-ordering
  status: mixed_result
  company: McDonald's
  domain: Customer Operations
  process: Drive-through voice order taking
  what_happened: McDonald's ended its IBM automated order-taking test at more than 100 restaurants in 2024 without expanding
    that implementation, while saying voice ordering still had future potential.
  failure_mode: The pilot showed that noisy real-world voice input, accents, correction loops, and order accuracy are harder
    than a controlled conversational demo.
  missing_controls:
  - strong confirmation before committing the basket
  - fast human takeover when speech confidence or correction loops degrade
  - segment testing across accents, noise, and menu complexity
  lesson: A stopped pilot is useful evidence. Do not scale a conversational pattern until the environment, not only the model,
    is inside the evaluation set.
  evidence_grade: B
  source_ids:
  - mcdonalds-aot
- id: donotpay-ai-lawyer-claims
  status: failure
  company: DoNotPay
  domain: Legal Services
  process: Automated legal guidance and document generation
  what_failed: The US Federal Trade Commission alleged that DoNotPay made claims that its AI service could substitute for
    a human lawyer without testing whether the output matched that level of expertise.
  failure_mode: Capability claims exceeded the evidence and evaluation behind the product.
  missing_controls:
  - domain-expert validation
  - defined scope and limitations
  - evidence for equivalence claims
  - clear escalation to qualified legal professionals
  lesson: Do not market a probabilistic assistant as a professional substitute unless the evidence actually supports that
    claim.
  evidence_grade: A
  source_ids:
  - ftc-donotpay
- id: sun-finance-id-fraud-pipeline
  status: strong_pattern
  company: Sun Finance
  domain: Financial Services, Risk, and Customer Onboarding
  process: Identity document extraction and fraud detection
  pattern_ids:
  - document-to-workflow
  technology:
  - Amazon Textract
  - Amazon Rekognition
  - Amazon Bedrock
  - Claude Sonnet 4
  - Amazon Titan Multimodal Embeddings
  - Amazon S3 Vectors
  - AWS Step Functions
  - AWS Lambda
  what_worked: The design separated OCR, LLM structuring, validation, visual fraud analysis, vector similarity, and workflow
    orchestration instead of asking one model to do every job.
  reported_results:
  - ID extraction accuracy improved from 79.73% to 90.80% on 585 ID images.
  - Document type classification reached 96.40%.
  - Average ID processing time was 4.42 seconds.
  - Per-document ID extraction cost fell 91% versus the previous solution.
  - Fraud detection reported 81% accuracy, 59% recall, and 83% specificity.
  good_controls:
  - Specialized OCR runs before LLM structuring.
  - Validation and Rekognition fallback improve weak fields.
  - Fraud methods run in parallel and combine scores.
  - The published evaluation includes recall and specificity, not only average accuracy.
  limits:
  - Results are company/provider reported.
  - Fraud recall of 59% means the pipeline still misses a material share of fraud and must sit inside a wider control system.
  - Some operational savings in the source are projections after production launch.
  lesson: Use the best component for each uncertainty. A composed pipeline can outperform a general model, and residual risk
    should stay visible in the KPI set.
  evidence_grade: B
  source_ids:
  - sun-finance-aws-2026
- id: ellby-invoice-automation
  status: strong_pattern
  company: Ellby
  domain: Finance and Accounts Payable
  process: Invoice extraction, validation, and onboarding
  pattern_ids:
  - document-to-workflow
  technology:
  - Amazon Bedrock
  - generative AI prompts
  - invoice automation workflow
  what_worked: Generative extraction replaced brittle vendor-specific OCR templates, reducing setup and maintenance work while
    leaving invoice processing inside a controlled workflow.
  reported_results:
  - More than 94% of invoice processing automated, up from below 60%.
  - More than 300 hours per month saved in manual maintenance.
  - Customer onboarding time reduced by more than 55%.
  good_controls:
  - The company tested multiple cloud approaches against real invoice performance before selecting the platform.
  - The AI is embedded in an existing accounts-payable automation product rather than acting as an independent financial authority.
  limits:
  - Results are company/provider reported.
  - The public case does not publish field-level false-acceptance rates or downstream posting error rates.
  lesson: Document AI creates value when it removes template maintenance and manual exceptions, but finance controls still
    belong to the transaction workflow.
  evidence_grade: B
  source_ids:
  - ellby-aws
- id: us-venture-finance-reconciliation
  status: strong_pattern
  company: U.S. Venture / U.S. AutoForce
  domain: Finance
  process: Bank and credit-card reconciliation
  pattern_ids:
  - cross-system-operational-copilot
  technology:
  - Microsoft 365 Copilot for Finance
  - Microsoft Excel
  - Dynamics 365
  what_worked: The finance copilot was applied to a recurring reconciliation task with governed finance data instead of a
    vague general-productivity goal.
  reported_results:
  - More than 30 accounting hours saved each month.
  - A bank reconciliation process was reported to take about 80% less time.
  - The initial setup took four weeks.
  good_controls:
  - The use case has a deterministic financial record and a repeatable before/after process.
  - The copilot assists reconciliation work rather than owning the accounting system of record.
  limits:
  - Results are Microsoft/customer reported.
  - The public case does not provide independent error-rate or audit-quality measurements.
  lesson: Finance AI is easier to defend when it attacks a repetitive reconciliation step with an authoritative ledger and
    a measurable baseline.
  evidence_grade: B
  source_ids:
  - us-venture-microsoft
- id: verizon-hybrid-customer-service
  status: strong_pattern
  company: Verizon
  domain: Customer Service and Sales
  process: Call triage, agent knowledge assistance, routine self-service, and complex human support
  pattern_ids:
  - enterprise-knowledge-retrieval
  - conversation-resolution-automation
  technology:
  - Google Gemini
  - Google Cloud AI
  - enterprise knowledge retrieval
  what_worked: AI was used to retrieve information and assist service representatives, while routine requests could move to
    self-service and complex or empathy-heavy cases remained with people.
  reported_results:
  - Verizon said its AI assistant used about 15,000 internal documents and reduced call handling time.
  - In April 2025 Verizon reported a nearly 40% increase in sales associated with the assisted-service rollout.
  - By late 2025 the company still emphasized human handling for complex customer issues.
  good_controls:
  - AI augments human representatives for complex service rather than forcing complete automation.
  - Routine and complex work follow different routes.
  - Human access remains part of the operating model.
  limits:
  - Business results are based on company statements reported by Reuters.
  - The public evidence does not isolate how much of the sales change came from AI versus other operating changes.
  lesson: The mature customer-service pattern is often hybrid. AI handles triage, retrieval, and routine work; people handle
    ambiguity, empathy, negotiation, and exceptions.
  evidence_grade: B
  source_ids:
  - verizon-reuters-assist
  - verizon-reuters-hybrid
- id: cando-rail-safety-knowledge
  status: failure
  company: Cando Rail and Terminals
  domain: Safety, Operations, and Knowledge Management
  process: Employee access to rail safety rules, reports, and training material
  what_failed: An internal chatbot could not consistently and correctly summarize the roughly 100-page Canadian Rail Operating
    Rules. Reuters reported that it sometimes forgot or misinterpreted rules and sometimes invented them. Cando paused the
    project.
  failure_mode: The project treated a safety rulebook as a summarization problem without evidence that every important rule
    could be retrieved and reproduced reliably.
  missing_controls:
  - rule-level evaluation set
  - mandatory citations to the authoritative rule text
  - explicit no-answer state
  - expert verification for safety guidance
  - coverage tests for information buried inside long documents
  lesson: Putting a document inside a model context is not the same as grounding. Safety knowledge needs clause-level retrieval,
    traceable evidence, and tests that prove important rules are not silently skipped.
  evidence_grade: B
  source_ids:
  - cando-reuters-2025
- id: microsoft-global-collections-ai
  status: strong_pattern
  company: Microsoft Global Collections
  domain: Finance, Treasury, and Accounts Receivable
  process: Cash collection, payment matching, case prioritization, routing, and customer inquiry handling
  pattern_ids:
  - cross-system-process-copilot
  - agentic-exception-management
  technology:
  - SAP
  - Microsoft Dynamics 365
  - Microsoft IQ
  - Copilot and AI agents
  - predictive models
  what_worked: The team first consolidated fragmented finance and collection data, standardized workflows, and only then layered
    AI into prioritization, matching, routing, summarization, and drafting.
  reported_results:
  - Payment matching accuracy improved from 40% to 90%.
  - 98% of payments could be applied within 48 hours.
  - Call preparation time fell 40%.
  - Automatic cash applications doubled.
  - Customer inquiry resolution accelerated 2.5x.
  - Inquiry handling time fell by up to 60%.
  - Hundreds of thousands of hours were reported as unlocked annually.
  good_controls:
  - Human-led operating model remained explicit.
  - SAP and Dynamics 365 formed the transaction data foundation.
  - The team measured dollars collected, cycle time, throughput, and hours worked.
  - Frontline users and change management were included in rollout.
  limits:
  - All metrics are Microsoft internal data and are explicitly described by Microsoft as directional for the measurement period.
  - The public article does not publish false-match costs by payment type or customer segment.
  lesson: Fix fragmented data and workflow ownership before adding agents. Collections AI works best when it prepares and
    prioritizes work around an authoritative finance process instead of becoming the finance process.
  evidence_grade: B
  source_ids:
  - microsoft-global-collections-2026
- id: walmart-autonomous-procurement-negotiation
  status: strong_pattern
  company: Walmart
  domain: Procurement and Working Capital
  process: Supplier payment-term and price-discount negotiation
  pattern_ids:
  - autonomous-commercial-negotiation
  technology:
  - Pactum AI Agents
  - procurement data and commercial guardrails
  what_worked: The agent handled high-volume supplier negotiations that were uneconomic to run manually, while procurement
    defined the strategy and acceptable trade-offs before negotiation started.
  reported_results:
  - 3% average gain across negotiations.
  - Payment terms extended by an average of 35 days.
  - 68% of engaged suppliers closed an agreement.
  - 83% of surveyed suppliers described the system as easy to use.
  good_controls:
  - Commercial strategy and negotiation space are defined before the agent acts.
  - The program targets tail-end or otherwise unmanaged negotiation volume rather than replacing strategic sourcing teams.
  - Supplier acceptance is measured together with buyer value.
  limits:
  - Metrics are reported by the AI negotiation provider.
  - The public material does not provide a control group or category-level distribution of savings and supplier outcomes.
  lesson: Autonomy becomes defensible when the commercial authority is bounded in advance. The agent executes a negotiation
    policy; it should not invent procurement strategy.
  evidence_grade: B
  source_ids:
  - walmart-pactum-clients
- id: oplog-fulfillment-agent-orchestration
  status: strong_pattern
  company: OPLOG
  domain: Warehouse and Fulfillment Operations
  process: Resource coordination, fulfillment decisions, and operational scaling
  pattern_ids:
  - operations-optimization
  - agentic-exception-management
  technology:
  - Amazon Bedrock AgentCore
  - AWS
  - proprietary warehouse software
  - autonomous mobile robots
  what_worked: AI agents were inserted into a live fulfillment operating model where warehouse state, resources, robots, and
    service commitments were already observable and measurable.
  reported_results:
  - Decision-making time reduced by 90%.
  - Resource usage reported at 85-95% versus a cited industry range of 60-70%.
  - Operational costs reduced by 30-40%.
  - The same management team could oversee three times the previous scale.
  - SLA compliance improved by 3.5 percentage points.
  - Customer satisfaction increased by 8 percentage points.
  good_controls:
  - The business already had measurable service-level commitments and operational state.
  - Agent outcomes are tied to resource use, cost, scale, SLA, and customer metrics rather than chat quality.
  - Physical execution remains connected to warehouse software and robots.
  limits:
  - Results are company/provider reported.
  - The public case does not publish the distribution of wrong decisions, rollback events, or safety exceptions.
  lesson: Warehouse agents are useful when they optimize a visible constrained system. The important metrics are throughput,
    resource use, SLA, cost, and recoverability, not how autonomous the agent sounds.
  evidence_grade: B
  source_ids:
  - oplog-aws
- id: delhivery-llm-geocoding
  status: strong_pattern
  company: Delhivery
  domain: Transportation and Last-Mile Logistics
  process: Pickup and delivery address geocoding
  pattern_ids:
  - cross-system-process-copilot
  technology:
  - fine-tuned large language model
  - Amazon EKS
  - AWS
  what_worked: 'Delhivery used a fine-tuned model for a narrow operational language problem: translating messy delivery addresses
    into high-precision geocoding results at production scale.'
  reported_results:
  - Up to 8,000 requests per minute.
  - 160 millisecond latency at the reported concurrency benchmark.
  - Model-serving costs reduced by approximately 80%.
  - Prototype cycles reduced from about two days to under six hours.
  good_controls:
  - The use case has clear latency, throughput, cost, and internal precision benchmarks.
  - The model is a component inside the navigation stack rather than an autonomous delivery decision maker.
  limits:
  - The public case does not disclose the exact geocoding accuracy or delivery-failure reduction.
  - Most published KPIs are technical and cost metrics rather than final customer-delivery outcomes.
  lesson: LLMs can be useful in logistics when language itself is the uncertain input. Keep routing and delivery execution
    downstream of measurable geocoding quality.
  evidence_grade: B
  source_ids:
  - delhivery-aws
- id: arneg-predictive-maintenance
  status: strong_pattern
  company: Arneg
  domain: Manufacturing and Field Service
  process: Predictive maintenance for commercial refrigeration
  pattern_ids:
  - manufacturing-quality-prediction
  technology:
  - IoT infrastructure
  - Amazon Forecast
  - Amazon SageMaker
  - AWS
  what_worked: Machine and IoT data were connected to a maintenance decision so the business could move from reactive service
    toward predicted maintenance needs.
  reported_results:
  - Maintenance needs predicted with more than 80% accuracy.
  - AWS reports a substantial reduction in refrigeration downtime, without publishing the exact percentage.
  good_controls:
  - The prediction has a clear downstream maintenance action.
  - The case is grounded in equipment telemetry rather than free-form text generation.
  limits:
  - The case is from 2020 and uses an older AWS service mix.
  - The exact downtime reduction and false-positive maintenance cost are not public.
  lesson: Predictive maintenance is not a dashboard problem. The value appears only when a risk signal changes inspection,
    scheduling, spare-parts, or technician action.
  evidence_grade: C
  source_ids:
  - arneg-aws
- id: johannesburg-security-copilot
  status: strong_pattern
  company: City of Johannesburg
  domain: Cybersecurity and IT Operations
  process: SOC alert triage, investigation, reporting, and response
  pattern_ids:
  - ai-assisted-security-triage
  technology:
  - Microsoft Security Copilot
  - Microsoft security stack
  - AI agents
  what_worked: AI was embedded into an existing SOC workflow to summarize evidence, reduce false positives, speed repetitive
    analysis, and support analysts rather than replacing security ownership.
  reported_results:
  - False positives reduced by up to 95%.
  - Analyst task completion reported up to 26% faster.
  - Overall productivity gains reported between 23% and 46.7%.
  good_controls:
  - The SOC remains the owner of investigation and remediation.
  - AI operates over existing security telemetry and incident state.
  - The case measures false positives and analyst productivity rather than prompt quality.
  limits:
  - Results are Microsoft/customer reported.
  - The public case does not provide severity-weighted miss rates or details for autonomous remediation boundaries.
  lesson: Security AI should compress investigation and noise first. High-consequence remediation still needs explicit authority,
    auditability, and rollback.
  evidence_grade: B
  source_ids:
  - johannesburg-microsoft-security
- id: accenture-github-copilot-rct
  status: strong_pattern
  company: Accenture
  domain: Software Engineering
  process: Daily software development with AI coding assistance
  pattern_ids:
  - cross-system-process-copilot
  technology:
  - GitHub Copilot Business
  - GitHub
  what_worked: Accenture and GitHub evaluated the coding assistant in a randomized controlled trial instead of relying only
    on developer surveys or accepted-line counts.
  reported_results:
  - The Accenture trial compared 450 developers with Copilot against 200 developers without it.
  - GitHub reports statistically significant increases in successful builds and pull requests for the treatment group.
  - 95% of developers surveyed said they enjoyed coding more with Copilot.
  - A later Microsoft Research analysis combining three field experiments, including Accenture, reported a 26.08% increase
    in completed tasks across 4,867 developers.
  good_controls:
  - Random assignment created a stronger causal design than a normal customer story.
  - Telemetry and developer experience were measured separately.
  - The research distinguishes adoption from productivity outcomes.
  limits:
  - GitHub and Microsoft were involved in the research and product being evaluated.
  - The public Accenture story does not expose every project-level quality or defect metric.
  lesson: For developer AI, accepted code is not enough. Measure completed work, build success, pull requests, defects, review
    load, and developer experience with a real comparison group when possible.
  evidence_grade: A
  source_ids:
  - accenture-github-rct
  - microsoft-developer-field-experiments
- id: uniqa-health-claims-document-ai
  status: strong_pattern
  company: UNIQA Southeastern Europe
  domain: Insurance Operations
  process: Health claim and medical referral intake, extraction, validation, and core-system preparation
  pattern_ids:
  - document-to-workflow
  technology:
  - Microsoft Foundry
  - Azure Document Intelligence
  - Azure OpenAI
  - APIs to legacy core systems
  what_worked: The solution used AI to convert fragmented medical documents into validated structured data and connected the
    result to the existing claims core through APIs.
  reported_results:
  - Average processing time reduced from 15-30 minutes to 2-3 minutes.
  - Processing time reduction reported at 85-90%.
  - Call-center volumes decreased and claim responses that once took weeks were reported as taking days or hours.
  good_controls:
  - Document extraction and validation are separated from the core claims record.
  - APIs integrate the prepared result into the existing system instead of replacing it.
  - Human staff remain available for complex cases.
  limits:
  - Results are Microsoft/customer reported.
  - The public story does not publish field-level false-acceptance rates or claim-payment error rates.
  lesson: Document AI is strongest when it removes re-keying and preparation while policy, eligibility, pricing, and payment
    authority stay in the claims process.
