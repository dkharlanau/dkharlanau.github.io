  - Amazon DynamoDB
  - Amazon EC2
  what_worked: 'Computer vision identifies returned products and drives a concrete warehouse workflow step: printing labels
    and moving returns faster through processing.'
  reported_results:
  - Returns processed 15 times faster than before.
  - The company also reported higher accuracy, without publishing the exact accuracy figure.
  good_controls:
  - Vision is used for a bounded identification task tied to a known product process.
  - The output feeds a warehouse workflow instead of becoming a free-form business decision.
