- id: united-entity-resolution
  status: strong_pattern
  company: United Airlines
  domain: Master Data, Customer Identity, and Customer Experience
  process: Customer identity resolution across booking, CRM, and journey data
  pattern_ids:
  - trusted-master-data-foundation
  technology:
  - AWS Entity Resolution
  - rule-based matching
  - ML-based matching
  - Amazon Connect Customer Profiles
  what_worked: United combined deterministic and probabilistic matching across fragmented customer systems to create a unified
    identity used downstream for the traveler journey.
  reported_results:
  - Matching accuracy reported above 90%.
  - The solution ingests data from 14 backend and legacy sources.
  - A probabilistic customer ID can be associated with each booking in near real time.
  good_controls:
  - Deterministic and probabilistic matching are both used instead of pretending one method fits every record.
  - Identity resolution produces a persistent business identity for downstream processes.
  - The source systems remain traceable inputs to the unified profile.
  limits:
  - The public source does not publish false-merge versus false-split rates.
  - Customer-experience and marketing ROI improvements are described without a controlled attribution method.
  lesson: Entity resolution is an AI foundation problem with business consequences. Measure false merges and false splits
    separately because a wrong golden record can poison every downstream agent.
  evidence_grade: B
  source_ids:
  - united-aws-entity-resolution
- id: siemens-field-service-report-pilot
  status: mixed_result
  company: Siemens Smart Infrastructure
  domain: Field Service
  process: Technician work-order report generation
  pattern_ids:
  - cross-system-process-copilot
  technology:
  - Dynamics 365 Field Service
  - Microsoft Copilot for Dynamics 365
  what_happened: 'Siemens built a generative AI application to standardize technician work-order reports. The business context
    is large: more than 10,000 technicians and more than 1.4 million work-order reports per year. Public material describes
    a pilot that began with a handful of technicians and planned expansion to 40.'
  reported_results:
  - Concept to first pilot took about six months.
  - The target scale is more than 1.4 million work-order reports per year.
  good_controls:
  - Technicians remain responsible for the service work and can review generated reports.
  - The team piloted with a small group and incorporated technician feedback before expanding.
  limits:
  - The source describes expected quality, workflow, customer-communication, and satisfaction benefits but does not publish
    a realized production KPI.
  - This is evidence of a sensible pattern and rollout method, not proof of business value at full scale.
  lesson: A pilot with a clear process and users is useful evidence, but expected benefits are not realized benefits. Define
    the production KPI before calling the transformation successful.
  evidence_grade: C
