trend_contract:
  snapshot_key: "contract_version + reviewed_at"
  stable_dimensions:
    - domain
    - end_to_end_process
    - process_stage
    - pattern
    - technology_family
    - industry
    - evidence_grade
    - implementation_maturity
    - autonomy_level
    - control_coverage
    - measurable_outcome
    - negative_evidence
  rule: "Future snapshots use the same dimension IDs and weighting version so changes can be compared. A weighting change creates a new coverage-model version rather than silently rewriting history."
