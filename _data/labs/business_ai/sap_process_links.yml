process_stages:
  - id: "lead-to-cash-order-capture"
    process_id: "lead-to-cash"
    title: "Order capture"
  - id: "lead-to-cash-availability-promise"
    process_id: "lead-to-cash"
    title: "Availability and promise"
  - id: "lead-to-cash-delivery-fulfillment"
    process_id: "lead-to-cash"
    title: "Delivery and fulfillment"
  - id: "lead-to-cash-billing-receivables"
    process_id: "lead-to-cash"
    title: "Billing and receivables"
  - id: "source-to-pay-purchase-order"
    process_id: "source-to-pay"
    title: "Purchase order"
  - id: "source-to-pay-supplier-confirmation"
    process_id: "source-to-pay"
    title: "Supplier confirmation"
  - id: "source-to-pay-receipt-service-entry"
    process_id: "source-to-pay"
    title: "Receipt and service entry"
  - id: "source-to-pay-invoice"
    process_id: "source-to-pay"
    title: "Invoice"
  - id: "forecast-to-fulfill-inventory-target"
    process_id: "forecast-to-fulfill"
