version: 1
updated_at: 2026-08-16
policy: >-
  Search publication is separate from drafting. A route can enter an approved wave only
  after its load-bearing claims are source-supported, its page structure is complete,
  and the whole page has been reviewed as a coherent explanation. Authored heuristics
  remain clearly separated from documented product behavior.

