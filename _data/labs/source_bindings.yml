version: "1.0.0"
updated_at: "2026-08-16"
policy: >-
  Route-level provenance bindings for reviewed public Lab pages. The publication loop
  resolves these registries into visible source links, JSON-LD citations and page sidecars.
  Bindings complement explicit source-registry references already present in a page.

routes:
  /labs/enterprise-context/business-ai/:
    registries:
      - business_ai_registry
  /labs/enterprise-context/business-ai/agents/:
    registries:
      - business_ai_registry
      - agent_architecture_registry
  /labs/enterprise-context/data-governance/:
    registries:
      - master_data
      - mdg_registry
  /labs/enterprise-context/deployment-models/:
    registries:
      - deployment_registry
  /labs/enterprise-context/development/:
    registries:
      - development_registry
      - development_toolbox_registry
  /labs/enterprise-context/mdg/:
    registries:
      - mdg_registry
      - mdg_architecture_registry
  /labs/enterprise-context/mdg/interfaces/:
    registries:
      - mdg_registry
      - mdg_architecture_registry
      - integration_registry
  /labs/enterprise-context/sales-processes/:
    registries:
      - sales_process_registry
      - sales_process_coverage_registry
  /labs/enterprise-context/sales-processes/integrations/:
    registries:
      - sales_interface_registry
      - integration_registry
  /labs/enterprise-context/transportation-management/integrations/:
