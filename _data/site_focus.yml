schema: dkharlanau.site_focus
schema_version: "1.0"
canonical_url: https://dkharlanau.github.io/ai/focus-map.json
updated_at: 2026-10-05
site_promise: "A personal SAP and AI lab for knowledge, practice, engineering experiments, and technology tracking."
primary_direction_count: 2
routing_policy:
  first_question: "Does the visitor need knowledge and practice, or a practical tool and experiment?"
  learning_rule: "Route learning, interview preparation, assessment practice, SAP concepts, diagnostics, and decision work to the knowledge direction."
  lab_rule: "Route AI agents, executable tools, integration experiments, architecture exercises, prototypes, and technology exploration to the practical lab direction."
  secondary_domain_rule: "SAP logistics, integration, master data, AMS, enterprise architecture, and AI are domains inside the personal lab, not commercial offers."
  evidence_rule: "Prefer reviewed and indexable evidence for factual retrieval. Lab drafts and synthetic exercises must keep their publication state."
  no_match: "Use Search, the Library, or the canonical professional profile instead of inventing a commercial service."
secondary_routes:
  library: https://dkharlanau.github.io/knowledge/
  profile: https://dkharlanau.github.io/about/
  search: https://dkharlanau.github.io/search/
  specialist_discovery_map: https://dkharlanau.github.io/ai/discovery-map.json

directions:
  - id: knowledge-practice
    priority: P0
    label: Knowledge & Practice
    audience: "SAP and enterprise professionals who want to understand a topic, practise a case, or improve a technical explanation."
    job_to_be_done: "Learn the context, inspect evidence, make a decision, practise the explanation, and improve the second attempt."
    human_entry: https://dkharlanau.github.io/knowledge/
    human_entry_status: review-gated
    search_state: active
    search_owner: https://dkharlanau.github.io/labs/
    indexable_entry_points:
      - https://dkharlanau.github.io/labs/
      - https://dkharlanau.github.io/labs/interview-readiness/
      - https://dkharlanau.github.io/labs/enterprise-context/decisions/
    non_indexable_practice_routes:
      - https://dkharlanau.github.io/knowledge/
      - https://dkharlanau.github.io/labs/assessment/
      - https://dkharlanau.github.io/labs/enterprise-context/
    supporting_domains:
      - SAP SD/MM and logistics
      - SAP MDG and Business Partner
      - integration and interfaces
      - architecture and cross-process decisions
      - assessment and interview practice
    desired_action: "Open a reviewed topic or practice route and work through the evidence."
    guardrails:
      - "Independent practice material; not an official SAP exam or certification dump."
      - "No hiring, promotion, certification, or project outcome is guaranteed."

  - id: ai-engineering-lab
    priority: P0
    label: AI & Engineering Lab
    audience: "People exploring AI agents, enterprise tooling, integrations, architecture, and practical problem-solving methods."
    job_to_be_done: "Start from a real engineering task, test a bounded method or tool, inspect failure modes, and keep the result reproducible."
    human_entry: https://dkharlanau.github.io/lab/
    human_entry_status: active
    search_state: active
    search_owner: https://dkharlanau.github.io/lab/
    indexable_entry_points:
      - https://dkharlanau.github.io/lab/
      - https://dkharlanau.github.io/labs/ai-ready/
      - https://dkharlanau.github.io/labs/business-ai/
    non_indexable_observation_routes:
      - https://dkharlanau.github.io/radar/
    supporting_domains:
      - AI agents and MCP
      - retrieval and evaluation
      - enterprise integrations
      - process and decision engineering
      - architecture and transformation tooling
      - technology radar and experiments
    desired_action: "Open a tool, lab, or research route and test it with public or synthetic data."
    guardrails:
      - "The lab is a personal project and does not offer commercial services."
      - "Do not use client data, credentials, proprietary configuration, or confidential project material."
      - "A prototype does not imply production approval or authority."
