schema: dkharlanau.site_focus
schema_version: "1.0"
canonical_url: https://dkharlanau.github.io/ai/focus-map.json
updated_at: 2026-09-10
site_promise: "Two primary jobs: practise SAP decision-making, or improve SAP AMS so recurring work stops returning."
primary_direction_count: 2
routing_policy:
  first_question: "Is the visitor practising a capability, or solving a live team problem?"
  learning_rule: "Route personal learning, interview preparation and assessment practice to the learning direction."
  ams_rule: "Route live operational pain, repeat incidents, unreliable integrations, master-data instability and avoidable support work to the AMS optimization direction."
  secondary_domain_rule: "Integration, MDG/master data, logistics and practical AI are evidence and solution domains inside the two directions, not additional top-level site promises."
  evidence_rule: "Prefer reviewed, indexable evidence for factual retrieval. A navigation hub, draft lab, service draft or synthetic exercise does not become verified evidence merely because it is linked here."
  no_match: "If neither direction fits, use the library or canonical professional profile instead of inventing a third primary offer."
secondary_routes:
  library: https://dkharlanau.github.io/knowledge/
  profile: https://dkharlanau.github.io/about/
  search: https://dkharlanau.github.io/search/
  specialist_discovery_map: https://dkharlanau.github.io/ai/discovery-map.json

directions:
  - id: sap-learning-practice
    priority: P0
    label: SAP Learning & Assessment Practice
    audience: "SAP professionals preparing for interviews, assessments or stronger project decision-making."
    job_to_be_done: "Learn a topic, practise a constrained case, explain the decision and improve the second attempt."
    human_entry: https://dkharlanau.github.io/learn/
    human_entry_status: review-gated
    search_state: staged
    search_owner: https://dkharlanau.github.io/labs/interview-readiness/
    search_note: "The /learn/ hub, assessment hub, broad Enterprise Context hub and current pilot pack are noindex. Until separate human review changes those states, search discovery should use the reviewed/indexable Interview Readiness and Decision Cards routes below."
    indexable_entry_points:
      - https://dkharlanau.github.io/labs/interview-readiness/
      - https://dkharlanau.github.io/labs/enterprise-context/decisions/
    non_indexable_practice_routes:
      - https://dkharlanau.github.io/learn/
      - https://dkharlanau.github.io/learn/packs/bp-mdg-replication/
      - https://dkharlanau.github.io/labs/assessment/
      - https://dkharlanau.github.io/labs/enterprise-context/
    target_queries:
      - SAP interview preparation
      - SAP interview practice
      - SAP assessment practice
      - SAP consultant assessment
      - SAP case study practice
      - SAP MDG interview questions
      - SAP Business Partner replication practice
    supporting_domains:
      - SAP MDG and Business Partner
      - SAP integration and interfaces
      - SAP SD/MM and logistics
      - architecture and cross-process decisions
    proof_surfaces:
      - https://dkharlanau.github.io/labs/interview-readiness/
      - https://dkharlanau.github.io/labs/enterprise-context/decisions/
      - https://dkharlanau.github.io/atlas/
    desired_action: "Start a practice route and complete an attempt before reading the review."
    guardrails:
      - "Independent practice material; not an official SAP exam or certification dump."
      - "No hiring, promotion or certification outcome is guaranteed."
      - "Unverified/noindex learning pages must not be promoted into reviewed retrieval indexes before human review."

  - id: sap-ams-optimization
    priority: P0
    label: SAP AMS Optimization
    audience: "SAP service owners, application teams and AMS leads dealing with repeat operational work."
    job_to_be_done: "Find a recurring support burden, identify the evidence gap or cause, make one bounded improvement and verify whether the burden falls."
    human_entry: https://dkharlanau.github.io/services/sap-ams-consulting/
    human_entry_status: active
    search_state: active
    search_owner: https://dkharlanau.github.io/services/sap-ams-consulting/
    indexable_entry_points:
      - https://dkharlanau.github.io/services/sap-ams-consulting/
      - https://dkharlanau.github.io/services/sap-o2c-process-audit/
    non_indexable_supporting_routes:
      - https://dkharlanau.github.io/services/sap-integration-reliability-assessment/
      - https://dkharlanau.github.io/services/sap-master-data-stability-assessment/
    target_queries:
      - SAP AMS optimization
      - SAP AMS continuous improvement
      - reduce repeat SAP incidents
      - SAP incident prevention
      - SAP integration reliability assessment
      - SAP master data stability
      - reduce manual SAP support work
      - SAP AMS automation
    supporting_domains:
      - repeat-incident analysis and problem management
      - integration reliability and reconciliation
      - MDG, Business Partner and master-data stability
      - O2C and cross-process diagnostics
      - operational knowledge, runbooks and bounded automation
      - practical AI with accountable review and production controls
    proof_surfaces:
      - https://dkharlanau.github.io/services/sap-ams-consulting/#diagnostic-example
      - https://dkharlanau.github.io/atlas/diagnostics/sap-incident-triage-diagnostics/
      - https://dkharlanau.github.io/atlas/automation/operational-memory-for-sap-ams/
      - https://dkharlanau.github.io/datasets/ams/
    desired_action: "Bring one recurring SAP problem without confidential data and define the outcome, evidence and acceptance measure."
    guardrails:
      - "No unconditional savings, SLA or customer-outcome claim."
      - "Synthetic diagnostic examples are method demonstrations, not customer evidence."
      - "Automation does not inherit authority to change production data, replay messages or close business exceptions."
