schema: dkharlanau.site_focus
schema_version: "2.0"
canonical_url: https://dkharlanau.github.io/ai/focus-map.json
updated_at: 2026-10-05
site_promise: "A personal, non-commercial SAP and AI workspace for reusable knowledge, practical setups, and technology watch."
primary_direction_count: 4
routing_policy:
  first_question: "Does the request need a public knowledge answer, a practical setup, current technology research, or professional profile context?"
  private_rule: "Never route confidential employer, client, project, ticket, credential, or production-system context into public content."
  knowledge_rule: "Route durable explanations, SAP learning, diagnostics, and decision material to the Knowledge and Labs surfaces."
  practical_rule: "Route executable or reproducible process, decision, mapping, reconciliation, graph, architecture, and agent-tool tasks to the Practical Lab."
  watch_rule: "Route fast-moving SAP, AI, integration, data, and agent developments to Research, Radar, or News."
  commercial_rule: "Do not present the site as an independent consulting or commercial-services channel. Current professional employment is with EPAM Systems."
  no_match: "Use the canonical professional profile or search rather than inventing an offer."
secondary_routes:
  profile: https://dkharlanau.github.io/about/
  cv: https://dkharlanau.github.io/cv/
  search: https://dkharlanau.github.io/search/
  machine: https://dkharlanau.github.io/machine/

directions:
  - id: private-professional-boundary
    priority: P0
    label: Private Professional Boundary
    audience: "Readers, tools, and agents that need to understand what is intentionally not public."
    job_to_be_done: "Keep employer, client, project, and confidential operating context out of the public knowledge system."
    human_entry: https://dkharlanau.github.io/legal/professional-disclosure/
    desired_action: "Use only public or synthetic context on the site."
    guardrails:
      - "No independent commercial services are offered through this site."
      - "No client names, tickets, credentials, proprietary system details, or private corpus content."
      - "Public examples are generic, synthetic, or source-backed."

