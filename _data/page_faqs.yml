"/services/":
  eyebrow: "Business questions"
  title: "Frequently asked questions before starting"
  intro: "Use these questions to choose the right problem boundary before discussing a project, platform, or delivery model."
  schema: false
  items:
    - question: "When is a SAP transformation friction audit the right starting point?"
      answer: >-
        It is the right starting point when change is happening but value is lost across process, data, integration, handover, and support boundaries. The goal is to find the friction before scaling more delivery work.
    - question: "How do you protect clean-core S/4HANA during new delivery work?"
      answer: >-
        Separate deterministic ERP logic that must stay close to transactional truth from automation, APIs, events, analytics, and edge services that should remain portable. The boundary is a business and lifecycle decision, not a slogan.
    - question: "What is the fastest way to prove value before a larger SAP transformation programme?"
      answer: >-
        Start with one audit slice, one repeat incident pattern, one handover gap, or one manual workflow where time, cost, or business risk is already visible. A narrow problem creates a measurable first decision.

"/services/sap-o2c-process-audit/":
  eyebrow: "O2C business FAQ"
  title: "Questions business and SAP teams usually ask"
  intro: "The useful questions are about blocked revenue, ownership, evidence, and repeatability, not only SD configuration."
  items:
    - question: "What business problem is large enough to justify an O2C audit?"
      answer: >-
        Repeated blocked orders, late deliveries, billing backlog, credit or pricing exceptions, manual releases, and recurring customer complaints are strong signals. The key condition is that the problem repeats and its owner or root cause is still unclear.
    - question: "Is this mainly an SAP SD configuration review?"
      answer: >-
        No. Configuration is only one possible cause. The audit also checks master data, ATP or aATP, credit, pricing, enhancements, interfaces, timing, manual workarounds, and the ownership of business decisions.
    - question: "What evidence should the business provide first?"
      answer: >-
        Start with a small set of representative document flows: order, delivery, billing or return, plus the visible business consequence. Add the relevant error, block, timestamp, master-data context, and interface evidence where available.
    - question: "How do you separate a valid business control from a system defect?"
      answer: >-
        First state the rule the business wants. Then trace the SAP condition that enforces it and test whether the required data and context are correct. A valid control with bad data needs a different fix from a wrong rule or defective enhancement.
    - question: "What should management receive at the end?"
      answer: >-
        A breakpoint map, evidence-backed findings, an owner decision map, and a ranked backlog. The result should show what can be fixed now, what needs process or data work, and what needs a larger architecture decision.
    - question: "Should AI release blocked orders or override credit decisions?"
      answer: >-
        Not by default. AI can prepare evidence, group similar cases, and suggest a next action. Releasing commercial controls should remain behind deterministic checks, explicit authority, and accountable approval.

"/services/sap-integration-architecture/":
  eyebrow: "Architecture FAQ"
  title: "Questions to answer before choosing middleware"
  intro: "Most integration decisions become easier after ownership, contract, timing, recovery, and business completion are clear."
  items:
    - question: "When do we need architecture work instead of another interface fix?"
      answer: >-
        Architecture work is justified when the same failures return, several teams disagree about ownership, contracts change unpredictably, recovery depends on people, or different interfaces solve the same business interaction in incompatible ways.
    - question: "Should we prefer APIs, events, or IDocs for new SAP integrations?"
      answer: >-
        There is no universal winner. Use APIs when a consumer needs a controlled request or current fact, events when other systems need to react to a business change without tight coupling, and IDocs when their business semantics and operational model fit the landscape well.
    - question: "Where should validation and orchestration live in a clean-core design?"
      answer: >-
        Keep rules that protect SAP transactional integrity close to the system of record. Put cross-system orchestration, replaceable transformation, channel logic, and edge automation outside the core when that improves lifecycle independence without weakening control.
    - question: "What does a good recovery model include?"
      answer: >-
        It defines correlation, retries, duplicate handling, replay, reconciliation, business error ownership, and the evidence that proves the receiving business object reached the expected state. A green middleware message is not enough.
    - question: "Who should own an integration contract?"
      answer: >-
        Ownership should connect business meaning and technical lifecycle. One accountable owner must be able to approve semantic or breaking changes, while producer and consumer teams keep clear responsibilities for implementation and operation.
    - question: "Should a company standardize on one integration platform?"
      answer: >-
        Standardize principles, contracts, observability, security, and ownership first. A mature landscape may still need APIs, event brokers, B2B exchange, files, or streaming for different interaction types. Forcing every flow into one runtime can create a new form of coupling.

"/services/enterprise-ai-pilot-design/":
  eyebrow: "Enterprise AI FAQ"
  title: "Business questions before an ERP AI pilot"
  intro: "A useful pilot proves a business decision and a control model, not only that a model can produce an impressive answer."
  items:
    - question: "What is a strong business case for an Enterprise AI pilot?"
      answer: >-
        Look for work where people spend real time interpreting documents, assembling evidence, classifying exceptions, or navigating context before a decision. The cost, delay, or risk should already be visible before AI enters the discussion.
    - question: "When should we not use AI?"
      answer: >-
        Do not use AI when a rule, query, workflow, integration, or ordinary application can solve the task reliably. Deterministic work does not become better merely because a language model is added to it.
    - question: "How small should the first pilot be?"
      answer: >-
        Small enough to have one process owner, one measurable outcome, a limited set of inputs and actions, and clear exit criteria. It should still contain difficult and unsafe cases, otherwise the pilot only tests the happy path.
    - question: "Do we need production ERP data to start?"
      answer: >-
        Not always. Synthetic or sanitized examples are often enough to test architecture, extraction, tool contracts, approval logic, and failure handling. Production-like data becomes important when the hypothesis depends on real variation, volume, or business context.
    - question: "How should we measure whether the pilot worked?"
      answer: >-
        Measure business validity, human correction, unsafe action rate, traceability, processing time, operating cost, and the share of cases that still need manual work. Model accuracy alone is not an operating KPI.
    - question: "When may an AI agent write to ERP?"
      answer: >-
        Only when the action is narrow, the identity is known, permissions are explicit, inputs are validated, the transaction is auditable, failure can be recovered, and the business risk allows that level of autonomy. High-risk actions should require confirmation or approval.
    - question: "Should we build the AI solution or buy a product?"
      answer: >-
        Decide after the process and control boundary are clear. Buy when the product matches the business job and governance model. Build when differentiation, unusual integration, control, or portability justify owning more of the lifecycle.

"/labs/enterprise-context/integrations/":
  eyebrow: "Integration architecture FAQ"
  title: "Questions that expose the real architecture decision"
  intro: "Answer these with a business object and a failure scenario. Product names can come later."
  items:
    - question: "How do I choose between synchronous and asynchronous integration?"
      answer: >-
        Ask whether the sender needs an immediate business answer and whether both systems must be available at the same time. Synchronous calls create direct runtime dependency. Asynchronous patterns reduce that dependency but require stronger state, retry, and reconciliation design.
    - question: "When is an event better than an API call?"
      answer: >-
        An event is useful when a business fact has already happened and several consumers may react independently. An API call is better when a consumer asks for data or requests a controlled action from an owner system.
    - question: "Does event-driven architecture mean we need Kafka or Event Mesh everywhere?"
      answer: >-
        No. Event-driven architecture starts with business semantics and coupling. A broker or streaming platform is selected only when its delivery, scale, routing, retention, ordering, or ecosystem properties fit the interaction.
    - question: "What is business completion in an integration flow?"
      answer: >-
        It is evidence that the receiving business object reached the state the process actually needs. Transport success, HTTP 200, or a delivered message can be useful technical signals, but they are not always proof of business completion.
    - question: "How should master data be distributed across systems?"
      answer: >-
        Name the authoritative source, the approved consumers, the distribution contract, local derivations, and the reconciliation model. The important question is not only how data moves, but how the landscape proves that copies remain usable and consistent enough for the business process.
    - question: "What is the clean-core rule for integration?"
      answer: >-
        Keep authoritative SAP business decisions and transactional safeguards where they belong. Keep replaceable mediation, channel-specific transformation, cross-system orchestration, and external integration logic portable when possible. Clean core is a boundary discipline, not zero integration logic.

"/labs/enterprise-context/business-ai/agents/":
  eyebrow: "Agent architecture FAQ"
  title: "Questions before giving an AI agent real authority"
  intro: "The model is only one component. Identity, tools, state, permissions, recovery, and business accountability decide whether the architecture is safe."
  items:
    - question: "When is an AI agent better than a normal workflow?"
      answer: >-
        Use an agent when the path genuinely needs dynamic planning, tool choice, or context-dependent reasoning. Use a workflow when the steps and decision rules are already known. The least complex mechanism that can own the task safely is usually the better design.
    - question: "Does MCP make ERP access safe?"
      answer: >-
        No. MCP can standardize how tools and context are exposed to an agent, but authorization, identity, business validation, audit, rate limits, and recovery still need separate controls. A tool description is not a security policy.
    - question: "Should an agent inherit all permissions of the human user?"
      answer: >-
        Usually no. Effective permission should be limited by the user, the agent, the tool, the business action, and the current context. The agent should receive only the authority needed for the task.
    - question: "How much autonomy should an enterprise agent have?"
      answer: >-
        Autonomy should follow business risk. Reading and explaining can often be broader. Preparing an action needs stronger validation. Committing financial, commercial, master-data, or logistics changes needs narrow tools, explicit policy, and often human confirmation.
    - question: "How do you make agent actions reliable when systems retry or fail?"
      answer: >-
        Treat every side effect as a transaction design problem. Use stable identifiers, idempotency where possible, durable business state, clear retry rules, compensation or recovery paths, and traces that connect the agent decision to the resulting business object.
    - question: "Do we need a multi-agent architecture?"
      answer: >-
        Only when responsibilities, authority, or lifecycle boundaries are genuinely different and the handoff can be made explicit. Splitting one vague agent into several vague agents mostly creates more messages and more places to lose context.
    - question: "What should we monitor in production?"
      answer: >-
        Monitor business outcome, tool usage, unsafe or denied actions, human corrections, retries, latency, cost, agent version, and the final state of affected business objects. Token counts are operational data, not proof that the process worked.

"/labs/business-ai/pilots/":
  eyebrow: "Pilot FAQ"
  title: "Questions that decide whether a pilot is worth running"
  intro: "A pilot is useful when it can change a business or architecture decision, including the decision to stop."
  items:
    - question: "What is the difference between a demo, a proof of concept, and a pilot?"
      answer: >-
        A demo shows that something can look useful. A proof of concept tests a technical hypothesis. A pilot tests whether the solution can work inside a real business process with representative data, controls, owners, failure cases, and measurable outcomes.
    - question: "Which Enterprise AI use case should go first?"
      answer: >-
        Prefer a narrow task with visible manual effort, enough representative examples, a clear owner, and limited authority. Document interpretation, evidence assembly, exception classification, and assistive ERP analysis are often easier first steps than autonomous transactions.
    - question: "What makes a pilot fail safely?"
      answer: >-
        Limit the action boundary, use test or reversible operations where possible, require approval for risky changes, keep an audit trail, define fallback behavior, and include cases that the system must refuse rather than force through.
    - question: "How much data is enough for a first pilot?"
      answer: >-
        Enough to represent normal cases, meaningful variation, ambiguity, and known failure modes. A small but deliberately difficult test set is more useful than a large collection of easy examples.
    - question: "What is a good exit criterion?"
      answer: >-
        Define the minimum business validity, correction rate, unsafe action threshold, processing improvement, traceability, and operating cost before building. The result may be scale, redesign, remain assistive, fix foundations first, or stop.
    - question: "Why keep the architecture vendor-neutral at the start?"
      answer: >-
        Because process ownership, authority, data, integration, and evaluation exist regardless of the chosen platform. Vendor products matter, but they should fit the operating model instead of defining it by accident.

"/labs/enterprise-context/procurement/":
  eyebrow: "Procurement FAQ"
  title: "Questions that separate purchasing symptoms from procurement decisions"
  intro: "A purchase order is one point in a longer chain. These questions help locate the first wrong decision before changing the document."
  items:
    - question: "What should I check before changing a supplier on a purchase order?"
      answer: >-
        Start with the requirement and source-of-supply logic. Check source list, quota arrangement, purchasing info record, contracts or scheduling agreements, validity, plant, purchasing organization, and any fixed or blocked source. A wrong supplier field can be the result of an earlier sourcing decision.
    - question: "What is the difference between item category and account assignment?"
      answer: >-
        Item category defines how the procurement item behaves, including whether goods receipt, service entry, subcontracting, consignment, or another special process is expected. Account assignment answers where the cost is charged. They solve different business questions and should be diagnosed separately.
    - question: "Does source determination choose the cheapest supplier?"
      answer: >-
        Not by itself. Source determination first decides which sources are valid and eligible for the requirement. Price matters inside the commercial decision, but validity, plant, purchasing organization, fixed sources, quotas, blocks, and agreements can determine which source may be used.
    - question: "Why can a purchase order be correct but the process still fail later?"
      answer: >-
        The PO only defines part of the process. Goods receipt, service confirmation, invoice verification, GR/IR, output, workflow, and downstream accounting still have their own controls. A correct order does not prove physical or financial completion.
    - question: "Who owns an open GR/IR problem?"
      answer: >-
        Ownership depends on the first wrong state. Purchasing may own an incorrect PO, receiving may own a missing or wrong goods receipt, accounts payable may own invoice handling, and master-data or integration teams may own supporting defects. The balance is a symptom, not an ownership model.
    - question: "When should procurement automation stop and ask for a human decision?"
      answer: >-
        Stop when the action changes supplier choice, commercial commitment, account assignment, approval, quantity, or another material business decision that is not fully determined by policy. Automation can prepare evidence and validate rules, but ambiguous or high-impact choices need an accountable owner.

"/services/sap-planning-and-replenishment-assessment/":
  eyebrow: "Planning business FAQ"
  title: "Questions behind recurring shortages and expedites"
  intro: "The useful question is not whether another alert can be created. It is whether the signal becomes an owned decision with evidence and a safe action boundary."
  schema: false
  items:
    - question: "When is a recurring shortage a planning problem rather than a one-off incident?"
      answer: >-
        Treat it as a planning problem when the same exception class repeats, teams keep expediting or reallocating, and the reason is not captured in a stable decision path. Repetition across demand, supply, master data, policy, or timing is stronger evidence than one urgent case.
    - question: "How do MRP, ATP, and inventory differ in a shortage discussion?"
      answer: >-
        Inventory describes physical or book stock, MRP plans supply and demand over time, and ATP or aATP evaluates what can be promised under its scope and policy. Mixing these views creates false explanations because each answers a different business question.
    - question: "Who should own a customer commitment when supply is constrained?"
      answer: >-
        The owner should be defined by business policy, not by whichever team sees the exception first. Planning can prepare the supply picture, but commercial priority, allocation, and customer commitment often need an explicit sales, supply, or cross-functional decision owner.
    - question: "What evidence should we collect before changing planning configuration?"
      answer: >-
        Use a small sample of repeated exceptions with demand, supply, dates, planning parameters, allocation or policy context, current document state, prior actions, and final business outcome. The goal is to find the first wrong assumption before changing a shared rule.
    - question: "Can AI automatically reallocate supply or change confirmations?"
      answer: >-
        Not as a default. AI can summarize evidence, group similar exceptions, and suggest review questions. Reallocating constrained supply or changing a customer promise affects commercial and operational commitments and should stay behind deterministic checks and accountable approval.
    - question: "What should management receive from a planning assessment?"
      answer: >-
        A decision-path map, evidence and ownership model, failure taxonomy, safe automation boundary, and a ranked backlog that separates data, process, control, integration, and platform work.

"/services/sap-master-data-stability-assessment/":
  eyebrow: "Master data business FAQ"
  title: "Questions behind recurring master-data repair"
  intro: "Repeated manual correction usually means the change lifecycle, ownership, or prevention control is weak somewhere before the transaction fails."
  schema: false
  items:
    - question: "When is a master-data issue large enough to justify an assessment?"
      answer: >-
        When the same object class causes blocked transactions, repeated manual repair, duplicate records, failed replication, or recurring escalation. The important signal is repeated operational cost, not the number of fields in one bad record.
    - question: "Do we need SAP MDG to solve master-data quality problems?"
      answer: >-
        Not automatically. First define which decisions need governance, who owns them, what must be validated, and which changes are low risk. MDG can support governance, but a tool cannot replace missing ownership or a poorly designed data contract.
    - question: "Why can a source record be correct while the target process still fails?"
      answer: >-
        The target may need a role, organizational view, relationship, key mapping, reference value, or activation state that the source record does not prove. Replication success also does not guarantee that the receiving business process can use the object.
    - question: "How should duplicate prevention work?"
      answer: >-
        Define business identity, authoritative keys, search rules, source-system responsibility, and the conditions that require human review. Prevention should happen before downstream replication where possible, because cleaning duplicates later is more expensive and riskier.
    - question: "Who owns master data: business or IT?"
      answer: >-
        The business should own meaning, policy, and material decisions. IT owns technical controls, platforms, integration, and operational reliability. Good governance makes both responsibilities explicit instead of assigning the whole object to one team.
    - question: "Can AI merge duplicate business partners automatically?"
      answer: >-
        It should not make that decision by default. AI can propose duplicate candidates and summarize evidence, but legal identity, contractual relationships, tax context, credit exposure, and downstream references can make a merge high risk.

"/labs/enterprise-context/master-data/":
  eyebrow: "Master data architecture FAQ"
  title: "Questions before changing a BP, customer, or product record"
  intro: "The word correct is incomplete without a role, organizational level, runtime consumer, and replication state."
  schema: false
  items:
    - question: "Why can a Business Partner be valid for one process and fail in another?"
      answer: >-
        A Business Partner has several business contexts. General identity, customer roles, sales-area data, company-code data, partner functions, and credit data can be complete at different levels. Always ask which role and organizational view the failing process needs.
    - question: "What does it mean when someone says the material master is correct?"
      answer: >-
        It is not enough evidence. Product behavior depends on the relevant organizational view, such as sales organization and distribution channel or plant. Compare the failing and working cases at the same level used by the runtime decision.
    - question: "Is there one universal precedence order for master data?"
      answer: >-
        No. Precedence belongs to a specific determination. Plant, shipping condition, partner determination, pricing, ATP, and other decisions can use different inputs and rules. Trace the actual engine instead of assuming one global priority.
    - question: "Why is successful replication not proof of correct master data?"
      answer: >-
        Replication proves movement, not business usability. The target can receive the message and still have a missing role, wrong mapping, incomplete organizational extension, stale reference data, or a local rule that changes the result.
    - question: "How should a master-data change be regression tested?"
      answer: >-
        Identify every important runtime consumer of the changed field and test the affected organizational levels. A field changed to fix shipping may also influence pricing, ATP, credit, billing, procurement, or reporting.
    - question: "Where should validation live?"
      answer: >-
        Put deterministic validity checks as close as possible to the point where incorrect data can still be prevented. Keep cross-system consistency and consumer-specific validation explicit rather than assuming one central rule can safely own every context.

"/labs/enterprise-context/pricing/":
  eyebrow: "Pricing FAQ"
  title: "Questions that find the first wrong pricing decision"
  intro: "A condition record is only one step. Start with document context and follow the search and calculation path until reality diverges from expectation."
  items:
    - question: "Why is the price wrong even though the condition record exists?"
      answer: >-
        The expected pricing procedure, condition type, access, and runtime key may not have been used. The record may also be inactive because of a requirement, exclusion, scale, formula, or another condition interaction. Existence is not proof of selection or activation.
    - question: "What should I check first in SAP pricing troubleshooting?"
      answer: >-
        Start with the expected commercial result and document context, then confirm the pricing procedure. After that, follow condition eligibility, access sequence, runtime key, record match, calculation, and condition interaction in order.
    - question: "Why can sales order and billing prices differ?"
      answer: >-
        Order and billing can be different pricing contexts depending on configuration, pricing type, dates, copied conditions, and later business changes. Compare the two pricing paths before assuming that one document copied the other incorrectly.
    - question: "How do I know whether the problem is configuration or master data?"
      answer: >-
        Configuration defines the search and calculation rules; master data and condition records provide runtime inputs. Prove which rule path executed and which values it used. Changing shared configuration to repair one bad record can create a much larger blast radius.
    - question: "Where should custom pricing logic live?"
      answer: >-
        Use standard condition technique and supported configuration first. Add custom logic only when the business rule cannot be represented safely in standard behavior, and place it where its data, transaction coupling, lifecycle, and upgrade impact are explicit.
    - question: "Can AI decide customer prices or discounts?"
      answer: >-
        AI can help analyze patterns or prepare a recommendation, but final price determination should remain inside controlled commercial rules and approval policy. A probabilistic suggestion should not silently replace contractual, regulatory, or margin controls.

"/labs/enterprise-context/atp/":
  eyebrow: "ATP and aATP FAQ"
  title: "Questions behind an unexpected confirmation"
  intro: "Availability is a promise calculation over time and policy. A stock number is only one input."
  items:
    - question: "Why can SAP show stock but confirm zero quantity?"
      answer: >-
        The stock may not be inside the relevant ATP scope, plant, date, checking context, or policy boundary. Existing requirements, receipts, safety or protection rules, scheduling, and advanced aATP controls can all change what is available to promise.
    - question: "What is the difference between inventory and ATP?"
      answer: >-
        Inventory tells you what stock exists. ATP evaluates what quantity can be promised for a requirement and date using a defined scope of supply and demand. The two numbers can legitimately differ.
    - question: "Do classic ATP controls still matter when aATP is used?"
      answer: >-
        Yes. Requirement relevance, checking group, checking rule, scope, plant, and scheduling still form the context in which advanced capabilities operate. Advanced logic does not repair a wrong basic availability context.
    - question: "What is the difference between Product Allocation and Supply Protection?"
      answer: >-
        Both control scarce supply, but they express different business policies. Product Allocation limits confirmation against allocation quantities, while Supply Protection reserves supply for protected groups or priorities. The design should start from the business rule, not the feature name.
    - question: "Why did a previously confirmed order lose or gain quantity after BOP?"
      answer: >-
        Backorder Processing can re-evaluate confirmations according to its selection and confirmation strategies. The important question is which business priority rule was applied and whether the resulting commitments remain acceptable downstream.
    - question: "Who should own scarce-supply priority?"
      answer: >-
        SAP executes the configured rule, but the business must own the policy. Sales priority, customer importance, contractual commitments, supply constraints, and margin can conflict, so scarce-supply decisions need explicit governance.
    - question: "What is the fastest diagnostic path for a wrong ATP result?"
      answer: >-
        Reconstruct the requirement, plant, material availability date, ATP relevance, scope, supply-demand picture, PAC result, and any PAL, Supply Protection, alternatives, or BOP rules. Find the first point where the actual promise differs from the expected one.

"/labs/enterprise-context/decisions/clean-core-extension-placement/":
  eyebrow: "Clean core FAQ"
  title: "Questions before choosing on-stack or side-by-side extensibility"
  intro: "Clean core is a boundary decision about coupling and lifecycle. Moving code is not the same as reducing dependency."
  items:
    - question: "What does clean core mean for a real SAP extension decision?"
      answer: >-
        Prefer standard behavior first, then released extensibility contracts. Keep logic close to SAP when it must share the transaction and authoritative state. Move capabilities side-by-side when they should have a separate lifecycle, cross-system scope, or independent runtime.
    - question: "Is side-by-side on SAP BTP always more clean-core compliant?"
      answer: >-
        No. A remote service can still be tightly coupled if every SAP transaction depends on it synchronously. The code may be outside S/4HANA while the business transaction becomes more fragile because of network, latency, or availability dependency.
    - question: "When should logic stay on-stack?"
      answer: >-
        Keep logic on-stack when it is tightly coupled to an SAP business object, must participate in the same consistency boundary, or needs authoritative transactional state with low latency. Use released extension points and ABAP Cloud-compatible contracts where possible.
    - question: "When is side-by-side a better fit?"
      answer: >-
        Side-by-side is strong for cross-system processes, external data ownership, independent scaling, separate product-team lifecycle, different runtime needs, or capabilities that should evolve without coupling their deployment to the S/4HANA core.
    - question: "Should we extend SAP when configuration or master data can represent the rule?"
      answer: >-
        Usually no. If standard configuration or governed master data already owns the requirement, an extension creates another rule owner and another lifecycle without adding business value.
    - question: "Why do released APIs, events, BAdIs, and CDS views matter?"
      answer: >-
        Released contracts define a supported boundary that is safer across upgrades than direct dependency on internal objects. They do not remove design responsibility, but they reduce accidental coupling to implementation details.
    - question: "How should existing custom code be assessed for clean core?"
      answer: >-
        Classify each extension by business owner, transaction coupling, data ownership, released dependency, failure behavior, change frequency, and upgrade cost. The target can be keep, replace with standard, refactor on-stack, move side-by-side, or retire.

"/labs/enterprise-context/integration-operations/":
  eyebrow: "Integration operations FAQ"
  title: "Questions to answer before retrying a failed interface"
  intro: "Recovery starts with message identity and receiver state. A restart button is not a recovery model."
  items:
    - question: "Why can the middleware message be green while the business process is wrong?"
      answer: >-
        Technical delivery, application processing, and business completion are different states. A message can arrive successfully while the receiver rejects, partially processes, duplicates, or commits a business object that does not match the sender's intent.
    - question: "What should I know before retrying or replaying a message?"
      answer: >-
        Know the message identity, first failed hop, receiver commit state, ordering dependency, and duplicate protection. If the receiver may already have committed, a blind retry can create a second business transaction.
    - question: "What is the dangerous case after a timeout?"
      answer: >-
        The dangerous case is unknown commit state. The sender may see a timeout while the receiver completed the transaction. Recovery must check the target business object or idempotency key before deciding whether another write is safe.
    - question: "Does exactly-once delivery mean the business transaction can never duplicate?"
      answer: >-
        No. Delivery semantics apply to a specific technical boundary. Duplicates can still appear through retries across other hops, application behavior, manual recovery, or missing business idempotency. Business uniqueness needs its own control.
    - question: "When should we replay a message and when should we repair data first?"
      answer: >-
        Replay when the original payload is still valid and the failure is safely recoverable. Repair data or business state first when the receiver rejected the message for a valid reason, reference data changed, ordering is wrong, or replay would repeat the same defect.
    - question: "Who owns an interface incident?"
      answer: >-
        Ownership follows the first wrong state. The source owns bad source data or business intent, integration owns transport and mapping defects, the target owns target processing, and a business owner must confirm the final process result. One incident may cross several teams, but each decision should have one accountable owner.
    - question: "Which metrics matter more than message volume?"
      answer: >-
        Track aging failures, retry count, duplicates, unknown commit cases, business reconciliation failures, manual recovery effort, time to ownership, and time to business completion. High message throughput is not evidence of a healthy process.
