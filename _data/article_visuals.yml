idoc-evidence-boundaries:
  src: /assets/img/articles/idoc-evidence-boundaries.webp
  title: Find the first unproven step
  alt: Four IDoc evidence boundaries — source trigger, outbound message, target receipt and expected business result
    — with a gap between receipt and result.
  caption: A conceptual diagnostic path. A received message does not establish that the expected business object
    or state exists. Identify the object at each boundary before choosing a recovery action.
  width: 1536
  height: 1024
  creator: Dzmitryi Kharlanau
  credit: 'Concept and editorial direction: Dzmitryi Kharlanau. Illustration generated with OpenAI Image Gen.'
atp-inventory-promise-context:
  src: /assets/img/articles/atp-inventory-promise-context.webp
  title: Stock is a quantity. A promise has a date.
  alt: Inventory passes through scope, demand and date context before an ATP quantity and date can be confirmed.
  caption: A conceptual comparison, not an SAP calculation formula. The inventory total is one observation; the
    availability check also depends on eligible supply and requirements, dates and the active process context.
  width: 1536
  height: 1024
  creator: Dzmitryi Kharlanau
  credit: 'Concept and editorial direction: Dzmitryi Kharlanau. Illustration generated with OpenAI Image Gen.'
idoc-status-evidence:
  src: /assets/img/articles/idoc-status-evidence.webp
  title: A status proves one checkpoint.
  alt: Outbound status 03 means data passed to the port; inbound status 53 means the application document was posted.
    These are separate directions, not a guaranteed sequence.
  caption: A comparison of two checkpoints. For outbound 03, trace downstream delivery when required. For inbound
    53, inspect the referenced application object and expected state before interpreting a user report of a missing
    result.
  width: 1536
  height: 1024
  creator: Dzmitryi Kharlanau
  credit: 'Concept and editorial direction: Dzmitryi Kharlanau. Illustration generated with OpenAI Image Gen.'
qrfc-serialized-backlog:
  src: /assets/img/articles/qrfc-serialized-backlog.webp
  title: A backlog is not a root cause.
  alt: One blocked unit holds three subsequent units in an assumed serialized queue; investigation starts with the
    blocking error and recovery preserves the sequence.
  caption: Conceptual example of one serialized queue. The labels WAITING and BLOCKED describe the drawing, not
    specific SAP status codes. Actual waiting can also reflect dependencies or deliberate stops; inspect the queue
    state before inferring a cause.
  width: 1536
  height: 1024
  creator: Dzmitryi Kharlanau
  credit: 'Concept and editorial direction: Dzmitryi Kharlanau. Illustration generated with OpenAI Image Gen.'
inbound-search-evidence:
  src: /assets/img/articles/inbound-search-evidence.webp
  title: Not found is a search result.
  alt: A receiver search branches into checking system, selection and correlation when no match exists, or status
    history, application object and expected state when a match is found.
  caption: A conceptual diagnostic fork. An empty receiver list requires a check of system, client, selection and
    correlation before any conclusion about delivery. A matching IDoc shifts the investigation to its status and
    application outcome.
  width: 1536
  height: 1024
  creator: Dzmitryi Kharlanau
  credit: 'Concept and editorial direction: Dzmitryi Kharlanau. Illustration generated with OpenAI Image Gen.'
integration-monitor-boundaries:
  src: /assets/img/articles/integration-monitor-boundaries.webp
  mobile_src: /assets/img/articles/integration-monitor-boundaries-mobile.webp
  mobile_width: 1024
  mobile_height: 1536
  title: One message. Different evidence.
  alt: One conceptual business message crosses IDoc, optional AIF, middleware, and application checkpoints, with a shared correlation key below them.
  caption: A conceptual evidence map, not a mandatory architecture. Include only the checkpoints used by the actual interface. Correlate records across those checkpoints, read the first failed or unproven step, and verify the business outcome before recovery.
  width: 1536
  height: 1024
  creator: Dzmitryi Kharlanau
  credit: 'Concept and editorial direction: Dzmitryi Kharlanau. Illustration generated with OpenAI Image Gen.'
interface-monitoring-coverage:
  src: /assets/img/articles/interface-monitoring-coverage.webp
  mobile_src: /assets/img/articles/interface-monitoring-coverage-mobile.webp
  mobile_width: 1024
  mobile_height: 1536
  title: Green is one observation.
  alt: A green interface monitor covers selected status while age, path coverage, fresh data, and the business outcome remain separate evidence questions.
  caption: A conceptual coverage model. A green result can accurately describe the selected status and still leave message age, collection freshness, route coverage, or the receiver-side business outcome unproven.
  width: 1536
  height: 1024
  creator: Dzmitryi Kharlanau
  credit: 'Concept and editorial direction: Dzmitryi Kharlanau. Illustration generated with OpenAI Image Gen.'
integration-retry-gates:
  src: /assets/img/articles/integration-retry-gates.webp
  mobile_src: /assets/img/articles/integration-retry-gates-mobile.webp
  mobile_width: 1024
  mobile_height: 1536
  title: Retry is a decision.
  alt: A failed message passes through outcome, cause, duplicate, ordering, and ownership evidence gates before a bounded recovery action.
  caption: A conceptual recovery decision, not a product workflow. A retry control is useful only after the receiver outcome, changed cause, duplicate handling, ordering, and verification owner are established for the actual interface.
  width: 1536
  height: 1024
  creator: Dzmitryi Kharlanau
  credit: 'Concept and editorial direction: Dzmitryi Kharlanau. Illustration generated with OpenAI Image Gen.'
