<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">A safe handoff from orchestration to SAP diagnostic specialists</title><desc id="desc">An orchestrator delegates evidence reads to three specialists. A handoff includes source facts, at-most-once effects, fanout budgets and explicit outcomes. An uncertain write result stops for reconciliation instead of being replayed.</desc>
<rect width="1200" height="500" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#132238}.h{font-size:26px;font-weight:bold}.m{font-size:19px;font-weight:bold}.s{font-size:15px}.b{fill:#f5f9ff;stroke:#1254f5;stroke-width:2}.n{fill:#fff;stroke:#aab6c5;stroke-width:2}.r{fill:#fff8f8;stroke:#bd3947;stroke-width:2}.l{fill:none;stroke:#1254f5;stroke-width:3}.t{fill:#526070;font-size:15px}</style>
<text class="h" x="35" y="49">A subagent response is a distributed-system handoff</text><line x1="35" y1="68" x2="1165" y2="68" stroke="#d7dfe8"/>
<rect class="b" x="445" y="88" width="310" height="86" rx="7"/><text class="m" x="488" y="120">Orchestrator</text><text class="s" x="483" y="148">Owns scope and budget</text>
<path class="l" d="M600 174 V209 M214 209 H986 M214 209 V245 M600 209 V245 M986 209 V245"/>
<rect class="n" x="45" y="246" width="335" height="100" rx="7"/><text class="m" x="82" y="278">Sales evidence</text><text class="s" x="82" y="305">Document status + timestamp</text><text class="s" x="82" y="327">Source reference</text>
<rect class="n" x="433" y="246" width="335" height="100" rx="7"/><text class="m" x="470" y="278">Master Data evidence</text><text class="s" x="470" y="305">Fields, ownership, freshness</text><text class="s" x="470" y="327">No direct write</text>
<rect class="n" x="819" y="246" width="335" height="100" rx="7"/><text class="m" x="850" y="278">Integration evidence</text><text class="s" x="850" y="305">Queue + message state</text><text class="s" x="850" y="327">Retry outcome may be unknown</text>
<rect class="b" x="46" y="380" width="750" height="81" rx="6"/><text class="m" x="69" y="408">SAFE handoff contract</text><text class="s" x="69" y="436">Source facts   •   At-most-once effects   •   Fanout budgets   •   Explicit outcomes</text>
<rect class="r" x="827" y="380" width="328" height="81" rx="6"/><text class="m" x="850" y="408">Unknown ≠ Failed</text><text class="s" x="850" y="436">Reconcile before any replay</text>
<text class="t" x="45" y="489">Illustrative SAP workflow. SAFE is the speaker's proposed model, not a universal standard.</text>
</svg>