<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">An evidence-driven autonomy ladder for SAP operations</title><desc id="desc">The first level reads evidence and suggests next checks; the second level prepares a proposed change for human approval; the third performs only narrowly authorized, low-risk, reversible tasks. Each level adds permission only after evaluation and operational controls.</desc>
<rect width="1200" height="500" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#132238}.h{font-size:25px;font-weight:700}.m{font-size:20px;font-weight:700}.s{font-size:16px}.t{font-size:15px;fill:#52647b}.b{fill:#f6faff;stroke:#1254f5;stroke-width:2}.r{fill:#fff7f7;stroke:#a93b4b;stroke-width:2}.line{stroke:#1254f5;stroke-width:3;fill:none}</style>
<text class="h" x="35" y="52">Earn autonomy one approved capability at a time</text><line x1="35" y1="71" x2="1165" y2="71" stroke="#cbd5e1"/>
<rect class="b" x="45" y="132" width="340" height="230" rx="6"/><text class="m" x="68" y="167">1 — Investigate</text><text class="s" x="68" y="207">Read-only evidence</text><text class="s" x="68" y="237">Explain competing causes</text><text class="s" x="68" y="267">No SAP write permission</text><text class="t" x="68" y="332">Default starting level</text>
<path class="line" d="M389 244 H418"/><path class="line" d="M410 236 L419 244 L410 252"/>
<rect class="b" x="430" y="132" width="340" height="230" rx="6"/><text class="m" x="453" y="167">2 — Prepare</text><text class="s" x="453" y="207">Draft exact correction</text><text class="s" x="453" y="237">Request human approval</text><text class="s" x="453" y="267">Show impact and recovery</text><text class="t" x="453" y="332">No autonomous production writes</text>
<path class="line" d="M773 244 H801"/><path class="line" d="M793 236 L802 244 L793 252"/>
<rect class="r" x="815" y="132" width="340" height="230" rx="6"/><text class="m" x="837" y="167">3 — Execute narrowly</text><text class="s" x="837" y="207">Allowlisted low-risk action</text><text class="s" x="837" y="237">Idempotency + rollback path</text><text class="s" x="837" y="267">Post-action verification</text><text class="t" x="837" y="332">Only after measured evidence</text>
<text class="s" x="49" y="418">Every level: named owner  •  identity  •  source evidence  •  traces  •  stop states  •  evaluation</text>
<text class="t" x="49" y="454">Adapted as a synthetic SAP operating pattern from Meta's AI on-call talk; not a tested SAP product feature.</text>
</svg>