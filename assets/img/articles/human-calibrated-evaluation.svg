<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
<title id="title">A quality evaluation loop built from calibrated human rubrics</title>
<desc id="desc">Experts define and calibrate a rubric on shared examples. Offline model and deterministic evaluations are compared against human decisions. A controlled release is monitored using business metrics. Verified failures return as new examples.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#12243a}.h{font-size:27px;font-weight:700}.t{font-size:21px;font-weight:700}.p{font-size:17px}.s{font-size:16px;fill:#546478}.blue{fill:#f5f9ff;stroke:#1254f5;stroke-width:2}.white{fill:#fff;stroke:#bbc7d3;stroke-width:2}.red{fill:#fff8f8;stroke:#b63b49;stroke-width:2}.line{stroke:#1254f5;stroke-width:3;fill:none}</style>
<rect width="760" height="590" fill="#fff"/><text class="h" x="27" y="51">Quality starts before the model judge</text><path d="M27 68 H733" stroke="#cdd5df"/>
<rect class="blue" x="135" y="96" width="490" height="89" rx="5"/><text class="t" x="169" y="131">Human rubric + calibration</text><text class="p" x="169" y="159">Two experts review the same examples</text>
<path class="line" d="M380 185 V218"/>
<rect class="white" x="135" y="221" width="490" height="89" rx="5"/><text class="t" x="169" y="255">Offline evaluations</text><text class="p" x="169" y="282">Code checks + judge/human agreement</text>
<path class="line" d="M380 310 V344"/>
<rect class="blue" x="135" y="347" width="490" height="89" rx="5"/><text class="t" x="169" y="380">Limited rollout + outcome metrics</text><text class="p" x="169" y="408">Accepted cases · cost · incidents</text>
<path class="line" d="M380 436 V464"/>
<rect class="red" x="135" y="467" width="490" height="73" rx="5"/><text class="t" x="169" y="504">New failures → reviewed test cases</text>
<text class="s" x="28" y="573">A high score is useful only when the grader is trustworthy.</text>
</svg>