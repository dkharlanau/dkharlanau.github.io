<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">Separating requester, agent, policy and SAP access</title><desc id="desc">A request from a human reaches an identified agent. A policy gate verifies delegated purpose and scopes a short-lived credential. An authorized SAP adapter performs a read and records actor identity, decision, tool, target and outcome. The language model does not receive SAP credentials.</desc>
<rect width="1200" height="450" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#132238}.h{font-size:25px;font-weight:700}.m{font-size:19px;font-weight:700}.s{font-size:15px}.b{fill:#f4f8ff;stroke:#1254f5;stroke-width:2}.n{fill:#fff;stroke:#bbc5d1;stroke-width:2}.r{fill:#fff8f8;stroke:#ae3947;stroke-width:2}.line{stroke:#1254f5;stroke-width:3;fill:none}</style>
<text class="h" x="35" y="50">Who asked? Who acted? What was authorized?</text><line x1="35" y1="70" x2="1165" y2="70" stroke="#c9d4df" />
<rect class="n" x="35" y="110" width="200" height="106" rx="5"/><text class="m" x="68" y="153">Human user</text><text class="s" x="65" y="185">Request + identity</text>
<rect class="b" x="280" y="110" width="220" height="106" rx="5"/><text class="m" x="315" y="153">AI agent</text><text class="s" x="304" y="185">Own runtime identity</text>
<rect class="r" x="545" y="110" width="240" height="106" rx="5"/><text class="m" x="577" y="153">Policy gate</text><text class="s" x="565" y="185">Purpose + delegation</text>
<rect class="b" x="830" y="110" width="330" height="106" rx="5"/><text class="m" x="863" y="153">Authorized SAP adapter</text><text class="s" x="856" y="185">Scoped access, typed result</text>
<path class="line" d="M236 162 H276 M500 162 H540 M785 162 H826"/>
<rect class="n" x="213" y="270" width="775" height="93" rx="6"/><text class="m" x="245" y="308">Evidence record</text><text class="s" x="245" y="337">requester  •  agent  •  purpose  •  policy decision  •  tool  •  resource  •  outcome</text>
<path class="line" d="M993 216 V244 H615 V266"/>
<rect class="r" x="35" y="386" width="1125" height="44" rx="4"/><text class="s" x="55" y="413">Never place a broad SAP password or production write token inside an agent prompt, tool description or general-purpose memory.</text>
</svg>