<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" role="img" aria-labelledby="title desc">
<title id="title">One canonical article with separate human and agent retrieval views</title>
<desc id="desc">A single maintained source page provides both human-readable guidance and structured, source-linked retrieval. A shared test set checks factual correctness and usefulness before updates.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#11243a}.h{font-size:28px;font-weight:700}.t{font-size:21px;font-weight:700}.p{font-size:18px}.s{font-size:16px;fill:#526275}.blue{fill:#f6faff;stroke:#1254f5;stroke-width:2}.gray{fill:#fff;stroke:#c1cad5;stroke-width:2}.red{fill:#fff8f8;stroke:#b53745;stroke-width:2}.line{stroke:#1254f5;stroke-width:3;fill:none;stroke-linecap:round}</style>
<rect width="760" height="610" fill="#fff"/><text class="h" x="26" y="49">One source. Two reading paths.</text><path d="M26 68 H730" stroke="#ccd6e1"/>
<rect class="blue" x="172" y="94" width="412" height="105" rx="6"/><text class="t" x="216" y="136">Canonical, reviewed content</text><text class="p" x="218" y="169">Owner · version · evidence · scope</text>
<path class="line" d="M381 200 V245 M380 228 H188 V257 M381 228 H575 V257"/>
<rect class="gray" x="27" y="261" width="322" height="132" rx="6"/><text class="t" x="69" y="296">Human reading</text><text class="p" x="58" y="331">Decision · examples</text><text class="p" x="58" y="362">Risks · next action</text>
<rect class="gray" x="405" y="261" width="324" height="132" rx="6"/><text class="t" x="439" y="296">Agent retrieval</text><text class="p" x="435" y="331">Stable ID · fresh chunk</text><text class="p" x="435" y="362">Source and citations</text>
<path class="line" d="M187 393 V433 H376 M568 393 V433 H376 V449"/>
<rect class="red" x="163" y="456" width="425" height="101" rx="6"/><text class="t" x="204" y="495">Quality gate</text><text class="p" x="205" y="526">Find → understand → verify</text>
<text class="s" x="27" y="593">A shorter page is only better if it preserves the correct decision.</text>
</svg>