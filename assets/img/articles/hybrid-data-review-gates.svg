<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 635" role="img" aria-labelledby="title desc">
<title id="title">Deterministic, agent and human checks for a data change</title>
<desc id="desc">A proposed change to a data pipeline or migration file passes a deterministic schema and permission gate, then an agent reviews business impact with cited evidence, before protected or uncertain changes go to a human. Approved output is verified downstream.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#122239}.h{font-size:27px;font-weight:700}.t{font-size:21px;font-weight:700}.p{font-size:18px}.s{font-size:16px;fill:#546479}.blue{fill:#f5f9ff;stroke:#1254f5;stroke-width:2}.white{fill:#fff;stroke:#bfc9d4;stroke-width:2}.red{fill:#fff7f7;stroke:#b53745;stroke-width:2}.line{stroke:#1254f5;stroke-width:3;fill:none}</style>
<rect width="760" height="635" fill="#fff"/><text class="h" x="25" y="48">Data changes need different checks</text><path d="M25 65 H733" stroke="#d2dae2"/>
<rect class="white" x="150" y="89" width="460" height="67" rx="5"/><text class="t" x="191" y="131">Proposed mapping / schema change</text>
<path class="line" d="M380 155 V180"/>
<rect class="blue" x="150" y="184" width="460" height="102" rx="6"/><text class="t" x="191" y="220">1. Code proves exact facts</text><text class="p" x="191" y="252">Schema · types · protected records</text>
<path class="line" d="M380 286 V312"/>
<rect class="blue" x="150" y="315" width="460" height="103" rx="6"/><text class="t" x="191" y="353">2. AI reviews context</text><text class="p" x="191" y="383">Consumers · meaning · uncertainty</text>
<path class="line" d="M380 418 V443"/>
<rect class="red" x="150" y="446" width="460" height="103" rx="6"/><text class="t" x="191" y="483">3. Human owns protected risk</text><text class="p" x="191" y="514">Approve exact change, or reject</text>
<text class="s" x="26" y="585">Missing checks cannot be treated as passing results.</text>
<text class="s" x="26" y="610">After release: verify the downstream business outcome.</text>
</svg>