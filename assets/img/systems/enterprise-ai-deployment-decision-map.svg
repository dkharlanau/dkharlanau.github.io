<g text-anchor="middle"><g font-size="20" font-weight="700"><text x="500" y="89">01 · Value &amp; scope</text><text x="500" y="196">02 · Identity &amp; boundaries</text><text x="182" y="329">03 · Access &amp; authority</text><text x="500" y="329">04 · Workflow governance</text><text x="818" y="329">05 · Economics</text><text x="500" y="484">06 · Evidence &amp; learning</text></g><g font-size="15" fill="#425765"><text x="500" y="113">Business outcome · baseline · constraints</text><text x="500" y="222">Trust zones · execution identity · roles</text><text x="182" y="355">Data · tools · actions</text><text x="182" y="377">Approvals and side effects</text><text x="500" y="355">Build · review · publish</text><text x="500" y="377">Version and retire</text><text x="818" y="355">Budget · cost per result</text><text x="818" y="377">Limits and escalation</text><text x="500" y="510">Audit · quality · adoption · feedback</text><text x="500" y="567" font-size="16">Evidence revisits the decision; it does not merely report usage.</text></g></g></g></svg>