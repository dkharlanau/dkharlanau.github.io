<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="766" viewBox="0 0 620 766" role="img" aria-labelledby="route-title route-desc">
  <title id="route-title">Outcome-aware model routing</title>
  <desc id="route-desc">A real task passes through policy and a decision model. The system can choose a frontier model, a smaller open model, or a specialized model. Evaluation considers correctness, safety, cost and latency. Human review remains available for sensitive cases.</desc>
  <defs><marker id="route-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1254f5"/></marker></defs>
  <rect width="620" height="766" fill="#ffffff"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="42" y="46" font-size="26" font-weight="700" fill="#1f242c">Choose the right model per task</text>
    <text x="42" y="78" font-size="17" fill="#57606e">Decide with evidence, not a fixed provider preference</text>
    <rect x="55" y="104" width="510" height="66" rx="7" fill="#f7f8fa" stroke="#d8dfe7"/>
    <text x="78" y="142" font-size="22" font-weight="700" fill="#1f242c">INCOMING TASK + BUSINESS CONTEXT</text>
    <path d="M310 170V207" fill="none" stroke="#1254f5" stroke-width="2.3" marker-end="url(#route-arrow)"/>
    <rect x="55" y="214" width="510" height="90" rx="7" fill="#eef3fe" stroke="#1254f5"/>
    <text x="78" y="252" font-size="23" font-weight="700" fill="#183c8f">ROUTER + POLICY GATE</text>
    <text x="78" y="280" font-size="17" fill="#315f9f">Task fit, evidence, permissions and escalation</text>
    <path d="M310 304V333" fill="none" stroke="#1254f5" stroke-width="2.3" marker-end="url(#route-arrow)"/>
    <text x="57" y="357" font-size="17" fill="#57606e">Candidate models (one is selected)</text>
    <rect x="55" y="372" width="510" height="72" rx="7" fill="#ffffff" stroke="#d8dfe7"/>
    <rect x="55" y="372" width="6" height="72" fill="#1254f5"/>
    <text x="78" y="401" font-size="22" font-weight="700" fill="#1f242c">FRONTIER MODEL</text>
    <text x="78" y="426" font-size="17" fill="#57606e">Complex, ambiguous or high-uncertainty tasks</text>
    <rect x="55" y="457" width="510" height="72" rx="7" fill="#ffffff" stroke="#d8dfe7"/>
    <rect x="55" y="457" width="6" height="72" fill="#1254f5"/>
    <text x="78" y="486" font-size="22" font-weight="700" fill="#1f242c">SMALLER OPEN MODEL</text>
    <text x="78" y="511" font-size="17" fill="#57606e">Repeatable tasks that pass the same quality gates</text>
    <rect x="55" y="542" width="510" height="72" rx="7" fill="#ffffff" stroke="#d8dfe7"/>
    <rect x="55" y="542" width="6" height="72" fill="#1254f5"/>
    <text x="78" y="571" font-size="22" font-weight="700" fill="#1f242c">SPECIALIZED MODEL</text>
    <text x="78" y="596" font-size="17" fill="#57606e">Stable, high-volume domain work after evaluation</text>
    <path d="M310 614V646" fill="none" stroke="#1254f5" stroke-width="2.3" marker-end="url(#route-arrow)"/>
    <rect x="55" y="653" width="510" height="64" rx="7" fill="#f7f8fa" stroke="#d8dfe7"/>
    <text x="78" y="679" font-size="21" font-weight="700" fill="#1f242c">OUTCOME + EVAL FEEDBACK</text>
    <text x="78" y="702" font-size="16" fill="#57606e">Quality, safety, cost, latency, human review</text>
    <text x="55" y="752" font-size="16" fill="#57606e">Conceptual architecture. No performance claim.</text>
  </g>
</svg>