<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="770" viewBox="0 0 620 770" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">The organizational agent improvement loop</title>
  <desc id="loop-desc">Five steps: real work, traces and feedback, curated test cases, targeted change, and evaluated release. Observed results feed the next iteration.</desc>
  <defs>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1254f5"/></marker>
  </defs>
  <rect width="620" height="770" fill="#ffffff"/>
  <text x="42" y="46" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1f242c">Work becomes evidence</text>
  <text x="42" y="78" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#57606e">A controlled improvement loop, not automatic retraining</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="54" y="110" width="502" height="88" rx="8" fill="#f7f8fa" stroke="#d8dfe7"/>
    <text x="78" y="147" font-size="23" font-weight="700" fill="#1f242c">01  REAL WORK</text>
    <text x="78" y="177" font-size="17" fill="#57606e">Tasks, tools, outcomes and human decisions</text>
    <path d="M 305 198 V 225" stroke="#1254f5" stroke-width="2.3" marker-end="url(#loop-arrow)"/>
    <rect x="54" y="232" width="502" height="88" rx="8" fill="#ffffff" stroke="#d8dfe7"/>
    <text x="78" y="269" font-size="23" font-weight="700" fill="#1f242c">02  TRACES + FEEDBACK</text>
    <text x="78" y="299" font-size="17" fill="#57606e">What happened, what failed, what was corrected</text>
    <path d="M 305 320 V 347" stroke="#1254f5" stroke-width="2.3" marker-end="url(#loop-arrow)"/>
    <rect x="54" y="354" width="502" height="88" rx="8" fill="#eef3fe" stroke="#1254f5"/>
    <text x="78" y="391" font-size="23" font-weight="700" fill="#183c8f">03  CURATED EVAL CASES</text>
    <text x="78" y="421" font-size="17" fill="#315f9f">Reproducible cases with trusted acceptance checks</text>
    <path d="M 305 442 V 469" stroke="#1254f5" stroke-width="2.3" marker-end="url(#loop-arrow)"/>
    <rect x="54" y="476" width="502" height="88" rx="8" fill="#ffffff" stroke="#d8dfe7"/>
    <text x="78" y="513" font-size="23" font-weight="700" fill="#1f242c">04  TARGETED CHANGE</text>
    <text x="78" y="543" font-size="17" fill="#57606e">Skill, retrieval, router, policy or model update</text>
    <path d="M 305 564 V 591" stroke="#1254f5" stroke-width="2.3" marker-end="url(#loop-arrow)"/>
    <rect x="54" y="598" width="502" height="88" rx="8" fill="#ffffff" stroke="#d8dfe7"/>
    <text x="78" y="635" font-size="23" font-weight="700" fill="#1f242c">05  COMPARE + RELEASE</text>
    <text x="78" y="665" font-size="17" fill="#57606e">Quality, safety, latency, cost and rollback</text>
    <path d="M 556 642 H 589 V 155 H 557" stroke="#1254f5" stroke-width="2.2" stroke-dasharray="7 7" fill="none" marker-end="url(#loop-arrow)"/>
    <text x="55" y="742" font-size="17" fill="#57606e">Only a measured improvement moves forward.</text>
  </g>
</svg>