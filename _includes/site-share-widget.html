<aside class="site-share" data-site-share aria-labelledby="site-share-title">
  <div>
    <p class="site-share__eyebrow">Share</p>
    <h2 id="site-share-title">Send this page to a colleague</h2>
    <p>Copy the link, share it, or mark it useful for later.</p>
  </div>
  <div class="site-share__actions" aria-label="Share this page">
    <button class="site-share__action" type="button" data-site-share-native>
      <span class="material-symbols-outlined" aria-hidden="true">ios_share</span><span>Share</span>
    </button>
    <button class="site-share__action" type="button" data-site-share-copy>
      <span class="material-symbols-outlined" aria-hidden="true">link</span><span>Copy link</span>
    </button>
    <a class="site-share__action" data-site-share-email href="mailto:?subject={{ page.title | url_encode }}&body={{ site.url }}{{ page.url }}">
      <span class="material-symbols-outlined" aria-hidden="true">mail</span><span>Send by email</span>
    </a>
    <button class="site-share__action" type="button" data-site-share-like aria-pressed="false">
      <span class="material-symbols-outlined" aria-hidden="true">thumb_up</span><span>Helpful</span>
    </button>
  </div>
  <p class="site-share__status" aria-live="polite" data-site-share-status>Helpful marks are stored only on this device.</p>
</aside>
