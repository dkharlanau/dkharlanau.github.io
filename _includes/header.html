{% assign nav_ui = locale_data.ui.navigation %}
<header class="site-header" data-site-header>
  <div class="wrapper site-header__inner">
    <a class="site-brand" href="/" aria-label="{{ nav_ui.home | default: 'Home' }} — Dzmitryi Kharlanau">
      <img class="site-brand__mark" src="{{ '/assets/img/logo-d.svg' | relative_url }}" alt="" width="30" height="30" />
    </a>

    <button class="site-nav__toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
      <span class="site-nav__toggle-label">{{ nav_ui.menu | default: 'Menu' }}</span>
      <span class="site-nav__toggle-mark" aria-hidden="true"></span>
    </button>

    <nav class="site-nav" aria-label="{{ nav_ui.label | default: 'Primary navigation' }}">
      <div class="nav-links" id="site-navigation">
        {% if page.home_locale %}
        {% include home-language-switcher.html %}
        {% else %}
        <a href="/knowledge/" class="nav-link{% if page.url contains '/knowledge/' or page.url contains '/atlas/' or page.url contains '/scenarios/' or page.url contains '/research/' or page.url contains '/blog/' or page.url contains '/notes/' %} is-active{% endif %}"{% if page.url contains '/knowledge/' %} aria-current="page"{% endif %}>Knowledge</a>
        <a href="/labs/" class="nav-link{% if page.url contains '/labs/' or page.url == '/lab/' %} is-active{% endif %}"{% if page.url == '/labs/' %} aria-current="page"{% endif %}>{{ nav_ui.labs | default: 'Labs' }}</a>
        <a href="/frameworks/" class="nav-link{% if page.url contains '/frameworks/' or page.url contains '/triz/' or page.url contains '/ddd/' or page.url contains '/reusable-data-procedures/' %} is-active{% endif %}"{% if page.url contains '/frameworks/' %} aria-current="page"{% endif %}>Frameworks</a>
        <a href="/services/" class="nav-link{% if page.url contains '/services/' %} is-active{% endif %}"{% if page.url contains '/services/' %} aria-current="page"{% endif %}>{{ nav_ui.services | default: 'Services' }}</a>
        <a href="/search/" class="nav-link nav-link--utility{% if page.url == '/search/' %} is-active{% endif %}" aria-label="{{ nav_ui.search | default: 'Search' }}"{% if page.url == '/search/' %} aria-current="page"{% endif %}>
          <span class="material-symbols-outlined" aria-hidden="true">search</span>
          <span class="nav-link__search-label">{{ nav_ui.search | default: 'Search' }}</span>
        </a>
        {% endif %}
      </div>
    </nav>
  </div>
</header>
