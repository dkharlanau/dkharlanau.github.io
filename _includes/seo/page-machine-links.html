{% comment %}
Per-page machine-readable discovery links.
No visible content is emitted. Homepage rendered text remains unchanged.
{% endcomment %}
<link rel="describedby" type="application/json" href="{{ '/ai/site-profile.json' | absolute_url }}" title="Agent-Ready Web Profile" />
<link rel="describedby" type="application/json" href="{{ '/ai/ai-search-profile.json' | absolute_url }}" title="AI Search and Citation Profile" />
<link rel="describedby" type="application/json" href="{{ '/trust/trust.json' | absolute_url }}" title="Trust Center" />
<link rel="describedby" type="application/ld+json" href="{{ '/ai/entity-graph.jsonld' | absolute_url }}" title="Canonical entity graph" />
<link rel="describedby" type="application/json" href="{{ '/ai/page-knowledge-index.json' | absolute_url }}" title="Knowledge page catalog" />
{% if page.ai_sidecar %}
<link rel="alternate" type="application/json" href="{{ page.ai_sidecar | absolute_url }}" title="Machine-readable page data" />
<link rel="describedby" type="application/json" href="{{ page.ai_sidecar | absolute_url }}" title="Page knowledge sidecar" />
{% endif %}
{% if page.machine_readable %}
  {% for machine_url in page.machine_readable %}
<link rel="alternate" type="application/json" href="{{ machine_url | absolute_url }}" />
  {% endfor %}
{% endif %}
