name: AI Metadata Preview

on:
  pull_request:
  push:
    branches:
      - agent/enterprise-ai-pilots

permissions:
  contents: write

jobs:
  preview:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python3 -m pip install pyyaml
      - name: Generate canonical metadata
        run: python3 scripts/knowledge_publication_loop.py
      - name: Commit canonical metadata if changed
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet; then
            echo 'Generated metadata is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/ ai/ _data/labs/semantic_relations.yml
          git commit -m 'Refresh generated AI publication metadata'
          git push origin HEAD:"${TARGET_BRANCH}"
