name: AI Metadata Preview Cleanup

on:
  pull_request:
  push:
    branches:
      - agent/enterprise-ai-pilots

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Remove this temporary workflow from the PR branch
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          if [ ! -f .github/workflows/ai-metadata-preview.yml ]; then
            echo 'Temporary workflow is already removed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ai-metadata-preview.yml
          git commit -m 'Remove temporary metadata preview workflow'
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:"${TARGET_BRANCH}"
