name: Temporary Pricing billing detail

on:
  push:
    branches:
      - agent/sales-order-decision-map

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install pyyaml
      - name: Add billing repricing detail
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          graph = Path('_data/labs/enterprise_context/graphs/pricing.yml')
          text = graph.read_text(encoding='utf-8')
          marker = '\npractitioner_heuristics:\n'
          block = '''
billing_repricing:
  title: "Billing pricing type is a design decision"
  summary: >-
    Billing can copy pricing from the reference document or execute pricing again.
    The pricing type is configured in copying control at item level. When order and
    invoice values differ, I check this before treating the difference as a pricing defect.
  common_types:
    - code: "A"
      behavior: "Copy pricing elements and update according to scale."
      lead_question: "Did billing quantity change the scale result?"
    - code: "B"
      behavior: "Carry out completely new pricing."
      lead_question: "Which billing date and billing context are now driving the search?"
    - code: "C"
      behavior: "Copy manual pricing elements and redetermine the remaining price elements."
      lead_question: "Which values are manual, and which are expected to be redetermined?"
    - code: "D"
      behavior: "Copy pricing elements unchanged."
      lead_question: "Is the business expecting a redetermination that this pricing type intentionally prevents?"
    - code: "E"
      behavior: "Copy pricing elements and values unchanged."
      lead_question: "Should quantity or later context be allowed to change the values at all?"
    - code: "F"
      behavior: "Copy pricing elements, reverse the sign of condition values, and fix the result."
      lead_question: "Is the sign change part of the intended follow-on process?"
    - code: "G"
      behavior: "Copy pricing elements unchanged and redetermine selected conditions such as taxes and intercompany billing conditions."
      lead_question: "Is the difference limited to the condition classes that this type is meant to redetermine?"
    - code: "H"
      behavior: "Copy pricing elements and redetermine freight."
      lead_question: "Is freight the only intended difference from the reference document?"
  diagnostic_sequence:
    - "Read the source document and target billing document."
    - "Identify the reference/copying-control path and item category."
    - "Read the configured pricing type."
    - "Compare pricing analysis in source and target."
    - "Only then inspect billing-side custom fields, exits, or BAdIs."
  remember: >-
    A different invoice price can be correct system behavior. First prove whether the
    copying-control design asks billing to copy, partially redetermine, or fully reprice.
  source_refs:
    - SRC-SAP-PRICING-BILLING-PRICING-TYPES
    - SRC-SAP-PRICING-COPYING-CONTROL

'''
          if 'billing_repricing:' not in text:
              if marker not in text:
                  raise SystemExit('graph insertion marker not found')
              text = text.replace(marker, '\n' + block + 'practitioner_heuristics:\n', 1)
          graph.write_text(text, encoding='utf-8')
          yaml.safe_load(text)

          page = Path('labs/enterprise-context/pricing/index.md')
          p = page.read_text(encoding='utf-8')
          page_marker = '''  <section class="research-canvas__inventory" data-reveal>\n    <header>\n      <p class="research-canvas__eyebrow">Lead reasoning</p>'''
          page_block = '''  <section class="research-canvas__inventory" data-reveal>
    <header>
      <p class="research-canvas__eyebrow">Billing repricing</p>
      <h2>Before debugging the invoice, read the pricing type.</h2>
      <p>Billing does not have one universal pricing behavior. Copying control can ask it to copy conditions, fully reprice, or redetermine only selected parts. I treat that as part of the process design, not as background Customizing.</p>
    </header>
    <div class="ecg-determination-list">
      {% for item in graph.billing_repricing.common_types %}
      <article class="ecg-determination-detail">
        <header>
          <div><span>TYPE {{ item.code }}</span><small>billing pricing</small></div>
          <h3>{{ item.behavior }}</h3>
          <p class="ecg-question">{{ item.lead_question }}</p>
        </header>
      </article>
      {% endfor %}
    </div>
    <div class="ecg-remember"><strong>My sequence</strong><p>{{ graph.billing_repricing.diagnostic_sequence | join: " → " }}</p></div>
    <p class="ecg-lead-lens"><strong>Remember:</strong> {{ graph.billing_repricing.remember }}</p>
  </section>

'''
          if 'Billing repricing' not in p:
              if page_marker not in p:
                  raise SystemExit('page insertion marker not found')
              p = p.replace(page_marker, page_block + page_marker, 1)
          page.write_text(p, encoding='utf-8')
          PY
      - name: Regenerate Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add billing repricing detail"
            git push origin HEAD:${{ github.ref_name }}
          fi