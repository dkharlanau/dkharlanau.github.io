name: ARWP validation

on:
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - 'datasets/**'
      - '.well-known/**'
      - 'mcp/**'
      - 'trust/**'
      - 'evidence/**'
      - 'crawler-matrix/**'
      - 'knowledge/**'
      - 'media/**'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'robots.txt'
      - 'SECURITY.md'
      - '_includes/seo/page-machine-links.html'
      - '.github/workflows/arwp.yml'
  pull_request:
    paths:
      - 'ai/**'
      - 'datasets/**'
      - '.well-known/**'
      - 'mcp/**'
      - 'trust/**'
      - 'evidence/**'
      - 'crawler-matrix/**'
      - 'knowledge/**'
      - 'media/**'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'robots.txt'
      - 'SECURITY.md'
      - '_includes/seo/page-machine-links.html'
      - '.github/workflows/arwp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Agent-Ready Web Profile
        uses: dkharlanau/agent-ready-web-profile@c1d51698e3765d0817ee14bcbc36c67297457260
        with:
          profile: ai/site-profile.json
