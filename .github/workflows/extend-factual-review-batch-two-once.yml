          tests = tests.replace(old_summary, new_summary, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY
      - name: Refresh promotion readiness after factual review page change
        run: python3 scripts/audit_assessment_promotion_readiness.py
      - name: Refresh Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Run assessment tests
        run: python3 -m pytest tests/test_assessment_practice_layer.py
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/assessment/data/factual-review.json labs/assessment/factual-review/index.html labs/assessment/data/catalog.json labs/assessment/data/backlog.json labs/assessment/index.md tests/test_assessment_practice_layer.py labs/assessment/data/promotion-readiness.json ai/markdown-clusters.json
          git commit -m "feat: expand SAP factual review coverage"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            python3 scripts/audit_assessment_promotion_readiness.py
            python3 scripts/generate_atlas_artifacts.py
            git add labs/assessment/data/promotion-readiness.json ai/markdown-clusters.json
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          done
          exit 1
