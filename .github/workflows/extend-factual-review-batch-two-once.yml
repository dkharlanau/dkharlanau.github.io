                  'claim_type': 'configuration_behavior',
                  'status': 'source_supported',
                  'source_refs': ['SRC-SAP-CREDIT-CHECK-RULE', 'SRC-SAP-CREDIT-CHECK-STEPS', 'SRC-SAP-CREDIT-BP'],
