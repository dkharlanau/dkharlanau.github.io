                  'source_refs': ['SRC-SAP-AATP-API'],
                  'official_evidence': ['https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/f5d3e1005efd4e86acf9a65abf428082/e2b6448e88ce4f32b34a512f92c183bf.html'],
