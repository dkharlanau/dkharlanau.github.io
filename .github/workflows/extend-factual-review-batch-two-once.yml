name: Extend Factual Review Batch Two Once

on:
  push:
    branches: [main]
    paths: [".github/workflows/extend-factual-review-batch-two-once.yml"]

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install pyyaml pytest
      - name: Extend factual review registry and navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          root = Path('.')
          review_path = root / 'labs/assessment/data/factual-review.json'
          review = json.loads(review_path.read_text(encoding='utf-8'))

          new_routes = [
              {
                  'route': '/labs/enterprise-context/atp/',
                  'title': 'ATP / aATP',
                  'review_status': 'primary_source_review_complete',
                  'reviewed_at': '2026-08-16',
                  'page_verified': False,
                  'human_verification_required': True,
                  'claim_ids': ['FACT-ATP-001', 'FACT-ATP-002', 'FACT-ATP-003'],
              },
              {
                  'route': '/labs/enterprise-context/credit/',
