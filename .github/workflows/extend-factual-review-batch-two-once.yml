                  'product_scope': 'SAP S/4HANA Extended Warehouse Management',
                  'release_scope': 'SAP S/4HANA 2025 FPS01',
                  'reviewed_at': '2026-08-16',
                  'human_verification_required': True,
              },
              {
                  'id': 'FACT-EWM-002',
                  'route': '/labs/enterprise-context/ewm/',
                  'claim': 'A warehouse order is an executable work package that groups warehouse tasks or physical inventory items. Warehouse order creation rules control how tasks are grouped for warehouse execution.',
                  'claim_type': 'configuration_behavior',
                  'status': 'source_supported',
                  'source_refs': ['SRC-SAP-EWM-WAREHOUSE-ORDER'],
                  'official_evidence': ['https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/9832125c23154a179bfa1784cdc9577a/65cccb53ad377114e10000000a174cb4.html', 'https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/9832125c23154a179bfa1784cdc9577a/48890776d2b21b5ae10000000a42189c.html'],
                  'product_scope': 'SAP S/4HANA Extended Warehouse Management',
                  'release_scope': 'SAP S/4HANA 2025 FPS01',
                  'reviewed_at': '2026-08-16',
                  'human_verification_required': True,
              },
              {
                  'id': 'FACT-EWM-003',
                  'route': '/labs/enterprise-context/ewm/',
                  'claim': 'Releasing a wave can create warehouse tasks for stock removal or internal movements. EWM then creates warehouse orders from those tasks to form work packages, and task creation updates the referenced warehouse request and document flow.',
                  'claim_type': 'documented_behavior',
                  'status': 'source_supported',
                  'source_refs': ['SRC-SAP-EWM-WAVE', 'SRC-SAP-EWM-WAREHOUSE-ORDER', 'SRC-SAP-EWM-WAREHOUSE-REQUEST'],
                  'official_evidence': ['https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/9832125c23154a179bfa1784cdc9577a/7fcccb53ad377114e10000000a174cb4.html'],
                  'product_scope': 'SAP S/4HANA Extended Warehouse Management',
                  'release_scope': 'SAP S/4HANA 2025 FPS01',
                  'reviewed_at': '2026-08-16',
                  'human_verification_required': True,
              },
              {
                  'id': 'FACT-DEPLOY-001',
                  'route': '/labs/enterprise-context/deployment-models/',
                  'claim': 'SAP S/4HANA Cloud Public Edition is operated and maintained by SAP, uses a more standardized configurable functional scope, and SAP manages its software upgrades.',
                  'claim_type': 'release_scope',
                  'status': 'source_supported',
                  'source_refs': ['SRC-SAP-S4-OFFERING-COMPARISON'],
                  'official_evidence': ['https://help.sap.com/docs/SAP_S4HANA_CLOUD_PE/b89b8b9026e1456bb2a1df7c0d59c937/1485d139460246d2a4b936c0bb0ca272.html'],
                  'product_scope': 'SAP S/4HANA Cloud Public Edition',
                  'release_scope': 'Current SAP offering comparison checked 2026-08-16',
                  'reviewed_at': '2026-08-16',
                  'human_verification_required': True,
              },
              {
                  'id': 'FACT-DEPLOY-002',
                  'route': '/labs/enterprise-context/deployment-models/',
                  'claim': 'SAP S/4HANA Cloud Private Edition has a functional scope and upgrade flexibility comparable to SAP S/4HANA. SAP publishes a new software version every two years and installs upgrades at the customer request within the maintenance obligations.',
                  'claim_type': 'release_scope',
                  'status': 'source_supported',
                  'source_refs': ['SRC-SAP-S4-OFFERING-COMPARISON', 'SRC-SAP-S4-PRIVATE-EDITION'],
                  'official_evidence': ['https://help.sap.com/docs/SAP_S4HANA_CLOUD_PE/b89b8b9026e1456bb2a1df7c0d59c937/1485d139460246d2a4b936c0bb0ca272.html'],
                  'product_scope': 'SAP S/4HANA Cloud Private Edition',
                  'release_scope': 'Current SAP offering comparison checked 2026-08-16',
                  'reviewed_at': '2026-08-16',
                  'human_verification_required': True,
              },
              {
                  'id': 'FACT-DEPLOY-003',
                  'route': '/labs/enterprise-context/deployment-models/',
                  'claim': 'For SAP S/4HANA on-premise, the customer manages software and hardware updates and decides whether and when to upgrade. Its software release cycle is parallel to SAP S/4HANA Cloud Private Edition.',
                  'claim_type': 'release_scope',
                  'status': 'source_supported',
                  'source_refs': ['SRC-SAP-S4-OFFERING-COMPARISON', 'SRC-SAP-S4-ONPREM-PRIVATE-DOC'],
                  'official_evidence': ['https://help.sap.com/docs/SAP_S4HANA_CLOUD_PE/b89b8b9026e1456bb2a1df7c0d59c937/1485d139460246d2a4b936c0bb0ca272.html'],
                  'product_scope': 'SAP S/4HANA on-premise',
                  'release_scope': 'Current SAP offering comparison checked 2026-08-16',
                  'reviewed_at': '2026-08-16',
                  'human_verification_required': True,
              },
          ]

          routes = {item['route']: item for item in review['routes']}
          for item in new_routes:
              routes[item['route']] = item
          claims = {item['id']: item for item in review['claims']}
          for item in new_claims:
              claims[item['id']] = item
          review['routes'] = [routes[key] for key in sorted(routes)]
          review['claims'] = [claims[key] for key in sorted(claims)]
          review['version'] = '1.1.0'
          review['updated_at'] = '2026-08-16'
          review['summary'] = {
              'routes_reviewed': len(review['routes']),
              'claims_reviewed': len(review['claims']),
              'source_supported': sum(1 for item in review['claims'] if item['status'] == 'source_supported'),
              'source_conflict': sum(1 for item in review['claims'] if item['status'] == 'source_conflict'),
              'human_verification_required': sum(1 for item in review['claims'] if item['human_verification_required']),
          }
          review_path.write_text(json.dumps(review, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          page_path = root / 'labs/assessment/factual-review/index.html'
          text = page_path.read_text(encoding='utf-8')
          text = text.replace('<p>First review batch</p>', '<p>Current review coverage</p>', 1)
          text = text.replace('id="fact-routes">2</strong>', 'id="fact-routes">6</strong>', 1)
          text = text.replace('id="fact-claims">11</strong>', 'id="fact-claims">23</strong>', 1)
          text = text.replace('id="fact-supported">11</strong>', 'id="fact-supported">23</strong>', 1)
          old_header = '<header><p class="research-canvas__eyebrow">Batch 01</p><h2>Start where an operational mistake is expensive.</h2><p>Integration recovery and billing contain several details where a wrong assumption can create duplicate documents, bad recovery, or incorrect financial output.</p></header>'
          new_header = '<header><p class="research-canvas__eyebrow">Reviewed routes</p><h2>Start with claims that change a design or recovery decision.</h2><p>The first two batches cover integration recovery, billing, ATP, credit, warehouse execution, and deployment boundaries. These are areas where a small release or configuration assumption can change the answer.</p></header>'
          if old_header not in text:
              raise SystemExit('Factual review page header anchor not found')
          text = text.replace(old_header, new_header, 1)
          old_cards = '      <a href="/labs/enterprise-context/billing/"><span>5</span><strong>Billing & Revenue Handoff</strong><small>Billing processing, copying control, pricing, collective billing, and split analysis checked against current SAP Help.</small><i class="material-symbols-outlined" aria-hidden="true">receipt_long</i></a>'
          new_cards = old_cards + '\n' + '''      <a href="/labs/enterprise-context/atp/"><span>3</span><strong>ATP / aATP</strong><small>Advanced ATP API behavior, Supply Protection, and the PAL/SUP boundary checked against SAP S/4HANA 2025 FPS01.</small><i class="material-symbols-outlined" aria-hidden="true">inventory</i></a>\n      <a href="/labs/enterprise-context/credit/"><span>3</span><strong>Credit Management</strong><small>Check timing, check rules and steps, document blocking, and SD credit exposure reviewed against 2025 FPS01.</small><i class="material-symbols-outlined" aria-hidden="true">credit_score</i></a>\n      <a href="/labs/enterprise-context/ewm/"><span>3</span><strong>Extended Warehouse Management</strong><small>Warehouse task, warehouse order, wave release, and document-flow behavior checked against EWM 2025 FPS01.</small><i class="material-symbols-outlined" aria-hidden="true">warehouse</i></a>\n      <a href="/labs/enterprise-context/deployment-models/"><span>3</span><strong>Deployment Models</strong><small>Public, Private, and on-premise operational and upgrade boundaries checked against the current SAP offering comparison.</small><i class="material-symbols-outlined" aria-hidden="true">cloud</i></a>'''
          if old_cards not in text:
              raise SystemExit('Factual review cards anchor not found')
          text = text.replace(old_cards, new_cards, 1)
          text = text.replace('Eleven reviewed claims across Integration Operations and Billing.', 'Twenty-three reviewed claims across six release-sensitive SAP routes.', 1)
          page_path.write_text(text, encoding='utf-8')

          catalog_path = root / 'labs/assessment/data/catalog.json'
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          catalog['version'] = '1.7.0'
          strong = catalog['coverage']['strong_now']
          marker = 'Primary-source factual review across Integration Operations, Billing, ATP, Credit, EWM, and deployment models'
          if marker not in strong:
              strong.append(marker)
          catalog['coverage']['next_practice_layers'] = [
              'continue factual review with Production, Quality, Inventory, Finance Logistics, Automotive, and TM',
              'integrate factual-review state into promotion prioritization instead of treating all structurally ready pages equally',
              'connect real assessment feedback to review priorities without turning feedback into automatic truth',
              'extend graph-backed candidate generation only where evidence coverage is strong'
          ]
          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          backlog_path = root / 'labs/assessment/data/backlog.json'
          backlog = json.loads(backlog_path.read_text(encoding='utf-8'))
          items = {item['id']: item for item in backlog['items']}
          items['LOOP-018'] = {
              'id': 'LOOP-018',
              'priority': 'P1',
              'title': 'Factual review batch two: ATP, Credit, EWM, Deployment',
              'status': 'done',
              'outputs': ['/labs/assessment/factual-review/', '/labs/assessment/data/factual-review.json'],
              'reviewed_routes': ['/labs/enterprise-context/atp/', '/labs/enterprise-context/credit/', '/labs/enterprise-context/ewm/', '/labs/enterprise-context/deployment-models/'],
