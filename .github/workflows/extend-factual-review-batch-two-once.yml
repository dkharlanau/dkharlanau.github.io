                  'title': 'SAP S/4HANA Deployment Models',
                  'review_status': 'primary_source_review_complete',
                  'reviewed_at': '2026-08-16',
                  'page_verified': False,
                  'human_verification_required': True,
                  'claim_ids': ['FACT-DEPLOY-001', 'FACT-DEPLOY-002', 'FACT-DEPLOY-003'],
