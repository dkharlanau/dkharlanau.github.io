          assessment_path = root / 'labs/assessment/index.md'
          assessment = assessment_path.read_text(encoding='utf-8')
          assessment = assessment.replace(
              '<li>Continue claim-level factual review for ATP, Credit, EWM, and deployment-sensitive architecture routes</li>',
              '<li>Integrate factual-review coverage into promotion prioritization</li>',
              1,
          )
          assessment = assessment.replace(
              '<a href="/labs/assessment/data/factual-review.json"><span>11</span><strong>Factual Review Registry</strong><small>Eleven source-supported claims across Integration Operations and Billing; page verification remains unchanged.</small>',
              '<a href="/labs/assessment/data/factual-review.json"><span>23</span><strong>Factual Review Registry</strong><small>Twenty-three source-supported claims across six release-sensitive SAP routes; page verification remains unchanged.</small>',
              1,
          )
          assessment = assessment.replace('LOOP-001 through LOOP-017 are complete; next work expands factual review to other release-sensitive routes.', 'LOOP-001 through LOOP-018 are complete; next work connects factual coverage to promotion priority.', 1)
          assessment_path.write_text(assessment, encoding='utf-8')

          tests_path = root / 'tests/test_assessment_practice_layer.py'
          tests = tests_path.read_text(encoding='utf-8')
          tests = tests.replace(
              '("LOOP-010", "LOOP-011", "LOOP-012", "LOOP-013", "LOOP-014", "LOOP-015", "LOOP-016", "LOOP-017")',
              '("LOOP-010", "LOOP-011", "LOOP-012", "LOOP-013", "LOOP-014", "LOOP-015", "LOOP-016", "LOOP-017", "LOOP-018")',
              1,
          )
          old_summary = '''    assert review["summary"] == {\n        "routes_reviewed": 2,\n        "claims_reviewed": 11,\n        "source_supported": 11,\n        "source_conflict": 0,\n        "human_verification_required": 11,\n    }'''
          new_summary = '''    assert review["summary"]["routes_reviewed"] == len(review["routes"])\n    assert review["summary"]["claims_reviewed"] == len(review["claims"])\n    assert review["summary"]["source_supported"] == sum(1 for claim in review["claims"] if claim["status"] == "source_supported")\n    assert review["summary"]["source_conflict"] == sum(1 for claim in review["claims"] if claim["status"] == "source_conflict")\n    assert review["summary"]["human_verification_required"] == sum(1 for claim in review["claims"] if claim["human_verification_required"])\n    assert review["summary"]["routes_reviewed"] == 6\n    assert review["summary"]["claims_reviewed"] == 23'''
