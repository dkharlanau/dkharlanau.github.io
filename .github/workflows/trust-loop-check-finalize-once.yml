name: Trust Loop Check Finalize Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trust-loop-check-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml

      - name: Make report output non-blocking in check mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ai_search_trust_loop.py')
          text = path.read_text(encoding='utf-8')
          old = '    write_or_check(REPORT_JSON, report_json, args.check, changed)\n    write_or_check(REPORT_MD, "\\n".join(report_md), args.check, changed)\n'
          new = '    # Reports are ephemeral run artifacts and are ignored by Git. A clean checkout\n    # must be able to use --check without failing because reports/seo is absent.\n    if not args.check:\n        write_or_check(REPORT_JSON, report_json, False, changed)\n        write_or_check(REPORT_MD, "\\n".join(report_md), False, changed)\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one report check block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Prove clean-run check
        run: python3 scripts/ai_search_trust_loop.py --check

      - name: Prove no tracked page drift
        run: git diff --exit-code -- . ':!scripts/ai_search_trust_loop.py'

      - name: Remove one-shot workflow
        run: rm .github/workflows/trust-loop-check-finalize-once.yml

      - name: Commit final check behavior
        run: |
          git config user.name 'DKharlanau Site Automation'
          git config user.email 'dkharlanau@users.noreply.github.com'
          git add scripts/ai_search_trust_loop.py .github/workflows/trust-loop-check-finalize-once.yml
          git diff --cached --check
          git commit -m 'Make AI search trust check clean-run safe'
          git push origin HEAD:main
