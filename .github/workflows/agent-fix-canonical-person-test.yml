name: Agent Fix Canonical Person Test

on:
  push:
    branches:
      - agent/site-trust-connectivity-20260816
    paths:
      - '.github/workflows/agent-fix-canonical-person-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-trust-connectivity-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch outdated inline-Person expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_seo_discovery.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_article_publisher_is_site_author_not_employer():
              path = REPO_ROOT / "_includes" / "seo" / "structured-data.html"
              text = path.read_text(encoding="utf-8")
              article_block = text.split(
                  "{% comment %} Article / TechArticle", 1
              )[1].split("{% comment %} ProfilePage entities", 1)[0]
              publisher = article_block.split('"publisher":', 1)[1].split("},", 1)[0]
              assert '"@type": "Person"' in publisher
              assert '"@id": "{{ author_id }}"' in publisher
              assert "resume.schema.worksFor" not in publisher
          '''
          new = '''def test_article_publisher_references_canonical_site_author():
              path = REPO_ROOT / "_includes" / "seo" / "structured-data.html"
              text = path.read_text(encoding="utf-8")
              article_block = text.split(
                  "{% comment %} Article / TechArticle", 1
              )[1].split("{% comment %} ProfilePage entities", 1)[0]
              publisher = article_block.split('"publisher":', 1)[1].split("},", 1)[0]
              assert '"@id": "{{ author_id }}"' in publisher
              assert '"@type": "Person"' not in publisher
              assert '"sameAs"' not in publisher
              assert "resume.schema.worksFor" not in publisher
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old test block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run focused regression tests
        run: |
          python3 -m pip install pytest pyyaml
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest \
            tests/test_production_urls.py::test_structured_data_uses_one_person_identity \
            tests/test_seo_discovery.py::test_article_publisher_references_canonical_site_author
      - name: Commit patched test
        run: |
          git config user.name 'dkharlanau'
          git config user.email 'dkharlanau@gmail.com'
          git add tests/test_seo_discovery.py
          git commit -m 'Align publisher regression test with canonical Person ID'
          git push origin HEAD:agent/site-trust-connectivity-20260816
