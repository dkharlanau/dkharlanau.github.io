name: Branch Artifact Refresh

on:
  push:
    branches:
      - agent/add-brfplus-aif-frameworks

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/add-brfplus-aif-frameworks
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependency
        run: python -m pip install pyyaml

      - name: Regenerate Atlas artifacts
        run: python scripts/generate_atlas_artifacts.py

      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/expert-promotion-inventory.json ai/markdown-clusters.json
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
          else
            git commit -m "Refresh Atlas artifacts for ISLM"
            git push origin HEAD:agent/add-brfplus-aif-frameworks
          fi