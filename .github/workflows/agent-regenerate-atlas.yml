name: Agent Regenerate Atlas

on:
  push:
    branches:
      - codex/mdg-enterprise-context
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/mdg-enterprise-context

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python -m pip install PyYAML

      - name: Regenerate Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py

      - name: Commit deterministic generated indexes
        shell: bash
        run: |
          if git diff --quiet -- ai/markdown-clusters.json ai/expert-promotion-inventory.json; then
            echo "Atlas indexes are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/markdown-clusters.json ai/expert-promotion-inventory.json
          git commit -m "Regenerate Atlas AI indexes"
          git push origin HEAD:codex/mdg-enterprise-context
