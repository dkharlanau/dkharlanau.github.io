name: Refresh Atlas artifacts

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/refresh-atlas-artifacts.yml"

permissions:
  contents: write

concurrency:
  group: refresh-atlas-artifacts-main
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python3 -m pip install pyyaml

      - name: Regenerate Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Atlas artifacts are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Refresh generated Atlas artifacts"
          git push
