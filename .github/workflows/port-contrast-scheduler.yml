name: port-contrast-scheduler-main

on:
  push:
    branches: [agent/port-contrast-scheduler-main]
    paths:
      - .github/workflows/port-contrast-scheduler.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  port-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/port-contrast-scheduler-main
          fetch-depth: 0

      - name: Fetch historical branch
        run: git fetch origin agent/contrast-scheduler-v2

      - name: Replay historical feature commits onto current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for commit in $(git rev-list --reverse 7e81be45bb2efcc84a1a242b2309048f943ebe29..origin/agent/contrast-scheduler-v2); do
            git cherry-pick "$commit"
          done

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
          bundler-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python3 -m pip install pytest pyyaml

      - name: Materialize current repository state
        run: python3 scripts/sync_repository_state.py

      - name: Run current Python suite
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests

      - name: Build current Jekyll site
        run: bundle exec jekyll build --trace

      - name: Commit verified replay
        run: |
          rm .github/workflows/port-contrast-scheduler.yml
          git add -A
          git commit -m "Port Contrast Lab and scheduler onto current main"
          git push origin HEAD:agent/port-contrast-scheduler-main
