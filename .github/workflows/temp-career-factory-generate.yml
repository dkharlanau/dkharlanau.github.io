name: Temporary Career Factory Generator

on:
  push:
    branches: [agent/career-factory-v2]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/career-factory-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pyyaml
      - run: python3 scripts/generate_career_factory.py
      - name: Commit generated inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/career-factory.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Career Factory inventory"
          git push origin HEAD:agent/career-factory-v2
