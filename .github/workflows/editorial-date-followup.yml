name: Editorial Date Follow-up

on:
  push:
    branches:
      - agent/refine-domains-add-business-ai
    paths:
      - .github/workflows/editorial-date-followup.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refine-domains-add-business-ai
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - name: Update review date
        run: |
          sed -i 's/last_modified_at: 2026-07-25/last_modified_at: 2026-08-14/' services/sap-integration-architecture.md
      - run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/sap-integration-architecture.md ai/expert-promotion-inventory.json ai/markdown-clusters.json
          git commit -m "Align sampled integration page review date"
          git push origin HEAD:agent/refine-domains-add-business-ai
