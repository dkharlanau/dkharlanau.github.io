name: Temporary MDG quality fix

on:
  push:
    branches:
      - agent/mdg-knowledge-model
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mdg-knowledge-model
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: python3 -m pip install pyyaml

      - name: Fix MDG quality signals
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'labs/enterprise-context/mdg/data-model/index.md': (
              'description: "Understand SAP MDG data models from governed roots and entity types to keys, staging, active areas, Material structure, and extension decisions."',
              'description: "Problem-first SAP MDG data modeling: roots, entity types, keys, staging, active areas, Material structure, and extension decisions."'
            ),
            'labs/enterprise-context/mdg/deployments/index.md': (
              'description: "Compare SAP MDG on S/4HANA, cloud edition, classic mode, cloud-ready mode, and Public Edition boundaries."',
              'description: "Problem-first comparison of SAP MDG deployment choices, product scope, operating modes, and current domain boundaries."'
            ),
            'labs/enterprise-context/mdg/extensions/index.md': (
              'description: "A practical SAP MDG extension matrix for fields, validations, workflow, nodes, UI, and side-by-side applications across classic, cloud-ready, and cloud edition."',
              'description: "Problem-first SAP MDG extension matrix for fields, logic, workflow, nodes, UI, services, and side-by-side applications."'
            ),
            'labs/enterprise-context/mdg/implementation/index.md': (
              'description: "A practical MDG implementation sequence: ownership, data model, workflow, data quality, replication, testing, operating model, failure modes, and presales questions."',
              'description: "SAP MDG implementation guide for ownership, data model, workflow, quality, replication, testing, operations, and presales."'
            ),
            'labs/enterprise-context/mdg/index.md': (
              'description: "A practical SAP MDG Data Book: products, governance processes, data-model anatomy, ownership, process impact, solution architecture, interface contracts, extensibility, implementation, and assessment reasoning."',
              'description: "SAP MDG Data Book for product scope, data models, ownership, process impact, interfaces, extensibility, operations, and assessment reasoning."'
            ),
            'labs/enterprise-context/mdg/interfaces/index.md': (
              'description: "Object-level SAP MDG interface contracts for Business Partner, Customer, Supplier, and Material, including mapping, errors, reconciliation, and downstream proof."',
              'description: "Problem-first SAP MDG interface contracts for BP, Customer, Supplier, and Material with mapping, errors, reconciliation, and business proof."'
            ),
            'labs/enterprise-context/mdg/reasoning/index.md': (
              'description: "Practice Explain, Compare, Design, and Diagnose questions for SAP MDG with evidence paths, weak answers, Lead-level signals, and scoring dimensions."',
              'description: "Problem-based SAP MDG assessment practice: Explain, Compare, Design, and Diagnose with evidence paths and Lead-level scoring."'
            ),
          }

          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected description not found: {name}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Regenerate Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py

      - name: Commit quality fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/enterprise-context/mdg ai/expert-promotion-inventory.json ai/markdown-clusters.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refine MDG content quality signals"
          git push origin HEAD:agent/mdg-knowledge-model
