name: Agent regenerate Atlas artifacts after metadata fix

on:
  push:
    branches:
      - agent/sap-development-architecture-lab-v2

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/expert-promotion-inventory.json ai/markdown-clusters.json
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
          else
            git commit -m "refresh Atlas artifacts after metadata fix"
            git push
          fi
