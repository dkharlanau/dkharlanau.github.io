name: Repository State Sync

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repository-state-sync-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install pytest pyyaml "pillow>=11,<12"

      - name: Synchronize deterministic repository state
        run: python3 scripts/sync_repository_state.py

      - name: Run Python regression suite on synchronized state
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests

      - name: Commit synchronized state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository state is already synchronized."
            exit 0
          fi
          git commit -m "Sync generated repository state"
          git push origin HEAD:main
