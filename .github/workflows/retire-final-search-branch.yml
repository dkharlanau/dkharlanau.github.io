name: Retire final merged branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retire-final-search-branch.yml

permissions:
  contents: write

jobs:
  retire:
    if: github.repository == 'dkharlanau/dkharlanau.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged search branch
        shell: bash
        run: |
          set -euo pipefail
          branch="search-release-hardening-20260911"
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git push origin --delete "${branch}"
            echo "Deleted ${branch}"
          else
            echo "Already absent ${branch}"
          fi

      - name: Remove one-time cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/retire-final-search-branch.yml
          git commit -m "Remove final branch cleanup workflow"
          git push origin HEAD:main
