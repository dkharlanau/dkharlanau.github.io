name: Sync Assessment Contracts Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-assessment-tests-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml

      - name: Protect homepage content sources
        run: |
          git ls-files index.md '_data/home*' '_data/home_i18n/**' | sort > /tmp/home-files.txt
          while IFS= read -r f; do sha256sum "$f"; done < /tmp/home-files.txt > /tmp/home-before.sha

      - name: Refresh assessment derived artifacts
        run: |
          python3 scripts/generate_assessment_evidence_coverage.py
          python3 scripts/generate_assessment_human_review_queue.py
          python3 scripts/generate_assessment_core_study_map.py
          python3 scripts/generate_assessment_evidence_coverage.py --check
          python3 scripts/generate_assessment_human_review_queue.py --check
          python3 scripts/generate_assessment_core_study_map.py --check

      - name: Update regression contracts to current publication model
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/test_assessment_practice_layer.py')
          text = p.read_text(encoding='utf-8')
          old = '    assert by_route["/labs/enterprise-context/business-ai/"]["priority"] == "P1"\n'
          new = '    assert by_route["/labs/enterprise-context/business-ai/"]["priority"] == "P2"\n    assert by_route["/labs/enterprise-context/business-ai/"]["state"] == "public_or_indexable"\n    assert by_route["/labs/enterprise-context/business-ai/"]["verified"] is True\n'
          if text.count(old) != 1:
              raise SystemExit('assessment Business AI priority assertion anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('tests/test_production_urls.py')
          text = p.read_text(encoding='utf-8')
          old = '    assert structured.count(\'"sameAs": ["{{ author_website_url }}", "{{ author_linkedin_url }}", "{{ author_github_url }}"]\') >= 3\n'
          new = '    assert structured.count(\'"sameAs": ["{{ author_website_url }}", "{{ author_linkedin_url }}", "{{ author_github_url }}"]\') >= 2\n    assert structured.count(\'"sameAs": {{ resume.schema.sameAs | jsonify }}\') == 1\n    profile_duplicate = \'"sameAs": ["{{ author_website_url }}", "{{ author_linkedin_url }}", "{{ author_github_url }}"],\\n  "url": "{{ canonical_url }}"\'\n    assert profile_duplicate not in structured\n'
          if text.count(old) != 1:
              raise SystemExit('Person sameAs count assertion anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('tests/test_sales_diagnostic_casebook.py')
          text = p.read_text(encoding='utf-8')
          old = '    assert "status: draft" in page\n    assert "robots: noindex,follow" in page\n'
          new = '    assert "status: reviewed" in page\n    assert "verified: true" in page\n    assert "robots: index,follow" in page\n    assert "sitemap: true" in page\n    assert \'publication_wave: "public-framework-search-wave-04"\' in page\n'
          if text.count(old) != 1:
              raise SystemExit('Sales diagnostic draft assertion anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run affected tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest \
            tests/test_assessment_practice_layer.py \
            tests/test_production_urls.py \
            tests/test_sales_diagnostic_casebook.py

      - name: Run complete Python suite
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests

      - name: Prove homepage content sources remain unchanged
        run: |
          while IFS= read -r f; do sha256sum "$f"; done < /tmp/home-files.txt > /tmp/home-after.sha
          diff -u /tmp/home-before.sha /tmp/home-after.sha

      - name: Remove one-shot workflow
        run: rm .github/workflows/sync-assessment-tests-once.yml

      - name: Commit synchronized contracts
        run: |
          git config user.name 'DKharlanau Site Automation'
          git config user.email 'dkharlanau@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Sync assessment artifacts with published knowledge state'
          git push origin HEAD:main
