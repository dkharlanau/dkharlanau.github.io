name: Question Bank Final Sync Temp

on:
  push:
    branches:
      - agent/question-bank-v2

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/question-bank-v2
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install pyyaml

      - name: Generate deterministic Career and discovery state
        run: |
          python3 scripts/generate_career_factory.py
          python3 scripts/generate_atlas_artifacts.py

      - name: Commit generated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/career-factory.json ai/expert-promotion-inventory.json ai/markdown-clusters.json
          if git diff --cached --quiet; then
            echo "Generated state is already synchronized."
            exit 0
          fi
          git commit -m "Sync final Question Bank generated state"
          git push origin HEAD:agent/question-bank-v2
