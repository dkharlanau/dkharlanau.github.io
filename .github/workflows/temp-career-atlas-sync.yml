name: Temporary Career Atlas Sync

on:
  push:
    branches: [agent/career-factory-v2]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/career-factory-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pyyaml
      - run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit synchronized discovery artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/markdown-clusters.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync Career Factory discovery index"
          git push origin HEAD:agent/career-factory-v2
