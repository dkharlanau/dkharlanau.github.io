name: Temporary Lead Drills Sync

on:
  push:
    branches:
      - agent/lead-drills-wave

permissions:
  contents: write

jobs:
  sync-generated-artifacts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/lead-drills-wave
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: python3 -m pip install pyyaml

      - name: Regenerate Career Factory inventory
        run: python3 scripts/generate_career_factory.py

      - name: Regenerate Atlas and Markdown cluster artifacts
        run: python3 scripts/generate_atlas_artifacts.py

      - name: Commit generated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/career-factory.json ai/markdown-clusters.json
          if git diff --cached --quiet; then
            echo "Generated artifacts are already synchronized."
            exit 0
          fi
          git commit -m "Regenerate Lead drill inventories"
          git push origin HEAD:agent/lead-drills-wave
