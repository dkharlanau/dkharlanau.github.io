name: LOOP030 Pricing Procurement Pass Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/loop030-pricing-procurement-pass-once.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Apply LOOP-030
        run: python scripts/_loop030_core_routes_pass.py
      - name: Register LOOP-030 in assessment contract test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_assessment_practice_layer.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('"LOOP-027", "LOOP-028", "LOOP-029"):', '"LOOP-027", "LOOP-028", "LOOP-029", "LOOP-030"):')
          p.write_text(t, encoding='utf-8')
          PY
      - name: Refresh derived assessment and Atlas artifacts
        run: |
          python scripts/audit_assessment_promotion_readiness.py
          python scripts/generate_assessment_evidence_coverage.py
          python scripts/generate_assessment_human_review_queue.py
          python scripts/generate_atlas_artifacts.py
      - name: Validate core route pass
        run: |
          python - <<'PY'
          from pathlib import Path
          pricing = Path('labs/enterprise-context/pricing/index.html').read_text(encoding='utf-8')
          procurement = Path('labs/enterprise-context/procurement/index.html').read_text(encoding='utf-8')
          for text in (pricing, procurement):
              assert 'Lead answer frame' in text
              assert 'Evidence boundary:' in text
              assert 'verified: false' in text
              assert 'robots: noindex,follow' in text
              assert 'last_modified_at: 2026-08-16' in text
          assert 'procedure, condition, access, and runtime key' in pricing
          assert 'physical completion from GR/IR and financial completion' in procurement
          PY
          python scripts/audit_assessment_promotion_readiness.py --check
          python scripts/generate_assessment_evidence_coverage.py --check
          python scripts/generate_assessment_human_review_queue.py --check
          PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_assessment_practice_layer.py tests/test_sales_pricing_anatomy.py tests/test_sales_pricing_configuration.py tests/test_sales_pricing_operations.py tests/test_enterprise_context_model.py
      - name: Commit and push with retry
        run: |
          git config user.name "Dzmitryi Kharlanau"
          git config user.email "dkharlanau@gmail.com"
          git add labs/enterprise-context/pricing labs/enterprise-context/procurement labs/assessment scripts tests ai _data
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: sharpen Pricing and Procurement Lead reasoning"
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
