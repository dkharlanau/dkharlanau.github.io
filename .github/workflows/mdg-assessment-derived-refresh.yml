name: Refresh MDG assessment derived state once

on:
  push:
    branches:
      - agent/mdg-lead-decision-layer

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mdg-lead-decision-layer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install pytest pyyaml
      - name: Make reasoning-gap validation follow current coverage
        shell: bash
        run: |
          cat > scripts/validate_assessment_reasoning_gap_candidates.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          DATA = ROOT / "labs" / "assessment" / "data"
          PAGE = ROOT / "labs" / "assessment" / "reasoning-gaps" / "index.html"

          def load(name: str):
              return json.loads((DATA / name).read_text(encoding="utf-8"))

          def load_jsonl(path: Path):
              return [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]

          def main() -> int:
              gaps = load("reasoning-gap-candidates.json")
              coverage = load("reasoning-pressure-coverage.json")
              factual = load("factual-review.json")
              manifest = load("case-sets.json")
              page = PAGE.read_text(encoding="utf-8")
              errors: list[str] = []

              coverage_gaps = {(item["track"], item["level"]): item for item in coverage["authoring_gaps"]}
              plan = {(item["track"], item["level"]): item for item in gaps["gap_plan"]}
              if set(plan) != set(coverage_gaps):
                  errors.append("Reasoning-gap plan must match the current published authoring gaps exactly")
              for key, item in plan.items():
                  if item["published_count"] != coverage_gaps[key]["count"]:
                      errors.append(f"Published count mismatch for reasoning gap {key}")

              candidate_ids = {item["id"] for item in gaps["candidates"]}
              planned_signals = {item.get("review_stage_signal") for item in gaps["gap_plan"]}
              if not candidate_ids <= planned_signals:
                  errors.append("Every authored reasoning-gap candidate must correspond to a current gap-plan signal")
              if gaps["summary"]["new_review_candidates"] != len(gaps["candidates"]):
                  errors.append("Reasoning-gap candidate summary count mismatch")
              if gaps["summary"]["thin_cells_with_review_stage_signal"] != len(gaps["gap_plan"]):
                  errors.append("Reasoning-gap thin-cell summary count mismatch")

              factual_routes = {item["route"]: item for item in factual["routes"]}
              for candidate in gaps["candidates"]:
                  if candidate["level"] not in {"design", "challenge"}:
                      errors.append(f"Reasoning-gap candidate must be Design or Challenge: {candidate['id']}")
                  if len(candidate.get("expected_points", [])) < 6:
                      errors.append(f"Candidate needs at least six expected points: {candidate['id']}")
                  if len(candidate.get("red_flags", [])) < 2:
                      errors.append(f"Candidate needs at least two red flags: {candidate['id']}")
                  if not candidate.get("novelty_note"):
                      errors.append(f"Candidate needs an explicit novelty note: {candidate['id']}")
                  for route in candidate.get("evidence_routes", []):
                      review = factual_routes.get(route)
                      if not review:
                          errors.append(f"Evidence route is not in factual review: {route}")
                          continue
                      if review.get("review_status") != "primary_source_review_complete":
                          errors.append(f"Evidence route is not source-review complete: {route}")
                      if not review.get("claim_ids"):
                          errors.append(f"Evidence route has no reviewed claim ids: {route}")
                      if review.get("page_verified") is not False:
                          errors.append(f"Reasoning-gap authoring must not require verified pages: {route}")

              published_ids = set()
              for case_set in manifest["sets"]:
                  published_ids.update(item["id"] for item in load_jsonl(ROOT / case_set["url"].lstrip("/")))
              if published_ids & candidate_ids:
                  errors.append("Review-stage reasoning candidate entered published manifest")
              if gaps["summary"]["published_cases_changed"] != 0:
                  errors.append("Reasoning-gap candidates must not change published cases")

              for pattern in ("design", "challenge"):
                  if len(gaps.get("pattern_contract", {}).get(pattern, [])) < 6:
                      errors.append(f"{pattern.title()} pattern contract must define at least six reasoning moves")

              for token in ("verified: false", "robots: noindex,follow", "/labs/assessment/data/reasoning-gap-candidates.json"):
                  if token not in page:
                      errors.append(f"Reasoning-gap page missing token: {token}")
              for candidate_id in candidate_ids:
                  if candidate_id not in page:
                      errors.append(f"Reasoning-gap page missing active candidate: {candidate_id}")

              if errors:
                  for error in errors:
                      print(f"ERROR: {error}")
                  return 2
              print(f"Reasoning-gap candidates valid: {len(gaps['gap_plan'])} current thin cells, {len(gaps['candidates'])} authored review candidates, published cases unchanged.")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          cat > scripts/validate_assessment_reasoning_gap_semantic_review.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          DATA = ROOT / "labs" / "assessment" / "data"

          def load(name: str):
              return json.loads((DATA / name).read_text(encoding="utf-8"))

          def load_jsonl(path: Path):
              return [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]

          def main() -> int:
              review = load("reasoning-gap-semantic-review.json")
              candidates = load("reasoning-gap-candidates.json")
              manifest = load("case-sets.json")
              errors: list[str] = []

              candidate_by_id = {item["id"]: item for item in candidates["candidates"]}
              published = {}
              for case_set in manifest["sets"]:
                  for row in load_jsonl(ROOT / case_set["url"].lstrip("/")):
                      published[row["id"]] = row

              decisions = review["decisions"]
              if review["summary"]["reviewed_candidates"] != len(decisions):
                  errors.append("Reasoning-gap semantic review count mismatch")
              if review["summary"]["published_case_change"] != 0:
                  errors.append("Semantic review must not change the published case set")
              if {item["candidate_id"] for item in decisions} != set(candidate_by_id):
                  errors.append("Semantic review must cover every current reasoning-gap candidate exactly once")

              retained = 0
              rejected = 0
              for item in decisions:
                  cid = item["candidate_id"]
                  candidate = candidate_by_id.get(cid)
                  if not candidate:
                      continue
                  if item["recommendation"] == "retain_for_human_promotion_review":
                      retained += 1
                  elif item["recommendation"] == "reject_semantic_duplicate":
                      rejected += 1
                  else:
                      errors.append(f"Unsupported semantic recommendation: {cid}")
                  if not item.get("reason") or not item.get("novel_signal"):
                      errors.append(f"Semantic review requires reason and novel signal: {cid}")
                  if len(item.get("review_checks", [])) < 3:
                      errors.append(f"Semantic review requires at least three review checks: {cid}")
                  for published_id in item.get("closest_published_cases", []):
                      if published_id not in published:
                          errors.append(f"Closest published case does not exist: {published_id}")
                  if cid in published:
                      errors.append(f"Review-stage candidate unexpectedly published: {cid}")

              if review["summary"]["retain_for_human_promotion_review"] != retained:
                  errors.append("Retained-candidate summary count mismatch")
              if review["summary"]["reject_semantic_duplicate"] != rejected:
                  errors.append("Rejected-candidate summary count mismatch")

              if errors:
                  for error in errors:
                      print(f"ERROR: {error}")
                  return 2
              print(f"Reasoning-gap semantic review valid: {retained} retained, {rejected} rejected, published cases unchanged.")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
      - name: Update reasoning-gap page and tests for current coverage
        run: |
          cat > labs/assessment/reasoning-gaps/index.html <<'HTML'
          ---
          layout: default
          title: "Reasoning Gap Review — SAP Lead Assessment Lab"
          description: "Review-stage SAP Lead Design and Challenge candidates created only for current thin published reasoning cells."
          permalink: /labs/assessment/reasoning-gaps/
          status: draft
          verified: false
          robots: noindex,follow
          sitemap: false
          last_modified_at: 2026-08-16
          hide_global_cta: true
          tags: [sap, assessment, design, challenge, question-authoring]
          ---

          <nav class="breadcrumbs" aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li><a href="/labs/">Labs</a></li><li><a href="/labs/assessment/">SAP Lead Assessment</a></li><li><a href="/labs/assessment/reasoning-coverage/">Reasoning Coverage</a></li><li aria-current="page">Reasoning Gap Review</li></ol></nav>

          <div class="research-canvas">
            <header class="research-canvas__hero" data-reveal>
              <div class="research-canvas__hero-copy">
                <p class="research-canvas__eyebrow">Assessment / reasoning coverage</p>
                <h1>Fill the missing reasoning, not the spreadsheet.</h1>
                <p>The published case set now covers the configured minimum for AI/Data Diagnose and Challenge. One thin Lead-pressure cell remains: Sales Design.</p>
              </div>
              <div class="research-canvas__signal" aria-label="Reasoning gap authoring state">
                <p>Current Lead-pressure gaps</p>
                <div class="research-canvas__signal-line"><span>01</span><strong>1</strong><small>Thin published cell</small></div>
                <div class="research-canvas__signal-line"><span>02</span><strong>1</strong><small>Review candidate</small></div>
                <em>Published case set unchanged by this queue</em>
              </div>
            </header>

            <section class="research-canvas__boundary" data-reveal>
              <span class="material-symbols-outlined" aria-hidden="true">policy</span>
              <p><strong>Authoring boundary:</strong> reasoning-gap records are review-stage only. They do not change scoring or publication and still require semantic review plus an explicit human promotion decision.</p>
              <a href="/labs/assessment/data/reasoning-gap-candidates.json">Open reasoning-gap dataset <span class="material-symbols-outlined" aria-hidden="true">data_object</span></a>
            </section>

            <section class="research-canvas__inventory" id="gap-plan" data-reveal>
              <header><p class="research-canvas__eyebrow">Current gap</p><h2>Sales · Design</h2><p>The published corpus still has one Sales Design case. The missing pressure is deliberate choice among competing sales-to-supply operating models.</p></header>
              <div class="ecg-decision-columns">
                <div><h4>Alternatives</h4><p>Sell from stock · Make to order · Third-party supply.</p></div>
                <div><h4>Decision pressure</h4><p>Customer promise, demand uncertainty, customization, working capital, supplier dependency, inventory ownership, ATP, billing, and finance.</p></div>
                <div><h4>Lead signal</h4><p>Choose a default plus exception rules and state what business condition would change the design.</p></div>
              </div>
              <p><strong>RCAND-SALES-DESIGN-SUPPLY-MODEL</strong> remains the active review candidate for this cell.</p>
            </section>

            <section class="research-canvas__inventory" data-reveal>
              <header><p class="research-canvas__eyebrow">Coverage change</p><h2>MDG cases closed two former AI/Data gaps.</h2><p>The new published MDG set adds AI/Data Diagnose, Design and Challenge pressure. The previous RAW-MCP Diagnose signal and autonomous-agent Challenge candidate are therefore no longer needed as reasoning-gap fillers. This does not erase their content or automatically reject them for other editorial use.</p></header>
            </section>

            <section class="research-canvas__inventory" id="semantic-result" data-reveal>
              <header><p class="research-canvas__eyebrow">Semantic review</p><h2>The Sales Design signal remains novel.</h2><p>The existing third-party case starts after the supply model is chosen. This candidate asks which model should exist at all, what becomes the default, and what condition changes the choice.</p></header>
              <a href="/labs/assessment/data/reasoning-gap-semantic-review.json">Open semantic review dataset <span class="material-symbols-outlined" aria-hidden="true">data_object</span></a>
            </section>

            <section class="research-canvas__inventory" data-reveal>
              <header><p class="research-canvas__eyebrow">Pattern contract</p><h2>Design and Challenge still need different proof.</h2><p>A good Design answer makes a choice. A good Challenge answer attacks an assumption and defines when it becomes acceptable.</p></header>
              <div class="research-route-list">
                <a href="/labs/assessment/data/reasoning-gap-candidates.json"><span>D</span><strong>Design</strong><small>Constraints → alternatives → ownership → consequences → trade-offs → decision-changing condition → validation evidence.</small><i class="material-symbols-outlined" aria-hidden="true">architecture</i></a>
                <a href="/labs/assessment/data/reasoning-gap-candidates.json"><span>C</span><strong>Challenge</strong><small>Proposal → hidden dependency → alternative controls → authority/failure/recovery → acceptance conditions → evaluation evidence.</small><i class="material-symbols-outlined" aria-hidden="true">rule</i></a>
              </div>
            </section>

            <div class="research-canvas__support" data-reveal>{% include atlas/author-block.html %}{% include atlas/disclaimer.html %}</div>
          </div>
          HTML

          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_assessment_practice_layer.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    assert gaps["summary"]["new_review_candidates"] == 2\n    assert {item["level"] for item in gaps["candidates"]} == {"design", "challenge"}\n',
              '    assert gaps["summary"]["new_review_candidates"] == len(gaps["candidates"])\n    assert all(item["level"] in {"design", "challenge"} for item in gaps["candidates"])\n'
          )
          text = text.replace(
              '    assert decisions["RCAND-SALES-DESIGN-SUPPLY-MODEL"]["recommendation"] == "retain_for_human_promotion_review"\n    assert decisions["RCAND-AI-CHALLENGE-AUTONOMY"]["recommendation"] == "retain_for_human_promotion_review"\n    assert review["summary"]["published_case_change"] == 0\n',
              '    assert decisions["RCAND-SALES-DESIGN-SUPPLY-MODEL"]["recommendation"] == "retain_for_human_promotion_review"\n    assert review["summary"]["reviewed_candidates"] == len(candidates["candidates"])\n    assert review["summary"]["retain_for_human_promotion_review"] == sum(item["recommendation"] == "retain_for_human_promotion_review" for item in review["decisions"])\n    assert review["summary"]["published_case_change"] == 0\n'
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Refresh derived assessment and discovery artifacts
        run: |
          python3 scripts/generate_assessment_reasoning_coverage.py
          python3 scripts/generate_assessment_promotion_review_packet.py
          python3 scripts/generate_atlas_artifacts.py
          python3 scripts/audit_assessment_promotion_readiness.py
      - name: Validate the changed contracts
        run: |
          python3 scripts/generate_assessment_reasoning_coverage.py --check
          python3 scripts/validate_assessment_reasoning_coverage.py
          python3 scripts/validate_assessment_reasoning_gap_candidates.py
          python3 scripts/validate_assessment_reasoning_gap_semantic_review.py
          python3 scripts/generate_assessment_promotion_review_packet.py --check
          python3 scripts/validate_assessment_promotion_review_packet.py
          python3 -m pytest tests/test_assessment_practice_layer.py tests/test_mdg_domain_deep_dive.py
      - name: Commit generated and contract changes, then remove one-shot workflow
        run: |
          rm .github/workflows/mdg-assessment-derived-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh MDG assessment derived state"
          git push origin HEAD:agent/mdg-lead-decision-layer
