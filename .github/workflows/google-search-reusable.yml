name: Google Search Reusable

on:
  workflow_call:
    inputs:
      site_url:
        description: "Exact URL-prefix Search Console property, including trailing slash"
        required: true
        type: string
      sitemap_url:
        description: "Public sitemap or sitemap index URL"
        required: true
        type: string
      max_inspections:
        description: "Maximum page URLs to inspect"
        required: false
        default: 100
        type: number
      inspection_mode:
        description: "Inspection selection mode"
        required: false
        default: priority
        type: string
      cooldown_hours:
        description: "Minimum hours between inspections of the same page"
        required: false
        default: 0
        type: number
      runner_ref:
        description: "Pinned cv-ai commit containing the pipeline implementation"
        required: true
        type: string
    secrets:
      google_search_console_service_account:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  google-search:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ inputs.site_url }}
      SITEMAP_URL: ${{ inputs.sitemap_url }}
      GITHUB_TOKEN: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Checkout pinned indexing runner
        uses: actions/checkout@v4
        with:
          repository: dkharlanau/dkharlanau.github.io
          ref: ${{ inputs.runner_ref }}
          path: .google-search-runner

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google authentication client
        run: python -m pip install "google-auth[requests]>=2.35,<3"

      - name: Restore previous indexing report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous
          previous_run_id="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Google Search Pipeline" \
              --status success \
              --limit 10 \
              --json databaseId \
              --jq '.[0].databaseId // empty' 2>/dev/null || true
          )"
          if [[ -n "$previous_run_id" ]]; then
            gh run download "$previous_run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name google-search-report \
              --dir previous >/dev/null 2>&1 || true
          fi

      - name: Prepare Search Console credentials
        id: credentials
        shell: bash
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.google_search_console_service_account }}
        run: |
          set -euo pipefail
          if [[ -z "${SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::error::GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT is not configured."
            exit 1
          fi

          credentials_path="$RUNNER_TEMP/google-search-console.json"
          umask 077
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$credentials_path"
          python - "$credentials_path" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          required = {"client_email", "private_key", "token_uri"}
          missing = sorted(required - set(data))
          if missing:
              raise SystemExit(f"Service account JSON is missing: {', '.join(missing)}")
          print("Service account JSON is structurally valid.")
          PY

          echo "path=$credentials_path" >> "$GITHUB_OUTPUT"

      - name: Run Google Search pipeline
        shell: bash
        env:
          CREDENTIALS_PATH: ${{ steps.credentials.outputs.path }}
          POLICY_MAX: ${{ inputs.max_inspections }}
          POLICY_MODE: ${{ inputs.inspection_mode }}
          POLICY_COOLDOWN: ${{ inputs.cooldown_hours }}
        run: |
          set -euo pipefail
          args=(
            --site-url "$SITE_URL"
            --sitemap-url "$SITEMAP_URL"
            --max-inspections "$POLICY_MAX"
            --inspection-mode "$POLICY_MODE"
            --min-inspection-interval-hours "$POLICY_COOLDOWN"
            --credentials "$CREDENTIALS_PATH"
            --require-credentials
            --output-dir reports/seo/google-search
          )

          if [[ -f previous/google-indexing.json ]]; then
            args+=(--previous-report previous/google-indexing.json)
          fi

          python .google-search-runner/scripts/google_search_pipeline.py "${args[@]}"

      - name: Add report to workflow summary
        if: always()
        shell: bash
        run: |
          if [[ -f reports/seo/google-search/google-indexing.md ]]; then
            cat reports/seo/google-search/google-indexing.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Google Search report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-search-report
          path: reports/seo/google-search/
          if-no-files-found: warn
          retention-days: 90
