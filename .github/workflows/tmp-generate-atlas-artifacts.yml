name: Temporary Atlas artifact generation

on:
  push:
    branches:
      - lab/abap-runtime-ui-toolkit

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install pyyaml
      - name: Generate Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Upload regenerated files
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-atlas-files
          path: |
            ai/expert-promotion-inventory.json
            ai/markdown-clusters.json
          if-no-files-found: error
