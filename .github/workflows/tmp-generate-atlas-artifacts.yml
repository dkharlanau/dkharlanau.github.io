name: Temporary Atlas artifact generation

on:
  push:
    branches:
      - lab/abap-runtime-ui-toolkit

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install pyyaml
      - name: Generate Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/expert-promotion-inventory.json ai/markdown-clusters.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: refresh Atlas generated artifacts"
            git push origin HEAD:lab/abap-runtime-ui-toolkit
          fi
