name: IndexNow Submit

on:
  pull_request:
    paths:
      - "scripts/indexnow_*.py"
      - "scripts/lib/indexnow_release.py"
      - "tests/test_indexnow*.py"
      - ".github/workflows/indexnow.yml"
  deployment_status:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the production delta without submitting"
        type: boolean
        default: true
      max_urls:
        description: "Maximum number of changed HTML URLs in one request"
        type: number
        default: 100

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: indexnow-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  indexnow:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'github-pages' &&
       github.event.deployment.ref == 'main')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify IndexNow release contracts
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install pytest pyyaml
          python -m pytest tests/test_indexnow*.py tests/test_search_workflow_policy.py tests/test_search_pipeline_routing.py

      - name: Prepare the successful Pages deployment
        if: github.event_name != 'pull_request'
        run: |
          python scripts/indexnow_pages.py \
            --repo "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/indexnow-pages"

      - name: Preview production delta
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          python scripts/indexnow_submit.py \
            --pages-release "$RUNNER_TEMP/indexnow-pages" \
            --verify-live \
            --report "$RUNNER_TEMP/indexnow-report.json"

      - name: Real IndexNow submission
        id: release
        if: github.event_name == 'deployment_status' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INPUT_MAX_URLS: ${{ inputs.max_urls }}
        run: |
          python scripts/indexnow_submit.py \
            --pages-release "$RUNNER_TEMP/indexnow-pages" \
            --report "$RUNNER_TEMP/indexnow-report.json" \
            --submit --require-key-file \
            --max-urls "${INPUT_MAX_URLS:-100}"
          if test -f "$RUNNER_TEMP/indexnow-pages/manifest.json"; then
            echo "manifest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve the production release manifest
        if: steps.release.outputs.manifest == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-production-release
          path: ${{ runner.temp }}/indexnow-pages/manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Upload IndexNow report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/indexnow-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarize IndexNow result
        if: always() && github.event_name != 'pull_request'
        run: |
          python - "$RUNNER_TEMP/indexnow-report.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          report = Path(sys.argv[1])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              if report.exists():
                  data = json.loads(report.read_text())
                  print(f"IndexNow status: {data['status']}", file=summary)
                  print(f"URLs accepted: {len(data['submitted'])}", file=summary)
                  print(f"Provider HTTP status: {data['http_status']}", file=summary)
              else:
                  print("No IndexNow receipt. See the Pages preparation step.", file=summary)
          PY
