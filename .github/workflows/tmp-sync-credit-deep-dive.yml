name: Temporary Credit deep-dive sync

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/sales-order-decision-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install pyyaml
      - name: Validate Credit data
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for name in [
              '_data/labs/enterprise_context/graphs/credit.yml',
              '_data/labs/enterprise_context/sources/credit.yml',
              '_data/labs/enterprise_context/manifest.yml',
          ]:
              data = yaml.safe_load(Path(name).read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise SystemExit(f'{name} did not parse to a mapping')
              print(f'validated {name}')
          PY
      - name: Regenerate Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Artifacts already current."
          else
            git commit -m "Sync Credit deep-dive artifacts"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
