name: Patch Assessment Progress Once

on:
  push:
    branches: [main]
    paths: [".github/workflows/patch-assessment-progress-once.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch assessment navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('labs/assessment/index.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '      <a href="/labs/assessment/review/"><span>REVIEW</span><strong>Review Queue</strong><small>Turn local weak signals into focused review routes, then repeat a related case.</small><i class="material-symbols-outlined" aria-hidden="true">target</i></a>\n      <a href="/labs/assessment/cross-process/">',
                  '      <a href="/labs/assessment/review/"><span>REVIEW</span><strong>Review Queue</strong><small>Turn local weak signals into focused review routes, then repeat a related case.</small><i class="material-symbols-outlined" aria-hidden="true">target</i></a>\n      <a href="/labs/assessment/progress/"><span>PROGRESS</span><strong>Progress & Portability</strong><small>Inspect local scoring history and move canonical attempts between browsers without a server profile.</small><i class="material-symbols-outlined" aria-hidden="true">monitoring</i></a>\n      <a href="/labs/assessment/cross-process/">'
              ),
              (
                  '<li>Shared seven-dimension scoring history</li>',
                  '<li>Shared seven-dimension scoring history</li><li>Portable local history import and export</li>'
              ),
              (
                  '      <a href="/labs/assessment/data/review-map.json"><span>REVIEW</span><strong>Review Map</strong><small>Weak dimension and weak track to focused review route.</small><i class="material-symbols-outlined" aria-hidden="true">target</i></a>\n      <a href="/labs/assessment/data/backlog.json">',
                  '      <a href="/labs/assessment/data/review-map.json"><span>REVIEW</span><strong>Review Map</strong><small>Weak dimension and weak track to focused review route.</small><i class="material-symbols-outlined" aria-hidden="true">target</i></a>\n      <a href="/labs/assessment/data/history-portability.json"><span>HISTORY</span><strong>History Portability Contract</strong><small>Versioned browser-only export, validation, merge, and replace rules.</small><i class="material-symbols-outlined" aria-hidden="true">move_up</i></a>\n      <a href="/labs/assessment/data/backlog.json">'
              ),
              (
                  'LOOP-001 through LOOP-012 are complete',
                  'LOOP-001 through LOOP-013 are complete'
              ),
              (
                  '<li>Portable local practice-history import and export</li>',
                  '<li>Capture real assessment feedback for scoring calibration</li>'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected assessment anchor not found: {old[:90]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install generator dependencies
        run: python3 -m pip install pyyaml
      - name: Refresh Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/assessment/index.md ai/markdown-clusters.json
          git commit -m "feat: surface assessment progress and portability"
          git push origin HEAD:main
