name: Temporary Pricing deep-dive sync

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/sales-order-decision-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install pyyaml
      - name: Normalize and validate Pricing data
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          graph = Path('_data/labs/enterprise_context/graphs/pricing.yml')
          text = graph.read_text(encoding='utf-8').replace('$type: knowledge_graph', 'type: knowledge_graph', 1)
          graph.write_text(text, encoding='utf-8')

          paths = [
              graph,
              Path('_data/labs/enterprise_context/sources/pricing.yml'),
              Path('_data/labs/enterprise_context/manifest.yml'),
          ]
          for path in paths:
              data = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise SystemExit(f'{path} did not parse to a mapping')
              print(f'validated {path}')
          PY
      - name: Regenerate Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit normalized data and generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Sync Pricing deep-dive artifacts"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi