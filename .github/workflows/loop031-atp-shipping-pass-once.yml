name: LOOP031 ATP Shipping Pass Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/loop031-atp-shipping-pass-once.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Apply LOOP-031
        run: python scripts/_loop031_promise_shipping_pass.py
      - name: Register LOOP-031 in assessment contract test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_assessment_practice_layer.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('"LOOP-028", "LOOP-029", "LOOP-030"):', '"LOOP-028", "LOOP-029", "LOOP-030", "LOOP-031"):')
          p.write_text(t, encoding='utf-8')
          PY
      - name: Refresh derived assessment and Atlas artifacts
        run: |
          python scripts/audit_assessment_promotion_readiness.py
          python scripts/generate_assessment_evidence_coverage.py
          python scripts/generate_assessment_human_review_queue.py
          python scripts/generate_atlas_artifacts.py
      - name: Validate promise and shipping pass
        run: |
          python - <<'PY'
          from pathlib import Path
          atp = Path('labs/enterprise-context/atp/index.html').read_text(encoding='utf-8')
          shipping = Path('labs/enterprise-context/shipping/index.html').read_text(encoding='utf-8')
          for text in (atp, shipping):
              assert 'Lead answer frame' in text
              assert 'Evidence boundary:' in text
              assert 'verified: false' in text
              assert 'robots: noindex,follow' in text
              assert 'last_modified_at: 2026-08-16' in text
          assert 'Boundary with Shipping:' in atp
          assert 'Boundary with ATP:' in shipping
          PY
          python scripts/audit_assessment_promotion_readiness.py --check
          python scripts/generate_assessment_evidence_coverage.py --check
          python scripts/generate_assessment_human_review_queue.py --check
          PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_assessment_practice_layer.py tests/test_sales_mechanism_model.py tests/test_sales_coverage_consistency.py tests/test_enterprise_context_model.py
      - name: Commit and push with retry
        run: |
          git config user.name "Dzmitryi Kharlanau"
          git config user.email "dkharlanau@gmail.com"
          git add labs/enterprise-context/atp labs/enterprise-context/shipping labs/assessment scripts tests ai _data
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: clarify ATP and Shipping Lead ownership boundaries"
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
