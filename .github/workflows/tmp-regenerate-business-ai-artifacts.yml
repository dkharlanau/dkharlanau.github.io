name: Temporary Business AI artifact regeneration

on:
  push:
    branches:
      - agent/business-ai-catalog
    paths:
      - ".github/workflows/tmp-regenerate-business-ai-artifacts.yml"
      - "labs/business-ai/**"
      - "_data/labs/business_ai/**"
      - "labs/index.md"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/business-ai-catalog
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python3 -m pip install pyyaml

      - name: Regenerate Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add ai/markdown-clusters.json ai/expert-promotion-inventory.json
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "regenerate Business AI discovery artifacts"
          git push origin HEAD:agent/business-ai-catalog
