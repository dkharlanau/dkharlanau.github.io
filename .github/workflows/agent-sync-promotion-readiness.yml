name: Agent Sync Promotion Readiness

on:
  push:
    branches:
      - agent/site-trust-connectivity-20260816
    paths:
      - '.github/workflows/agent-sync-promotion-readiness.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-trust-connectivity-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pyyaml
      - name: Regenerate promotion readiness inventory
        run: python3 scripts/audit_assessment_promotion_readiness.py
      - name: Verify promotion readiness inventory
        run: python3 scripts/audit_assessment_promotion_readiness.py --check
      - name: Protect homepage source content
        run: |
          git diff --exit-code origin/main -- index.html _data/home.yml _data/home || {
            echo 'Homepage protection failed'; exit 1;
          }
      - name: Commit generated assessment inventory
        run: |
          git config user.name 'dkharlanau'
          git config user.email 'dkharlanau@gmail.com'
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git add labs/assessment/data/promotion-readiness.json
          git commit -m 'Synchronize assessment promotion readiness'
          git push origin HEAD:agent/site-trust-connectivity-20260816
