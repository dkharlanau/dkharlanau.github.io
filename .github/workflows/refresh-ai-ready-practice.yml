name: Refresh AI Ready Practice

on:
  push:
    branches:
      - agent/ams-next-gen-relaunch-current-20260816
    paths:
      - '.github/workflows/refresh-ai-ready-practice.yml'

permissions:
  contents: write

concurrency:
  group: refresh-ams-next-gen-derived-artifacts
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ams-next-gen-relaunch-current-20260816
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pyyaml
      - name: Refresh Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Refresh assessment promotion readiness
        run: python3 scripts/audit_assessment_promotion_readiness.py
      - name: Verify generated artifacts
        run: |
          python3 scripts/generate_atlas_artifacts.py --check
          python3 scripts/audit_assessment_promotion_readiness.py --check
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/refresh-ai-ready-practice.yml
          git config user.name 'DKharlanau Site Automation'
          git config user.email 'dkharlanau@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh AMS derived artifacts'
          git push origin HEAD:agent/ams-next-gen-relaunch-current-20260816
