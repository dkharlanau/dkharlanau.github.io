name: Agent Fix Indexing JSONL

on:
  push:
    branches:
      - agent/site-trust-connectivity-20260816
    paths:
      - '.github/workflows/agent-fix-indexing-jsonl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-trust-connectivity-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pytest pyyaml
      - name: Fix JSONL static asset handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_indexing_policy.py')
          text = path.read_text(encoding='utf-8')
          old = '            ".json", ".yml", ".yaml", ".xml", ".txt", ".css", ".js",\n'
          new = '            ".json", ".jsonl", ".yml", ".yaml", ".xml", ".txt", ".css", ".js",\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one static extension list match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cat > tests/test_indexing_policy_jsonl.py <<'PY'
          from pathlib import Path
          import importlib.util

          ROOT = Path(__file__).resolve().parents[1]
          SPEC = importlib.util.spec_from_file_location(
              'check_indexing_policy', ROOT / 'scripts' / 'check_indexing_policy.py'
          )
          MODULE = importlib.util.module_from_spec(SPEC)
          assert SPEC.loader is not None
          SPEC.loader.exec_module(MODULE)


def test_indexable_page_can_link_to_jsonl_static_asset(tmp_path: Path) -> None:
              site = tmp_path / '_site'
              page_dir = site / 'labs' / 'ai-ready'
              data_dir = page_dir / 'data'
              data_dir.mkdir(parents=True)
              (data_dir / 'eval-sample.jsonl').write_text('{"id":"case-1"}\n', encoding='utf-8')
              (page_dir / 'index.html').write_text(
                  '<html><head><meta name="robots" content="index,follow"></head>'
                  '<body><a href="/labs/ai-ready/data/eval-sample.jsonl">Eval sample</a></body></html>',
                  encoding='utf-8',
              )
              assert MODULE.check_built_html(site, tmp_path) == []
          PY
      - name: Run regression test
        run: python3 -m pytest -q tests/test_indexing_policy_jsonl.py
      - name: Protect homepage source content
        run: |
          git diff --exit-code origin/main -- index.html _data/home.yml _data/home || {
            echo 'Homepage protection failed'; exit 1;
          }
      - name: Commit fix
        run: |
          git config user.name 'dkharlanau'
          git config user.email 'dkharlanau@gmail.com'
          git add scripts/check_indexing_policy.py tests/test_indexing_policy_jsonl.py
          git commit -m 'Handle JSONL assets in indexing policy checks'
          git push origin HEAD:agent/site-trust-connectivity-20260816
