name: Agent Fix Indexing JSONL

on:
  push:
    branches:
      - agent/site-trust-connectivity-20260816
    paths:
      - '.github/workflows/agent-fix-indexing-jsonl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-trust-connectivity-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pytest pyyaml
      - name: Fix JSONL static asset handling
        run: python3 -c "from pathlib import Path; p=Path('scripts/check_indexing_policy.py'); t=p.read_text(); old='            \".json\", \".yml\", \".yaml\", \".xml\", \".txt\", \".css\", \".js\",\\n'; new='            \".json\", \".jsonl\", \".yml\", \".yaml\", \".xml\", \".txt\", \".css\", \".js\",\\n'; assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new,1))"
      - name: Run regression test
        run: python3 -m pytest -q tests/test_indexing_policy_jsonl.py
      - name: Protect homepage source content
        run: git diff --exit-code origin/main -- index.html _data/home.yml _data/home
      - name: Commit fix
        run: |
          git config user.name 'dkharlanau'
          git config user.email 'dkharlanau@gmail.com'
          git add scripts/check_indexing_policy.py tests/test_indexing_policy_jsonl.py
          git commit -m 'Handle JSONL assets in indexing policy checks'
          git push origin HEAD:agent/site-trust-connectivity-20260816
