name: One-time closed PR branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-closed-pr-branches-once.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches from closed PRs and remove this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          open_heads=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.ref' | sort -u)
          closed_heads=$(gh api --paginate "repos/$REPO/pulls?state=closed&per_page=100&sort=updated&direction=desc" --jq '.[].head.ref' | sort -u)
          deleted=0
          kept_open=0
          kept_no_closed_pr=0

          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            [[ "$branch" == "$DEFAULT_BRANCH" ]] && continue

            if grep -Fxq "$branch" <<< "$open_heads"; then
              echo "KEEP open PR: $branch"
              kept_open=$((kept_open+1))
              continue
            fi

            if grep -Fxq "$branch" <<< "$closed_heads"; then
              encoded_ref=$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "heads/$branch")
              echo "DELETE closed PR branch: $branch"
              gh api --method DELETE "repos/$REPO/git/refs/$encoded_ref"
              deleted=$((deleted+1))
            else
              echo "KEEP no closed PR evidence: $branch"
              kept_no_closed_pr=$((kept_no_closed_pr+1))
            fi
          done < <(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name')

          echo "Deleted closed PR branches: $deleted"
          echo "Kept open PR branches: $kept_open"
          echo "Kept branches without closed-PR evidence: $kept_no_closed_pr"

          sha=$(gh api "repos/$REPO/contents/.github/workflows/cleanup-closed-pr-branches-once.yml?ref=$DEFAULT_BRANCH" --jq '.sha')
          gh api --method DELETE "repos/$REPO/contents/.github/workflows/cleanup-closed-pr-branches-once.yml" \
            -f message='chore: remove one-time closed PR cleanup workflow' \
            -f sha="$sha" \
            -f branch="$DEFAULT_BRANCH"
