name: Gate Assessment Candidates Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gate-assessment-candidates-once.yml"

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install pyyaml pytest
      - name: Apply candidate evidence gate
        run: python3 scripts/_gate_candidate_generation_once.py
      - name: Regenerate question candidate inventory
        run: python3 scripts/generate_assessment_candidates.py
      - name: Refresh promotion readiness and evidence coverage
        run: |
          python3 scripts/audit_assessment_promotion_readiness.py
          python3 scripts/generate_assessment_evidence_coverage.py
      - name: Refresh Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Run assessment tests
        run: python3 -m pytest tests/test_assessment_practice_layer.py
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_assessment_candidates.py labs/assessment/data/candidate-generation-seeds.json labs/assessment/data/candidate-question-schema.json labs/assessment/data/question-generation.json labs/assessment/data/question-candidates.json labs/assessment/data/catalog.json labs/assessment/data/backlog.json labs/assessment/index.md tests/test_assessment_practice_layer.py labs/assessment/data/promotion-readiness.json labs/assessment/data/evidence-coverage.json ai/markdown-clusters.json
          git commit -m "feat: gate assessment candidates by evidence completeness"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD
            git fetch origin main
            git rebase origin/main
            python3 scripts/generate_assessment_candidates.py
            python3 scripts/audit_assessment_promotion_readiness.py
            python3 scripts/generate_assessment_evidence_coverage.py
            python3 scripts/generate_atlas_artifacts.py
            git add labs/assessment/data/question-candidates.json labs/assessment/data/promotion-readiness.json labs/assessment/data/evidence-coverage.json ai/markdown-clusters.json
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          done
          exit 1
