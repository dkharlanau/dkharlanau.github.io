name: LOOP027 Human Review Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/loop027-human-review-once.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Integrate LOOP-027
        run: python scripts/_loop027_patch.py
      - name: Refresh readiness and evidence coverage
        run: |
          python scripts/audit_assessment_promotion_readiness.py
          python scripts/generate_assessment_evidence_coverage.py
      - name: Generate human review queue
        run: python scripts/generate_assessment_human_review_queue.py
      - name: Refresh Atlas artifacts
        run: python scripts/generate_atlas_artifacts.py
      - name: Validate generated queue and assessment layer
        run: |
          python scripts/audit_assessment_promotion_readiness.py --check
          python scripts/generate_assessment_evidence_coverage.py --check
          python scripts/generate_assessment_human_review_queue.py --check
          python scripts/generate_assessment_candidates.py --check
          PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_assessment_practice_layer.py tests/test_enterprise_context_model.py
      - name: Commit and push
        run: |
          git config user.name "Dzmitryi Kharlanau"
          git config user.email "dkharlanau@gmail.com"
          git add labs/assessment scripts tests ai _data
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add source-supported human review queue"
          git pull --rebase origin main
          git push origin HEAD:main
