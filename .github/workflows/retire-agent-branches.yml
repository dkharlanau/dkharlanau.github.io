name: Retire merged and superseded branches
# Safe after consolidation PR #400 merged to main as b7d4ec101e14956b01042ec953dc6022e9f92265.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retire-agent-branches.yml

permissions:
  contents: write

jobs:
  retire:
    if: github.repository == 'dkharlanau/dkharlanau.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete reviewed stale branches
        shell: bash
        run: |
          set -uo pipefail

          branches=(
            "agent/portfolio-validation-current"
            "agent/two-focus-learning-ams-20260910"
            "agent/two-focus-search-arwp-20260910"
            "agent-loop/portfolio-governance-20260829"
            "assessment/migration-lead-casebook-20260909"
            "chatgpt/repository-setup"
            "chore/consolidate-stale-prs-20260910"
            "chore/retire-stale-branches-20260910"
            "codex/arwp-adoption-20260908"
            "codex/issue-380-labs-visual-system"
            "codex/public-repo-health-20260905"
            "content/kanban-enterprise-context-20260908"
            "feat/incident-diagnostics-discovery"
            "feat/sap-greenfield-migration-lab"
            "feat/sap-incident-diagnostics"
            "lab/s4-greenfield-migration"
          )

          deleted=0
          skipped=0
          failed=0

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              if git push origin --delete "${branch}"; then
                echo "Deleted ${branch}"
                deleted=$((deleted + 1))
              else
                echo "Failed to delete ${branch}" >&2
                failed=$((failed + 1))
              fi
            else
              echo "Already absent ${branch}"
              skipped=$((skipped + 1))
            fi
          done

          {
            echo "### Branch retirement"
            echo "- Deleted: ${deleted}"
            echo "- Already absent: ${skipped}"
            echo "- Failed: ${failed}"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( failed > 0 )); then
            exit 1
          fi

      - name: Remove one-time cleanup workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.gitignore')
          marker = '!.github/workflows/retire-agent-branches.yml\n'
          text = path.read_text(encoding='utf-8')
          path.write_text(text.replace(marker, ''), encoding='utf-8')
          PY

          git rm .github/workflows/retire-agent-branches.yml
          git add .gitignore
          git commit -m "Remove one-time branch cleanup"
          git push origin HEAD:main