name: Retire merged agent branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retire-agent-branches.yml

permissions:
  contents: write

jobs:
  retire:
    if: github.repository == 'dkharlanau/dkharlanau.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete reviewed agent branches
        shell: bash
        run: |
          set -uo pipefail

          branches=(
            "agent/accessibility-heading-cleanup-20260817"
            "agent/accessibility-heading-cleanup-current-20260817"
            "agent/ams-next-gen-relaunch"
            "agent/ams-next-gen-relaunch-20260816"
            "agent/ams-next-gen-relaunch-current-20260816"
            "agent/fix-baseline-links-20260816"
            "agent/fix-baseline-links-current-20260816"
            "agent/lead-architect-skill-loop"
            "agent/mdg-domain-deep-dive"
            "agent/mdg-lead-decision-layer"
            "agent/mdg-lineage-deep-dive"
            "agent/rdp-procurement-reference-case"
            "agent/rdp-procurement-reference-case-2"
            "agent/rdp-procurement-reference-case-3"
            "agent/rdp-procurement-reference-case-4"
            "agent/rdp-procurement-reference-case-final"
            "agent/rdp-procurement-reference-case-final2"
            "agent/rdp-procurement-reference-case-work"
            "agent/rdp-procurement-reference-case-work2"
            "agent/rdp-sales-reference-case"
            "agent/rdp-sales-reference-case-2"
            "agent/reusable-data-procedures"
            "agent/reusable-data-procedures-catalog"
            "agent/reusable-data-procedures-concept"
            "agent/reusable-data-procedures-execution"
            "agent/reusable-data-procedures-framework"
            "agent/reusable-data-procedures-review-memory"
            "agent/reusable-data-procedures-sap-pack"
            "agent/reusable-data-procedures-semantics"
            "agent/site-architecture-finalize"
            "agent/site-architecture-refactor"
            "agent/site-cluster-navigation-contract"
            "agent/site-structure-simplification"
            "agent/site-trust-connectivity-20260816"
            "agent/retire-agent-branches-20260817"
          )

          deleted=0
          skipped=0
          failed=0

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              if git push origin --delete "${branch}"; then
                echo "Deleted ${branch}"
                deleted=$((deleted + 1))
              else
                echo "Failed to delete ${branch}" >&2
                failed=$((failed + 1))
              fi
            else
              echo "Already absent ${branch}"
              skipped=$((skipped + 1))
            fi
          done

          {
            echo "### Agent branch retirement"
            echo "- Deleted: ${deleted}"
            echo "- Already absent: ${skipped}"
            echo "- Failed: ${failed}"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( failed > 0 )); then
            exit 1
          fi

      - name: Remove one-time cleanup workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.gitignore')
          marker = '!.github/workflows/retire-agent-branches.yml\n'
          text = path.read_text(encoding='utf-8')
          path.write_text(text.replace(marker, ''), encoding='utf-8')
          PY

          git rm .github/workflows/retire-agent-branches.yml
          git add .gitignore
          git commit -m "Remove one-time agent branch cleanup"
          git push origin HEAD:main
