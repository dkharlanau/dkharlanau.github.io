name: Refresh Derived Artifacts

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python3 -m pip install pyyaml
      - name: Refresh assessment promotion readiness
        run: python3 scripts/audit_assessment_promotion_readiness.py
      - name: Refresh Atlas and discovery artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit refreshed artifacts and remove this workflow
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-derived-artifacts.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh derived search and assessment artifacts'
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:"${TARGET_BRANCH}"
