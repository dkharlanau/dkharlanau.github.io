name: Refresh Business AI integration artifacts

on:
  push:
    branches:
      - agent/business-ai-scenarios
    paths:
      - ".github/workflows/business-ai-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/business-ai-scenarios
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python3 -m pip install pyyaml

      - name: Refresh generated artifacts
        run: python3 scripts/generate_atlas_artifacts.py

      - name: Remove temporary workflow and commit refresh
        run: |
          rm -f .github/workflows/business-ai-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refresh Business AI artifacts on current main"
            git push origin HEAD:agent/business-ai-scenarios
          fi
