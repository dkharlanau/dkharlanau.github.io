name: Publish Reviewed Lab Wave 04

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fourth-wave-publish.yml"

concurrency:
  group: reviewed-lab-wave-04
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install pyyaml pytest

      - name: Prove P2 publication triage
        run: |
          python3 scripts/lab_p2_publication_triage.py --fail-on-unclassified
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          from lab_p2_publication_triage import (
              build_triage,
              PUBLIC_REVIEW_NEXT,
              POLICY_ERROR,
              NEEDS_POLICY_DECISION,
          )
          payload = build_triage(Path('.').resolve())
          counts = payload['counts']
          errors = []
          if counts.get(PUBLIC_REVIEW_NEXT, 0) != 3:
              errors.append(f"PUBLIC_REVIEW_NEXT={counts.get(PUBLIC_REVIEW_NEXT, 0)}")
          if counts.get(POLICY_ERROR, 0) != 0:
              errors.append(f"POLICY_ERROR={counts.get(POLICY_ERROR, 0)}")
          if counts.get(NEEDS_POLICY_DECISION, 0) != 0:
              errors.append(f"NEEDS_POLICY_DECISION={counts.get(NEEDS_POLICY_DECISION, 0)}")
          if errors:
              raise SystemExit('Unexpected P2 triage before wave 04: ' + ', '.join(errors))
          routes = [row['route'] for row in payload['rows'] if row['decision'] == PUBLIC_REVIEW_NEXT]
          expected = [
              '/labs/ai-ready/',
              '/labs/business-ai/',
              '/labs/enterprise-context/sales-diagnostics/',
          ]
          if routes != expected:
              raise SystemExit(f'Unexpected public framework routes: {routes}')
          print('P2 triage approved exactly three public frameworks.')
          PY

      - name: Register publication wave
        run: |
          if grep -q '^  public-framework-search-wave-04:' _data/labs/publication_reviews.yml; then
            echo 'Wave already registered.'
          else
            cat >> _data/labs/publication_reviews.yml <<'YAML'

          public-framework-search-wave-04:
            reviewed_at: 2026-08-16
            review_mode: selective_or_heuristic
            review_basis: "selective external evidence + page-level editorial review + authored heuristic boundary"
            min_structural_score: 5
            routes:
              /labs/ai-ready/:
                source_path: labs/ai-ready/index.md
                search_intent: "practical AI architecture for RAG, tools, MCP, agents, evals and security"
              /labs/business-ai/:
                source_path: labs/business-ai/index.md
                search_intent: "enterprise Business AI patterns, technologies, controls and implementation evidence"
              /labs/enterprise-context/sales-diagnostics/:
                source_path: labs/enterprise-context/sales-diagnostics/index.html
                search_intent: "SAP Sales diagnostic cases and symptom-first troubleshooting for Lead consultants"
          YAML
          fi

      - name: Apply selective editorial review
        run: python3 scripts/publish_reviewed_lab_wave.py --wave public-framework-search-wave-04

      - name: Refresh post-review readiness
        run: python3 scripts/audit_assessment_promotion_readiness.py

      - name: Rebuild discoverability inventory
        run: python3 scripts/search_discoverability_inventory.py

      - name: Open search only through promotion gate
        run: python3 scripts/lab_search_promotion_loop.py --apply

      - name: Verify post-wave P2 policy
        run: python3 scripts/lab_p2_publication_triage.py --fail-on-unclassified

      - name: Audit search intent ownership
        run: python3 scripts/audit_lab_search_intents.py

      - name: Enforce Lab publication policy
        run: python3 scripts/check_lab_publication_gate.py

      - name: Verify framework publication state without factual relabelling
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          root = Path('.')
          wave_id = 'public-framework-search-wave-04'
          routes = {
              '/labs/ai-ready/': 'labs/ai-ready/index.md',
              '/labs/business-ai/': 'labs/business-ai/index.md',
              '/labs/enterprise-context/sales-diagnostics/': 'labs/enterprise-context/sales-diagnostics/index.html',
          }
          readiness = json.loads((root / 'labs/assessment/data/promotion-readiness.json').read_text())
          by_route = {item['route']: item for item in readiness['items']}
          errors = []
          for route, source_path in routes.items():
              text = (root / source_path).read_text(encoding='utf-8')
              end = text.find('\n---', 4)
              fm = yaml.safe_load(text[4:end])
              if fm.get('status') != 'reviewed':
                  errors.append(f'{route}: status={fm.get("status")}')
              if fm.get('verified') is not True:
                  errors.append(f'{route}: verified={fm.get("verified")}')
              if 'noindex' in str(fm.get('robots', '')).lower():
                  errors.append(f'{route}: robots={fm.get("robots")}')
              if fm.get('sitemap') is not True:
                  errors.append(f'{route}: sitemap={fm.get("sitemap")}')
              if fm.get('publication_wave') != wave_id:
                  errors.append(f'{route}: publication_wave={fm.get("publication_wave")}')
              if fm.get('evidence_review_mode') != 'selective_or_heuristic':
                  errors.append(f'{route}: evidence_review_mode={fm.get("evidence_review_mode")}')
              item = by_route.get(route)
              if not item or item.get('state') != 'public_or_indexable':
                  errors.append(f'{route}: readiness_state={None if not item else item.get("state")}')
              factual_status = ((item or {}).get('factual_review') or {}).get('status')
              if factual_status != 'not_reviewed':
                  errors.append(f'{route}: factual_status={factual_status}')
          if errors:
              raise SystemExit('Wave 04 publication mismatch:\n' + '\n'.join(errors))
          print('All three public frameworks are indexable with factual status left unchanged.')
          PY

      - name: Run publication and triage safety tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest \
            tests/test_publish_reviewed_lab_wave.py \
            tests/test_lab_p2_publication_triage.py \
            tests/test_search_discoverability_inventory.py \
            tests/test_lab_search_promotion_loop.py

      - name: Check readiness is current
        run: python3 scripts/audit_assessment_promotion_readiness.py --check

      - name: Check patch whitespace
        run: git diff --check

      - name: Remove one-shot workflow
        run: rm .github/workflows/fourth-wave-publish.yml

      - name: Commit reviewed public frameworks
        run: |
          git config user.name "DKharlanau Site Automation"
          git config user.email "dkharlanau@users.noreply.github.com"
          git add \
            .github/workflows/fourth-wave-publish.yml \
            _data/labs/publication_reviews.yml \
            labs/assessment/data/promotion-readiness.json \
            labs/ai-ready/index.md \
            labs/business-ai/index.md \
            labs/enterprise-context/sales-diagnostics/index.html
          git diff --cached --stat
          git commit -m "Publish reviewed public AI and diagnostic frameworks"
          git pull --rebase origin main
          git push origin HEAD:main
