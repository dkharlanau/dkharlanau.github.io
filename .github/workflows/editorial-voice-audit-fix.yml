name: Editorial Voice Audit Fix

on:
  push:
    branches:
      - agent/refine-domains-add-business-ai
    paths:
      - .github/workflows/editorial-voice-audit-fix.yml

permissions:
  contents: write

jobs:
  editorial-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/refine-domains-add-business-ai

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install pyyaml

      - name: Apply editorial fixes
        run: python3 scripts/_tmp_editorial_voice_fix.py

      - name: Refresh derived Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py

      - name: Commit editorial fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/labs/enterprise_context/manifest.yml _data/labs/enterprise_context/schema.yml legal/research-attribution.md about.md _blog/centralized-or-federated-sap-integration-architecture-how-to-divide.md _blog/how-to-automate-sap-incident-triage-without-building-an-unreliable-ai.md services/sap-integration-architecture.md scenarios/invoice-verification-three-way-match-delays.md ai/expert-promotion-inventory.json ai/markdown-clusters.json
          git commit -m "Strengthen expert voice and correct sampled SAP content"
          git push origin HEAD:agent/refine-domains-add-business-ai
