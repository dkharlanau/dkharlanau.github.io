name: Audit Promotion Readiness Once

on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-promotion-readiness-once.yml"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python3 -m pip install pyyaml pytest
      - name: Register promotion readiness governance
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')

          catalog_path = root / 'labs/assessment/data/catalog.json'
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          catalog['version'] = '1.5.0'
          catalog['purpose'] = (
              'Turn the Lab into a structured SAP Lead assessment practice route across process knowledge, diagnostics, '
              'architecture, integration, data, AI, adaptive practice, focused review, portable local progress, '
              'provenance-aware feedback, evidence-backed question authoring, and controlled content-promotion review.'
          )
          authoring = {item['id']: item for item in catalog.get('authoring_tools', [])}
          authoring['promotion-readiness'] = {
              'id': 'promotion-readiness',
              'label': 'Promotion Readiness',
              'route': '/labs/assessment/promotion-readiness/',
              'purpose': 'Review structurally mature draft/noindex Lab pages while keeping factual verification and publication policy separate.'
          }
          catalog['authoring_tools'] = [authoring[key] for key in sorted(authoring)]
          strong = catalog.setdefault('coverage', {}).setdefault('strong_now', [])
          marker = 'Assessment-linked Lab promotion readiness audit separating structural maturity from factual verification'
          if marker not in strong:
              strong.append(marker)
          catalog['coverage']['next_practice_layers'] = [
              'perform factual and primary-source review of structurally mature draft/noindex pages before any promotion',
              'extend candidate generation only to graphs with strong failure-mode evidence',
              'connect real feedback observations to review priorities without treating feedback as automatic scoring truth',
              'create explicit human-reviewed calibration decisions when enough real evidence exists'
          ]
          endpoints = catalog.setdefault('endpoints', {})
          endpoints['promotion_readiness_route'] = '/labs/assessment/promotion-readiness/'
          endpoints['promotion_readiness_policy'] = '/labs/assessment/data/promotion-readiness-policy.json'
          endpoints['promotion_readiness'] = '/labs/assessment/data/promotion-readiness.json'
          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          backlog_path = root / 'labs/assessment/data/backlog.json'
          backlog = json.loads(backlog_path.read_text(encoding='utf-8'))
          items = {item['id']: item for item in backlog['items']}
          items['LOOP-016'] = {
              'id': 'LOOP-016',
              'priority': 'P1',
              'title': 'Assessment-linked Lab promotion readiness audit',
              'status': 'done',
              'outputs': [
                  '/labs/assessment/promotion-readiness/',
                  '/labs/assessment/data/promotion-readiness-policy.json',
                  '/labs/assessment/data/promotion-readiness.json',
                  'scripts/audit_assessment_promotion_readiness.py'
              ],
              'working_rule': 'Structural readiness does not imply verified or public. Factual, source, release-sensitivity, and index-policy review remain explicit human decisions.'
          }
          backlog['items'] = [items[key] for key in sorted(items)]
          backlog['next_iteration_themes'] = [
              'perform factual and primary-source review of structurally mature assessment-linked Lab pages',
              'extend candidate generation to another graph only when source references and failure-mode structure are strong enough',
              'connect real feedback observations to review priorities without treating feedback as automatic scoring truth',
              'create explicit human-reviewed calibration decisions when enough real evidence exists'
          ]
          backlog_path.write_text(json.dumps(backlog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          index_path = root / 'labs/assessment/index.md'
          text = index_path.read_text(encoding='utf-8')
          old_author = '''      <a href="/labs/assessment/question-review/"><span>AUTHOR</span><strong>Question Candidate Review</strong><small>Inspect graph evidence, source refs, duplicate checks, and local review decisions before any case promotion.</small><i class="material-symbols-outlined" aria-hidden="true">fact_check</i></a>\n      <a href="/labs/assessment/data/question-candidates.json"><span>2</span><strong>Generated Candidate Inventory</strong><small>Two review candidates, twelve duplicate rejections, and a hard publication boundary.</small><i class="material-symbols-outlined" aria-hidden="true">dataset</i></a>'''
          new_author = '''      <a href="/labs/assessment/question-review/"><span>AUTHOR</span><strong>Question Candidate Review</strong><small>Inspect graph evidence, source refs, duplicate checks, and local review decisions before any case promotion.</small><i class="material-symbols-outlined" aria-hidden="true">fact_check</i></a>\n      <a href="/labs/assessment/promotion-readiness/"><span>CONTENT</span><strong>Promotion Readiness</strong><small>Review structurally mature draft pages while factual verification and publication policy remain separate decisions.</small><i class="material-symbols-outlined" aria-hidden="true">policy</i></a>\n      <a href="/labs/assessment/data/question-candidates.json"><span>2</span><strong>Generated Candidate Inventory</strong><small>Two review candidates, twelve duplicate rejections, and a hard publication boundary.</small><i class="material-symbols-outlined" aria-hidden="true">dataset</i></a>'''
          if old_author not in text:
              raise SystemExit('Authoring-control anchor not found')
          text = text.replace(old_author, new_author, 1)

          old_next = '<li>Human review and promotion of mature draft pages</li>'
          new_next = '<li>Factual and primary-source review of structurally mature draft routes before any promotion</li>'
          if old_next not in text:
              raise SystemExit('Next-iteration readiness anchor not found')
          text = text.replace(old_next, new_next, 1)

          old_machine = '''      <a href="/labs/assessment/data/question-candidates.json"><span>2</span><strong>Question Candidate Inventory</strong><small>Two review candidates and twelve duplicate rejections; not part of the 59 published cases.</small><i class="material-symbols-outlined" aria-hidden="true">dataset</i></a>\n      <a href="/labs/assessment/data/backlog.json"><span>LOOP</span><strong>Development State</strong><small>LOOP-001 through LOOP-015 are complete; next work focuses on evidence quality and controlled promotion.</small><i class="material-symbols-outlined" aria-hidden="true">playlist_add_check</i></a>'''
          new_machine = '''      <a href="/labs/assessment/data/question-candidates.json"><span>2</span><strong>Question Candidate Inventory</strong><small>Two review candidates and twelve duplicate rejections; not part of the 59 published cases.</small><i class="material-symbols-outlined" aria-hidden="true">dataset</i></a>\n      <a href="/labs/assessment/data/promotion-readiness-policy.json"><span>POLICY</span><strong>Promotion Readiness Policy</strong><small>Structural checks, evidence boundary, review states, and anti-shortcut rules.</small><i class="material-symbols-outlined" aria-hidden="true">policy</i></a>\n      <a href="/labs/assessment/data/promotion-readiness.json"><span>38</span><strong>Promotion Readiness Inventory</strong><small>Assessment-linked human routes queued for factual and publication-policy review without automatic promotion.</small><i class="material-symbols-outlined" aria-hidden="true">dataset</i></a>\n      <a href="/labs/assessment/data/backlog.json"><span>LOOP</span><strong>Development State</strong><small>LOOP-001 through LOOP-016 are complete; next work focuses on factual review and controlled promotion.</small><i class="material-symbols-outlined" aria-hidden="true">playlist_add_check</i></a>'''
          if old_machine not in text:
              raise SystemExit('Machine-readable readiness anchor not found')
          text = text.replace(old_machine, new_machine, 1)
          index_path.write_text(text, encoding='utf-8')

          tests_path = root / 'tests/test_assessment_practice_layer.py'
          tests = tests_path.read_text(encoding='utf-8')
          old_page = '        "question-review": ASSESSMENT / "question-review" / "index.html",\n        "cross-process": ASSESSMENT / "cross-process" / "index.html",'
          new_page = '        "question-review": ASSESSMENT / "question-review" / "index.html",\n        "promotion-readiness": ASSESSMENT / "promotion-readiness" / "index.html",\n        "cross-process": ASSESSMENT / "cross-process" / "index.html",'
          if old_page not in tests:
              raise SystemExit('Expected-pages test anchor not found')
          tests = tests.replace(old_page, new_page, 1)

          old_author_assert = '    assert authoring["question-review"]["route"] == "/labs/assessment/question-review/"'
          new_author_assert = '    assert authoring["question-review"]["route"] == "/labs/assessment/question-review/"\n    assert authoring["promotion-readiness"]["route"] == "/labs/assessment/promotion-readiness/"'
          if old_author_assert not in tests:
              raise SystemExit('Authoring-tool test anchor not found')
          tests = tests.replace(old_author_assert, new_author_assert, 1)

          old_loops = '("LOOP-010", "LOOP-011", "LOOP-012", "LOOP-013", "LOOP-014", "LOOP-015")'
          new_loops = '("LOOP-010", "LOOP-011", "LOOP-012", "LOOP-013", "LOOP-014", "LOOP-015", "LOOP-016")'
          if old_loops not in tests:
              raise SystemExit('Backlog-loop test anchor not found')
          tests = tests.replace(old_loops, new_loops, 1)

          readiness_test = '''\n\ndef test_promotion_readiness_audit_is_reproducible_and_non_publishing() -> None:\n    policy = load_json("promotion-readiness-policy.json")\n    inventory = load_json("promotion-readiness.json")\n\n    assert inventory["policy"] == "/labs/assessment/data/promotion-readiness-policy.json"\n    assert inventory["scope_route_count"] == 38\n    assert inventory["counts"] == {"human_review_candidate": 38}\n    assert all(item["structural_score"] >= 4 for item in inventory["items"])\n    assert all(item["verified"] is False for item in inventory["items"])\n    assert "never changes status" in policy["promotion_rule"].lower()\n\n    result = subprocess.run(\n        [sys.executable, "scripts/audit_assessment_promotion_readiness.py", "--check"],\n        cwd=ROOT,\n        text=True,\n        capture_output=True,\n        check=False,\n    )\n    assert result.returncode == 0, result.stdout + result.stderr\n    assert "38 routes" in result.stdout\n'''
          if 'test_promotion_readiness_audit_is_reproducible_and_non_publishing' not in tests:
              tests = tests.rstrip() + readiness_test + '\n'
          tests_path.write_text(tests, encoding='utf-8')
          PY
      - name: Generate updated promotion readiness inventory
        run: python3 scripts/audit_assessment_promotion_readiness.py
      - name: Refresh Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Verify focused assessment governance tests
        run: python3 -m pytest tests/test_assessment_practice_layer.py
      - name: Commit and push final LOOP-016 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/assessment/data/catalog.json labs/assessment/data/backlog.json labs/assessment/index.md tests/test_assessment_practice_layer.py labs/assessment/data/promotion-readiness.json ai/markdown-clusters.json
          git commit -m "feat: complete Lab promotion readiness governance"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            python3 scripts/audit_assessment_promotion_readiness.py
            python3 scripts/generate_atlas_artifacts.py
            git add labs/assessment/data/promotion-readiness.json ai/markdown-clusters.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          done
          echo "Could not push LOOP-016 after retries." >&2
          exit 1
