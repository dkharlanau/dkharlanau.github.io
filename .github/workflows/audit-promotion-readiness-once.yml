name: Audit Promotion Readiness Once

on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-promotion-readiness-once.yml"]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python3 -m pip install pyyaml
      - name: Generate promotion readiness inventory
        run: python3 scripts/audit_assessment_promotion_readiness.py
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/assessment/data/promotion-readiness.json
          if git diff --cached --quiet; then
            echo "Promotion readiness inventory already current."
            exit 0
          fi
          git commit -m "chore: generate Lab promotion readiness inventory"
          git push origin HEAD:main
