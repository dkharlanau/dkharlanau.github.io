name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python3 -m pip install pytest pyyaml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check public repo hygiene
        run: python3 scripts/check_public_repo.py

      - name: Check source heading hierarchy
        run: python3 scripts/normalize_heading_hierarchy.py --check

      - name: Run Python tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests

      - name: Enforce Career Factory contract
        run: python3 scripts/check_career_factory.py --changed-from origin/main

      - name: Check Career Factory inventory is current
        run: python3 scripts/generate_career_factory.py --check

      - name: Generate DAMA pages
        run: node scripts/generate_dama_pages.js

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Check rendered structured data
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/test_rendered_structured_data.py

      - name: Check content quality for changed content
        if: github.event_name == 'pull_request'
        run: python3 scripts/content_quality.py check --site-dir _site --changed-from origin/main

      - name: Audit complete content quality on default branch
        if: github.event_name != 'pull_request'
        run: python3 scripts/content_quality.py audit --site-dir _site

      - name: Upload content quality reports
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: content-quality-reports
          path: |
            reports/content-quality.md
            reports/content-quality.json
            reports/content-quality-summary.json
            reports/content-link-graph.json
            reports/content-review-queue.md
            reports/content-quality-initial-rollout.md
          if-no-files-found: ignore

      - name: Check local links
        run: python3 scripts/check_links.py _site

      - name: Check SEO metadata
        run: python3 scripts/check_seo.py _site

      - name: Check indexing policy
        run: python3 scripts/check_indexing_policy.py --site-dir _site --fail-on-critical

      - name: Build search discoverability inventory
        run: python3 scripts/search_discoverability_inventory.py

      - name: Build Lab search promotion queue
        run: python3 scripts/lab_search_promotion_loop.py

      - name: Enforce P2 Lab publication policy
        run: python3 scripts/lab_p2_publication_triage.py --fail-on-unclassified

      - name: Audit Lab search intent ownership
        run: python3 scripts/audit_lab_search_intents.py

      - name: Build Lab internal link gap queue
        run: python3 scripts/lab_link_gap_loop.py

      - name: Enforce Lab publication gate
        run: python3 scripts/check_lab_publication_gate.py

      - name: Upload search discoverability inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-discoverability-inventory
          path: |
            reports/seo/search-discoverability.csv
            reports/seo/search-discoverability.md
            reports/seo/lab-promotion-queue.csv
            reports/seo/lab-promotion-queue.md
            reports/seo/lab-p2-publication-triage.csv
            reports/seo/lab-p2-publication-triage.md
            reports/seo/lab-p2-publication-triage.json
            reports/seo/lab-search-intents.json
            reports/seo/lab-search-intents.md
            reports/seo/lab-link-gaps.csv
            reports/seo/lab-link-gaps.md
          if-no-files-found: ignore

      - name: Check sitemap policy
        run: python3 scripts/check_sitemap_policy.py --site-dir _site --repo-dir . --fail-on-critical

      - name: Check date consistency
        run: python3 scripts/check_date_consistency.py --site-dir _site --repo-dir . --fail-on-critical

      - name: Check content quality
        run: python3 scripts/check_content_quality.py --fail-on-critical

      - name: Audit indexability
        run: python3 scripts/audit_indexability.py --site-dir _site --fail-on-critical

      - name: Audit internal links
        run: python3 scripts/audit_internal_links.py --site-dir _site

      - name: Audit accessibility and semantic HTML
        run: python3 scripts/accessibility_audit.py --site-dir _site --fail-on-critical

      - name: Validate AI-readable endpoints
        run: python3 scripts/validate_ai_endpoints.py _site

      # Freshness checks remain hard gates, but run last so stale generated files do
      # not hide independent link, SEO, sitemap, indexability, or accessibility results.
      - name: Check Atlas artifacts are up to date
        run: python3 scripts/generate_atlas_artifacts.py --check

      - name: Check assessment promotion readiness is current
        run: python3 scripts/audit_assessment_promotion_readiness.py --check
