name: Final Business AI regeneration after graph update

on:
  push:
    branches:
      - agent/business-ai-catalog
    paths:
      - ".github/workflows/tmp-final2-regenerate-business-ai.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/business-ai-catalog
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependency
        run: python3 -m pip install pyyaml
      - name: Regenerate repository artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit generated files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-final2-regenerate-business-ai.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "regenerate Business AI artifacts after graph update"
          git push origin HEAD:agent/business-ai-catalog
