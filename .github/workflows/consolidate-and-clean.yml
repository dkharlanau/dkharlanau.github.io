name: Consolidate and clean branches

# One-time repository cleanup after branch consolidation.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/consolidate-and-clean.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout all branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python3 -m pip install pytest pyyaml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py

      - name: Validate public repo hygiene
        run: python3 scripts/check_public_repo.py

      - name: Validate refreshed Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py --check

      - name: Run Python tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests

      - name: Generate DAMA pages
        run: node scripts/generate_dama_pages.js

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Audit complete content quality
        run: python3 scripts/content_quality.py audit --site-dir _site

      - name: Check local links
        run: python3 scripts/check_links.py _site

      - name: Check SEO metadata
        run: python3 scripts/check_seo.py _site

      - name: Check indexing policy
        run: python3 scripts/check_indexing_policy.py --site-dir _site --fail-on-critical

      - name: Check sitemap policy
        run: python3 scripts/check_sitemap_policy.py --site-dir _site --repo-dir . --fail-on-critical

      - name: Check date consistency
        run: python3 scripts/check_date_consistency.py --site-dir _site --repo-dir . --fail-on-critical

      - name: Check content quality
        run: python3 scripts/check_content_quality.py --fail-on-critical

      - name: Audit indexability
        run: python3 scripts/audit_indexability.py --site-dir _site --fail-on-critical

      - name: Audit internal links
        run: python3 scripts/audit_internal_links.py --site-dir _site

      - name: Audit accessibility and semantic HTML
        run: python3 scripts/accessibility_audit.py --site-dir _site --fail-on-critical

      - name: Validate AI-readable endpoints
        run: python3 scripts/validate_ai_endpoints.py _site

      - name: Commit refreshed generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A atlas/manifest.json llms-full.txt ai _data/expert_context.yml sitemap-data.xml
          if git diff --cached --quiet; then
            echo "No generated artifact changes to commit."
          else
            git commit -m "Refresh generated artifacts after branch consolidation"
            git push origin HEAD:main
          fi

      - name: Delete all remote branches except main
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ \
              | grep -v '^HEAD$' \
              | grep -v '^main$' \
              | sort -u
          )
          echo "Deleting ${#branches[@]} branches"
          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            git push origin --delete "$branch"
          done
          echo "Remote branch cleanup complete."
