name: LOOP033 Core Wave Close Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/loop033-core-wave-close-once.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Apply LOOP-033
        run: python scripts/_loop033_core_wave_close.py
      - name: Register LOOP-033 in assessment contract test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_assessment_practice_layer.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('"LOOP-030", "LOOP-031", "LOOP-032"):', '"LOOP-030", "LOOP-031", "LOOP-032", "LOOP-033"):')
          p.write_text(t, encoding='utf-8')
          PY
      - name: Refresh assessment and Atlas artifacts
        run: |
          python scripts/audit_assessment_promotion_readiness.py
          python scripts/generate_assessment_evidence_coverage.py
          python scripts/generate_assessment_human_review_queue.py
          python scripts/generate_atlas_artifacts.py
      - name: Validate core wave close
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = {
              'qm': Path('labs/enterprise-context/quality-management/index.html').read_text(encoding='utf-8'),
              'ewm': Path('labs/enterprise-context/ewm/index.html').read_text(encoding='utf-8'),
              'mdg': Path('labs/enterprise-context/mdg/index.md').read_text(encoding='utf-8'),
              'fin': Path('labs/enterprise-context/finance-logistics/index.html').read_text(encoding='utf-8'),
          }
          for text in pages.values():
              assert 'Evidence boundary:' in text
              assert 'verified: false' in text
              assert 'robots: noindex,follow' in text
          assert 'Quality decides disposition' in pages['qm']
          assert 'Do not confuse the warehouse request' in pages['ewm']
          assert 'Approved data is not yet business proof' in pages['mdg']
          assert 'A posting can be correct and the process can still be open' in pages['fin']
          assert 'last_modified_at: 2026-08-16' in pages['ewm']
          assert 'last_modified_at: 2026-08-16' in pages['mdg']
          PY
          python scripts/audit_assessment_promotion_readiness.py --check
          python scripts/generate_assessment_evidence_coverage.py --check
          python scripts/generate_assessment_human_review_queue.py --check
          python scripts/generate_assessment_candidates.py --check
          PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_assessment_practice_layer.py tests/test_enterprise_context_model.py
      - name: Commit and push with retry
        run: |
          git config user.name "Dzmitryi Kharlanau"
          git config user.email "dkharlanau@gmail.com"
          git add labs/enterprise-context/quality-management labs/enterprise-context/ewm labs/enterprise-context/mdg labs/enterprise-context/finance-logistics labs/assessment scripts tests ai _data
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: close core SAP Lead human review content wave"
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
