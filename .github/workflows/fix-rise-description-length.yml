name: Fix RISE Description Length

on:
  push:
    branches:
      - agent/refine-domains-add-business-ai
    paths:
      - .github/workflows/fix-rise-description-length.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refine-domains-add-business-ai
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - name: Shorten description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_blog/do-you-actually-need-rise-with-sap-what-it-is-what-it-includes-and.md')
          t = p.read_text(encoding='utf-8')
          old = 'description: "A practical decision framework for evaluating RISE with SAP: transformation intent, operating model, architecture, commercial boundaries, and exit considerations."'
          new = 'description: "A practical framework for evaluating RISE with SAP across transformation intent, operating model, architecture, commercial boundaries, and exit."'
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY
      - run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _blog/do-you-actually-need-rise-with-sap-what-it-is-what-it-includes-and.md ai/expert-promotion-inventory.json ai/markdown-clusters.json
          git commit -m "Fit sampled RISE metadata to quality guidance"
          git push origin HEAD:agent/refine-domains-add-business-ai
