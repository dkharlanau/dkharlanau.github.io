name: Editorial Follow-up Fix

on:
  push:
    branches:
      - agent/refine-domains-add-business-ai
    paths:
      - .github/workflows/editorial-followup-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refine-domains-add-business-ai
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - run: python3 scripts/_tmp_rise_editorial_fix.py
      - run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _blog/do-you-actually-need-rise-with-sap-what-it-is-what-it-includes-and.md ai/expert-promotion-inventory.json ai/markdown-clusters.json
          git commit -m "Polish sampled RISE article voice and metadata"
          git push origin HEAD:agent/refine-domains-add-business-ai
