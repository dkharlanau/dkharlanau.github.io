name: Sync Lab Promotion Readiness Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-promotion-readiness-once.yml"

concurrency:
  group: sync-lab-promotion-readiness-once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install pyyaml pytest

      - name: Refresh assessment promotion readiness
        run: python3 scripts/audit_assessment_promotion_readiness.py

      - name: Verify readiness is synchronized
        run: python3 scripts/audit_assessment_promotion_readiness.py --check

      - name: Verify published waves are public in readiness
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          root = Path('.')
          approvals = yaml.safe_load((root / '_data/labs/publication_reviews.yml').read_text())
          readiness = json.loads((root / 'labs/assessment/data/promotion-readiness.json').read_text())
          by_route = {item['route']: item for item in readiness['items']}
          errors = []
          checked = 0
          for wave_id, wave in approvals.get('waves', {}).items():
              for route in wave.get('routes', {}):
                  checked += 1
                  item = by_route.get(route)
                  if not item:
                      errors.append(f'{wave_id}: missing readiness route {route}')
                      continue
                  if item.get('state') != 'public_or_indexable':
                      errors.append(f'{route}: state={item.get("state")}')
                  if item.get('verified') is not True:
                      errors.append(f'{route}: verified={item.get("verified")}')
                  if 'noindex' in str(item.get('robots', '')).lower():
                      errors.append(f'{route}: robots={item.get("robots")}')
                  if item.get('sitemap') is not True:
                      errors.append(f'{route}: sitemap={item.get("sitemap")}')
          if errors:
              raise SystemExit('Published-wave readiness mismatch:\n' + '\n'.join(errors))
          print(f'Published-wave readiness synchronized for {checked} approved routes.')
          PY

      - name: Rebuild discoverability inventory
        run: python3 scripts/search_discoverability_inventory.py

      - name: Enforce Lab publication policy
        run: python3 scripts/check_lab_publication_gate.py

      - name: Run promotion safety tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest \
            tests/test_publish_reviewed_lab_wave.py \
            tests/test_search_discoverability_inventory.py \
            tests/test_lab_search_promotion_loop.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Remove one-shot workflow
        run: rm .github/workflows/sync-promotion-readiness-once.yml

      - name: Commit synchronized readiness
        run: |
          git config user.name "DKharlanau Site Automation"
          git config user.email "dkharlanau@users.noreply.github.com"
          git add \
            .github/workflows/sync-promotion-readiness-once.yml \
            labs/assessment/data/promotion-readiness.json
          git diff --cached --stat
          git commit -m "Sync Lab promotion readiness after publication"
          git pull --rebase origin main
          git push origin HEAD:main
