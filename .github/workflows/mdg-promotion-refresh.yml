name: Refresh MDG assessment promotion readiness once

on:
  push:
    branches:
      - agent/mdg-domain-deep-dive

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mdg-domain-deep-dive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependency
        run: python3 -m pip install pyyaml
      - name: Generate assessment promotion readiness
        run: python3 scripts/audit_assessment_promotion_readiness.py
      - name: Commit generated file and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/assessment/data/promotion-readiness.json
          git rm .github/workflows/mdg-promotion-refresh.yml
          git commit -m "Refresh MDG assessment promotion readiness"
          git push origin HEAD:agent/mdg-domain-deep-dive
