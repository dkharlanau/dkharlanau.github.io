name: Schema About Fix Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schema-about-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restrict author-as-about to ProfilePage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('_includes/seo/structured-data.html')
          text = path.read_text(encoding='utf-8')
          old = '  "author": {\n    "@id": "{{ author_id }}"\n  },\n  "about": {\n    "@id": "{{ author_id }}"\n  },\n'
          new = '  "author": {\n    "@id": "{{ author_id }}"\n  },\n  {% if page_type == \'ProfilePage\' %}\n  "about": {\n    "@id": "{{ author_id }}"\n  },\n  {% endif %}\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one generic author/about block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify schema contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('_includes/seo/structured-data.html').read_text(encoding='utf-8')
          assert '"sameAs": ["{{ author_website_url }}", "{{ author_linkedin_url }}", "{{ author_github_url }}"],\n  "url": "{{ canonical_url }}"' not in text
          marker = "{% if page_type == 'ProfilePage' %}\n  \"about\": {\n    \"@id\": \"{{ author_id }}\""
          assert marker in text
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/schema-about-fix-once.yml
      - name: Commit schema semantics fix
        run: |
          git config user.name 'DKharlanau Site Automation'
          git config user.email 'dkharlanau@users.noreply.github.com'
          git add _includes/seo/structured-data.html .github/workflows/schema-about-fix-once.yml
          git diff --cached --check
          git commit -m 'Fix generic WebPage topic semantics'
          git push origin HEAD:main
