name: One-time final orphan branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-final-orphan-branch-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove stale orphan branch and this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch='roadmap/p1-portfolio-failure-intelligence'
          encoded_ref=$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "heads/$branch")
          gh api --method DELETE "repos/$REPO/git/refs/$encoded_ref"
          sha=$(gh api "repos/$REPO/contents/.github/workflows/cleanup-final-orphan-branch-once.yml?ref=main" --jq '.sha')
          gh api --method DELETE "repos/$REPO/contents/.github/workflows/cleanup-final-orphan-branch-once.yml" \
            -f message='chore: remove final cleanup workflow' \
            -f sha="$sha" \
            -f branch='main'
