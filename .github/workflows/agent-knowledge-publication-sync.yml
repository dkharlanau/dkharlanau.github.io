name: Agent Knowledge Publication Sync

on:
  push:
    branches:
      - agent/site-trust-connectivity-20260816
    paths:
      - '_data/labs/source_bindings.yml'
      - 'scripts/knowledge_publication_loop.py'
      - '.github/workflows/agent-knowledge-publication-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-trust-connectivity-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pyyaml
      - name: Regenerate canonical publication metadata
        run: python3 scripts/knowledge_publication_loop.py
      - name: Protect homepage content
        run: |
          git diff --exit-code origin/main -- index.html _data/home.yml _data/home || {
            echo 'Homepage protection failed'; exit 1;
          }
      - name: Validate publication contract
        run: python3 scripts/check_knowledge_publication_contract.py
      - name: Commit generated publication metadata
        run: |
          git config user.name 'dkharlanau'
          git config user.email 'dkharlanau@gmail.com'
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git add labs ai/pages ai/page-knowledge-index.json _layouts/default.html sitemap-pages.xml
          git commit -m 'Synchronize knowledge provenance and sidecars'
          git push origin HEAD:agent/site-trust-connectivity-20260816
