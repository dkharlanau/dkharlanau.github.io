name: Agent Knowledge Schema Sync

on:
  push:
    branches:
      - agent/site-trust-connectivity-20260816
    paths:
      - 'scripts/normalize_publication_schema.py'
      - '.github/workflows/agent-knowledge-schema-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-trust-connectivity-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pyyaml
      - name: Normalize structured-data templates
        run: python3 scripts/normalize_publication_schema.py
      - name: Regenerate publication metadata
        run: python3 scripts/knowledge_publication_loop.py
      - name: Protect homepage source content
        run: |
          git diff --exit-code origin/main -- index.html _data/home.yml _data/home || {
            echo 'Homepage protection failed'; exit 1;
          }
      - name: Validate final publication contract
        run: |
          python3 scripts/normalize_publication_schema.py --check
          python3 scripts/knowledge_publication_loop.py --check
          python3 scripts/check_knowledge_publication_contract.py
      - name: Commit normalized knowledge schema
        run: |
          git config user.name 'dkharlanau'
          git config user.email 'dkharlanau@gmail.com'
          if git diff --quiet; then
            echo 'No normalized changes.'
            exit 0
          fi
          git add _includes/head.html _includes/seo/structured-data.html _includes/seo/structured-data-sitewide-graph.html labs ai/pages ai/page-knowledge-index.json
          git commit -m 'Normalize canonical knowledge structured data'
          git push origin HEAD:agent/site-trust-connectivity-20260816
