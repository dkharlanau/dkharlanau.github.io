name: Refresh AI Ready generic artifacts

on:
  push:
    branches: [main]
    paths:
      - "labs/ai-ready/**"
      - ".github/workflows/refresh-ai-ready-generic.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - name: Regenerate Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated artifacts are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Refresh generated Atlas artifacts for generic AI Ready"
          git push
