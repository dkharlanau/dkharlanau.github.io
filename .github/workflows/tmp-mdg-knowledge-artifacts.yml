name: Temporary MDG knowledge artifact refresh

on:
  push:
    branches:
      - agent/mdg-knowledge-model
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/mdg-knowledge-model
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/expert-promotion-inventory.json ai/markdown-clusters.json
          if git diff --cached --quiet; then
            echo "No generated artifact changes"
            exit 0
          fi
          git commit -m "Refresh Atlas artifacts for MDG knowledge model"
          git push origin HEAD:agent/mdg-knowledge-model
