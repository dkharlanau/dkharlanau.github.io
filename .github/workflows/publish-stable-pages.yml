# Stable publish trigger: reviewed Labs content; workflow-file updates can request a full current-main publish
name: Stable Pages Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-stable-pages.yml'
      - 'labs/enterprise-context/organizational-structure/**'
      - 'labs/assessment/leadership-toolkit/**'
      - 'scripts/generate_leadership_print_pdf.py'

permissions:
  contents: read

concurrency:
  group: pages-stable-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-lato fonts-noto-core
          python -m pip install "weasyprint==68.0" "beautifulsoup4>=4.12,<5"

      - name: Generate the Leadership Toolkit PDF
        run: |
          python scripts/generate_leadership_print_pdf.py \
            --source labs/assessment/leadership-toolkit/index.md \
            --output assets/downloads/sap-lead-leadership-toolkit-print.pdf
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/downloads/sap-lead-leadership-toolkit-print.pdf')
          assert p.read_bytes().startswith(b'%PDF-'), "Expected a real PDF file"
          assert p.stat().st_size > 25000, "Generated PDF is unexpectedly small"
          print(f"Print PDF ready: {p.stat().st_size} bytes")
          PY

      - name: Persist generated leadership PDF
        run: |
          if ! git diff --quiet -- assets/downloads/sap-lead-leadership-toolkit-print.pdf; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/downloads/sap-lead-leadership-toolkit-print.pdf
            git commit -m "Update generated Leadership Toolkit PDF [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
