name: Diagnose Python Tests Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-tests-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install pytest pyyaml

      - name: Capture pytest output
        shell: bash
        run: |
          set +e
          PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests -q > pytest-output.txt 2>&1
          code=$?
          echo "$code" > pytest-exit-code.txt
          cat pytest-output.txt
          exit 0

      - name: Upload pytest diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-output.txt
            pytest-exit-code.txt

# Final diagnostic after source-contract normalization.
