name: Refresh enterprise skills once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-enterprise-skills-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh generated discovery artifacts
        run: python3 scripts/generate_atlas_artifacts.py

      - name: Validate portable agent skills
        run: python3 agent-skills/exporters/validate_agent_skills.py

      - name: Remove one-shot workflow and commit refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.gitignore')
          marker = '!.github/workflows/refresh-enterprise-skills-once.yml\n'
          text = path.read_text(encoding='utf-8')
          path.write_text(text.replace(marker, ''), encoding='utf-8')
          PY
          git rm --ignore-unmatch .github/workflows/refresh-enterprise-skills-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: refresh enterprise skill discovery artifacts'
          git push origin HEAD:main
