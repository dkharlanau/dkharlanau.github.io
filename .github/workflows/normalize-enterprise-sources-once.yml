name: Normalize Enterprise Sources Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/normalize-enterprise-sources-once.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML support
        run: python3 -m pip install pyyaml

      - name: Normalize source registries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          paths = [
              Path('_data/labs/enterprise_context/sources/development_registry.yml'),
              Path('_data/labs/enterprise_context/sources/development_toolbox_registry.yml'),
          ]

          for path in paths:
              data = yaml.safe_load(path.read_text(encoding='utf-8'))
              accessed_at = str(data.get('updated_at') or '2026-08-14')
              for source in data.get('sources', []):
                  publisher = str(source.get('publisher') or '')
                  if 'GitHub' in publisher or 'github' in str(source.get('url') or '').lower():
                      source.setdefault('source_type', 'official_repository')
                  else:
                      source.setdefault('source_type', 'official_documentation')
                  source.setdefault('accessed_at', accessed_at)
                  source.setdefault('status', 'source_verified')
              path.write_text(
                  yaml.safe_dump(data, sort_keys=False, allow_unicode=True, width=120),
                  encoding='utf-8',
              )
          PY

      - name: Commit normalized source metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/labs/enterprise_context/sources/development_registry.yml \
                  _data/labs/enterprise_context/sources/development_toolbox_registry.yml
          if git diff --cached --quiet; then
            echo "No source normalization changes."
            exit 0
          fi
          git commit -m "Normalize Development source metadata"
          git push origin HEAD:main
