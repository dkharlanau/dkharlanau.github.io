name: Agent Sales Map State Sync

on:
  push:
    branches: [agent/sales-lead-assessment-map]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install pytest pyyaml

      - name: Synchronize deterministic repository state
        run: python3 scripts/sync_repository_state.py

      - name: Remove temporary workflow and commit generated state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-sync-sales-map.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Sync generated state for Sales assessment map"
          git push origin HEAD:agent/sales-lead-assessment-map
