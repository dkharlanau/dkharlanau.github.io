name: Regenerate DDD v0.3 artifacts

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-regenerate-ddd-v03.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: python3 -m pip install pyyaml

      - name: Regenerate canonical artifacts
        run: python3 scripts/generate_atlas_artifacts.py

      - name: Commit generated artifacts and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tmp-regenerate-ddd-v03.yml
          git add ai/ .github/workflows/tmp-regenerate-ddd-v03.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh AI artifacts for DDD v0.3'
          git push
