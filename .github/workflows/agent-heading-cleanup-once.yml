name: Agent Heading Cleanup Once

on:
  push:
    branches:
      - agent/accessibility-heading-cleanup-20260817

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/accessibility-heading-cleanup-20260817
          fetch-depth: 0
      - name: Normalize heading hierarchy
        run: python3 scripts/normalize_heading_hierarchy.py
      - name: Verify normalization is idempotent
        run: python3 scripts/normalize_heading_hierarchy.py --check
      - name: Protect homepage
        run: |
          if git diff --name-only | grep -E '^(index\.html|_data/home)'; then
            echo 'Homepage files changed unexpectedly.'
            exit 1
          fi
      - name: Commit normalized pages
        run: |
          if git diff --quiet; then
            echo 'No heading changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/assessment labs/enterprise-context
          git commit -m 'Normalize Lab heading hierarchy'
          git push origin HEAD:agent/accessibility-heading-cleanup-20260817
