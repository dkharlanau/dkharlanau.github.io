name: LOOP046 Reasoning Gap Semantic Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/loop046-reasoning-gap-semantic-once.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pytest pyyaml
      - name: Apply LOOP-046
        run: python3 scripts/_loop046_reasoning_gap_semantic_integration.py
      - name: Refresh assessment inventories
        run: |
          python3 scripts/audit_assessment_promotion_readiness.py
          python3 scripts/generate_assessment_evidence_coverage.py
          python3 scripts/generate_assessment_human_review_queue.py
          python3 scripts/generate_assessment_core_study_map.py
          python3 scripts/generate_assessment_secondary_review_priority.py
          python3 scripts/generate_assessment_reasoning_coverage.py
      - name: Validate reasoning-gap semantic review
        run: |
          python3 scripts/validate_assessment_reasoning_gap_candidates.py
          python3 scripts/validate_assessment_reasoning_gap_semantic_review.py
          pytest -q tests/test_assessment_practice_layer.py
      - name: Refresh Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Revalidate after generation
        run: |
          python3 scripts/validate_assessment_reasoning_gap_candidates.py
          python3 scripts/validate_assessment_reasoning_gap_semantic_review.py
          python3 scripts/audit_assessment_promotion_readiness.py --check
          python3 scripts/generate_assessment_evidence_coverage.py --check
          python3 scripts/generate_assessment_human_review_queue.py --check
          python3 scripts/generate_assessment_core_study_map.py --check
          python3 scripts/generate_assessment_secondary_review_priority.py --check
          python3 scripts/generate_assessment_reasoning_coverage.py --check
          pytest -q tests/test_assessment_practice_layer.py
      - name: Commit and push with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Assessment Agent"
          git config user.email "assessment-agent@users.noreply.github.com"
          git add labs/assessment scripts tests ai atlas llms-full.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: review Design and Challenge gap novelty"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          git push origin HEAD:main
