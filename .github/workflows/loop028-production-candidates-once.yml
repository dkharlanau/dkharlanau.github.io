name: LOOP028 Production Candidates Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/loop028-production-candidates-once.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Apply LOOP-028
        run: python scripts/_loop028_patch.py
      - name: Register LOOP-028 in practice contract test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_assessment_practice_layer.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('"LOOP-025", "LOOP-026", "LOOP-027"):', '"LOOP-025", "LOOP-026", "LOOP-027", "LOOP-028"):')
          p.write_text(t, encoding='utf-8')
          PY
      - name: Regenerate candidate inventory
        run: python scripts/generate_assessment_candidates.py
      - name: Refresh assessment derived models and Atlas
        run: |
          python scripts/audit_assessment_promotion_readiness.py
          python scripts/generate_assessment_evidence_coverage.py
          python scripts/generate_assessment_human_review_queue.py
          python scripts/generate_atlas_artifacts.py
      - name: Validate assessment layer
        run: |
          python scripts/generate_assessment_candidates.py --check
          python scripts/audit_assessment_promotion_readiness.py --check
          python scripts/generate_assessment_evidence_coverage.py --check
          python scripts/generate_assessment_human_review_queue.py --check
          PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_assessment_practice_layer.py tests/test_enterprise_context_model.py
      - name: Commit and push with retry
        run: |
          git config user.name "Dzmitryi Kharlanau"
          git config user.email "dkharlanau@gmail.com"
          git add labs/assessment scripts tests ai _data
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: expand evidence-gated Production assessment candidates"
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Unable to push after retries"
          exit 1
