name: Generate Assessment Candidates Once

on:
  push:
    branches: [main]
    paths: [".github/workflows/generate-assessment-candidates-once.yml"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Surface question review and clean assessment copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('labs/assessment/index.md')
          text = path.read_text(encoding='utf-8')

          anchor = '''  <section class="research-canvas__inventory" data-reveal>\n    <header><p class="research-canvas__eyebrow">Reasoning levels</p><h2>Move from knowledge to ownership.</h2><p>The same SAP topic can be tested at five levels.</p></header>'''
          authoring = '''  <section class="research-canvas__inventory" data-reveal>\n    <header><p class="research-canvas__eyebrow">Authoring control</p><h2>New questions enter through evidence and review.</h2><p>The generator currently reads whitelisted Billing and Integration Operations failure modes. It found two review candidates and rejected twelve duplicate patterns. Published practice remains at 59 cases.</p></header>\n    <div class="research-route-list">\n      <a href="/labs/assessment/question-review/"><span>AUTHOR</span><strong>Question Candidate Review</strong><small>Inspect graph evidence, source refs, duplicate checks, and local review decisions before any case promotion.</small><i class="material-symbols-outlined" aria-hidden="true">fact_check</i></a>\n      <a href="/labs/assessment/data/question-candidates.json"><span>2</span><strong>Generated Candidate Inventory</strong><small>Two review candidates, twelve duplicate rejections, and a hard publication boundary.</small><i class="material-symbols-outlined" aria-hidden="true">dataset</i></a>\n    </div>\n  </section>\n\n'''
          if anchor not in text:
              raise SystemExit('Reasoning-level anchor not found')
          text = text.replace(anchor, authoring + anchor, 1)

          old_next = '''      <div><h4>Next iteration</h4><ul><li>Calibrate scoring with real assessment feedback</li><li>Generate candidate questions from graph evidence</li><li>Human review and promotion of mature pages</li><li>Generate graph-backed candidate questions with human review</li></ul></div>'''
          new_next = '''      <div><h4>Next iteration</h4><ul><li>Extend candidate generation only to graphs with strong failure evidence</li><li>Human review and promotion of mature draft pages</li><li>Connect real feedback to review priorities without automatic scoring changes</li><li>Create reviewed calibration decisions when enough evidence exists</li></ul></div>'''
          if old_next not in text:
              raise SystemExit('Duplicate next-iteration block not found')
          text = text.replace(old_next, new_next, 1)

          old_machine = '''      <a href="/labs/assessment/data/calibration-policy.json"><span>CAL</span><strong>Calibration Policy</strong><small>Human-reviewed scoring changes with anti-overfit checks and explicit evidence.</small><i class="material-symbols-outlined" aria-hidden="true">policy</i></a>\n      <a href="/labs/assessment/data/backlog.json"><span>LOOP</span><strong>Development State</strong><small>LOOP-001 through LOOP-014 are complete; next work focuses on calibration and review quality.</small><i class="material-symbols-outlined" aria-hidden="true">playlist_add_check</i></a>'''
          new_machine = '''      <a href="/labs/assessment/data/calibration-policy.json"><span>CAL</span><strong>Calibration Policy</strong><small>Human-reviewed scoring changes with anti-overfit checks and explicit evidence.</small><i class="material-symbols-outlined" aria-hidden="true">policy</i></a>\n      <a href="/labs/assessment/data/candidate-question-schema.json"><span>CAND</span><strong>Candidate Question Schema</strong><small>Evidence map, graph/source refs, dedup result, and review-stage status.</small><i class="material-symbols-outlined" aria-hidden="true">schema</i></a>\n      <a href="/labs/assessment/data/candidate-generation-seeds.json"><span>SEED</span><strong>Candidate Generation Seeds</strong><small>Whitelisted graph failure modes and approved source references.</small><i class="material-symbols-outlined" aria-hidden="true">filter_alt</i></a>\n      <a href="/labs/assessment/data/question-candidates.json"><span>2</span><strong>Question Candidate Inventory</strong><small>Two review candidates and twelve duplicate rejections; not part of the 59 published cases.</small><i class="material-symbols-outlined" aria-hidden="true">dataset</i></a>\n      <a href="/labs/assessment/data/backlog.json"><span>LOOP</span><strong>Development State</strong><small>LOOP-001 through LOOP-015 are complete; next work focuses on evidence quality and controlled promotion.</small><i class="material-symbols-outlined" aria-hidden="true">playlist_add_check</i></a>'''
          if old_machine not in text:
              raise SystemExit('Machine-readable assessment anchor not found')
          text = text.replace(old_machine, new_machine, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install generator dependencies
        run: python3 -m pip install pyyaml
      - name: Verify candidate inventory
        run: python3 scripts/generate_assessment_candidates.py --check
      - name: Refresh Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/assessment/index.md ai/markdown-clusters.json
          git commit -m "feat: surface graph-backed assessment question review"
          git push origin HEAD:main
