name: Agent Regenerate Architecture Artifacts

on:
  push:
    branches:
      - agent/site-architecture-refactor
    paths:
      - "knowledge/**"
      - "frameworks/**"
      - "machine/**"
      - "labs/**"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "PROJECT_MAP.md"
      - ".github/workflows/agent-regenerate-architecture-artifacts.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/site-architecture-refactor
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python3 -m pip install pyyaml

      - name: Regenerate source-owned discovery artifacts
        run: python3 scripts/generate_atlas_artifacts.py

      - name: Commit generated artifacts when changed
        run: |
          git add \
            atlas/manifest.json \
            llms-full.txt \
            ai/rag/related.json \
            ai/atlas-compact-index.json \
            ai/verified-pages.json \
            ai/markdown-clusters.json \
            _data/expert_context.yml \
            ai/expert-evidence.json \
            ai/expert-promotion-inventory.json
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "regenerate discovery artifacts for architecture hubs"
          git push origin HEAD:agent/site-architecture-refactor
