name: Consolidate stale PR work

on:
  push:
    branches:
      - chore/consolidate-stale-prs-20260910

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install targeted test dependency
        run: python3 -m pip install pytest

      - name: Import reviewed unique work onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin \
            feat/sap-incident-diagnostics:refs/remotes/origin/feat/sap-incident-diagnostics \
            feat/incident-diagnostics-discovery:refs/remotes/origin/feat/incident-diagnostics-discovery \
            codex/issue-380-labs-visual-system:refs/remotes/origin/codex/issue-380-labs-visual-system \
            agent-loop/portfolio-governance-20260829:refs/remotes/origin/agent-loop/portfolio-governance-20260829

          git checkout origin/feat/sap-incident-diagnostics -- \
            assets/css/incident-diagnostics.css \
            assets/js/incident-diagnostics.js \
            labs/incident-diagnostics/index.md \
            mcp/sap-diagnostics-mcp/README.md \
            mcp/sap-diagnostics-mcp/package.json \
            mcp/sap-diagnostics-mcp/src/server.js \
            mcp/sap-diagnostics-mcp/test/incident-artifacts.test.js \
            tests/test_incident_diagnostics.py

          git checkout origin/codex/issue-380-labs-visual-system -- \
            assets/labs-technical-content.css

          git checkout origin/agent-loop/portfolio-governance-20260829 -- \
            products/VALIDATION.md \
            products/validation-policy.json \
            products/validation-record.example.json \
            products/validation-record.schema.json \
            tests/test_portfolio_governance_contracts.py

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          labs = Path("labs/index.md")
          text = labs.read_text(encoding="utf-8")
          if '/labs/incident-diagnostics/' not in text:
              lines = text.splitlines(keepends=True)
              for index, line in enumerate(lines):
                  if 'href="/labs/templates/"' in line:
                      lines.insert(
                          index + 1,
                          '      <a href="/labs/incident-diagnostics/"><span>INC</span><strong>SAP Incident Diagnostics</strong><small>Browser-local evidence triage for IDoc and integration failures, BP/MDG replication, and recurring AMS incidents, with reusable Markdown outputs.</small><i class="material-symbols-outlined" aria-hidden="true">troubleshoot</i></a>\n',
                      )
                      break
              else:
                  raise SystemExit("Could not find Labs insertion point")
              text = ''.join(lines)
          text = re.sub(r'(?m)^last_modified_at: .*$', 'last_modified_at: 2026-09-10', text, count=1)
          labs.write_text(text, encoding="utf-8")

          layout = Path("_layouts/default.html")
          text = layout.read_text(encoding="utf-8")
          if 'labs-technical-content.css' not in text:
              marker = '</head>'
              block = '  {% if page.url contains \'/labs/\' %}\n  <link rel="stylesheet" href="{{ \'/assets/labs-technical-content.css\' | relative_url }}?v={{ site.time | date: \'%s\' }}" />\n  {% endif %}\n'
              if marker not in text:
                  raise SystemExit("Could not find layout insertion point")
              text = text.replace(marker, block + marker, 1)
          layout.write_text(text, encoding="utf-8")

          manifest_path = Path("products/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.update({
              "compatibility_source": "https://github.com/dkharlanau/dkharlanau.github.io/blob/main/products/COMPATIBILITY.md",
              "compatibility_contract": "https://raw.githubusercontent.com/dkharlanau/dkharlanau.github.io/main/products/compatibility.json",
              "trust_boundary_source": "https://github.com/dkharlanau/dkharlanau.github.io/blob/main/products/TRUST_BOUNDARIES.md",
              "trust_boundary_contract": "https://raw.githubusercontent.com/dkharlanau/dkharlanau.github.io/main/products/trust-boundaries.json",
              "external_validation_source": "https://github.com/dkharlanau/dkharlanau.github.io/blob/main/products/VALIDATION.md",
              "external_validation_policy": "https://raw.githubusercontent.com/dkharlanau/dkharlanau.github.io/main/products/validation-policy.json",
              "external_validation_record_schema": "https://raw.githubusercontent.com/dkharlanau/dkharlanau.github.io/main/products/validation-record.schema.json",
          })
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          governance_test = Path("tests/test_portfolio_governance_contracts.py")
          text = governance_test.read_text(encoding="utf-8")
          text = text.replace('assert manifest["schema_version"] == "1.2"', 'assert manifest["schema_version"] == "1.3"')
          governance_test.write_text(text, encoding="utf-8")
          PY

      - name: Targeted validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest tests/test_incident_diagnostics.py tests/test_portfolio_governance_contracts.py
          (cd mcp/sap-diagnostics-mcp && npm test)
          rm .github/workflows/consolidate-stale-prs.yml
          python3 scripts/check_public_repo.py

      - name: Commit consolidated result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/consolidate-stale-prs.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No consolidation delta found"
            exit 0
          fi
          git commit -m "chore: consolidate unique work from stale branches"
          git push origin HEAD:${GITHUB_REF_NAME}
