name: Refresh MDG Lead generated artifacts once

on:
  push:
    branches:
      - agent/mdg-lead-decision-layer

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mdg-lead-decision-layer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: python3 -m pip install pyyaml
      - name: Refresh Atlas discovery
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Refresh assessment candidates
        run: python3 scripts/generate_assessment_candidates.py
      - name: Refresh assessment promotion readiness
        run: python3 scripts/audit_assessment_promotion_readiness.py
      - name: Commit generated outputs and remove one-shot workflow
        run: |
          rm .github/workflows/mdg-lead-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Refresh MDG Lead generated artifacts"
          git push origin HEAD:agent/mdg-lead-decision-layer
