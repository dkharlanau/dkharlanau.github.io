name: Regenerate Atlas Artifacts Once

on:
  push:
    branches: [main]
    paths: [".github/workflows/regenerate-atlas-once.yml"]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: python3 -m pip install pyyaml
      - name: Generate Atlas artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit and push refreshed artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated artifact changes."
            exit 0
          fi
          git commit -m "chore: refresh Atlas artifacts"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with main; rebasing and regenerating (attempt ${attempt})."
            git fetch origin main
            git rebase origin/main
            python3 scripts/generate_atlas_artifacts.py
            git add -A
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          done

          echo "Could not push refreshed artifacts after retries." >&2
          exit 1
