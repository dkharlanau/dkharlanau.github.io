name: Temporary Career Factory Artifact Sync

on:
  push:
    branches: [agent/career-factory]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/career-factory
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependency
        run: python3 -m pip install pyyaml

      - name: Regenerate discovery artifacts
        run: python3 scripts/generate_atlas_artifacts.py

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/expert-promotion-inventory.json ai/markdown-clusters.json
          if git diff --cached --quiet; then
            echo "Discovery artifacts are already synchronized."
            exit 0
          fi
          git commit -m "Sync Career Factory discovery artifacts"
          git push origin HEAD:agent/career-factory
