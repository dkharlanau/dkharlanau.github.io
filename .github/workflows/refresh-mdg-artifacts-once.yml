name: Refresh MDG artifacts once

on:
  push:
    branches:
      - agent/mdg-lineage-deep-dive

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip mdg refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mdg-lineage-deep-dive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pyyaml
      - name: Regenerate discovery artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/expert-promotion-inventory.json ai/markdown-clusters.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: refresh MDG discovery artifacts [skip mdg refresh]"
            git push origin HEAD:agent/mdg-lineage-deep-dive
          fi
