name: Agent Fix Indexability Canonical

on:
  push:
    branches:
      - agent/site-trust-connectivity-20260816
    paths:
      - '.github/workflows/agent-fix-indexability-canonical.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-trust-connectivity-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pytest pyyaml
      - name: Fix duplicate canonical audit semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit_indexability.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for canonical, paths in all_canonicals.items():
              if len(paths) > 1:
                  for row in rows:
                      if row["canonical"] == canonical and "duplicate_canonical" not in row["classification"]:
                          row["classification"] += ", duplicate_canonical" if row["classification"] != "indexable_ok" else "duplicate_canonical"
                          critical_issues.append(f"Duplicate canonical '{canonical}' on {', '.join(paths)}")
          '''
          new = '''    for canonical, paths in all_canonicals.items():
              if len(paths) > 1:
                  canonical_rows = [row for row in rows if row["canonical"] == canonical]
                  indexable_rows = [row for row in canonical_rows if "noindex" not in row["robots"].lower()]
                  if len(indexable_rows) > 1:
                      indexable_paths = [row["output_path"] for row in indexable_rows]
                      for row in indexable_rows:
                          if "duplicate_canonical" not in row["classification"]:
                              row["classification"] += ", duplicate_canonical" if row["classification"] != "indexable_ok" else "duplicate_canonical"
                      critical_issues.append(f"Duplicate canonical '{canonical}' on {', '.join(indexable_paths)}")
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one duplicate canonical block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run focused regressions
        run: python3 -m pytest -q tests/test_indexability_legacy_canonical.py tests/test_indexing_policy_jsonl.py
      - name: Protect homepage source content
        run: git diff --exit-code origin/main -- index.html _data/home.yml _data/home
      - name: Commit fix
        run: |
          git config user.name 'dkharlanau'
          git config user.email 'dkharlanau@gmail.com'
          git add scripts/audit_indexability.py tests/test_indexability_legacy_canonical.py
          git commit -m 'Allow noindex aliases to share canonical URLs'
          git push origin HEAD:agent/site-trust-connectivity-20260816
