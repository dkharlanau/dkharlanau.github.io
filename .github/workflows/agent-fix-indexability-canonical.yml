name: Agent Fix Indexability Canonical

on:
  push:
    branches:
      - agent/site-trust-connectivity-20260816
    paths:
      - '.github/workflows/agent-fix-indexability-canonical.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-trust-connectivity-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pytest pyyaml
      - name: Fix duplicate canonical audit semantics
        run: python3 scripts/_tmp_patch_indexability_canonical.py
      - name: Run focused regressions
        run: python3 -m pytest -q tests/test_indexability_legacy_canonical.py tests/test_indexing_policy_jsonl.py
      - name: Protect homepage source content
        run: git diff --exit-code origin/main -- index.html _data/home.yml _data/home
      - name: Commit fix
        run: |
          git config user.name 'dkharlanau'
          git config user.email 'dkharlanau@gmail.com'
          git add scripts/audit_indexability.py tests/test_indexability_legacy_canonical.py
          git commit -m 'Allow noindex aliases to share canonical URLs'
          git push origin HEAD:agent/site-trust-connectivity-20260816
