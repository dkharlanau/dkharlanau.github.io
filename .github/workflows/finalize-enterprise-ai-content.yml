name: Finalize Enterprise AI Content

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python3 -m pip install pyyaml
      - name: Fix content quality warnings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('labs/business-ai/document-to-erp-ai.md'): [
                  (
                      'description: "A vendor-neutral Enterprise AI pilot for turning business documents into validated ERP transaction proposals with controls, approvals, metrics, and auditability."',
                      'description: "A vendor-neutral Enterprise AI pilot for turning business documents into validated ERP proposals with controls, approvals, metrics, and audit trails."',
                  ),
              ],
              Path('labs/business-ai/open-research.md'): [
                  (
                      'title: "Open Enterprise AI Research — ERP Evidence, Safety, Readiness, and Benchmarks"',
                      'title: "Open Enterprise AI Research — ERP Evidence, Safety, and Readiness"',
                  ),
              ],
              Path('services/enterprise-ai-pilot-design.md'): [
                  (
                      'description: "A practical Enterprise AI pilot design service for ERP and document workflows, covering architecture, business controls, evaluation, integration, and safe production boundaries."',
                      'description: "Enterprise AI pilot design for ERP and document workflows, covering architecture, controls, evaluation, integration, and safe production boundaries."',
                  ),
              ],
              Path('labs/business-ai/erp-agent-gateway.md'): [
                  (
                      '<section class="research-canvas__boundary" data-reveal aria-label="Gateway principle">\n    <span class="material-symbols-outlined" aria-hidden="true">policy</span>\n    <p><strong>Core rule.</strong>',
                      '<section class="research-canvas__boundary" data-reveal aria-label="Gateway principle">\n    <span class="material-symbols-outlined" aria-hidden="true">policy</span>\n    <p><strong>Problem.</strong> An agent can cross from useful reasoning into an unsafe ERP action unless identity, policy, confirmation, and transaction controls are explicit.</p>\n    <p><strong>Core rule.</strong>',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old[:80]}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Refresh publication metadata
        run: python3 scripts/knowledge_publication_loop.py
      - name: Refresh assessment promotion readiness
        run: python3 scripts/audit_assessment_promotion_readiness.py
      - name: Refresh Atlas and discovery artifacts
        run: python3 scripts/generate_atlas_artifacts.py
      - name: Commit changes and remove this workflow
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-enterprise-ai-content.yml
          git add -A
          git commit -m 'Fix Enterprise AI content quality and refresh metadata'
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:"${TARGET_BRANCH}"
