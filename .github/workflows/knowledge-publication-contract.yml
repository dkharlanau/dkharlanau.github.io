name: Knowledge Publication Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract dependencies
        run: python3 -m pip install pyyaml
      - name: Check publication schema templates are normalized
        run: python3 scripts/normalize_publication_schema.py --check
      - name: Check generated publication metadata is current
        run: python3 scripts/knowledge_publication_loop.py --check
      - name: Validate reviewed Lab publication contract
        run: python3 scripts/check_knowledge_publication_contract.py
