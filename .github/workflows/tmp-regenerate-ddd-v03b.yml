name: Regenerate repository artifacts after DDD v0.3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-regenerate-ddd-v03b.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: python3 -m pip install pyyaml

      - name: Regenerate against latest main and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/generate_atlas_artifacts.py
            rm -f .github/workflows/tmp-regenerate-ddd-v03b.yml
            git add ai/ .github/workflows/tmp-regenerate-ddd-v03b.yml

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m 'Refresh generated artifacts after DDD v0.3'
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo 'Could not publish generated artifacts after five attempts.' >&2
          exit 1
