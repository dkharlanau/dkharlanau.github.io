name: fix-products-seo

on:
  push:
    branches:
      - agent/port-contrast-scheduler-main
    paths:
      - .github/workflows/fix-products-seo.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/port-contrast-scheduler-main
          fetch-depth: 0
      - name: Add canonical OpenGraph URL to standalone product page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('products/index.html')
          text = path.read_text(encoding='utf-8')
          anchor = '  <meta name="description" content="A family of small, composable open-source products for turning enterprise transformation work into contracts, graphs, evidence, and reviewable artifacts.">\n'
          addition = anchor + '  <link rel="canonical" href="https://dkharlanau.github.io/products/">\n  <meta property="og:url" content="https://dkharlanau.github.io/products/">\n'
          if 'rel="canonical" href="https://dkharlanau.github.io/products/"' not in text:
              if anchor not in text:
                  raise SystemExit('description anchor not found')
              text = text.replace(anchor, addition, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          rm .github/workflows/fix-products-seo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: add canonical metadata to products landing"
          git push origin HEAD:agent/port-contrast-scheduler-main