name: Sync Atlas Discovery Artifacts Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-atlas-artifacts-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml

      - name: Record homepage content hashes
        run: |
          git ls-files index.md '_data/home*' '_data/home_i18n/**' | sort > /tmp/home-files.txt
          while IFS= read -r f; do sha256sum "$f"; done < /tmp/home-files.txt > /tmp/home-before.sha

      - name: Regenerate Atlas and AI discovery artifacts
        run: python3 scripts/generate_atlas_artifacts.py

      - name: Verify generated artifacts are current
        run: python3 scripts/generate_atlas_artifacts.py --check

      - name: Prove homepage content sources are unchanged
        run: |
          while IFS= read -r f; do sha256sum "$f"; done < /tmp/home-files.txt > /tmp/home-after.sha
          diff -u /tmp/home-before.sha /tmp/home-after.sha

      - name: Remove one-shot workflow
        run: rm .github/workflows/sync-atlas-artifacts-once.yml

      - name: Commit synchronized discovery artifacts
        run: |
          git config user.name 'DKharlanau Site Automation'
          git config user.email 'dkharlanau@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Sync Atlas and AI discovery artifacts'
          git push origin HEAD:main
