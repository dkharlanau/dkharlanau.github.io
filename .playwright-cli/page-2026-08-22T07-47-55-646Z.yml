                - rowheader "System-level instructions" [ref=f28e557]
                - cell "Stable rules, role, policy, and operating boundaries." [ref=f28e558]
                - cell "Which instructions are controlled by the application, and which may come from the user?" [ref=f28e559]
              - row [ref=f28e560]:
                - rowheader "Approved context" [ref=f28e561]
                - cell "Enterprise facts, documents, records, or retrieved knowledge needed for the task." [ref=f28e562]
                - cell "Is the context relevant, current, permissioned, and traceable to a source?" [ref=f28e563]
              - row [ref=f28e564]:
