          - paragraph [ref=f28e25]: Lab 03 / Business AI
          - heading "Process first. Pattern second. Technology third." [level=1] [ref=f28e26]: Process first.Pattern second. Technology third.
          - paragraph [ref=f28e27]: This lab maps Business AI across the enterprise. It starts from business work and decisions, connects them to reusable AI patterns, compares technology families and platforms, and keeps both successful and failed implementation evidence attached.
          - link "Open the map" [ref=f28e28] [cursor=pointer]:
