              - row [ref=f28e884]:
                - rowheader "Workflow owner" [ref=f28e885]
                - cell "Usability, quality, effort, adoption, exceptions, and handoffs." [ref=f28e886]
                - cell "Day-to-day workflow impact and whether users can trust and act on the output." [ref=f28e887]
              - row [ref=f28e888]:
                - rowheader "Executive sponsor" [ref=f28e889]
                - cell "Strategic priority, urgency, business impact, risk of inaction, and expansion potential." [ref=f28e890]
                - cell "What is proven, what is still assumed, and why this deserves the next investment decision." [ref=f28e891]
        - generic [ref=f28e892]:
          - heading "Keep the seller narrative clean" [level=3] [ref=f28e893]
          - table [ref=f28e894]:
            - rowgroup [ref=f28e895]:
              - row [ref=f28e896]:
                - columnheader "Statement" [ref=f28e897]
                - columnheader "Keep it focused on" [ref=f28e898]
            - rowgroup [ref=f28e899]:
              - row [ref=f28e900]:
                - rowheader "Value hypothesis" [ref=f28e901]
                - cell "What outcome may improve, which priority it supports, and which assumption connects the two." [ref=f28e902]
              - row [ref=f28e903]:
                - rowheader "Solution direction" [ref=f28e904]
                - cell "The likely workflow, AI, data, and integration approach, but only where discovery supports it." [ref=f28e905]
              - row [ref=f28e906]:
                - rowheader "Validation need" [ref=f28e907]
                - cell "The evidence, baseline, stakeholder input, control, or technical question that must be resolved next." [ref=f28e908]
          - paragraph [ref=f28e909]: "Keeping these statements separate makes the conversation easier to trust: the value hypothesis explains the possible benefit, the solution direction explains how it may be achieved, and the validation need explains what is still unknown."
