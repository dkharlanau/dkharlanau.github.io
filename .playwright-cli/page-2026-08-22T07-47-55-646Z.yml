        - generic [ref=f28e538]:
          - paragraph [ref=f28e539]: API fluency
          - heading "Treat an AI API call as a controlled workflow contract." [level=2] [ref=f28e540]
          - paragraph [ref=f28e541]: The request is more than the user’s sentence. In a production workflow, it is the complete package of instructions, approved context, tools, state, identity, permissions, and output requirements needed to perform one controlled step.
        - generic [ref=f28e542]:
          - heading "The request contract" [level=3] [ref=f28e543]
          - paragraph [ref=f28e544]: Before discussing the model, make the full request boundary visible. A useful design review can explain where every important input comes from and who is allowed to supply it.
