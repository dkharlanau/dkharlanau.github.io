      - generic [ref=f28e45]:
        - generic [ref=f28e46]: rule
        - paragraph:
          - strong [ref=f28e47]: "Problem:"
          - text: enterprise AI discussions often start with a vendor or model and only later ask which business process should improve.
        - paragraph [ref=f28e48]:
          - strong [ref=f28e49]: "Context:"
          - text: this lab covers corporate scenarios across commercial, supply-chain, manufacturing, finance, people, service, IT, legal, data, and knowledge processes. Failed pilots and bad outcomes are part of the evidence model, not an embarrassing appendix.
        - paragraph [ref=f28e50]:
          - strong [ref=f28e51]: Working rule.
          - text: A model or platform name is metadata, not a use case. First define the process step, business job, system boundary, KPI, cost of error, and control model.
        - link "Start from end-to-end processes":
          - /url: /labs/business-ai/processes/
          - text: Start from end-to-end processes
          - generic [ref=f28e52] [cursor=pointer]: arrow_forward
      - generic [ref=f28e53]:
        - generic [ref=f28e54]:
          - paragraph [ref=f28e55]: Opportunity qualification
          - heading "Start with the problem. Increase confidence with evidence." [level=2] [ref=f28e56]
          - paragraph [ref=f28e57]: Strong AI opportunities begin with a customer problem, workflow challenge, or operational constraint. Customers often describe a possible solution before they have clearly described the problem. That is normal. The useful move is to understand the work behind the request before judging the AI idea.
        - generic [ref=f28e58]:
          - generic [ref=f28e59]:
            - heading "Translate interest into evidence" [level=3] [ref=f28e60]
            - paragraph [ref=f28e61]: Strong AI opportunities become visible through business evidence, not through interest in AI alone.
            - paragraph [ref=f28e62]:
              - text: Instead of asking
              - emphasis [ref=f28e63]: “Does this customer want AI?”
              - text: ", ask:"
            - list [ref=f28e64]:
              - listitem [ref=f28e65]: What business problem or decision needs to improve?
              - listitem [ref=f28e66]: Where does the problem appear in the process or workflow?
              - listitem [ref=f28e67]: Who performs the work, makes the decision, or owns the outcome?
              - listitem [ref=f28e68]: What data and business context are available?
              - listitem [ref=f28e69]: Why is AI suitable here instead of standard automation or process redesign?
              - listitem [ref=f28e70]: What measurable value could the use case create?
              - listitem [ref=f28e71]: What risks, controls, or human approvals are required?
              - listitem [ref=f28e72]: Has the customer agreed to validate the use case through a workshop, prototype, pilot, or another meaningful next step?
          - generic [ref=f28e73]:
            - heading "Qualification chain" [level=3] [ref=f28e74]
            - paragraph [ref=f28e75]:
              - text: A strong AI opportunity connects
              - strong [ref=f28e76]: business problem → workflow → owner → data → AI capability → measurable value → controlled validation
              - text: .
            - paragraph [ref=f28e77]: This keeps the conversation grounded in a business outcome. AI is a possible capability inside the solution, not the starting requirement.
        - generic [ref=f28e78]:
          - 'heading "Example: “AI for contract review”" [level=3] [ref=f28e79]'
          - paragraph [ref=f28e80]: The customer is not simply asking for AI for contract review. The request describes a workflow problem that can be made more concrete.
          - table [ref=f28e81]:
            - rowgroup [ref=f28e82]:
              - row [ref=f28e83]:
                - columnheader "Problem" [ref=f28e84]
                - columnheader "Description" [ref=f28e85]
            - rowgroup [ref=f28e86]:
              - row [ref=f28e87]:
                - rowheader "Workflow" [ref=f28e88]
                - cell "Reviewers identify and assess clauses across different contract types." [ref=f28e89]
              - row [ref=f28e90]:
                - rowheader "Pain" [ref=f28e91]
                - cell "Reviews take too long, and similar contracts are assessed inconsistently." [ref=f28e92]
              - row [ref=f28e93]:
                - rowheader "Owner" [ref=f28e94]
                - cell "The Head of Legal Operations owns the process." [ref=f28e95]
              - row [ref=f28e96]:
                - rowheader "Reason to act" [ref=f28e97]
                - cell "Delays affect business stakeholders, and the team wants more consistent review." [ref=f28e98]
              - row [ref=f28e99]:
                - rowheader "Boundary" [ref=f28e100]
                - cell "Human oversight still matters because legal decisions require review and accountability." [ref=f28e101]
        - generic [ref=f28e102]:
          - heading "Opportunity states" [level=3] [ref=f28e103]
          - paragraph [ref=f28e104]: Use these stages to describe how much confidence the available evidence supports. The important question is not how excited the customer sounds. It is how much is actually known.
          - table [ref=f28e105]:
            - rowgroup [ref=f28e106]:
              - row [ref=f28e107]:
                - columnheader "Opportunity state" [ref=f28e108]
                - columnheader "What it means" [ref=f28e109]
                - columnheader "What is usually known" [ref=f28e110]
            - rowgroup [ref=f28e111]:
              - row [ref=f28e112]:
                - rowheader "Lead" [ref=f28e113]
                - cell "The earliest indication that a potential AI opportunity may exist." [ref=f28e114]
                - cell "There is customer interest or a possible problem area, but the opportunity is not yet clear." [ref=f28e115]
              - row [ref=f28e116]:
                - rowheader "Stage 0" [ref=f28e117]
                - cell "Structured validation of whether the opportunity is real and ready to progress." [ref=f28e118]
                - cell "The problem is becoming more specific, a plausible use case is emerging, and stakeholders or next steps are becoming visible." [ref=f28e119]
              - row [ref=f28e120]:
                - rowheader "Stage 1" [ref=f28e121]
                - cell "The opportunity has enough evidence to justify deeper joint work." [ref=f28e122]
                - cell "The customer problem, relevant stakeholders, reason AI may be worth exploring, and justified next steps are clear enough to support structured opportunity development." [ref=f28e123]
          - paragraph [ref=f28e124]: A Lead can come from a customer conversation, event, referral, outreach, or inbound interest. It may be worth exploring, but it usually needs more discovery before anyone can judge whether there is a real opportunity.
        - generic [ref=f28e125]:
          - generic [ref=f28e126]:
            - heading "Evidence that builds confidence" [level=3] [ref=f28e127]
            - paragraph [ref=f28e128]: "As the opportunity progresses, look for evidence that answers a few practical questions:"
            - list [ref=f28e129]:
              - listitem [ref=f28e130]: Is the customer problem clear?
              - listitem [ref=f28e131]: Is the workflow understood?
              - listitem [ref=f28e132]: Are relevant stakeholders visible?
              - listitem [ref=f28e133]: Is there a plausible direction to explore?
          - generic [ref=f28e134]:
            - heading "Business problem clarity" [level=3] [ref=f28e135]
            - paragraph [ref=f28e136]: Problem clarity exists when the customer can describe a specific operational challenge that is important enough to investigate.
            - paragraph [ref=f28e137]: "Try to understand:"
            - list [ref=f28e138]:
              - listitem [ref=f28e139]: What is happening today?
              - listitem [ref=f28e140]: Who is affected by the problem?
              - listitem [ref=f28e141]: What is the impact on time, cost, risk, speed, quality, or customer experience?
              - listitem [ref=f28e142]: What would a better outcome look like?
        - generic [ref=f28e143]:
          - heading "Stakeholder discovery" [level=3] [ref=f28e144]
          - paragraph [ref=f28e145]: "Once a workflow problem begins to take shape, discovery needs to clarify who is connected to it. Different stakeholders often experience the same workflow in different ways: one group may carry the daily burden, another may own the business result, and another may influence whether a future change can move forward."
          - paragraph [ref=f28e146]: Stakeholder discovery helps identify who experiences the pain, who owns the outcome, who influences decisions, who needs to support validation, and who cares about adoption, approval, risk, or success measures. Opportunities become easier to validate when this ownership is visible.
          - table [ref=f28e147]:
            - rowgroup [ref=f28e148]:
              - row [ref=f28e149]:
                - columnheader "Stakeholder type" [ref=f28e150]
                - columnheader "What they usually tell you" [ref=f28e151]
                - columnheader "Why they matter" [ref=f28e152]
            - rowgroup [ref=f28e153]:
              - row [ref=f28e154]:
                - rowheader "Affected users" [ref=f28e155]
                - cell "What the work feels like day to day, where friction appears, and which exceptions make the workflow harder." [ref=f28e156]
                - cell "They reveal practical workflow friction and provide current-state evidence." [ref=f28e157]
              - row [ref=f28e158]:
                - rowheader "Outcome owner" [ref=f28e159]
                - cell "What business result needs to improve, such as turnaround time, quality, risk, cost, or service." [ref=f28e160]
                - cell "They help validate priority, accountability, and what success should mean." [ref=f28e161]
              - row [ref=f28e162]:
                - rowheader "Influencers" [ref=f28e163]
                - cell "What constraints, approvals, dependencies, or risks may affect progress." [ref=f28e164]
                - cell "They help identify what could block, shape, validate, or govern the opportunity. This may include IT, security, procurement, legal, compliance, or other control teams." [ref=f28e165]
              - row [ref=f28e166]:
                - rowheader "Executive sponsor or senior stakeholder" [ref=f28e167]
                - cell "Why the issue matters at a broader business level and how it connects to wider priorities." [ref=f28e168]
                - cell "They can create urgency, visibility, sponsorship, or access to the people needed for progress." [ref=f28e169]
          - paragraph [ref=f28e170]: An interested contact is still useful, but interest alone is weak evidence if that person does not experience the pain, own the outcome, influence a decision, or provide a path to the people who do.
        - generic [ref=f28e171]:
          - generic [ref=f28e172]:
            - heading "Identifying the outcome owner" [level=3] [ref=f28e173]
            - paragraph [ref=f28e174]: An outcome owner is the person accountable for improving the workflow or business result. They may be a team lead, department head, process owner, or business sponsor.
            - paragraph [ref=f28e175]: The outcome owner may not perform the work every day. Their role is to connect the workflow problem to a result that matters and help judge whether improving it is a real priority.
          - generic [ref=f28e176]:
            - heading "Questions that reveal ownership" [level=3] [ref=f28e177]
            - list [ref=f28e178]:
              - listitem [ref=f28e179]: Who is accountable for the current workflow result?
              - listitem [ref=f28e180]: Who is measured on the outcome that should improve?
              - listitem [ref=f28e181]: Who can decide that the problem deserves deeper validation?
              - listitem [ref=f28e182]: Who needs to agree on success measures or acceptable boundaries?
        - generic [ref=f28e183]:
          - generic [ref=f28e184]:
            - heading "Customer commitment" [level=3] [ref=f28e185]
            - paragraph [ref=f28e186]: Customer commitment means the customer has shown credible willingness to keep moving. It is stronger when the customer contributes time, access, evidence, people, or decisions rather than only expressing interest.
            - paragraph [ref=f28e187]: "Useful signals include:"
            - list [ref=f28e188]:
              - listitem [ref=f28e189]: Agreeing to a specific discovery workshop, validation session, prototype, or pilot.
              - listitem [ref=f28e190]: Bringing the workflow owner, operators, or required control teams into the discussion.
              - listitem [ref=f28e191]: Sharing approved process examples, requirements, data samples, or current-state evidence.
              - listitem [ref=f28e192]: Helping define success criteria, constraints, ownership, and a next decision point.
          - generic [ref=f28e193]:
            - heading "Do not confuse interest with movement" [level=3] [ref=f28e194]
            - paragraph [ref=f28e195]: A curious contact can open the door, but the opportunity becomes stronger when there is a path from interest to the people, evidence, and decisions required to validate it.
            - paragraph [ref=f28e196]: Commitment does not prove that AI is the right solution. It shows that the customer is willing to do the work required to find out.
        - generic [ref=f28e197]:
          - generic [ref=f28e198]:
            - heading "Keep discovery useful" [level=3] [ref=f28e199]
            - paragraph [ref=f28e200]: A good discovery conversation feels like joint problem-solving, not a product pitch or a checklist interview.
            - list [ref=f28e201]:
              - listitem [ref=f28e202]:
                - strong [ref=f28e203]: Ask before prescribing.
                - text: Understand the work before suggesting a solution.
              - listitem [ref=f28e204]:
                - strong [ref=f28e205]: Stay close to the workflow.
                - text: Follow tasks, decisions, handoffs, and outcomes rather than product labels.
              - listitem [ref=f28e206]:
                - strong [ref=f28e207]: Check the evidence.
                - text: Separate what the customer knows from what still needs validation.
              - listitem [ref=f28e208]:
                - strong [ref=f28e209]: Build the picture together.
                - text: Use questions to create shared clarity, not to test the customer.
          - generic [ref=f28e210]:
            - heading "Signs the opportunity is ready to move" [level=3] [ref=f28e211]
            - paragraph [ref=f28e212]: "Readiness becomes visible through action. Look for a combination of:"
            - list [ref=f28e213]:
              - listitem [ref=f28e214]: A named owner and a problem that can be explained clearly.
              - listitem [ref=f28e215]: The right users and decision-makers joining the discussion.
              - listitem [ref=f28e216]: Enough workflow detail to define a realistic validation scope.
              - listitem [ref=f28e217]: Customer willingness to share approved examples, context, or process evidence.
              - listitem [ref=f28e218]: A concrete validation activity or next meeting with the people needed to make progress.
            - paragraph [ref=f28e219]: No single signal is enough. Together, they show whether the opportunity is becoming testable rather than simply interesting.
        - generic [ref=f28e220]:
          - heading "Watch for red flags" [level=3] [ref=f28e221]
          - paragraph [ref=f28e222]: Red flags do not always mean the opportunity should stop. They show where discovery is too weak, too broad, or too risky to support the next decision.
          - table [ref=f28e223]:
            - rowgroup [ref=f28e224]:
              - row [ref=f28e225]:
                - columnheader "Red flag area" [ref=f28e226]
                - columnheader "What it may sound like" [ref=f28e227]
                - columnheader "Why it matters" [ref=f28e228]
            - rowgroup [ref=f28e229]:
              - row [ref=f28e230]:
                - rowheader "Unclear problem definition" [ref=f28e231]
                - cell [ref=f28e232]:
                  - emphasis [ref=f28e233]: “We want to do something with AI.”
                - cell "The problem is vague, and the partner may end up defining the customer’s problem for them." [ref=f28e234]
              - row [ref=f28e235]:
                - rowheader "Workflow uncertainty" [ref=f28e236]
                - cell [ref=f28e237]:
                  - emphasis [ref=f28e238]: “We need an AI assistant.”
                - cell "The label does not explain which workflow changes, who uses it, or what output improves." [ref=f28e239]
              - row [ref=f28e240]:
                - rowheader "Unclear ownership" [ref=f28e241]
                - cell [ref=f28e242]:
                  - emphasis [ref=f28e243]: “One contact is interested, but they do not own the process.”
                - cell "The opportunity may stall if no operator, outcome owner, or sponsor path is visible." [ref=f28e244]
              - row [ref=f28e245]:
                - rowheader "Sensitive workflow without boundaries" [ref=f28e246]
                - cell [ref=f28e247]:
                  - emphasis [ref=f28e248]: “We want AI for compliance decisions.”
                - cell "The workflow may need clear ownership, oversight, approval paths, and validation boundaries before it can progress." [ref=f28e249]
              - row [ref=f28e250]:
                - rowheader "No customer commitment" [ref=f28e251]
                - cell [ref=f28e252]:
                  - emphasis [ref=f28e253]: “Let’s check back later.”
                - cell "Without a credible next step, there may not be enough engagement to move forward." [ref=f28e254]
              - row [ref=f28e255]:
                - rowheader "Value is implied but not stated" [ref=f28e256]
                - cell [ref=f28e257]:
                  - emphasis [ref=f28e258]: “AI should improve the business somehow.”
                - cell "The opportunity lacks a testable reason to act." [ref=f28e259]
              - row [ref=f28e260]:
                - rowheader "First use case is too broad or risky" [ref=f28e261]
                - cell [ref=f28e262]:
                  - emphasis [ref=f28e263]: “We want AI to transform the whole compliance process.”
                - cell "Early validation needs a bounded workflow, owner, and approval path." [ref=f28e264]
              - row [ref=f28e265]:
                - rowheader "Stakeholders cannot support validation" [ref=f28e266]
                - cell [ref=f28e267]:
                  - emphasis [ref=f28e268]: “No one can join a discovery session or share workflow details.”
                - cell "Without participation, the opportunity cannot build credible evidence." [ref=f28e269]
        - generic [ref=f28e270]:
          - generic [ref=f28e271]:
            - heading "Create clarity through discovery" [level=3] [ref=f28e272]
            - paragraph [ref=f28e273]:
              - text: Strong discovery helps the customer move from broad statements to specific evidence. Do not accept
              - emphasis [ref=f28e274]: “we need AI”
              - text: as a complete requirement. Help the customer explain the workflow, pain, people involved, business impact, and next validation step.
            - paragraph [ref=f28e275]: "Effective discovery should answer:"
            - list [ref=f28e276]:
              - listitem [ref=f28e277]: What problem is the customer trying to solve?
              - listitem [ref=f28e278]: Where does the problem appear in the workflow?
              - listitem [ref=f28e279]: Who owns or experiences the problem?
              - listitem [ref=f28e280]: Why does the problem matter?
              - listitem [ref=f28e281]: What evidence supports deeper validation?
              - listitem [ref=f28e282]: What next step would improve understanding?
          - generic [ref=f28e283]:
            - heading "Map where the problem appears" [level=3] [ref=f28e284]
            - paragraph [ref=f28e285]: A workflow is the sequence of activities that turns an input into an output. It usually combines people, systems, decisions, handoffs, reviews, and approvals.
            - paragraph [ref=f28e286]: Business problems rarely affect every step equally. Locating the friction makes the opportunity easier to understand and helps determine whether deeper investigation is worthwhile.
        - generic [ref=f28e287]:
          - heading "Workflow mapping questions" [level=3] [ref=f28e288]
          - paragraph [ref=f28e289]: Map enough of the current workflow to find the problem boundary before discussing the target AI capability.
          - table [ref=f28e290]:
            - rowgroup [ref=f28e291]:
              - row [ref=f28e292]:
                - columnheader "Workflow element" [ref=f28e293]
                - columnheader "Discovery question" [ref=f28e294]
                - columnheader "Evidence to look for" [ref=f28e295]
            - rowgroup [ref=f28e296]:
              - row [ref=f28e297]:
                - rowheader "Input" [ref=f28e298]
                - cell "What starts the work, and what information arrives with it?" [ref=f28e299]
                - cell "Documents, requests, records, events, messages, or system states." [ref=f28e300]
              - row [ref=f28e301]:
                - rowheader "Activity" [ref=f28e302]
                - cell "What work is performed, and by whom?" [ref=f28e303]
                - cell "Manual steps, system actions, repeated tasks, and exception handling." [ref=f28e304]
              - row [ref=f28e305]:
                - rowheader "Decision" [ref=f28e306]
                - cell "Where must someone interpret, classify, compare, approve, or choose?" [ref=f28e307]
                - cell "Decision rules, judgment points, uncertainty, and escalation criteria." [ref=f28e308]
              - row [ref=f28e309]:
                - rowheader "Handoff" [ref=f28e310]
                - cell "Where does responsibility or information move between people, teams, or systems?" [ref=f28e311]
                - cell "Queues, integrations, emails, ownership changes, and waiting time." [ref=f28e312]
              - row [ref=f28e313]:
                - rowheader "Review or approval" [ref=f28e314]
                - cell "Which steps require oversight before the work can continue?" [ref=f28e315]
                - cell "Control points, approvers, legal or compliance checks, and audit evidence." [ref=f28e316]
              - row [ref=f28e317]:
                - rowheader "Output" [ref=f28e318]
                - cell "What business result should the workflow produce?" [ref=f28e319]
                - cell "Completed transaction, decision, document, recommendation, response, or measurable outcome." [ref=f28e320]
              - row [ref=f28e321]:
                - rowheader "Friction" [ref=f28e322]
                - cell "Where does time, inconsistency, rework, risk, cost, or poor quality appear?" [ref=f28e323]
                - cell "Delays, error rates, backlog, repeated corrections, escalations, or user complaints." [ref=f28e324]
              - row [ref=f28e325]:
                - rowheader "Owner" [ref=f28e326]
                - cell "Who is accountable for improving the result at the problem boundary?" [ref=f28e327]
                - cell "Named process owner, team lead, department head, sponsor, or control owner." [ref=f28e328]
        - generic [ref=f28e329]:
          - heading "Discovery evidence summary" [level=3] [ref=f28e330]
          - paragraph [ref=f28e331]: After discovery, capture only what helps the next decision. The summary should make evidence gaps visible, not hide them behind polished wording.
          - table [ref=f28e332]:
            - rowgroup [ref=f28e333]:
              - row [ref=f28e334]:
                - columnheader "Evidence area" [ref=f28e335]
                - columnheader "Capture this" [ref=f28e336]
            - rowgroup [ref=f28e337]:
              - row [ref=f28e338]:
                - rowheader "Problem" [ref=f28e339]
                - cell "The customer challenge in one clear sentence. Avoid product names unless they are part of the current environment." [ref=f28e340]
              - row [ref=f28e341]:
                - rowheader "Workflow friction" [ref=f28e342]
                - 'cell "The step where the problem appears and what goes wrong there: delay, rework, inconsistency, risk, cost, or another concrete pain." [ref=f28e343]'
              - row [ref=f28e344]:
                - rowheader "People and ownership" [ref=f28e345]
                - cell "Who feels the pain, who owns the result, and who can enable, shape, approve, or block progress." [ref=f28e346]
              - row [ref=f28e347]:
                - rowheader "Why it matters" [ref=f28e348]
                - cell "The strongest available signal that the problem deserves attention, such as time lost, backlog, quality issues, risk, cost, or service impact." [ref=f28e349]
              - row [ref=f28e350]:
                - rowheader "Readiness and constraints" [ref=f28e351]
                - cell "What is known about participation, data access, approvals, security, governance, operating limits, and willingness to validate." [ref=f28e352]
              - row [ref=f28e353]:
                - rowheader "Next proof" [ref=f28e354]
                - cell "The next activity that should reduce uncertainty, who needs to join, and which question it should answer." [ref=f28e355]
          - paragraph [ref=f28e356]: If an area cannot be supported with facts yet, mark it as a gap. That gap becomes part of the next discovery step rather than an invitation to guess.
      - generic [ref=f28e357]:
        - generic [ref=f28e358]:
          - paragraph [ref=f28e359]: Use-case design
          - heading "Turn a workflow problem into a testable AI job." [level=2] [ref=f28e360]
          - paragraph [ref=f28e361]: "Discovery shows where work is slow, inconsistent, risky, expensive, or difficult. Use-case design asks a narrower question: where could AI improve one part of that workflow without losing sight of ownership, control, and business value?"
        - generic [ref=f28e362]:
          - generic [ref=f28e363]:
