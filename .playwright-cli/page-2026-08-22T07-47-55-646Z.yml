                - rowheader "Operational outcome" [ref=f28e747]
                - cell "The observable result expected to change." [ref=f28e748]
                - cell "Which metric, behavior, queue, error rate, cycle time, or service result could move?" [ref=f28e749]
              - row [ref=f28e750]:
                - rowheader "Business priority" [ref=f28e751]
