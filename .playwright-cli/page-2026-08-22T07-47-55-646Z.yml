          - heading "Explain why the use case matters without jumping to ROI." [level=2] [ref=f28e707]
          - paragraph [ref=f28e708]: A use case explains what AI may help the customer do. A value story explains why that improvement is worth testing. Keep the path visible from current work to a business priority, and separate evidence from assumptions.
