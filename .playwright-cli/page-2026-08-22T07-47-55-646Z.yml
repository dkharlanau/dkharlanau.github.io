          - generic [ref=f28e619]:
            - heading "Authentication" [level=3] [ref=f28e620]
            - paragraph [ref=f28e621]:
              - text: Authentication proves that a person, application, or system is allowed to connect. It answers
              - strong [ref=f28e622]: “Who or what is calling?”
            - paragraph [ref=f28e623]: A valid credential opens the door. It does not grant unlimited business authority.
          - generic [ref=f28e624]:
            - heading "Access control and authorization" [level=3] [ref=f28e625]
            - paragraph [ref=f28e626]:
              - text: Access control decides what the authenticated caller may read, create, change, approve, or execute. It answers
              - strong [ref=f28e627]: “What is this identity allowed to do here?”
            - paragraph [ref=f28e628]: Keep this decision outside the model wherever possible. The model may help choose an action, but enterprise policy should decide whether that action is permitted.
        - generic [ref=f28e629]:
          - generic [ref=f28e630]: verified_user
          - paragraph [ref=f28e631]:
            - strong [ref=f28e632]: "Control chain:"
            - text: identity → authentication → authorization → context filtering → model or tool decision → approval when required → execution → result validation → audit and recovery.
          - paragraph [ref=f28e633]: If any step is missing, the system may still produce an impressive answer while exercising the wrong authority. Enterprise software has spent decades discovering that “it connected successfully” is not the same as “it was allowed to do that.”
        - generic [ref=f28e634]:
          - generic [ref=f28e635]:
            - heading "Structured output is an interface contract" [level=3] [ref=f28e636]
            - paragraph [ref=f28e637]: When a downstream system needs a reliable machine-readable result, define the expected fields with an appropriate JSON Schema and use schema-constrained output where the API supports it.
            - paragraph [ref=f28e638]: Do not rely on a prompt that merely asks for “valid JSON.” The schema should define required fields, allowed values, data types, and the structure the next system expects.
          - generic [ref=f28e639]:
            - heading "State is part of architecture" [level=3] [ref=f28e640]
            - paragraph [ref=f28e641]: "Multi-step AI workflows need an explicit answer to what continues across turns: conversation context, business object status, previous tool results, approval state, and retry information."
            - paragraph [ref=f28e642]: State should not quietly become hidden memory. Define what is stored, where it is stored, how long it is needed, and which identity may read or change it.
