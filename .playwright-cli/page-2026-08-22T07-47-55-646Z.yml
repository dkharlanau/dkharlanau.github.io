                - cell "What evidence should we check before making a stronger claim?" [ref=f28e757]
        - generic [ref=f28e758]:
          - generic [ref=f28e759]:
            - heading "Start from what the customer actually said" [level=3] [ref=f28e760]
            - paragraph [ref=f28e761]: Do not invent a strategy statement for the customer. Look for the priority, stakeholder, metric, or pressure already visible in discovery.
            - list [ref=f28e762]:
              - listitem [ref=f28e763]: Which priority did the customer name?
              - listitem [ref=f28e764]: Who owns or cares about the outcome?
              - listitem [ref=f28e765]: Which metric or business pressure is affected?
              - listitem [ref=f28e766]: What would make the customer decide the idea is worth testing?
              - listitem [ref=f28e767]: Which evidence would make that outcome believable?
          - generic [ref=f28e768]:
            - heading "Clarify the work before the value" [level=3] [ref=f28e769]
            - paragraph [ref=f28e770]: Value claims become easier to defend when the current workflow is concrete.
            - list [ref=f28e771]:
              - listitem [ref=f28e772]: Who performs the work today?
              - listitem [ref=f28e773]: What does the workflow produce?
              - listitem [ref=f28e774]: Where does time, cost, inconsistency, risk, or scale pressure appear?
              - listitem [ref=f28e775]: What happens when the workflow performs badly?
              - listitem [ref=f28e776]: Which operational or business outcome is affected?
        - generic [ref=f28e777]:
          - heading "Let stakeholder pressure shape the value emphasis" [level=3] [ref=f28e778]
          - paragraph [ref=f28e779]: The use case may stay the same while the value conversation changes. Emphasize the outcome the stakeholder is accountable for, not every possible benefit at once.
          - table [ref=f28e780]:
            - rowgroup [ref=f28e781]:
              - row [ref=f28e782]:
                - columnheader "What you hear" [ref=f28e783]
                - columnheader "Lead with" [ref=f28e784]
                - columnheader "Evidence to examine" [ref=f28e785]
            - rowgroup [ref=f28e786]:
              - row [ref=f28e787]:
                - rowheader "“We need to reduce backlog.”" [ref=f28e788]
                - cell "Throughput and cycle time." [ref=f28e789]
                - cell "Queue size, waiting time, completion rate, and available capacity." [ref=f28e790]
              - row [ref=f28e791]:
                - rowheader "“We are under cost pressure.”" [ref=f28e792]
                - cell "Effort and unit cost." [ref=f28e793]
                - cell "Manual time, cost per case, volume, avoided work, and the assumptions used to convert time into cost." [ref=f28e794]
              - row [ref=f28e795]:
                - rowheader "“We have audit findings.”" [ref=f28e796]
                - cell "Control and consistency." [ref=f28e797]
                - cell "Policy adherence, exception handling, escalation quality, repeat findings, and audit evidence." [ref=f28e798]
              - row [ref=f28e799]:
                - rowheader "“Our teams are overloaded.”" [ref=f28e800]
                - cell "Capacity and employee effort." [ref=f28e801]
                - cell "Repetitive work, handoffs, rework, workload, and time available for higher-value tasks." [ref=f28e802]
              - row [ref=f28e803]:
                - rowheader "“Customers are waiting too long.”" [ref=f28e804]
                - cell "Speed and service quality." [ref=f28e805]
                - cell "Response time, resolution rate, escalation rate, repeat contacts, and customer experience signals." [ref=f28e806]
          - paragraph [ref=f28e807]: "A credible value story is usually narrower than a sales pitch: one workflow problem, one plausible improvement, one observable outcome, one customer priority, and the evidence needed to test the connection."
        - generic [ref=f28e808]:
          - generic [ref=f28e809]:
            - heading "Turn the story into a value hypothesis" [level=3] [ref=f28e810]
            - paragraph [ref=f28e811]: A value hypothesis is a claim the customer can test, not a promise. It connects a workflow change to one expected outcome and makes the assumption visible.
            - paragraph [ref=f28e812]:
              - strong [ref=f28e813]: "Useful frame:"
              - text: If AI helps [user] improve [workflow step] by [specific change], then [indicator] may improve, supporting [business priority]. We will test this against [baseline or evidence] and validate [key assumption].
          - generic [ref=f28e814]:
            - heading "Measure only what supports the claim" [level=3] [ref=f28e815]
            - paragraph [ref=f28e816]: More metrics do not make a value story stronger. Choose the smallest set that can confirm or challenge the hypothesis.
            - list [ref=f28e817]:
              - listitem [ref=f28e818]: Which business outcome are we trying to support?
              - listitem [ref=f28e819]: Which indicator would show movement?
              - listitem [ref=f28e820]: What baseline do we need?
              - listitem [ref=f28e821]: Which assumption are we testing?
              - listitem [ref=f28e822]: What evidence would justify further investment?
        - generic [ref=f28e823]:
          - heading "Match indicators to the outcome" [level=3] [ref=f28e824]
          - table [ref=f28e825]:
            - rowgroup [ref=f28e826]:
              - row [ref=f28e827]:
                - columnheader "Outcome" [ref=f28e828]
                - columnheader "Indicators worth considering" [ref=f28e829]
            - rowgroup [ref=f28e830]:
              - row [ref=f28e831]:
                - rowheader "Speed" [ref=f28e832]
                - cell "Cycle time, turnaround time, wait time, and backlog age." [ref=f28e833]
              - row [ref=f28e834]:
                - rowheader "Productivity and capacity" [ref=f28e835]
                - cell "Manual effort, cases handled, review hours, queue size, and throughput." [ref=f28e836]
              - row [ref=f28e837]:
                - rowheader "Cost" [ref=f28e838]
                - cell "Cost per case, rework cost, external spend, overtime, or avoided future spend." [ref=f28e839]
              - row [ref=f28e840]:
                - rowheader "Quality" [ref=f28e841]
                - cell "Error rate, rework rate, consistency, completeness, and quality review findings." [ref=f28e842]
              - row [ref=f28e843]:
                - rowheader "Risk" [ref=f28e844]
                - cell "Escalation rate, policy exceptions, audit findings, control failures, and risk flags." [ref=f28e845]
              - row [ref=f28e846]:
                - rowheader "Customer experience" [ref=f28e847]
                - cell "Response time, resolution rate, repeat contacts, complaints, and satisfaction signals." [ref=f28e848]
              - row [ref=f28e849]:
                - rowheader "Employee experience" [ref=f28e850]
                - cell "Workload, repetitive-task time, handoffs, satisfaction, and capacity for higher-value work." [ref=f28e851]
          - paragraph [ref=f28e852]: The indicator should match the claim. A faster workflow is not automatically a cheaper workflow, and saved time is not automatically cash savings.
        - generic [ref=f28e853]:
          - generic [ref=f28e854]:
            - heading "Directional benefit estimate" [level=3] [ref=f28e855]
            - paragraph [ref=f28e856]: Early in the opportunity, a range can be useful if the assumptions are visible. Start with baseline performance, work volume, expected improvement, adoption, and the part of the workflow actually affected.
            - paragraph [ref=f28e857]: Call it a directional estimate until the customer has validated both the operational change and how that change converts into business value.
          - generic [ref=f28e858]:
            - heading "Before calling it ROI" [level=3] [ref=f28e859]
            - paragraph [ref=f28e860]: ROI needs the economics, not just the benefit side. Include solution, implementation, integration, enablement, change-management, operating, support, and governance costs.
            - paragraph [ref=f28e861]: Also make the time horizon, adoption rate, baseline, benefit conversion, risk adjustment, and confidence level explicit. A productivity gain may create capacity, service improvement, cost reduction, or none of those unless the operating model turns the time into value.
        - generic [ref=f28e862]:
          - heading "Same evidence, different stakeholder emphasis" [level=3] [ref=f28e863]
          - paragraph [ref=f28e864]: Tailoring changes the emphasis, not the facts. Use the same evidence base and lead with the part each stakeholder is accountable for.
          - table [ref=f28e865]:
            - rowgroup [ref=f28e866]:
              - row [ref=f28e867]:
