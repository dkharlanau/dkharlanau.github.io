              - row [ref=f28e876]:
                - rowheader "COO" [ref=f28e877]
                - cell "Throughput, cycle time, operating burden, exceptions, and service quality." [ref=f28e878]
                - cell "Process stability, handoffs, capacity, and operational controls." [ref=f28e879]
              - row [ref=f28e880]:
