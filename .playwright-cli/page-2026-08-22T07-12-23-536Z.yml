      - generic [ref=e51]:
        - heading "Research question" [level=2] [ref=e52]
        - paragraph [ref=e53]: Can knowledge graphs improve how SAP AMS teams store, query, and reason about operational memory compared to traditional document stores or vector databases?
        - heading "Short answer" [level=2] [ref=e54]
        - paragraph [ref=e55]: "Knowledge graphs excel at relationship-heavy queries that span multiple entities and systems: “Which customers are affected by this supplier delay?” or “What incidents involved both material master changes and pricing procedure updates?” For these queries, graph traversals outperform vector similarity or keyword search. However, building a knowledge graph requires upfront schema design (ontology), which is a barrier for teams used to unstructured document stores. The pragmatic approach is: keep runbooks and KEDB in a document/vector store for similarity search, and add a knowledge graph layer for cross-domain relationship queries and AI reasoning (GraphRAG)."
        - heading "What changed" [level=2] [ref=e56]
        - list [ref=e57]:
          - listitem [ref=e58]:
            - strong [ref=e59]: Neo4j AI memory launch (2025).
            - text: Neo4j launched dedicated AI memory and context graph capabilities, positioning graph databases as persistent reasoning engines for agentic AI.
            - 'link "Neo4j: 2025 Year of AI and Scalability" [ref=e60] [cursor=pointer]':
              - /url: https://neo4j.com/blog/news/2025-ai-scalability/
          - listitem [ref=e61]:
            - strong [ref=e62]: Graphiti framework for agent memory.
            - text: Zep AI’s Graphiti framework, built on Neo4j, introduced temporally-aware knowledge graphs for real-time agent memory, achieving P95 query latency of 300ms.
            - 'link "Neo4j: Graphiti Knowledge Graph Memory" [ref=e63] [cursor=pointer]':
              - /url: https://neo4j.com/blog/developer/graphiti-knowledge-graph-memory/
          - listitem [ref=e64]:
            - strong [ref=e65]: Neo4j agent-memory open-source project.
            - text: Neo4j Labs released
            - code [ref=e66]: neo4j-labs/agent-memory
            - text: ", a graph-native memory system for AI agents with multi-stage entity extraction, relationship extraction, and integrations with LangChain, Pydantic AI, and CrewAI."
            - 'link "GitHub: neo4j-labs/agent-memory" [ref=e67] [cursor=pointer]':
              - /url: https://github.com/neo4j-labs/agent-memory
          - listitem [ref=e68]:
            - strong [ref=e69]: Microsoft GraphRAG approach.
            - text: Microsoft Research’s GraphRAG builds entity-centric knowledge graphs from documents, precomputing community summaries for query-focused summarization. It excels at static datasets but is less effective for frequently updated data.
            - 'link "Neo4j: Graphiti vs GraphRAG comparison" [ref=e70] [cursor=pointer]':
              - /url: https://neo4j.com/blog/developer/graphiti-knowledge-graph-memory/
          - listitem [ref=e71]:
            - strong [ref=e72]: Knowledge Graph of Thoughts (KGoT).
            - text: Academic research demonstrated that representing LLM reasoning as knowledge graphs (property graphs, RDF, adjacency lists) reduces noise, mitigates bias, and improves transparency.
            - 'link "arXiv: Knowledge Graph of Thoughts" [ref=e73] [cursor=pointer]':
              - /url: https://arxiv.org/abs/2504.02670
