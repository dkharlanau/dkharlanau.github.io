        - heading "Why it matters" [level=2] [ref=e102]
        - paragraph [ref=e103]: "SAP support memory is traditionally stored in documents: Word files, wikis, KEDB entries, ticket comments. These are searchable by keyword or vector similarity, but they do not capture relationships. When an analyst asks “Which incidents last quarter involved both customer master changes and delivery block issues?”—a document store cannot answer this without exhaustive manual review. A knowledge graph that links incidents, systems, transactions, error types, and resolutions can answer this in a single query."
        - heading "Practical implications" [level=2] [ref=e104]
        - list [ref=e105]:
          - listitem [ref=e106]:
            - strong [ref=e107]: Entity extraction from tickets.
            - text: "Use NLP or LLM-based extraction to identify entities from incident tickets: system, client, transaction, error code, material, customer, vendor, user. Store these as graph nodes."
          - listitem [ref=e108]:
            - strong [ref=e109]: Relationship linking.
            - text: "Link entities with relationships:"
            - code [ref=e110]: INCIDENT-1234
            - text: →
            - code [ref=e111]: affects
            - text: →
            - code [ref=e112]: CUSTOMER-5678
            - text: ","
            - code [ref=e113]: INVOLVES
            - text: →
            - code [ref=e114]: TRANSACTION-VA01
            - text: ","
            - code [ref=e115]: RESOLVED_BY
            - text: →
            - code [ref=e116]: RUNBOOK-42
            - text: . This creates a queryable network.
          - listitem [ref=e117]:
            - strong [ref=e118]: GraphRAG for complex queries.
            - text: For questions that require multi-hop reasoning (“Find all customers with open orders for materials from supplier X that had quality issues in plant Y”), GraphRAG uses the graph structure to retrieve relevant context more accurately than vector-only RAG.
          - listitem [ref=e119]:
            - strong [ref=e120]: Temporal memory.
            - text: "Graphiti’s bi-temporal model tracks when events occurred and when they were ingested. This enables historical queries: “What did we know about this customer on March 1st?” Useful for audit and regression analysis."
          - listitem [ref=e121]:
            - strong [ref=e122]: Hybrid architecture.
            - text: Do not replace your document store with a graph. Use documents for full-text search and vector similarity, and the graph for relationship queries and AI reasoning. The two complement each other.
        - heading "Risks and unknowns" [level=2] [ref=e123]
        - list [ref=e124]:
          - listitem [ref=e125]:
            - strong [ref=e126]: Schema design burden.
            - text: Knowledge graphs require an ontology or schema. Defining entity types and relationship types for SAP support is non-trivial. A bad schema limits usefulness. Invest in graph modeling expertise.
          - listitem [ref=e127]:
            - strong [ref=e128]: Entity resolution complexity.
            - text: The same customer may appear as “Customer 1234” in SAP, “CUST-5678” in the CRM, and “Acme Corp” in a ticket comment. Entity resolution (deduplication) is required to build a clean graph. This is a hard problem.
          - listitem [ref=e129]:
            - strong [ref=e130]: Update latency.
            - text: If the graph is built from historical tickets, it reflects the past. Real-time graph updates from live SAP systems require CDC pipelines, which add infrastructure complexity.
          - listitem [ref=e131]:
            - strong [ref=e132]: Graph scale.
            - text: Very large graphs (millions of nodes) require careful indexing, partitioning, and query optimization. Neo4j, Amazon Neptune, and TigerGraph handle this, but operational expertise is needed.
          - listitem [ref=e133]:
            - strong [ref=e134]: ROI unproven for support.
            - text: While knowledge graphs are proven for fraud detection, recommendation systems, and drug discovery, their ROI for IT support memory is less documented. Start with a pilot.
