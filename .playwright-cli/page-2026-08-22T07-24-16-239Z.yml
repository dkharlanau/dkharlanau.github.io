      - generic [ref=f17e65]:
        - heading "Do not start with the status code alone" [level=2] [ref=f17e66]
        - paragraph [ref=f17e67]: "An IDoc status is evidence, but it is not the whole incident. First define the business message: what should have left the source system, where should it have gone, and which business document or update should have appeared in the target?"
        - paragraph [ref=f17e68]: Then trace the message through the actual landscape. The failure can happen before an IDoc is created, during dispatch, in RFC or queue processing, after the target receives the IDoc, or inside the target application. The same user symptom can therefore belong to very different owners.
        - complementary "Expert context" [ref=f17e69]:
          - paragraph [ref=f17e70]: Expert context
          - paragraph [ref=f17e71]:
            - text: This material was prepared by
            - link "Dzmitryi Kharlanau" [ref=f17e72] [cursor=pointer]:
              - /url: https://dkharlanau.github.io/
            - text: ", a Senior SAP Consultant working with SAP integration diagnostics, interface monitoring, IDoc and API failure analysis, and controlled incident resolution."
          - paragraph [ref=f17e73]:
            - link "Profile and experience" [ref=f17e74] [cursor=pointer]:
              - /url: /about/
            - link "LinkedIn" [ref=f17e75] [cursor=pointer]:
              - /url: https://www.linkedin.com/in/dkharlanau/
        - heading "Split the problem by the last confirmed step" [level=2] [ref=f17e76]
        - generic [ref=f17e77]:
          - text: Scroll horizontally to compare every column
          - table [ref=f17e78]:
            - rowgroup [ref=f17e79]:
              - row [ref=f17e80]:
                - columnheader "Evidence" [ref=f17e81]
                - columnheader "What it tells you" [ref=f17e82]
                - columnheader "Next place to look" [ref=f17e83]
            - rowgroup [ref=f17e84]:
              - row [ref=f17e85]:
                - cell "No expected outbound IDoc exists" [ref=f17e86]
                - cell "The problem may be in the business trigger, output/change logic, distribution model, or selection before IDoc creation." [ref=f17e87]
                - cell "Source document, trigger logic, change pointers or application-specific generation path." [ref=f17e88]
              - row [ref=f17e89]:
                - cell "IDoc exists but was not transferred as expected" [ref=f17e90]
                - cell "The message was created, so move downstream to partner, port, RFC, queue, or scheduling evidence." [ref=f17e91]
                - cell "IDoc status history, partner profile, port, RFC/tRFC/qRFC evidence." [ref=f17e92]
              - row [ref=f17e93]:
                - cell "Target received the IDoc but no business document was posted" [ref=f17e94]
                - cell "Transport worked far enough for application processing to begin." [ref=f17e95]
                - cell "Inbound status text, segment values, master data, mapping, application validation." [ref=f17e96]
              - row [ref=f17e97]:
                - cell "IDoc reached a success status but the business result is still wrong" [ref=f17e98]
                - cell "The technical message path may be healthy while the application result or follow-on process is not." [ref=f17e99]
                - cell "Created business document, application log, follow-on status, business rules." [ref=f17e100]
              - row [ref=f17e101]:
                - cell "The same business message appears more than once" [ref=f17e102]
                - cell "Do not assume “duplicate IDoc” is the cause. Find whether the source sent twice, middleware retried, or the target processed twice." [ref=f17e103]
                - cell "Message identifiers, timestamps, source trigger, middleware/retry history, target document references." [ref=f17e104]
        - heading "A useful diagnostic path" [level=2] [ref=f17e105]
        - list [ref=f17e106]:
          - listitem [ref=f17e107]:
            - strong [ref=f17e108]: Capture the business context.
            - text: Source and target systems, direction, message type, business object, expected result, time window, and one concrete example.
          - listitem [ref=f17e109]:
            - strong [ref=f17e110]: Find the IDoc and read its status history.
            - text: Use the sequence and timestamps, not only the latest status. The first meaningful error often explains more than later reprocessing statuses.
          - listitem [ref=f17e111]:
            - strong [ref=f17e112]: Check the control record.
            - text: Confirm sender/receiver partner information, message type, IDoc type, and basic routing context.
          - listitem [ref=f17e113]:
            - strong [ref=f17e114]: Inspect the failed layer.
            - text: For transport problems, follow partner, port, RFC, tRFC, or qRFC evidence as used in this landscape. For application errors, read the target error text and the relevant segment values.
          - listitem [ref=f17e115]:
            - strong [ref=f17e116]: Compare with a successful message.
            - text: A working IDoc of the same business scenario gives you routing, segment, and timing evidence without guessing.
          - listitem [ref=f17e117]:
            - strong [ref=f17e118]: Correct the cause before reprocessing.
            - text: Reprocessing is a recovery step, not a diagnosis.
          - listitem [ref=f17e119]:
            - strong [ref=f17e120]: Confirm the business result.
            - text: The incident is closed when the expected target document or update exists and the integration path is stable again.
        - heading "Useful SAP tools" [level=2] [ref=f17e121]
        - paragraph [ref=f17e122]: "The exact tool set depends on direction and architecture. Common starting points in classic IDoc/ALE landscapes include:"
        - list [ref=f17e123]:
          - listitem [ref=f17e124]:
            - strong [ref=f17e125]: WE02 / WE05
            - text: for IDoc content and status history.
          - listitem [ref=f17e126]:
            - strong [ref=f17e127]: WE20
            - text: for partner-profile context.
          - listitem [ref=f17e128]:
            - strong [ref=f17e129]: WE21
            - text: for port definitions.
          - listitem [ref=f17e130]:
            - strong [ref=f17e131]: BD87
            - text: for controlled IDoc reprocessing where applicable.
          - listitem [ref=f17e132]:
            - strong [ref=f17e133]: SM58
            - text: when transactional RFC processing is part of the failed path.
          - listitem [ref=f17e134]:
            - strong [ref=f17e135]: SMQ1 / SMQ2
            - text: when qRFC queues are part of the integration design.
        - paragraph [ref=f17e136]: Do not open every monitor because an IDoc failed. Use the IDoc history to decide which layer deserves attention.
        - heading "What to capture before escalation" [level=2] [ref=f17e137]
        - list [ref=f17e138]:
          - listitem [ref=f17e139]: IDoc number, direction, message type, sender and receiver.
          - listitem [ref=f17e140]: Business document or object reference and expected target result.
          - listitem [ref=f17e141]: Status sequence with the first relevant error text and timestamp.
          - listitem [ref=f17e142]: Relevant segment/value that failed application validation, if known.
          - listitem [ref=f17e143]: RFC or queue evidence only when that layer is part of the failure.
          - listitem [ref=f17e144]: A successful comparison message when available.
        - heading "Reprocessing needs a business check" [level=2] [ref=f17e145]
        - paragraph [ref=f17e146]: Before reprocessing, confirm whether the message is safe to repeat. Some inbound processes have duplicate protection; others can create a second business effect if the original result already exists outside the status you are looking at. Check the target business object and the landscape's restart design before pressing the convenient button humans invented for making yesterday's problem happen twice.
        - heading "The end of the diagnosis" [level=2] [ref=f17e147]
        - paragraph [ref=f17e148]: "A strong IDoc incident says where the chain broke: generation, routing, transport, queue, mapping/data, or application posting. “Status 51 fixed” is not enough. The status is the symptom. The reusable knowledge is why the application rejected the message and what control prevents the same failure next time."
