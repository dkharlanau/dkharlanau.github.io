      - generic [ref=f18e71]:
        - heading "Business pain" [level=2] [ref=f18e72]
        - paragraph [ref=f18e73]: When an IDoc fails or an API times out, three teams point at each other. The SAP team says "it is the interface." The integration team says "SAP rejected the payload." The business team says "just fix it — the order is stuck." No one owns end-to-end resolution, so the incident escalates through multiple tiers before anyone identifies which layer actually failed.
        - heading "Process context" [level=2] [ref=f18e74]
        - paragraph [ref=f18e75]: The pain appears at the boundary between SAP and external systems. Inbound IDocs from EDI partners or middleware land in SAP and fail during posting. Outbound IDocs generated by SAP transactions stall in dispatch queues. API calls — whether REST, SOAP, or RFC-based — return errors that are interpreted differently by each team. Middleware platforms (SAP PI/PO, CPI, MuleSoft, Boomi) add their own queue and transformation layers, each with separate monitoring tools.
        - heading "Typical symptoms" [level=2] [ref=f18e76]
        - list [ref=f18e77]:
          - listitem [ref=f18e78]: IDoc status 51, 56, 62, or 64 stuck in queue for hours.
          - listitem [ref=f18e79]: API returns HTTP 500 or timeout with no business-readable error mapping.
          - listitem [ref=f18e80]: Middleware queue backlog visible only in the integration tool, not in SAP.
          - listitem [ref=f18e81]: Business transaction (order, invoice, goods movement) completed in source system but missing in SAP or vice versa.
          - listitem [ref=f18e82]: Multiple manual reprocessing attempts creating duplicate IDocs or data inconsistencies.
          - listitem [ref=f18e83]: Incident bridges with three or more teams and no agreed runbook.
        - heading "SAP touchpoints" [level=2] [ref=f18e84]
        - list [ref=f18e85]:
          - listitem [ref=f18e86]:
            - strong [ref=f18e87]: WE02 / WE05
            - text: — IDoc display and list.
          - listitem [ref=f18e88]:
            - strong [ref=f18e89]: BD87
            - text: — Status monitor for ALE messages; primary reprocessing tool.
          - listitem [ref=f18e90]:
            - strong [ref=f18e91]: WE20
            - text: — Partner profiles; defines message type, direction, and processing logic.
          - listitem [ref=f18e92]:
            - strong [ref=f18e93]: WE21
            - text: — Port definitions; links partner to RFC destination or file path.
          - listitem [ref=f18e94]:
            - strong [ref=f18e95]: SM58
            - text: — Asynchronous RFC error log.
          - listitem [ref=f18e96]:
            - strong [ref=f18e97]: SMQ1 / SMQ2
            - text: — qRFC queue monitors.
          - listitem [ref=f18e98]:
            - strong [ref=f18e99]: SXI_MONITOR / PIFlow
            - text: — PI/PO/CPI message monitoring.
          - listitem [ref=f18e100]:
            - strong [ref=f18e101]: /AIF/ERR
            - text: — AIF error handling and reprocessing.
          - listitem [ref=f18e102]:
            - strong [ref=f18e103]: SOAMANAGER
            - text: — Web service configuration and payload tracing.
        - heading "Master data / configuration / integration touchpoints" [level=2] [ref=f18e104]
        - list [ref=f18e105]:
          - listitem [ref=f18e106]: Partner profile mismatch between sender and receiver (WE20).
          - listitem [ref=f18e107]: Port definition pointing to inactive RFC destination or wrong file path (WE21 / SM59).
          - listitem [ref=f18e108]: IDoc segment version or custom field mismatch between systems.
          - listitem [ref=f18e109]: Message type mapping error in middleware transformation.
          - listitem [ref=f18e110]: Missing or misconfigured AIF error handling rules.
          - listitem [ref=f18e111]: API metadata mismatch (WSDL, OpenAPI schema, or payload structure).
          - listitem [ref=f18e112]: qRFC queue registration failure or resource lock preventing dequeue.
        - heading "Cost drivers" [level=2] [ref=f18e113]
        - list [ref=f18e114]:
          - listitem [ref=f18e115]: Incident escalation time across SAP, integration, and business teams — often hours per ticket.
          - listitem [ref=f18e116]: "Delayed business transactions: orders not created, invoices not posted, shipments not confirmed."
          - listitem [ref=f18e117]: Manual IDoc reprocessing via BD87 or WE19, including segment-level correction.
          - listitem [ref=f18e118]: Emergency data correction in production after failed reprocessing attempts.
          - listitem [ref=f18e119]: Overtime and bridge-call cost for cross-team coordination.
        - heading "Root cause patterns" [level=2] [ref=f18e120]
        - list [ref=f18e121]:
          - listitem [ref=f18e122]:
            - strong [ref=f18e123]: Partner profile mismatch.
            - text: Sender and receiver disagree on message type, process code, or direction.
          - listitem [ref=f18e124]:
            - strong [ref=f18e125]: Segment errors.
            - text: IDoc segment contains unexpected values due to version difference or custom field extension.
          - listitem [ref=f18e126]:
            - strong [ref=f18e127]: Master data gaps.
            - text: Target system missing material, customer, or vendor required for posting.
          - listitem [ref=f18e128]:
            - strong [ref=f18e129]: Queue failures.
            - text: tRFC or qRFC queue stops due to resource locks, database issues, or max runtime.
          - listitem [ref=f18e130]:
            - strong [ref=f18e131]: Missing monitoring.
            - text: No single pane showing IDoc status, middleware queue depth, and API response code together.
          - listitem [ref=f18e132]:
            - strong [ref=f18e133]: API timeout.
            - text: Payload too large, network latency, or downstream system unavailable; retry logic missing or excessive.
        - heading "Diagnostic workflow" [level=2] [ref=f18e134]
        - paragraph [ref=f18e135]: "A practical first-pass approach to reduce escalation time:"
        - list [ref=f18e136]:
          - listitem [ref=f18e137]: "Identify direction: inbound to SAP, outbound from SAP, or API bidirectional."
          - listitem [ref=f18e138]: Check IDoc status in WE02 / WE05 or API response logs for error code and timestamp.
          - listitem [ref=f18e139]: Verify partner profile (WE20) and port (WE21) or API endpoint configuration.
          - listitem [ref=f18e140]: "Inspect queue status: SMQ1 / SMQ2 for qRFC, SM58 for tRFC errors."
          - listitem [ref=f18e141]: Review segment-level errors or API payload validation failures.
          - listitem [ref=f18e142]: Validate that required master data exists in the target system.
          - listitem [ref=f18e143]: Determine whether the failure is SAP-side, middleware-side, or partner-side.
          - listitem [ref=f18e144]: Document ownership assignment in the incident record before closing.
        - heading "Solution patterns" [level=2] [ref=f18e145]
        - list [ref=f18e146]:
          - listitem [ref=f18e147]: "Define an end-to-end interface ownership matrix: who owns the contract, the mapping, the SAP config, and the business outcome."
          - listitem [ref=f18e148]: Implement AIF or a centralized error monitoring dashboard that correlates IDoc, queue, and API status.
          - listitem [ref=f18e149]: "Standardize partner profile governance: change control for WE20 / WE21 / SM59."
          - listitem [ref=f18e150]: Automate queue depth and error-count alerting with escalation rules tied to ownership.
          - listitem [ref=f18e151]: Create a runbook mapping common IDoc status codes to owner team and first action.
          - listitem [ref=f18e152]: Align API error codes to business-readable messages so business users can self-serve status checks.
        - heading "AI / automation / workflow opportunity" [level=2] [ref=f18e153]
        - paragraph [ref=f18e154]: Structured interface error data enables real workflow improvement. Automated classification of IDoc status codes and API response patterns can route incidents to the correct team without manual triage. Queue depth alerts with predicted backlog time let operations act before business impact. NLP-based summarization of error logs reduces handoff time between SAP and integration teams. A simple chatbot or status portal can answer "Is my order in SAP yet?" without opening a support ticket.
