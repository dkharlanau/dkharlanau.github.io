        - generic [ref=f15e49]:
          - paragraph [ref=f15e50]: Operating scope
          - heading "Business problems that cross SAP boundaries" [level=2] [ref=f15e51]
        - generic [ref=f15e52]:
          - paragraph [ref=f15e53]: Senior SAP consultant with 12+ years in SAP SD, logistics, integration, MDG-related work, and AMS-heavy delivery. Experience spans SAP S/4HANA support and enhancement work, ABAP-backed troubleshooting, SAP IS-Automotive environments, and recent public writing on integration patterns, data governance, event-driven architecture, and practical AI tooling.
          - paragraph [ref=f15e54]: My work usually sits where a business process crosses SAP configuration, master data, custom logic, interfaces, and the support model. A blocked order, failed replication, or delayed invoice is rarely a useful "single-module" problem. I start by asking which decision, dependency, or control failed, then look for the evidence that separates a local workaround from a durable fix.
          - paragraph [ref=f15e55]: This is the kind of work where I can frame the functional problem and keep the same evidence chain understandable to application, ABAP, integration, data, and operations colleagues.
      - generic [ref=f15e57]:
        - generic [ref=f15e58]:
          - paragraph [ref=f15e59]: Operating approach
          - heading "How I approach SAP problems" [level=2] [ref=f15e60]
        - generic "Four-step diagnostic approach" [ref=f15e61]:
          - generic [ref=f15e62]:
            - strong [ref=f15e63]: 1. Make the failure concrete
            - generic [ref=f15e64]: Start with a blocked business outcome, not a technology label.
          - generic [ref=f15e65]:
            - strong [ref=f15e66]: 2. Trace dependencies
            - generic [ref=f15e67]: Follow process, master data, configuration, enhancement, and interface boundaries.
          - generic [ref=f15e68]:
            - strong [ref=f15e69]: 3. Separate evidence from assumption
            - generic [ref=f15e70]: Distinguish confirmed facts, missing evidence, and landscape-specific decisions.
          - generic [ref=f15e71]:
            - strong [ref=f15e72]: 4. Leave a reusable artefact
            - generic [ref=f15e73]: Turn the result into an owner decision, runbook, backlog item, or control.
        - paragraph [ref=f15e75]: "I avoid fixes that only improve the appearance of control: green SLAs while the same incidents recur, dashboards without an accountable recovery path, AI pilots without a usable knowledge layer, or clean-core work that merely moves unowned complexity elsewhere. I want the result to be a bounded change with an owner, evidence, and a recovery path."
